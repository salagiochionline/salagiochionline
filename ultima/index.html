/* ---------- animazioni delle carte ---------- */
const REDUCED = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
let handRects = {};
const flyingIds = new Set();
/* ogni carta sul tavolo ha una piccola rotazione e uno spostamento suoi, sempre uguali */
function pileStyle(c) {
  const h = (c.id * 2654435761) >>> 0;
  const rot = (h % 31) - 15, dx = ((h >> 5) % 13) - 6, dy = ((h >> 9) % 11) - 5;
  return `--rot:${rot}deg;--dx:${dx}px;--dy:${dy}px`;
}
function rectOf(el) { if (!el) return null; const r = el.getBoundingClientRect(); return r.width ? r : null; }
function sourceRect(pid, cardId) {
  if (pid === myId) return handRects[cardId] || rectOf($('#hand')) || rectOf($('#meInfo'));
  return rectOf(document.querySelector(`.opp[data-pid="${CSS.escape(pid)}"] .av`)) || rectOf($('#opponents'));
}
/* fa volare una carta da un punto a un altro */
function flyCard(html, from, to, opt) {
  if (REDUCED || !from || !to) { opt && opt.done && opt.done(); return; }
  const el = document.createElement('div');
  el.className = 'flying';
  el.innerHTML = html;
  const card = el.firstElementChild;
  document.body.appendChild(el);
  const w = to.width, hgt = to.height;
  el.style.left = to.left + 'px'; el.style.top = to.top + 'px';
  el.style.width = w + 'px'; el.style.height = hgt + 'px';
  card.style.setProperty('--cw', (w) + 'px');
  const sx = from.left + from.width / 2 - (to.left + w / 2), sy = from.top + from.height / 2 - (to.top + hgt / 2);
  const s0 = Math.max(0.35, Math.min(1, from.width / w));
  const a = el.animate([
    { transform: `translate(${sx}px,${sy}px) rotate(${opt.r0 || 0}deg) scale(${s0})`, opacity: opt.fade ? 0.2 : 1 },
    { transform: `translate(${sx * 0.35}px,${sy * 0.35 - 30}px) rotate(${(opt.r1 || 0) * 0.6}deg) scale(1.12)`, opacity: 1, offset: 0.55 },
    { transform: `translate(0,0) rotate(${opt.r1 || 0}deg) scale(1)`, opacity: 1 }
  ], { duration: opt.duration || 480, delay: opt.delay || 0, easing: 'cubic-bezier(.25,.8,.3,1)', fill: 'backwards' });
  a.onfinish = () => { el.remove(); opt.done && opt.done(); };
  a.oncancel = () => { el.remove(); opt.done && opt.done(); };
}
function animatePlay(e) {
  const disc = $('#discard'); if (!disc) return;
  const cards = e.cards || [];
  cards.forEach((c, k) => {
    const target = disc.querySelector(`[data-pile="${c.id}"]`);
    const to = rectOf(target) || rectOf(disc);
    const from = sourceRect(e.player, c.id);
    if (REDUCED || !from || !to) return;
    flyingIds.add(c.id);
    if (target) { target.classList.remove('landing'); target.style.visibility = 'hidden'; }
    const rot = parseFloat((pileStyle(c).match(/--rot:(-?\d+)/) || [])[1] || 0);
    flyCard(cardHTML(c), from, to, { delay: k * 140, r0: e.player === myId ? 0 : -25, r1: rot,
      done: () => { flyingIds.delete(c.id); const t = document.querySelector(`#discard [data-pile="${c.id}"]`); if (t) { t.style.visibility = ''; t.classList.add('thud'); } } });
  });
}
function animateDraw(pid, count) {
  const from = rectOf($('#drawPile .card'));
  const to = pid === myId ? (rectOf($('#hand')) && { left: $('#hand').getBoundingClientRect().left + $('#hand').clientWidth / 2 - 30, top: $('#hand').getBoundingClientRect().top + 10, width: 60, height: 90 }) : sourceRect(pid);
  if (!from || !to) return;
  const target = { left: to.left + to.width / 2 - from.width / 2, top: to.top + to.height / 2 - from.height / 2, width: from.width, height: from.height };
  for (let k = 0; k < Math.min(count, 4); k++) {
    // parte dal mazzo e va verso il giocatore
    flyCard(backHTML(), from, target, { delay: k * 110, duration: 420, r1: pid === myId ? 0 : 20 });
  }
}

function statusText(v, ai) {
  const L = v.legal || {}, me = v.me >= 0 ? v.players[v.me] : null;
  if (v.phase === 'roundEnd' || v.phase === 'gameEnd') return ['Mano finita', false];
  if (!me) return [`Stai guardando la partita · tocca a ${v.players[ai] ? v.players[ai].name : '…'}`, false];
  if (me.status === 'disconnesso') return ['Sei stato tolto dalla partita perché sei rimasto disconnesso troppo a lungo. Puoi continuare a guardare.', false];
  if (me.status === 'eliminato') return ['Sei stato eliminato da questa mano: guarda come va a finire 👀', false];
  const p = v.players[ai];
  if (ai !== v.me) {
    if (S.away && p && S.away[p.id]) return [`In attesa che ${p.name} torni online…`, false];
    if (v.phase === 'color') return [`${p.name} sta scegliendo il colore…`, false];
    if (v.phase === 'swap') return [`${p.name} sta scegliendo con chi scambiare la mano…`, false];
    if (L.jumpable && L.jumpable.length) return [`Tocca a ${p.name}… ma puoi inserirti al volo ⚡`, false];
    return [`Tocca a ${p.name}…`, false];
  }
  if (v.phase !== 'turn') return ['Scegli…', true];
  if (selected.length) return [`Seleziona le altre carte con il ${handCard(selected[0]).value} e premi “Gioca”`, true];
  if (v.pending > 0) {
    let t = `Devi pescare ${v.pending} carte` + (v.options.playAfterDraw ? ' (poi potrai giocare)' : '');
    if (L.playable.length) t += ' oppure rispondere con un\'altra carta Pesca';
    if (L.canChallenge) t += ' oppure sfidare';
    return [t, true];
  }
  if (v.drawn != null) return [v.options.forcedPlay ? 'Hai pescato una carta giocabile: devi giocarla' : 'Hai pescato una carta giocabile: giocala o passa', true];
  if (v.drewThisTurn) return [v.options.forcedPlay ? 'Hai pescato: gioca una carta' : 'Hai pescato: gioca una carta oppure passa', true];
  if (!L.playable.length) return ['Tocca a te: non hai carte giocabili, pesca', true];
  return ['Tocca a te!', true];
}

function renderMe(v, ai, me) {
  const area = $('#meArea');
  const [txt, mine] = statusText(v, ai);
  $('#status').textContent = txt;
  $('#status').className = 'status' + (mine ? ' mine' : '');
  if (me < 0) { area.hidden = true; return; }
  area.hidden = false;
  const L = v.legal, p = v.players[me];
  $('#meInfo').className = 'meinfo' + (ai === me ? ' active' : '');
  $('#meInfo').innerHTML = `${avatar(p, me)}<span>${esc(p.name)}</span><span class="tag">${p.count} carte</span>${p.saidUltima ? '<span class="tag ultima">ULTIMA!</span>' : ''}`;
  const myTurn = L.myTurn;
  $('#drawBtn').disabled = !L.canDraw;
  $('#drawBtn').textContent = v.pending > 0 && myTurn ? `Pesca ${v.pending}` : 'Pesca';
  $('#passBtn').hidden = !L.canPass;
  $('#challengeBtn').hidden = !L.canChallenge;
  const pb = $('#playSelBtn');
  pb.hidden = !selected.length;
  pb.textContent = `Gioca ${selected.length} ${selected.length === 1 ? 'carta' : 'carte'}`;
  const ub = $('#ultimaBtn');
  if (!L.canUltima) ultimaArmed = false;
  ub.disabled = !L.canUltima;
  ub.classList.toggle('ready', L.canUltima && !ultimaArmed);
  ub.classList.toggle('armed', ultimaArmed);
  ub.textContent = ultimaArmed ? 'ULTIMA! ✓' : 'ULTIMA!';
  ub.title = 'Premilo quando ti restano 2 carte, prima di giocare la penultima. Se non lo fai, peschi 2 carte.';

  const hand = sortHand(myHand());
  const sameVal = selected.length ? handCard(selected[0]).value : null;
  const n = hand.length, handEl = $('#hand');
  const avail = handEl.clientWidth - 20;
  const cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cw')) || 74;
  let ov = 6;
  if (n > 1 && n * (cw + 6) > avail) ov = Math.max(-cw * 0.62, (avail - cw) / (n - 1) - cw);
  handEl.style.setProperty('--ov', ov + 'px');
  handRects = {};
  handEl.querySelectorAll('.card[data-id]').forEach(el => { const r = rectOf(el); if (r) handRects[el.dataset.id] = r; });
  handEl.innerHTML = hand.map(c => {
    const cls = [];
    if (selected.length) {
      if (selected.includes(c.id)) cls.push('sel');
      else if (c.type === 'num' && c.value === sameVal) cls.push('playable');
      else cls.push('dim');
    } else if (myTurn && v.phase === 'turn') {
      cls.push(L.playable.includes(c.id) ? 'playable' : 'dim');
      if (v.drawn === c.id || (v.drawnIds || []).includes(c.id)) cls.push('fresh');
    } else if (L.jumpable.includes(c.id)) cls.push('jump');
    return cardHTML(c, cls, `data-id="${c.id}"`);
  }).join('');
}

/* ---------- chat + cronaca ---------- */
function renderFeed() {
  const f = $('#feed'); if (!f || !S || !S.game) return;
  const log = S.game.log.slice(-80).map(l => ({ t: l.t || 0, html: `<div class="msg ${l.kind || ''}">${esc(l.msg)}</div>` }));
  const ch = chat.map(m => ({ t: m.t, html: `<div class="msg chat"><b style="color:${/^#[0-9a-f]{3,8}$/i.test(m.c) ? m.c : '#ccc'}">${esc(m.by)}:</b> ${esc(m.x)}</div>` }));
  const all = log.concat(ch).sort((a, b) => a.t - b.t);
  const k = all.length + ':' + (all.length ? all[all.length - 1].t : 0) + ':' + S.game.logSeq + ':' + chat.length;
  if (k === feedKey) return; feedKey = k;
  const near = f.scrollHeight - f.scrollTop - f.clientHeight < 80;
  f.innerHTML = all.map(x => x.html).join('') || '<div class="small mut">Nessun messaggio.</div>';
  if (near || !f._init) { f.scrollTop = f.scrollHeight; f._init = 1; }
}
function onChat() {
  if (!S || view !== 'game' || S.status === 'lobby') return;
  renderFeed();
  const last = chat[chat.length - 1];
  const narrow = true /* chat a scomparsa su ogni schermo */;
  if (last && last.t > chatSeenT) {
    if (narrow && !sideOpen && last.id !== myId) { toast(`💬 ${last.by}: ${last.x}`); }
    if (!narrow || sideOpen) chatSeenT = last.t;
  }
  updBadge();
}
function updBadge() {
  const b = $('#chatBadge'); if (!b) return;
  const unread = chat.filter(m => m.t > chatSeenT && m.id !== myId).length;
  b.hidden = !unread; b.textContent = unread;
}
function sendChat(x) {
  if (!x || !code) return;
  const i = myIdx(); const p = i >= 0 ? S.game.players[i] : null;
  DB.collection(`games/${code}/chat`).add({ t: Date.now(), id: myId, by: p ? p.name : (myName || 'Spettatore'), c: PCOL[(i >= 0 ? i : 0) % PCOL.length], x: x.slice(0, 200) }).then(pruneChat).catch(writeErr);
}
function pruneChat() {
  if (MODE !== 'p2p' || !code) return;
  const pre = `games/${code}/chat/`; const ks = [...Net.cache.keys()].filter(k => k.startsWith(pre));
  if (ks.length > 60) ks.map(k => [k, (Net.cache.get(k) || {}).t || 0]).sort((a, b) => a[1] - b[1]).slice(0, ks.length - 60).forEach(([k]) => DB.doc(k).delete().catch(() => { }));
}

/* ---------- eventi -> avvisi ---------- */
function nameOf(id) { const p = S.game.players.find(p => p.id === id); return p ? p.name : '?'; }
function handleEvents(v) {
  for (const e of v.events) {
    if (e.n <= lastEventN) continue;
    lastEventN = e.n;
    switch (e.type) {
      case 'ultima': toast(e.player === myId ? 'Hai gridato ULTIMA!' : `${nameOf(e.player)}: ULTIMA!`, 'ultima'); break;
      case 'ultimaPenalty': animateDraw(e.player, e.count); toast(e.player === myId ? `Non hai detto ULTIMA! Peschi ${e.count} carte` : `${nameOf(e.player)} ha dimenticato di dire ULTIMA! (+${e.count})`, 'warn'); break;
      case 'challenge':
        if (e.player === myId) toast(e.won ? `⚖️ Sfida vinta! ${nameOf(e.from)} aveva bluffato e pesca ${e.count}` : `⚖️ Sfida persa: ${nameOf(e.from)} era in regola, peschi ${e.count}`, e.won ? 'good' : 'warn');
        else if (e.from === myId) toast(e.won ? `⚖️ ${nameOf(e.player)} ti ha scoperto: peschi ${e.count}` : `⚖️ ${nameOf(e.player)} ti ha sfidato e ha perso: pesca ${e.count}`, e.won ? 'warn' : 'good');
        else toast(e.won ? `⚖️ ${nameOf(e.player)} vince la sfida: ${nameOf(e.from)} pesca ${e.count}` : `⚖️ ${nameOf(e.player)} perde la sfida e pesca ${e.count}`);
        break;
      case 'reveal': reveals.push(e); break;
      case 'eliminated': toast(`💀 ${nameOf(e.player)} è eliminato (25 carte)`, 'warn'); break;
      case 'removed': toast(e.player === myId ? 'Sei stato tolto dalla partita (disconnesso troppo a lungo)' : `🔌 ${nameOf(e.player)} è stato tolto dalla partita`, 'warn'); break;
      case 'mischia': toast('🔀 Mischiatutto! Mani rimescolate'); break;
      case 'rotate': toast('0️⃣ Tutti passano la mano!'); break;
      case 'swap': if (e.target === myId) toast(`${nameOf(e.player)} ha scambiato la mano con te!`, 'warn'); break;
      case 'play': animatePlay(e); if (e.jump) toast(`⚡ ${nameOf(e.player)} si inserisce al volo!`); break;
      case 'draw': animateDraw(e.player, e.count); break;
      case 'penalty': animateDraw(e.player, e.count); if (e.player === myId) toast(`Peschi ${e.count} carte`, 'warn'); break;
      case 'roundEnd': resultsReadyAt = Date.now() + 1300; break;
    }
  }
}

/* ---------- barra "giocatore disconnesso" ---------- */
function renderAway() {
  const bar = $('#awaybar'); if (!bar) return;
  const list = Object.entries((S && S.status === 'playing' && S.away) || {});
  if (!list.length) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  bar.innerHTML = list.map(([id, a]) => `<div class="awayrow">⏳ <b>${esc(nameOf(id))}</b> si è disconnesso. Lo aspettiamo ancora <b class="cd" data-until="${a.until}">${fmtTime(a.until - Date.now())}</b>
    <button class="btn sm" data-more="${esc(id)}">+1 minuto</button></div>`).join('');
  bar.querySelectorAll('[data-more]').forEach(b => b.onclick = () => act(N => { if (N.away && N.away[b.dataset.more]) N.away[b.dataset.more].until += 60000; }));
}
function tickUI() {
  if (!S || view !== 'game' || !S.game) return;
  document.querySelectorAll('#awaybar .cd').forEach(el => el.textContent = fmtTime(+el.dataset.until - Date.now()));
  document.querySelectorAll('.netst').forEach(el => el.textContent = netText());
  // tempo per il turno
  const el = $('#timer'); if (!el) return;
  const G = S.game, t = G.options.turnTimer, ai = E.actorIdx(G);
  if (!t || S.status !== 'playing' || ai < 0 || G.players[ai].id !== myId) { el.hidden = true; return; }
  const left = (S.tAt || Date.now()) + t * 1000 - Date.now();
  el.hidden = false; el.textContent = '⏱ ' + Math.max(0, Math.ceil(left / 1000)) + 's'; el.classList.toggle('low', left < 5500);
}

/* ---------- finestre ---------- */
function showModal(html) { const box = $('#modalBox'); if (box._h === html && !$('#modal').hidden) return; box._h = html; box.innerHTML = html; $('#modal').hidden = false; }
function hideModal() { const m = $('#modal'); if (m && !m.hidden) { m.hidden = true; $('#modalBox').innerHTML = ''; $('#modalBox')._h = ''; } }
function showInfo(html, onMount) { $('#infoBox').innerHTML = html; $('#info').hidden = false; if (onMount) onMount($('#infoBox')); }
function hideInfo() { const m = $('#info'); if (m) m.hidden = true; }

function renderModal(v) {
  if (v.me >= 0 && v.phase === 'color' && v.colorCtx.player === v.me) {
    const hand = myHand(); const cnt = c => hand.filter(x => x.color === c).length;
    return showModal(`<h2>Scegli il colore</h2><p>Con quale colore si continua?</p>
      <div class="colors">${E.COLORS.map(c => `<button class="${c}" data-color="${c}"><span style="font-size:1.6rem">${SYM[c]}</span>${E.COLOR_NAMES[c]}<span class="n">ne hai ${cnt(c)}</span></button>`).join('')}</div>`);
  }
  if (v.me >= 0 && v.phase === 'swap' && v.swapCtx.player === v.me) {
    const list = v.players.map((p, i) => ({ p, i })).filter(x => x.i !== v.me && x.p.status === 'in');
    return showModal(`<h2>Regola del 7</h2><p>Scegli con chi scambiare tutta la tua mano.</p>
      <div class="plist">${list.map(({ p, i }) => `<button data-swap="${esc(p.id)}">${avatar(p, i)}<span style="flex:1">${esc(p.name)}</span><b>${p.count} carte</b></button>`).join('')}</div>`);
  }
  if (reveals.length) {
    const e = reveals[0];
    return showModal(`<h2>Mano di ${esc(nameOf(e.from))}</h2><p>Il colore in tavola era <b>${E.COLOR_NAMES[e.color]}</b>. Questa è la sua mano: solo tu la vedi.</p>
      <div class="cards-row">${sortHand(e.hand).map(c => cardHTML(c, ['sm'])).join('')}</div><div class="mbtns"><button class="btn primary" data-close-reveal>Ok</button></div>`);
  }
  if (v.phase === 'roundEnd' || v.phase === 'gameEnd') {
    const wait = resultsReadyAt - Date.now();
    if (wait > 0) { hideModal(); clearTimeout(resultsTimer); resultsTimer = setTimeout(() => { if (S && S.game) renderGame(); }, wait + 30); return; }
    return showModal(resultsHTML(v));
  }
  hideModal();
}

function statsTable(G) {
  const ps = G.ranking ? G.ranking.map(id => G.players.find(p => p.id === id)) : G.players.slice();
  const row = (l, f) => `<tr><td>${l}</td>${ps.map(p => `<td>${f(p)}</td>`).join('')}</tr>`;
  const disc = p => (S.disc && S.disc[p.id]) || 0;
  return `<h3 style="margin:18px 0 6px">Statistiche della partita</h3><div class="stwrap"><table class="sttab"><thead><tr><th></th>${ps.map(p => `<th>${avatar(p, G.players.indexOf(p), 26)}<br>${esc(p.name)}${p.status === 'disconnesso' ? '<div class="note">disconnesso</div>' : ''}</th>`).join('')}</tr></thead><tbody>
    ${row('Piazzamento', p => p.status === 'disconnesso' ? '–' : (G.ranking.indexOf(p.id) + 1) + '°')}
    ${G.options.mode === 'torneo' ? row('Punti totali', p => p.status === 'disconnesso' ? '—' : p.total) + row('Mani vinte', p => p.roundsWon) : ''}
    ${row('Carte giocate', p => p.stats.played)}${row('Carte pescate', p => p.stats.drawn)}
    ${row('“Ultima!” gridati', p => p.stats.ultimaCalls)}${row('“Ultima!” dimenticati', p => p.stats.ultimaPenalties)}
    ${row('Sfide vinte / perse', p => p.stats.challengesWon + ' / ' + p.stats.challengesLost)}
    ${G.options.jumpIn ? row('Inserimenti al volo', p => p.stats.jumpIns) : ''}
    ${row('Disconnessioni', p => p.bot ? '–' : disc(p))}
  </tbody></table></div>`;
}

function resultsHTML(v) {
  const G = S.game, o = v.options;
  const res = v.results[v.results.length - 1];
  const end = v.phase === 'gameEnd';
  const winName = nameOf(res.winner);
  let html = '';
  if (end) {
    html += `<h2>${o.mode === 'torneo' ? 'Fine del torneo' : 'Partita finita'}</h2><div class="winner">🎉 ${v.winner === myId ? 'Hai vinto!' : esc(nameOf(v.winner)) + ' vince!'}</div>`;
    if (o.mode === 'torneo') html += `<p>Ultima mano chiusa da ${esc(winName)}. Vince chi ha totalizzato meno punti.</p>`;
  } else html += `<h2>Fine della mano ${res.round} di ${o.rounds}</h2><div class="winner">🏆 ${res.winner === myId ? 'Hai chiuso tu!' : esc(winName) + ' ha chiuso la mano'}</div>`;
  const rows = res.rows.slice();
  if (end) rows.sort((a, b) => v.ranking.indexOf(a.id) - v.ranking.indexOf(b.id));
  else rows.sort((a, b) => (a.status === 'disconnesso') - (b.status === 'disconnesso') || a.total - b.total);
  html += `<div style="overflow:auto"><table class="res"><tr><th>#</th><th>Giocatore</th><th>Carte rimaste</th><th class="num">Punti mano</th>${o.mode === 'torneo' ? '<th class="num">Totale</th>' : ''}</tr>`;
  rows.forEach((r, k) => {
    const cards = r.hand.length ? `<div class="cards-row">${sortHand(r.hand).slice(0, 14).map(c => cardHTML(c, ['xs'])).join('')}${r.hand.length > 14 ? ' …' : ''}</div>` : (r.cards ? r.cards + ' carte' : '—');
    html += `<tr class="${r.id === res.winner ? 'win' : ''} ${r.status === 'disconnesso' ? 'off' : ''}"><td>${r.status === 'disconnesso' ? '–' : k + 1}</td>
      <td><b>${esc(r.name)}${r.id === myId ? ' (tu)' : ''}</b>${r.note ? `<div class="note">${r.note}</div>` : ''}</td><td>${cards}</td>
      <td class="num">${r.points == null ? '—' : r.points}</td>${o.mode === 'torneo' ? `<td class="num"><b>${r.status === 'disconnesso' ? '—' : r.total}</b></td>` : ''}</tr>`;
  });
  html += '</table></div>';
  if (end && o.mode === 'torneo' && v.results.length > 1) html += roundsTable(v);
  if (end) html += statsTable(G) + '<div class="small mut" style="margin-top:8px">Le tue statistiche sono salvate nella home del gioco, su questo dispositivo.</div>';
  const isHost = S.host === myId;
  const inGame = v.me >= 0 && v.players[v.me].status !== 'disconnesso';
  html += '<div class="mbtns">';
  if (end) html += `<button class="btn" data-home>🏠 Torna alla home</button>${isHost ? '<button class="btn primary" data-rematch>Rivincita</button>' : '<span class="small mut" style="align-self:center">La rivincita la propone chi ha creato la partita</span>'}`;
  else if (inGame) html += '<button class="btn primary" data-next>Prossima mano</button>';
  else html += '<span class="small mut">In attesa della prossima mano…</span>';
  html += '</div>';
  return html;
}
function roundsTable(v) {
  const R = v.results.length;
  const order = v.ranking.map(id => v.players.find(p => p.id === id));
  let h = `<h3 style="margin:18px 0 4px">Punti mano per mano</h3><div style="overflow:auto"><table class="res"><tr><th>Giocatore</th>`;
  for (let r = 1; r <= R; r++) h += `<th class="num">M${r}</th>`;
  h += '<th class="num">Totale</th></tr>';
  for (const p of order) {
    h += `<tr class="${p.status === 'disconnesso' ? 'off' : ''}"><td>${esc(p.name)}</td>`;
    for (let r = 0; r < R; r++) { const s = p.scores[r]; h += `<td class="num">${s == null ? '—' : s}</td>`; }
    h += `<td class="num"><b>${p.status === 'disconnesso' ? '—' : p.total}</b></td></tr>`;
  }
  return h + '</table></div>';
}

function rulesHTML() {
  const o = S.game.options, on = [];
  on.push(`<li><b>Jolly +4:</b> ${{ sfida: 'con sfida', bloccato: 'bloccato se hai il colore', libero: 'libero, senza sfida' }[o.wd4]}</li>`);
  if (o.stacking !== 'no') on.push(`<li><b>Accumulo:</b> ${o.stacking === 'piu2' ? 'solo +2 su +2' : '+2 e +4'}</li>`);
  GROUPS[1].items.forEach(it => { if (it.type !== 'select' && o[it.key]) on.push(`<li><b>${it.label}</b></li>`); });
  if (o.turnTimer) on.push(`<li><b>Tempo per turno:</b> ${o.turnTimer} secondi</li>`);
  on.push(`<li><b>Attesa per chi si disconnette:</b> ${fmtTime(o.disconnectWait * 1000)}</li>`);
  const ex = [[{ color: 'rosso', type: 'num', value: 7 }, 'Numeri: 1 punto'], [{ color: 'blu', type: 'salta' }, 'Salta Giro: 2'], [{ color: 'verde', type: 'cambio' }, 'Cambia Giro: 2'],
    [{ color: 'giallo', type: 'piu2' }, '+2: 2'], [{ color: null, type: 'jolly' }, 'Jolly: 3'], [{ color: null, type: 'piu4' }, 'Jolly +4: 4'], [{ color: null, type: 'mischia' }, 'Mischiatutto: 4']];
  return `<h2>Regole di questa partita</h2><ul class="rules-list">
    <li><b>Modalità:</b> ${o.mode === 'torneo' ? `torneo su ${o.rounds} mani, vince chi ha meno punti` : 'partita singola, vince chi chiude per primo'}</li>${on.join('')}
    <li><b>ULTIMA!:</b> quando ti restano 2 carte premi il pulsante prima di giocare la penultima, altrimenti peschi ${o.ultimaPenalty} carte.</li></ul>
    ${o.wd4 === 'sfida' ? `<details class="opt"><summary>Cos'è la sfida e come funziona</summary><div class="help">${SFIDA_HELP}</div></details>` : ''}
    <h3>Valore delle carte rimaste in mano</h3><p>Chi chiude prende 0 punti, gli altri sommano il valore delle carte che hanno ancora in mano.</p>
    <div class="values">${ex.map(([c, t]) => `<div>${cardHTML(c, ['xs'])}<span>${t}</span></div>`).join('')}</div>
    <div class="mbtns"><button class="btn primary" data-close-info>Chiudi</button></div>`;
}
function scoresHTML() {
  const G = S.game;
  const ps = G.players.slice().sort((a, b) => (a.status === 'disconnesso') - (b.status === 'disconnesso') || a.total - b.total);
  const head = G.options.mode === 'torneo' ? `<h2>Classifica del torneo</h2><p>Mano ${G.round} di ${G.options.rounds}. Vince chi ha meno punti.</p>
    <table class="res"><tr><th>#</th><th>Giocatore</th><th class="num">Mani vinte</th><th class="num">Punti</th></tr>
    ${ps.map((p, k) => `<tr class="${p.status === 'disconnesso' ? 'off' : ''}"><td>${k + 1}</td><td>${esc(p.name)}${p.status === 'disconnesso' ? ' <span class="note">(disconnesso)</span>' : ''}</td><td class="num">${p.roundsWon}</td><td class="num"><b>${p.total}</b></td></tr>`).join('')}</table>`
    : '<h2>Statistiche della partita</h2><p>Aggiornate a questo momento.</p>';
  const G2 = Object.assign({}, G, { ranking: G.ranking || ps.map(p => p.id) });
  return head + statsTable(G2).replace('Statistiche della partita', G.options.mode === 'torneo' ? 'Statistiche' : '') + '<div class="mbtns"><button class="btn primary" data-close-info>Chiudi</button></div>';
}

/* ---------- interazioni ---------- */
function onCardClick(id) {
  if (!S || !S.game) return;
  const v = E.viewFor(S.game, myId), L = v.legal; if (!L) return;
  if (L.myTurn && v.phase === 'turn') {
    if (selected.length) {
      if (selected.includes(id)) { selected = selected[0] === id ? [] : selected.filter(x => x !== id); return renderGame(); }
      const c = handCard(id), f = handCard(selected[0]);
      if (c.type === 'num' && c.value === f.value) { selected.push(id); return renderGame(); }
      selected = [];
    }
    if (!L.playable.includes(id)) { toast('Questa carta non si può giocare adesso', 'warn'); return renderGame(); }
    const c = handCard(id);
    if (S.game.options.multiPlay && c.type === 'num' && v.pending === 0 && (v.drawn == null || S.game.options.playAfterDraw)) {
      const same = myHand().filter(x => x.id !== id && x.type === 'num' && x.value === c.value);
      if (same.length) { selected = [id]; return renderGame(); }
    }
    return doPlay([id]);
  }
  if (L.jumpable.includes(id)) { const u = ultimaArmed; if (gameAct({ type: 'jump', player: myId, card: id, ultima: u })) { ultimaArmed = false; selected = []; } }
}
function doPlay(ids) { const u = ultimaArmed; if (gameAct({ type: 'play', player: myId, cards: ids, ultima: u })) { ultimaArmed = false; selected = []; renderGame(); } }

function bindGame() {
  $('#hand').addEventListener('click', e => { const c = e.target.closest('.card[data-id]'); if (c) onCardClick(+c.dataset.id); });
  $('#drawPile').addEventListener('click', () => { const v = E.viewFor(S.game, myId); if (v.legal && v.legal.canDraw) { ultimaArmed = false; gameAct({ type: 'draw', player: myId }); } });
  $('#drawBtn').addEventListener('click', () => { ultimaArmed = false; gameAct({ type: 'draw', player: myId }); });
  $('#passBtn').addEventListener('click', () => gameAct({ type: 'pass', player: myId }));
  $('#challengeBtn').addEventListener('click', () => gameAct({ type: 'challenge', player: myId }));
  $('#playSelBtn').addEventListener('click', () => { if (selected.length) doPlay(selected.slice()); });
  $('#ultimaBtn').addEventListener('click', () => { ultimaArmed = !ultimaArmed; if (ultimaArmed) toast('ULTIMA! pronto: ora gioca la carta', 'ultima'); renderGame(); });
  $('#rulesBtn').addEventListener('click', () => showInfo(rulesHTML()));
  $('#scoreBtn').addEventListener('click', () => showInfo(scoresHTML()));
  $('#chatToggle').addEventListener('click', () => { sideOpen = !sideOpen; $('#side').classList.toggle('open', sideOpen); if (sideOpen && chat.length) chatSeenT = chat[chat.length - 1].t; updBadge(); });
  $('#quitBtn').addEventListener('click', () => showInfo(`<h2>Uscire dalla partita?</h2><p>${S.status === 'playing' ? 'Se esci durante la partita, gli altri ti aspetteranno per il tempo scelto e poi verrai tolto. Puoi rientrare con lo stesso link.' : 'Puoi rientrare quando vuoi con lo stesso link.'}</p>
    <div class="mbtns"><button class="btn" data-close-info>Resta</button><button class="btn warn" data-quit>Esci</button></div>`));
  $('#chatForm').addEventListener('submit', e => { e.preventDefault(); const t = $('#chatInput').value.trim(); if (!t) return; $('#chatInput').value = ''; sendChat(t); });
}
function bindGlobal() {
  $('#modal').addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.color) gameAct({ type: 'color', player: myId, color: t.dataset.color });
    else if (t.dataset.swap) gameAct({ type: 'swap', player: myId, target: t.dataset.swap });
    else if ('closeReveal' in t.dataset) { reveals.shift(); renderGame(); }
    else if ('next' in t.dataset) { act(N => { const r = E.applyAction(N.game, { type: 'next', player: myId }); if (!r.ok) return false; N.tAt = Date.now(); if (N.game.phase === 'gameEnd') { N.status = 'ended'; N.ended = Date.now(); } }); }
    else if ('rematch' in t.dataset) act(N => { N.status = 'lobby'; N.game = null; N.away = {}; });
    else if ('home' in t.dataset) leave();
  });
  $('#info').addEventListener('click', e => {
    if (e.target.id === 'info') return hideInfo();
    const t = e.target.closest('button'); if (!t) return;
    if ('closeInfo' in t.dataset) hideInfo();
    if ('quit' in t.dataset) { hideInfo(); leave(); }
  });
  window.addEventListener('resize', () => { if (view === 'game' && S && S.game && S.status !== 'lobby') renderGame(); });
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (/^[A-Z0-9]{5}$/.test(h) && h !== code && myName) openGame(h, true); });
}

bindGlobal();
init();
window.__ultima = { get S() { return S; }, get myId() { return myId; }, E, B, gameAct, act };

</script>
<script>
/* 💬 Chat: il pulsante apre e chiude il pannello su ogni schermo */
(function () {
  var SEL = '#chatToggle,#bSide,#chatBtn,#bSideX';
  var wide = function () { return innerWidth > CHAT_BP; }, was = wide();
  function aperta() { try { return !!sideOpen; } catch (e) { return true; } }
  function sync() {
    var open = aperta();
    var L = document.querySelector('.layout'); if (L) L.classList.toggle('chat-chiusa', !open);
    var x = document.getElementById('bSideX'); if (x) x.hidden = !open;
    document.querySelectorAll('#chatToggle,#bSide,#chatBtn').forEach(function (b) {
      b.setAttribute('aria-pressed', open ? 'true' : 'false');
      b.title = open ? 'Nascondi la chat' : 'Mostra la chat';
    });
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest(SEL)) return;
    if (wide()) { try { localStorage.setItem('tavolata-chat', aperta() ? 'aperta' : 'chiusa'); } catch (er) {} }
    sync();
    if (wide()) dispatchEvent(new Event('resize'));
  });
  addEventListener('resize', function () {
    var w = wide(); if (w === was) return; was = w;
    try { sideOpen = chatAperta(); } catch (e) { return; }
    var s = document.getElementById('side'); if (s) s.classList.toggle('open', sideOpen);
    sync();
  });
  new MutationObserver(function () { if (document.getElementById('side')) sync(); }).observe(document.getElementById('app') || document.body, { childList: true });
  sync();
})();
</script>
<script>
/* 👤 Account Tavolata: profilo, amici, inviti e stanze (codice comune in ../comune/tavolata.js) */
(function () {
  if (!window.Tavolata) return;
  if (typeof avatar === 'function') { const _av = avatar; avatar = function (p) { return Tavolata.conFoto(_av.apply(this, arguments), p); }; }
  const scrive = () => { const a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#app')); };
  const lobby = () => { if (view === 'game' && S && S.status === 'lobby') renderLobby(); };
  Tavolata.collegaGioco({
    id: 'ultima',
    stato: () => ({ view, code, S, seats, myId, DB, MODE }),
    act: fn => act(fn),
    max: () => { try { return MAXP; } catch (e) { return 0; } },
    entra: c => { if (view !== 'home') leave(); setTimeout(() => { const j = document.getElementById('jc'), b = document.getElementById('joinc'); if (j && b) { j.value = c; b.click(); } }, 30); },
    riapri: () => { if (code) openGame(code, true); },
    impostaPosti: r => { seats = r.slice().sort((a, b) => a.t - b.t); },
    ridisegna: lobby,
    impostaNome: n => { myName = n; const nm = document.getElementById('nm'); if (nm && document.activeElement !== nm) nm.value = n; }
  });
  addEventListener('tavolata:stats', () => { if (view === 'home' && !scrive()) renderHome(); });
  addEventListener('tavolata:profili', () => { if (!scrive()) lobby(); });
})();
</script>
