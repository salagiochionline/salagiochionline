<script src="../comune/tavolata.js"></script>
<style>
:root{
  --bg:#1d1a2f; --bg2:#262142; --panel:#2b2550; --panel2:#342d60; --line:rgba(255,255,255,.10);
  --text:#f4f1ff; --muted:#b4acd6; --accent:#ffcf3f; --accent2:#ff5d8f;
  --rosso:#e5484d; --giallo:#f2b705; --verde:#22a35a; --blu:#2b6fd6; --wild:#17151f;
  --cw:74px; --radius:14px;
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{background:radial-gradient(1200px 700px at 50% -10%,#3a2f74 0%,var(--bg) 60%) fixed}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.screen{min-height:100vh}

/* ---------- pulsanti ---------- */
.btn{border:1px solid var(--line);background:var(--panel2);padding:.55em 1em;border-radius:12px;cursor:pointer;font-weight:600;transition:transform .12s,background .15s,opacity .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#3e3672}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(135deg,#7c4dff,#ff5d8f);border:none}
.btn.warn{background:#c2410c;border:none}
.btn.ghost{background:transparent}
.btn.big{width:100%;padding:.9em;font-size:1.15rem;margin-top:8px}
.btn.ultima{background:#3a3260;color:#ffe9a6;letter-spacing:.05em;font-weight:700}
.btn.ultima.ready:not(:disabled){background:var(--accent);color:#2a1d00;animation:pulse 1.1s infinite}
.btn.ultima.armed{background:#22c55e;color:#062b12;animation:none;box-shadow:0 0 0 3px rgba(34,197,94,.35)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,207,63,.6)}50%{box-shadow:0 0 0 8px rgba(255,207,63,0)}}

/* ---------- logo ---------- */
.logo{font-weight:700;font-size:3.4rem;letter-spacing:-.02em;line-height:1;
  background:linear-gradient(90deg,var(--rosso),var(--giallo),var(--verde),var(--blu));-webkit-background-clip:text;background-clip:text;color:transparent;
  transform:rotate(-4deg);display:inline-block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.logo span{color:#fff;-webkit-text-fill-color:#fff}
.logo.sm{font-size:1.7rem;transform:rotate(-3deg)}

/* ---------- impostazioni ---------- */
#setup{display:flex;justify-content:center;padding:28px 14px 60px}
.setup-card{width:100%;max-width:720px;background:rgba(43,37,80,.75);border:1px solid var(--line);border-radius:22px;padding:26px;backdrop-filter:blur(6px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.brand{text-align:center;margin-bottom:18px}
.tagline{color:var(--muted);margin:.8em 0 0}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field>span,.inline>span{font-size:.85rem;color:var(--muted);font-weight:500}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
input,select{font:inherit;color:var(--text);background:#1f1b38;border:1px solid var(--line);border-radius:10px;padding:.6em .7em}
input:focus,select:focus{outline:2px solid #7c4dff;outline-offset:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{background:#1f1b38;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.seg button small{color:var(--muted);font-size:.8rem}
.seg button.on{border-color:var(--accent);background:#2f2850}
.inline{display:flex;align-items:center;gap:10px;margin-top:10px}
.group{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.group h3{margin:4px 0 6px;font-size:1rem;color:var(--accent);font-weight:600}
.group .gnote{color:var(--muted);font-size:.82rem;margin:0 0 6px}
.opt{border-radius:12px;padding:8px 10px;margin:4px 0;background:rgba(255,255,255,.03)}
.opt-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.opt-label{font-weight:500}
.opt select{max-width:58%}
.opt details{margin-top:4px}
.opt summary{cursor:pointer;color:var(--muted);font-size:.82rem;list-style:none;display:inline-flex;gap:4px;align-items:center}
.opt summary::-webkit-details-marker{display:none}
.opt summary::before{content:'▸';transition:transform .15s}
.opt details[open] summary::before{transform:rotate(90deg)}
.opt .help{font-size:.88rem;color:#ddd6ff;line-height:1.45;padding:6px 2px 2px}
.opt .help ul{margin:.3em 0;padding-left:1.2em}
.opt.highlight{background:rgba(255,207,63,.07);border:1px solid rgba(255,207,63,.25)}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#443c70;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:#22c55e}
.switch input:checked+span::after{transform:translateX(20px)}
.fine{color:var(--muted);font-size:.8rem;text-align:center;margin:14px 0 0}

/* ---------- partita ---------- */
#game{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;isolation:isolate}
/* sfondo che prende il colore in tavola */
.glow{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.1s ease}
.glow.rosso{background:radial-gradient(ellipse 75% 65% at 45% 48%,rgba(229,72,77,.34),transparent 72%),linear-gradient(rgba(229,72,77,.10),rgba(229,72,77,.06))}
.glow.giallo{background:radial-gradient(ellipse 75% 65% at 45% 48%,rgba(242,183,5,.28),transparent 72%),linear-gradient(rgba(242,183,5,.09),rgba(242,183,5,.05))}
.glow.verde{background:radial-gradient(ellipse 75% 65% at 45% 48%,rgba(34,163,90,.34),transparent 72%),linear-gradient(rgba(34,163,90,.10),rgba(34,163,90,.06))}
.glow.blu{background:radial-gradient(ellipse 75% 65% at 45% 48%,rgba(43,111,214,.38),transparent 72%),linear-gradient(rgba(43,111,214,.11),rgba(43,111,214,.06))}
#game[data-color=rosso] .glow.rosso,#game[data-color=giallo] .glow.giallo,#game[data-color=verde] .glow.verde,#game[data-color=blu] .glow.blu{opacity:1}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(29,26,47,.55);backdrop-filter:blur(6px)}
.roundinfo{flex:1;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-actions{display:flex;gap:4px}
.layout{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
.table{position:relative;display:flex;flex-direction:column;min-height:0;padding:10px 12px 0;
  background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.05) 0%,transparent 70%)}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(20,18,34,.6)}
.side-head{padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line)}
.feed{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}

.discard .card{--cw:calc(var(--cw-base,74px)*1.15)}

.dir{position:absolute;width:300px;height:300px;border-radius:50%;opacity:.55;pointer-events:none}
.dir svg{width:100%;height:100%;color:var(--cc,#fff)}
.dir svg{animation:spin 14s linear infinite}
.dir.ccw{transform:scaleX(-1)} /* specchiata: frecce e rotazione in senso antiorario */

@keyframes spin{to{transform:rotate(360deg)}}

.colorbadge.rosso{background:var(--rosso)}.colorbadge.giallo{background:var(--giallo);color:#2a1d00}.colorbadge.verde{background:var(--verde)}.colorbadge.blu{background:var(--blu)}

.hand .card.fresh::before{content:'nuova';position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:.65rem;background:var(--accent);color:#2a1d00;padding:0 5px;border-radius:6px;font-weight:700}

<script>
/* =========================================================
   ULTIMA! — motore delle regole
   Funziona sia nel browser (window.UltimaEngine) sia in Node.
   Pensato per il multiplayer "host autorevole": l'host tiene lo
   stato completo, applica le azioni dei giocatori con
   applyAction() e manda a ciascuno solo viewFor(state, id).
   ========================================================= */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.UltimaEngine = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const COLORS = ['rosso', 'giallo', 'verde', 'blu'];
  const COLOR_NAMES = { rosso: 'Rosso', giallo: 'Giallo', verde: 'Verde', blu: 'Blu' };
  const TYPE_NAMES = {
    num: '', salta: 'Salta Giro', cambio: 'Cambia Giro', piu2: 'Pesca Due',
    jolly: 'Jolly', piu4: 'Jolly +4', mischia: 'Jolly Mischiatutto'
  };
  // Valore delle carte rimaste in mano (torneo: vince chi ha meno punti)
  const POINTS = { num: 1, salta: 2, cambio: 2, piu2: 2, jolly: 3, piu4: 4, mischia: 4 };
  const WILD = { jolly: true, piu4: true, mischia: true };

  const DEFAULT_OPTIONS = {
    mode: 'singola',        // 'singola' | 'torneo'
    rounds: 5,              // mani del torneo
    wd4: 'sfida',           // 'sfida' | 'bloccato' | 'libero'
    stacking: 'no',         // 'no' | 'piu2' | 'tutti'
    sevenZero: false,       // 7 scambia mano, 0 passa le mani
    jumpIn: false,          // inserimento al volo con carta identica
    drawUntilPlay: false,   // pesca finché puoi giocare
    forcedPlay: false,      // obbligo di giocare se puoi
    noActionFinish: false,  // si chiude solo con un numero
    multiPlay: false,       // più numeri uguali insieme
    twoPlayerReverse: true, // in 2: Cambia Giro = Salta Giro
    firstCardAction: false, // la prima carta azione ha effetto
    playAfterDraw: true,    // dopo aver pescato (anche per +2/+4) puoi ancora giocare
    mercy: false,           // 25+ carte = eliminato
    mischiatutto: true,     // includi la carta Mischiatutto
    ultimaPenalty: 2,       // carte di penalità se non dici Ultima!
    disconnectWait: 60,     // secondi di attesa per chi si disconnette
    turnTimer: 0            // secondi per turno (0 = nessun limite)
  };

  let rand = Math.random;
  function setRandom(fn) { rand = fn || Math.random; }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- carte ---------- */
  function buildDeck(opts) {
    const d = []; let id = 0;
    for (const c of COLORS) {
      d.push({ id: id++, color: c, type: 'num', value: 0 });
      for (let v = 1; v <= 9; v++) {
        d.push({ id: id++, color: c, type: 'num', value: v });
        d.push({ id: id++, color: c, type: 'num', value: v });
      }
      for (const t of ['salta', 'cambio', 'piu2']) {
        d.push({ id: id++, color: c, type: t });
        d.push({ id: id++, color: c, type: t });
      }
    }
    for (let i = 0; i < 4; i++) d.push({ id: id++, color: null, type: 'jolly' });
    for (let i = 0; i < 4; i++) d.push({ id: id++, color: null, type: 'piu4' });
    if (opts.mischiatutto) d.push({ id: id++, color: null, type: 'mischia' });
    return d;
  }
  function cardName(c) {
    if (c.type === 'num') return c.value + ' ' + COLOR_NAMES[c.color];
    if (WILD[c.type]) return TYPE_NAMES[c.type];
    return TYPE_NAMES[c.type] + ' ' + COLOR_NAMES[c.color];
  }
  function cardPoints(c) { return POINTS[c.type]; }
  function handPoints(h) { return h.reduce((s, c) => s + cardPoints(c), 0); }

  /* ---------- utilità di stato ---------- */
  function top(s) { return s.discard[s.discard.length - 1]; }
  function activeIdx(s) { return s.players.map((p, i) => i).filter(i => s.players[i].status === 'in'); }
  function activeCount(s) { return activeIdx(s).length; }
  function nextIdx(s, from, steps) {
    steps = steps || 1;
    const n = s.players.length;
    if (activeCount(s) === 0) return from;
    let i = from, k = 0, guard = 0;
    while (k < steps && guard++ < 1000) {
      i = ((i + s.dir) % n + n) % n;
      if (s.players[i].status === 'in') k++;
    }
    return i;
  }
  function idxOf(s, id) { return s.players.findIndex(p => p.id === id); }
  function log(s, msg, kind) {
    s.log.push({ n: ++s.logSeq, msg, kind: kind || 'sys', t: Date.now() });
    if (s.log.length > 150) s.log.shift();
  }
  function emit(s, ev) {
    ev.n = ++s.eventSeq;
    s.events.push(ev);
    if (s.events.length > 60) s.events.shift();
  }
  function actorIdx(s) {
    if (s.phase === 'color') return s.colorCtx.player;
    if (s.phase === 'swap') return s.swapCtx.player;
    if (s.phase === 'turn') return s.turn;
    return -1;
  }

  /* ---------- mazzo ---------- */
  function refill(s) {
    if (s.draw.length > 0) return true;
    if (s.discard.length <= 1) return false;
    const t = s.discard.pop();
    s.draw = shuffle(s.discard);
    s.discard = [t];
    log(s, 'Mazzo finito: rimescolo gli scarti.');
    return true;
  }
  function drawCards(s, idx, n) {
    const p = s.players[idx], got = [];
    for (let i = 0; i < n; i++) {
      if (!refill(s)) break;
      const c = s.draw.pop();
      p.hand.push(c); got.push(c);
    }
    p.stats.drawn += got.length;
    return got;
  }

  /* ---------- creazione partita ---------- */
  function createGame(players, options) {
    const opts = Object.assign({}, DEFAULT_OPTIONS, options || {});
    if (opts.mode !== 'torneo') opts.rounds = 1;
    const s = {
      options: opts,
      players: players.map(p => ({
        id: p.id, name: p.name, bot: !!p.bot,
        hand: [], total: 0, scores: [], status: 'in',
        disconnects: 0, saidUltima: false, eliminatedPoints: null, eliminatedCards: 0,
        roundsWon: 0,
        stats: { played: 0, drawn: 0, ultimaCalls: 0, ultimaPenalties: 0, challengesWon: 0, challengesLost: 0, jumpIns: 0 }
      })),
      round: 0, dealer: -1, draw: [], discard: [], color: null, dir: 1, turn: 0,
      phase: 'turn', pending: 0, pendingKind: null, wd4info: null,
      drawn: null, drewThisTurn: false, drawnIds: [], colorCtx: null, swapCtx: null,
      log: [], logSeq: 0, events: [], eventSeq: 0,
      results: [], winner: null, ranking: null, version: 0, lastPlay: 0
    };
    startRound(s);
    return s;
  }

  function startRound(s) {
    s.round++;
    s.players.forEach(p => {
      if (p.status !== 'disconnesso') p.status = 'in';
      p.hand = []; p.saidUltima = false; p.eliminatedPoints = null; p.eliminatedCards = 0;
    });
    s.dir = 1; s.pending = 0; s.pendingKind = null; s.wd4info = null;
    s.drawn = null; s.drewThisTurn = false; s.drawnIds = []; s.colorCtx = null; s.swapCtx = null;
    s.phase = 'turn';
    const act = activeIdx(s);
    if (s.round === 1) s.dealer = act[Math.floor(rand() * act.length)];
    else s.dealer = nextIdx(s, s.dealer);

    s.draw = shuffle(buildDeck(s.options));
    s.discard = [];
    for (let k = 0; k < 7; k++) for (const i of act) s.players[i].hand.push(s.draw.pop());
    s.turn = nextIdx(s, s.dealer);

    let c;
    for (;;) {
      c = s.draw.pop();
      if (c.type === 'num') break;
      if (s.options.firstCardAction && c.type !== 'piu4' && c.type !== 'mischia') break;
      s.draw.unshift(c); shuffle(s.draw);
    }
    s.discard.push(c);
    s.color = c.color;
    log(s, (s.options.mode === 'torneo' ? 'Mano ' + s.round + ' di ' + s.options.rounds + '. ' : '') +
      'Distribuisce ' + s.players[s.dealer].name + '. Prima carta: ' + cardName(c) + '.');
    emit(s, { type: 'round', round: s.round });

    if (c.type !== 'num') {
      const first = s.turn;
      if (c.type === 'salta') {
        log(s, s.players[first].name + ' salta il primo turno.');
        s.turn = nextIdx(s, first);
      } else if (c.type === 'cambio') {
        s.dir = -1;
        s.turn = nextIdx(s, s.dealer);
        log(s, 'Si parte in senso antiorario.');
      } else if (c.type === 'piu2') {
        drawCards(s, first, 2);
        log(s, s.players[first].name + ' pesca 2 carte e salta il turno.');
        s.turn = nextIdx(s, first);
      } else if (c.type === 'jolly') {
        s.phase = 'color';
        s.colorCtx = { player: first, then: 'first' };
      }
    }
  }

  /* ---------- regole di giocabilità ---------- */
  function hasColorMatch(hand, color, exceptId) {
    // Come da regolamento: anche il Jolly Cambia Colore conta come carta abbinabile
    return hand.some(c => c.id !== exceptId && (c.color === color || c.type === 'jolly'));
  }

  function isPlayable(s, idx, card) {
    const p = s.players[idx], t = top(s), o = s.options;
    if (p.status !== 'in') return false;
    if (o.noActionFinish && p.hand.length === 1 && card.type !== 'num') return false;
    if (s.pending > 0) {
      if (s.pendingKind === 'piu2') {
        if (o.stacking === 'piu2') return card.type === 'piu2';
        if (o.stacking === 'tutti') return card.type === 'piu2' || card.type === 'piu4';
        return false;
      }
      if (s.pendingKind === 'piu4') return o.stacking === 'tutti' && card.type === 'piu4';
      return false;
    }
    if (!o.playAfterDraw && s.drawn != null && card.id !== s.drawn) return false;
    if (card.type === 'jolly' || card.type === 'mischia') return true;
    if (card.type === 'piu4') {
      if (o.wd4 === 'bloccato') return !hasColorMatch(p.hand, s.color, card.id);
      return true;
    }
    if (card.color === s.color) return true;
    if (WILD[t.type]) return false;
    if (card.type === 'num') return t.type === 'num' && t.value === card.value;
    return card.type === t.type;
  }

  function canJump(s, idx, card) {
    const o = s.options, t = top(s), p = s.players[idx];
    if (!o.jumpIn || s.phase !== 'turn' || s.pending > 0 || !p || p.status !== 'in') return false;
    if (WILD[t.type] || WILD[card.type]) return false;
    if (o.noActionFinish && p.hand.length === 1 && card.type !== 'num') return false;
    if (card.type !== t.type || card.color !== t.color) return false;
    if (t.type === 'num' && t.value !== card.value) return false;
    return p.hand.some(c => c.id === card.id);
  }

  function canChallenge(s, idx) {
    if (s.options.wd4 !== 'sfida') return false;
    if (s.phase !== 'turn' || s.turn !== idx || s.pending <= 0 || s.pendingKind !== 'piu4' || !s.wd4info) return false;
    const by = s.players[s.wd4info.by];
    return !!by && by.status === 'in';
  }

  function legal(s, idx) {
    const p = s.players[idx];
    const res = { playable: [], jumpable: [], canDraw: false, canPass: false, canChallenge: false, myTurn: false, canUltima: false };
    if (!p || p.status !== 'in') return res;
    if (s.phase === 'turn' && s.turn === idx) {
      res.myTurn = true;
      res.playable = p.hand.filter(c => isPlayable(s, idx, c)).map(c => c.id);
      if (s.pending > 0) res.canDraw = true;
      else if (s.drawn != null || (s.options.playAfterDraw && s.drewThisTurn)) res.canPass = !(s.options.forcedPlay && res.playable.length > 0);
      else if (!s.drewThisTurn) res.canDraw = !(s.options.forcedPlay && res.playable.length > 0);
      res.canChallenge = canChallenge(s, idx);
      res.canUltima = p.hand.length === 2 || (s.options.multiPlay && p.hand.length > 2);
    }
    if (s.options.jumpIn && s.phase === 'turn') {
      res.jumpable = p.hand.filter(c => canJump(s, idx, c)).map(c => c.id);
      if (res.jumpable.length && p.hand.length === 2) res.canUltima = true;
    }
    return res;
  }

  /* ---------- svolgimento ---------- */
  function endTurn(s, idx, steps) {
    s.drawn = null; s.drewThisTurn = false; s.drawnIds = [];
    s.phase = 'turn'; s.colorCtx = null; s.swapCtx = null;
    s.turn = nextIdx(s, idx, steps);
  }

  function addPenalty(s, idx, n, kind) {
    const o = s.options;
    s.pending += n; s.pendingKind = kind;
    s.phase = 'turn'; s.colorCtx = null;
    s.drawn = null; s.drewThisTurn = false;
    const nx = nextIdx(s, idx);
    const respondable = o.playAfterDraw ||
      (kind === 'piu2' && o.stacking !== 'no') ||
      (kind === 'piu4' && (o.stacking === 'tutti' || o.wd4 === 'sfida'));
    if (!respondable) {
      const got = drawCards(s, nx, s.pending);
      log(s, s.players[nx].name + ' pesca ' + got.length + ' carte e salta il turno.');
      emit(s, { type: 'penalty', player: s.players[nx].id, count: got.length });
      s.pending = 0; s.pendingKind = null; s.wd4info = null;
      endTurn(s, idx, 2);
    } else {
      s.turn = nx;
    }
  }

  // Dopo aver pescato (regola "puoi ancora giocare"): il turno continua se c'è qualcosa da giocare
  function afterDrawContinue(s, idx, got) {
    s.drewThisTurn = true; s.drawn = null;
    s.drawnIds = got.map(c => c.id);
    const p = s.players[idx];
    if (p.hand.some(c => isPlayable(s, idx, c))) return true;
    log(s, p.name + ' non ha carte da giocare e passa.');
    endTurn(s, idx, 1);
    return false;
  }

  function rotateHands(s) {
    const act = activeIdx(s), newHands = {};
    for (const i of act) newHands[nextIdx(s, i)] = s.players[i].hand;
    for (const i of act) s.players[i].hand = newHands[i];
    log(s, 'Zero! Tutti passano la propria mano a chi segue.');
    emit(s, { type: 'rotate' });
  }

  function mischia(s, idx) {
    const act = activeIdx(s);
    let all = [];
    for (const i of act) { all = all.concat(s.players[i].hand); s.players[i].hand = []; }
    shuffle(all);
    let i = nextIdx(s, idx);
    while (all.length) { s.players[i].hand.push(all.pop()); i = nextIdx(s, i); }
    log(s, 'Mischiatutto! Tutte le mani vengono rimescolate e ridistribuite.');
    emit(s, { type: 'mischia' });
  }

  function doPlay(s, idx, cards, ultima, isJump) {
    const p = s.players[idx], o = s.options;
    const last = cards[cards.length - 1];
    let wd4legal = null;
    if (last.type === 'piu4') wd4legal = !hasColorMatch(p.hand, s.color, last.id);
    const ids = cards.map(c => c.id);
    p.hand = p.hand.filter(c => ids.indexOf(c.id) < 0);
    for (const c of cards) s.discard.push(c);
    p.stats.played += cards.length;
    if (isJump) p.stats.jumpIns++;
    s.turn = idx; s.drawn = null; s.drewThisTurn = false; s.drawnIds = [];
    if (last.color) s.color = last.color;
    s.lastPlay = ++s.eventSeq;

    const names = cards.map(cardName).join(', ');
    log(s, (isJump ? '⚡ ' + p.name + ' si inserisce al volo: ' : p.name + ' gioca ') + names + '.', 'play');
    emit(s, { type: 'play', player: p.id, cards: cards.map(c => Object.assign({}, c)), jump: !!isJump });

    if (p.hand.length === 1) {
      if (ultima) {
        p.saidUltima = true; p.stats.ultimaCalls++;
        log(s, p.name + ' grida ULTIMA!', 'ultima');
        emit(s, { type: 'ultima', player: p.id });
      } else {
        const got = drawCards(s, idx, o.ultimaPenalty);
        p.stats.ultimaPenalties++;
        log(s, p.name + ' non ha detto ULTIMA! e pesca ' + got.length + ' carte.', 'warn');
        emit(s, { type: 'ultimaPenalty', player: p.id, count: got.length });
      }
    }

    if (p.hand.length === 0) {
      if (last.type === 'piu2' || last.type === 'piu4') {
        const n = s.pending + (last.type === 'piu2' ? 2 : 4);
        const nx = nextIdx(s, idx);
        const got = drawCards(s, nx, n);
        log(s, s.players[nx].name + ' pesca comunque ' + got.length + ' carte.');
        s.pending = 0; s.pendingKind = null;
      }
      endRound(s, idx);
      return;
    }

    switch (last.type) {
      case 'num':
        if (o.sevenZero && last.value === 7 && activeCount(s) > 1) {
          s.phase = 'swap'; s.swapCtx = { player: idx };
          return;
        }
        if (o.sevenZero && last.value === 0 && activeCount(s) > 1) rotateHands(s);
        return endTurn(s, idx, 1);
      case 'salta':
        log(s, s.players[nextIdx(s, idx)].name + ' salta il turno.');
        return endTurn(s, idx, 2);
      case 'cambio':
        s.dir *= -1;
        if (activeCount(s) === 2 && o.twoPlayerReverse) {
          log(s, 'Cambia Giro in due: rigiochi tu.');
          return endTurn(s, idx, 2);
        }
        log(s, 'Il giro cambia senso.');
        return endTurn(s, idx, 1);
      case 'piu2':
        return addPenalty(s, idx, 2, 'piu2');
      case 'jolly':
        s.phase = 'color'; s.colorCtx = { player: idx, then: 'next' };
        return;
      case 'piu4':
        s.wd4info = { by: idx, legal: wd4legal, prevColor: s.color };
        s.phase = 'color'; s.colorCtx = { player: idx, then: 'piu4' };
        return;
      case 'mischia':
        mischia(s, idx);
        s.phase = 'color'; s.colorCtx = { player: idx, then: 'next' };
        return;
    }
  }

  function applyColor(s, idx, color) {
    const ctx = s.colorCtx;
    s.color = color;
    log(s, s.players[idx].name + ' sceglie il ' + COLOR_NAMES[color] + '.', 'color');
    emit(s, { type: 'color', player: s.players[idx].id, color });
    if (ctx.then === 'piu4') return addPenalty(s, idx, 4, 'piu4');
    if (ctx.then === 'first') { s.phase = 'turn'; s.colorCtx = null; return; }
    return endTurn(s, idx, 1);
  }

  function endRound(s, winnerIdx) {
    const o = s.options;
    const rows = [];
    s.players[winnerIdx].roundsWon++;
    s.players.forEach((p, i) => {
      let pts, note = '';
      if (p.status === 'disconnesso') { pts = null; note = 'disconnesso'; }
      else if (i === winnerIdx) { pts = 0; note = 'ha chiuso'; }
      else if (p.status === 'eliminato') { pts = p.eliminatedPoints; note = 'eliminato (25+ carte)'; }
      else pts = handPoints(p.hand);
      if (pts != null) p.total += pts;
      p.scores.push(pts);
      rows.push({
        id: p.id, name: p.name, bot: p.bot,
        cards: p.status === 'eliminato' ? p.eliminatedCards : p.hand.length,
        hand: p.hand.map(c => Object.assign({}, c)),
        points: pts, total: p.total, note, status: p.status
      });
    });
    s.results.push({ round: s.round, winner: s.players[winnerIdx].id, rows });
    log(s, '🏆 ' + s.players[winnerIdx].name + ' chiude la mano!', 'win');
    emit(s, { type: 'roundEnd', winner: s.players[winnerIdx].id });
    s.pending = 0; s.pendingKind = null; s.colorCtx = null; s.swapCtx = null; s.drawn = null;

    if (o.mode !== 'torneo' || s.round >= o.rounds) {
      s.phase = 'gameEnd';
      const order = s.players.map((p, i) => i);
      if (o.mode === 'torneo') {
        order.sort((a, b) => {
          const A = s.players[a], B = s.players[b];
          const da = A.status === 'disconnesso' ? 1 : 0, db = B.status === 'disconnesso' ? 1 : 0;
          if (da !== db) return da - db;
          if (A.total !== B.total) return A.total - B.total;
          return B.roundsWon - A.roundsWon;
        });
      } else {
        const last = s.results[s.results.length - 1].rows;
        order.sort((a, b) => {
          if (a === winnerIdx) return -1; if (b === winnerIdx) return 1;
          const ra = last[a], rb = last[b];
          const da = ra.status === 'disconnesso' ? 1 : 0, db = rb.status === 'disconnesso' ? 1 : 0;
          if (da !== db) return da - db;
          return (ra.points || 0) - (rb.points || 0);
        });
      }
      s.ranking = order.map(i => s.players[i].id);
      s.winner = s.ranking[0];
      log(s, '🎉 ' + s.players[order[0]].name + ' vince la partita!', 'win');
    } else {
      s.phase = 'roundEnd';
    }
  }

  function resolveStuckActor(s, i) {
    if (s.phase === 'color' && s.colorCtx && s.colorCtx.player === i) {
      applyColor(s, i, COLORS[Math.floor(rand() * 4)]);
    } else if (s.phase === 'swap' && s.swapCtx && s.swapCtx.player === i) {
      endTurn(s, i, 1);
    } else if (s.phase === 'turn' && s.turn === i) {
      s.pending = 0; s.pendingKind = null; s.wd4info = null;
      endTurn(s, i, 1);
    }
    if (s.wd4info && s.wd4info.by === i) s.wd4info = null;
  }

  function checkMercy(s) {
    if (!s.options.mercy) return;
    if (s.phase !== 'turn' && s.phase !== 'color' && s.phase !== 'swap') return;
    for (let i = 0; i < s.players.length; i++) {
      const p = s.players[i];
      if (p.status === 'in' && p.hand.length >= 25) {
        p.status = 'eliminato';
        p.eliminatedPoints = handPoints(p.hand);
        p.eliminatedCards = p.hand.length;
        s.draw = shuffle(s.draw.concat(p.hand));
        p.hand = [];
        log(s, '💀 ' + p.name + ' ha 25 o più carte: è eliminato da questa mano!', 'warn');
        emit(s, { type: 'eliminated', player: p.id });
        const act = activeIdx(s);
        if (act.length === 1) { endRound(s, act[0]); return; }
        resolveStuckActor(s, i);
      }
    }
  }

  /* ---------- azioni ---------- */
  function applyAction(s, a) {
    const r = applyInner(s, a);
    if (r.ok) {
      checkMercy(s);
      s.players.forEach(p => { if (p.hand.length !== 1) p.saidUltima = false; });
      s.version++;
    }
    return r;
  }

  function err(e) { return { ok: false, error: e }; }

  function applyInner(s, a) {
    if (!a || !a.type) return err('Azione non valida');
    const idx = idxOf(s, a.player);
    if (a.type === 'next') {
      if (s.phase !== 'roundEnd') return err('La mano non è finita');
      const still = s.players.map((p, i) => i).filter(i => s.players[i].status !== 'disconnesso');
      if (still.length < 2) {
        // non ci sono abbastanza giocatori per continuare il torneo
        s.phase = 'gameEnd';
        const order = s.players.map((p, i) => i).sort((a, b) => {
          const A = s.players[a], B = s.players[b];
          const da = A.status === 'disconnesso' ? 1 : 0, db = B.status === 'disconnesso' ? 1 : 0;
          return da - db || A.total - B.total;
        });
        s.ranking = order.map(i => s.players[i].id);
        s.winner = s.ranking[0];
        log(s, '🎉 ' + s.players[order[0]].name + ' vince il torneo (gli altri si sono disconnessi).', 'win');
        return { ok: true };
      }
      startRound(s);
      return { ok: true };
    }
    if (idx < 0) return err('Giocatore sconosciuto');
    const p = s.players[idx], o = s.options;
    if (p.status !== 'in') return err('Non sei in gioco');

    switch (a.type) {
      case 'play': {
        if (s.phase !== 'turn' || s.turn !== idx) return err('Non è il tuo turno');
        const ids = Array.isArray(a.cards) ? a.cards : [a.cards];
        if (!ids.length) return err('Nessuna carta');
        if (new Set(ids).size !== ids.length) return err('Carte ripetute');
        const cards = ids.map(id => p.hand.find(c => c.id === id));
        if (cards.some(c => !c)) return err('Carta non in mano');
        if (cards.length > 1) {
          if (!o.multiPlay) return err('Una carta alla volta');
          if (s.pending > 0 || (s.drawn != null && !o.playAfterDraw)) return err('Una carta alla volta');
          if (!cards.every(c => c.type === 'num' && c.value === cards[0].value)) return err('Puoi calare insieme solo numeri uguali');
          if (cards.length === p.hand.length && o.noActionFinish) { /* sono tutti numeri: ok */ }
        }
        if (!isPlayable(s, idx, cards[0])) return err('Questa carta non si può giocare');
        doPlay(s, idx, cards, !!a.ultima, false);
        return { ok: true };
      }
      case 'jump': {
        const card = p.hand.find(c => c.id === a.card);
        if (!card || !canJump(s, idx, card)) return err('Non puoi inserirti con questa carta');
        doPlay(s, idx, [card], !!a.ultima, true);
        return { ok: true };
      }
      case 'draw': {
        if (s.phase !== 'turn' || s.turn !== idx) return err('Non è il tuo turno');
        if (s.pending > 0) {
          const n = s.pending;
          const got = drawCards(s, idx, n);
          emit(s, { type: 'penalty', player: p.id, count: got.length });
          s.pending = 0; s.pendingKind = null; s.wd4info = null;
          if (o.playAfterDraw) {
            log(s, p.name + ' pesca ' + got.length + ' carte.');
            afterDrawContinue(s, idx, got);
          } else {
            log(s, p.name + ' pesca ' + got.length + ' carte e salta il turno.');
            endTurn(s, idx, 1);
          }
          return { ok: true };
        }
        if (s.drawn != null || s.drewThisTurn) return err('Hai già pescato');
        if (o.forcedPlay && p.hand.some(c => isPlayable(s, idx, c))) return err('Hai una carta giocabile: devi giocarla');

        if (o.drawUntilPlay) {
          for (;;) {
            const g = drawCards(s, idx, 1);
            if (!g.length) break;
            got.push(g[0]);
            if (isPlayable(s, idx, g[0]) || got.length > 120) break;
          }
        } else got = drawCards(s, idx, 1);
        emit(s, { type: 'draw', player: p.id, count: got.length });
        if (o.playAfterDraw) {
          log(s, p.name + ' pesca ' + (got.length > 1 ? got.length + ' carte' : 'una carta') + '.');
          afterDrawContinue(s, idx, got);
          return { ok: true };
        }
        s.drewThisTurn = true;
        const lc = got[got.length - 1];
        if (lc && isPlayable(s, idx, lc)) {
          s.drawn = lc.id;
          log(s, p.name + ' pesca ' + (got.length > 1 ? got.length + ' carte' : 'una carta') + '.');
          return { ok: true };
        }
        log(s, p.name + ' pesca ' + (got.length > 1 ? got.length + ' carte' : 'una carta') + ' e passa.');
        endTurn(s, idx, 1);

      }
      case 'pass': {
        if (s.phase !== 'turn' || s.turn !== idx) return err('Non è il tuo turno');
        if (s.drawn == null && !(o.playAfterDraw && s.drewThisTurn)) return err('Prima devi pescare');
        if (o.forcedPlay && p.hand.some(c => isPlayable(s, idx, c))) return err('Hai una carta giocabile: devi giocarla');

        endTurn(s, idx, 1);
        return { ok: true };
      }
      case 'color': {

      case 'swap': {

          p.stats.challengesWon++;
          log(s, '⚖️ ' + p.name + ' sfida e vince! ' + bp.name + ' aveva il ' + COLOR_NAMES[s.wd4info.prevColor] + ' e pesca ' + got.length + ' carte.', 'warn');
          emit(s, { type: 'challenge', player: p.id, from: bp.id, won: true, count: got.length });

          s.drewThisTurn = false; s.drawn = null;

          p.stats.challengesLost++;
          log(s, '⚖️ ' + p.name + ' sfida e perde: ' + bp.name + ' era in regola. ' + p.name + ' pesca ' + got.length + ' carte.', 'warn');
          emit(s, { type: 'challenge', player: p.id, from: bp.id, won: false, count: got.length });

  /* ---------- disconnessione ---------- */
  function removePlayer(s, id) {
    const i = idxOf(s, id);
    if (i < 0) return false;
    const p = s.players[i];
    if (p.status === 'disconnesso') return false;
    const wasIn = p.status === 'in';
    p.status = 'disconnesso';
    p.disconnects++;
    s.draw = shuffle(s.draw.concat(p.hand));
    p.hand = [];
    log(s, '🔌 ' + p.name + ' è stato rimosso dalla partita: le sue carte tornano nel mazzo.', 'warn');
    emit(s, { type: 'removed', player: p.id });

      if (act.length === 1) endRound(s, act[0]);

  }

  /* ---------- azione automatica (timer scaduto) ---------- */
  function autoAction(s) {
    const i = actorIdx(s);
    if (i < 0) return null;
    const p = s.players[i], id = p.id;
    if (s.phase === 'color') {
      const cnt = {}; COLORS.forEach(c => cnt[c] = 0);
      p.hand.forEach(c => { if (c.color) cnt[c.color]++; });
      const best = COLORS.slice().sort((a, b) => cnt[b] - cnt[a])[0];
      return { type: 'color', player: id, color: best };
    }
    if (s.phase === 'swap') {
      const t = activeIdx(s).filter(j => j !== i).sort((a, b) => s.players[a].hand.length - s.players[b].hand.length)[0];
      return { type: 'swap', player: id, target: s.players[t].id };
    }
    const L = legal(s, i);
    if (s.pending > 0) return { type: 'draw', player: id };
    if (s.drawn != null) return s.options.forcedPlay ? { type: 'play', player: id, cards: [s.drawn], ultima: true } : { type: 'pass', player: id };
    if (s.drewThisTurn) return L.canPass ? { type: 'pass', player: id } : { type: 'play', player: id, cards: [L.playable[0]], ultima: true };
    if (!L.canDraw && L.playable.length) return { type: 'play', player: id, cards: [L.playable[0]], ultima: true };
    return { type: 'draw', player: id };
  }

  /* ---------- vista per un giocatore (nasconde le mani altrui) ---------- */
  function viewFor(s, playerId) {
    const me = idxOf(s, playerId);
    const clone = x => JSON.parse(JSON.stringify(x));
    return {
      me,
      options: clone(s.options),
      round: s.round, phase: s.phase, color: s.color, dir: s.dir, turn: s.turn,
      dealer: s.dealer, pending: s.pending, pendingKind: s.pendingKind,
      drawn: me === s.turn ? s.drawn : null, drewThisTurn: me === s.turn ? s.drewThisTurn : false,
      drawnIds: me === s.turn ? (s.drawnIds || []).slice() : [],
      colorCtx: s.colorCtx, swapCtx: s.swapCtx,
      top: clone(top(s)), pile: clone(s.discard.slice(-4)), drawCount: s.draw.length, discardCount: s.discard.length,
      players: s.players.map((p, i) => ({
        id: p.id, name: p.name, bot: p.bot, status: p.status, total: p.total, scores: p.scores.slice(),
        saidUltima: p.saidUltima, disconnects: p.disconnects, roundsWon: p.roundsWon, count: p.hand.length,
        stats: clone(p.stats), hand: i === me ? clone(p.hand) : null
      })),
      legal: me >= 0 ? legal(s, me) : null,
      log: s.log.slice(-60),
      events: s.events.filter(e => !e.to || e.to === playerId),
      results: clone(s.results), ranking: s.ranking, winner: s.winner, version: s.version, lastPlay: s.lastPlay
    };
  }

  return {
    COLORS, COLOR_NAMES, TYPE_NAMES, POINTS, WILD, DEFAULT_OPTIONS,
    setRandom, buildDeck, cardName, cardPoints, handPoints,
    createGame, applyAction, removePlayer, autoAction, viewFor,
    isPlayable, canJump, canChallenge, legal, nextIdx, actorIdx, activeIdx, top
  };
});

      same.sort((a, b) => (a.color === fav) - (b.color === fav));

      c.on('reconnect',()=>this.setStatus('offline'));c.on('offline',()=>this.setStatus('offline'));c.on('error',()=>{});
      c.on('message',(topic,payload)=>{
        if(!topic.startsWith(TP))return;const p=topic.slice(TP.length);let d=null;
        if(payload&&payload.length){try{d=JSON.parse(typeof payload==='string'?payload:payload.toString())}catch(e){return}}
        const old=this.cache.get(p);
        if(d&&old&&typeof d.v==='number'&&typeof old.v==='number'&&d.v<old.v)return;
        if(d)this.cache.set(p,d);else this.cache.delete(p);this.notify();
      });
      setTimeout(()=>{if(!done){try{c.end(true)}catch(e){}this.client=null;fin(false)}},14000);
    });
    return this.ready;
  },
  sub(code){[TP+'games/'+code,TP+'games/'+code+'/#'].forEach(t=>{if(!this.subs.has(t)){this.subs.add(t);if(this.client)this.client.subscribe(t,{qos:1});}});},
  unsub(code){[TP+'games/'+code,TP+'games/'+code+'/#'].forEach(t=>{this.subs.delete(t);try{this.client&&this.client.unsubscribe(t)}catch(e){}});
    [...this.cache.keys()].forEach(k=>{if(k==='games/'+code||k.startsWith('games/'+code+'/'))this.cache.delete(k)});},
  kv(){return{get:p=>this.cache.get(p)||null,keys:()=>[...this.cache.keys()],listen:f=>{this.L.add(f);return()=>this.L.delete(f)},
    write:(op,p,d)=>{let v=null;if(op==='set')v=d;else if(op==='update'){const o=this.cache.get(p);if(!o)return Promise.resolve();v={...o,...d};}
      if(v)this.cache.set(p,v);else this.cache.delete(p);this.notify();
      return new Promise(res=>{try{this.client.publish(TP+p,v?JSON.stringify(v):'',{qos:1,retain:true},()=>res());}catch(e){res()}});}};},
  waitDoc(p,ms){return new Promise(res=>{if(this.cache.get(p))return res(true);const f=()=>{if(this.cache.get(p)){this.L.delete(f);res(true)}};this.L.add(f);setTimeout(()=>{this.L.delete(f);res(!!this.cache.get(p))},ms);});}
};

function sortHand(h) {
  return h.slice().sort((a, b) => {
    const ca = a.color ? ORDER[a.color] : 9, cb = b.color ? ORDER[b.color] : 9;

/* =========================================================
   CREA / APRI / ESCI
   ========================================================= */
function busy(msg) { $('#app').innerHTML = `<div class="home"><div class="panel mut">${esc(msg)}</div></div>`; }
function writeErr(e) {
  if (e && e.code === 'invalid_argument') toast('Non hai il permesso di giocare qui.', 'warn');
  else toast('Connessione instabile, riprova.', 'warn');
}
async function createGame() {
  if (MODE === 'claude' && !CANWRITE) return toast('Non hai il permesso di creare partite', 'warn');
  const c = genCode();
  if (MODE === 'p2p') {
    busy('Preparo la partita…');
    if (!(await Net.connect())) { renderHome(); return toast('Non riesco a collegarmi al server del gioco. Controlla la connessione e riprova.', 'warn'); }
    Net.sub(c);
  }
  addRecent(c, myName);
  const g = { code: c, status: 'lobby', host: myId, hostName: myName, created: Date.now(), v: 1, settings: defaultSettings(), extras: [] };
  try { await DB.doc('games/' + c).set(g); await DB.doc(`games/${c}/seats/${myId}`).set({ id: myId, name: myName, t: Date.now() }); }
  catch (e) { return writeErr(e); }
  openGame(c, false);
}

function closeGame() {
  unsubs.forEach(u => { try { u() } catch (e) { } }); unsubs = [];
  clearInterval(hbTimer); clearInterval(dutyTimer); clearInterval(uiTick); clearTimeout(botTimer); clearTimeout(jumpTimer); clearTimeout(resultsTimer);
  S = null; serverS = null; seats = []; chat = []; code = null; inflight = 0; writeChain = Promise.resolve();
  builtKey = ''; gameKey = ''; feedKey = '';
  for (const k in lastSeen) delete lastSeen[k];
  for (const k in presT) delete presT[k];
  hideModal(); hideInfo();
}

async function openGame(c, join) {
  closeGame(); view = 'game';
  try { if (location.hash !== '#' + c) location.hash = c; } catch (e) { }
  if (MODE === 'p2p') {
    busy('Mi collego alla partita ' + c + '…');
    const ok = await Net.connect();
    if (view !== 'game') return;
    let found = false;
    if (ok) { Net.sub(c); found = await Net.waitDoc('games/' + c, 9000); }
    if (view !== 'game') return;
    if (!found) {
      $('#app').innerHTML = `<div class="home"><div class="panel"><h3>${ok ? 'Non trovo la partita ' + esc(c) : 'Non riesco a collegarmi al server del gioco'}</h3><p class="mut">${ok ? 'Controlla che il codice sia giusto (5 caratteri, come te l’ha mandato chi ha creato la partita).' : 'Controlla la connessione a internet e riprova.'}</p><div class="row"><button class="btn primary" id="rt">Riprova</button><button class="btn" id="bk">Indietro</button></div></div></div>`;
      $('#rt').onclick = () => openGame(c, join); $('#bk').onclick = leave; return;
    }
    const g = Net.cache.get('games/' + c); addRecent(c, g && g.hostName);
  } else addRecent(c, myName);
  code = c;
  busy('Apro la partita ' + c + '…');
  let first = true;
  const t = setTimeout(() => { if (first && code === c) $('#app').innerHTML = '<div class="home"><div class="panel">Non riesco a raggiungere la partita. Controlla la connessione. <button class="btn sm" id="bk">Indietro</button></div></div>', $('#bk') && ($('#bk').onclick = leave); }, 10000);
  unsubs.push(DB.doc('games/' + c).onSnapshot(snap => {
    clearTimeout(t);
    if (!snap.exists) { if (first) { first = false; $('#app').innerHTML = '<div class="home"><div class="panel">Partita non trovata. <button class="btn sm" id="bk">Indietro</button></div></div>'; $('#bk').onclick = leave; } return; }
    const d = clone(snap.data()); serverS = d;
    if (first && join && d.status === 'lobby' && !seats.some(s => s.id === myId) && (!window.Tavolata || Tavolata.puoEntrare(d))) {
      DB.doc(`games/${c}/seats/${myId}`).set({ id: myId, name: myName || 'Giocatore', t: Date.now() }).catch(writeErr);
    }
    first = false;
    if (S && inflight > 0 && (d.v || 0) < (S.v || 0)) return;
    applyState(d);
  }, () => toast('Connessione alla partita persa.', 'warn')));
  unsubs.push(DB.collection(`games/${c}/seats`).onSnapshot(s => { seats = (window.Tavolata ? Tavolata.posti(s.docs.map(d => d.data())) : s.docs.map(d => d.data())).sort((a, b) => a.t - b.t); if (S && S.status === 'lobby') renderLobby(); }, () => { }));
  unsubs.push(DB.collection(`games/${c}/chat`).orderBy('t', 'desc').limit(60).onSnapshot(s => { chat = s.docs.map(d => d.data()).reverse(); onChat(); }, () => { }));
  unsubs.push(DB.collection(`games/${c}/pres`).onSnapshot(s => {
    const now = Date.now();
    s.docs.forEach(d => { const x = d.data(); if (!x || !x.id) return;
      if (presT[x.id] === undefined) lastSeen[x.id] = now - x.t < 30000 ? now : x.t;
      else if (presT[x.id] !== x.t) lastSeen[x.id] = now;
      presT[x.id] = x.t; });
  }, () => { }));
  const beat = () => { if (code === c && DB) DB.doc(`games/${c}/pres/${myId}`).set({ id: myId, t: Date.now() }).catch(() => { }); };
  beat(); hbTimer = setInterval(beat, 5000);
  openedAt = Date.now();
  dutyTimer = setInterval(dutyTick, 1000);
  uiTick = setInterval(tickUI, 500);
}

function leave() {
  if (S && S.status === 'lobby' && code && DB) DB.doc(`games/${code}/seats/${myId}`).delete().catch(() => { });
  const cc = code; closeGame(); view = 'home';
  if (MODE === 'p2p' && cc) setTimeout(() => Net.unsub(cc), 400);
  try { history.replaceState(null, '', location.pathname + location.search) } catch (e) { try { location.hash = '' } catch (_) { } }
  renderHome();
}

/* scrive il nuovo stato (come in Monopolio: copia, modifica, pubblica) */
function act(fn) {
  if (!S) return false;
  if (MODE === 'claude' && !CANWRITE) { toast('Puoi solo guardare questa partita'); return false; }
  const N = clone(S);
  if (fn(N) === false) return false;
  N.v = (S.v || 0) + 1; N.upd = Date.now();
  applyState(N);
  inflight++;
  writeChain = writeChain.then(() => DB.doc('games/' + code).set(N)).then(() => { inflight--; }, e => { inflight--; writeErr(e); if (serverS) applyState(clone(serverS)); });
  return true;
}
/* azione di gioco passata al motore delle regole */
function gameAct(a, quiet) {
  let res = null;
  const ok = act(N => {
    if (!N.game || N.status !== 'playing') return false;
    const before = N.game.phase;
    res = E.applyAction(N.game, a);
    if (!res.ok) return false;
    N.tAt = Date.now();
    if (N.game.phase === 'gameEnd') { N.status = 'ended'; N.ended = Date.now(); N.away = {}; }
    if (before !== N.game.phase && N.game.phase === 'turn') N.tAt = Date.now();
  });
  if (!ok && res && !res.ok && !quiet) toast(res.error, 'warn');
  return ok;
}

function applyState(d) {
  S = d;
  if (view !== 'game') return;
  if (S.status === 'lobby') { builtKey = ''; renderLobby(); return; }
  renderGame();
  saveGameStats();
}

function startMatch() {
  const humans = seats.map(s => ({ id: s.id, name: s.name || 'Giocatore', bot: false }));
  act(N => {
    const ex = (N.extras || []).map(x => ({ id: x.id, name: x.name, bot: true }));
    const all = [...humans, ...ex].slice(0, 10);
    if (all.length < 2) return false;
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
    const o = Object.assign({}, N.settings);
    N.game = E.createGame(all, o);
    N.status = 'playing'; N.started = Date.now(); N.away = {}; N.disc = {}; N.tAt = Date.now(); N.ended = null;
  });
}

/* =========================================================
   COMPITI DI "REGIA" (bot, timer, disconnessioni)
   Li svolge un solo dispositivo: chi ha creato la partita,
   oppure, se è offline, il primo giocatore ancora collegato.
   ========================================================= */
function isPresent(id) { return id === myId || (lastSeen[id] && Date.now() - lastSeen[id] < 16000); }
function dutyId() {
  if (!S) return null;
  if (!S.game) return S.host;
  const humans = S.game.players.filter(p => !p.bot && p.status !== 'disconnesso');
  const order = [S.host, ...humans.map(p => p.id)];
  for (const id of order) if (humans.some(p => p.id === id) && isPresent(id)) return id;
  return S.host;
}
function dutyTick() {
  if (!S || view !== 'game' || S.status !== 'playing' || !S.game) return;
  if (dutyId() !== myId) return;
  const G = S.game, now = Date.now();
  const wait = (G.options.disconnectWait || 60) * 1000;
  // disconnessioni (dopo qualche secondo dall'apertura, per dare tempo alle presenze di arrivare)
  if (now - openedAt > 15000) for (const p of G.players) {
    if (p.bot || p.status === 'disconnesso' || p.id === myId) continue;
    const here = isPresent(p.id), away = S.away && S.away[p.id];
    if (!here && !away) {
      return act(N => { N.away = N.away || {}; N.disc = N.disc || {};
        N.away[p.id] = { since: now, until: now + wait }; N.disc[p.id] = (N.disc[p.id] || 0) + 1;
        chatSys(N, `🔌 ${p.name} si è disconnesso: lo aspettiamo ${fmtTime(wait)}.`); });
    }
    if (here && away) {
      return act(N => { delete N.away[p.id]; chatSys(N, `✅ ${p.name} è tornato!`); });
    }
    if (away && now > away.until) {
      return act(N => {
        delete N.away[p.id];
        E.removePlayer(N.game, p.id);
        if (N.game.phase === 'gameEnd') { N.status = 'ended'; N.ended = Date.now(); }
        N.tAt = Date.now();
      });
    }
  }
  // tempo per turno
  const t = G.options.turnTimer;
  if (t && (G.phase === 'turn' || G.phase === 'color' || G.phase === 'swap')) {
    const ai = E.actorIdx(G); const ap = G.players[ai];
    if (ap && !ap.bot && !(S.away && S.away[ap.id]) && now - (S.tAt || now) > t * 1000 + 800) {
      const a = E.autoAction(G); if (a) { gameAct(a, true); }
    }
  }
}
/* un messaggio di sistema nella cronaca */
function chatSys(N, msg) { if (!N.game) return; N.game.log.push({ n: ++N.game.logSeq, msg, kind: 'warn', t: Date.now() }); }

function scheduleBots() {
  if (!S || S.status !== 'playing' || !S.game) return;
  if (dutyId() !== myId) return;
  const G = S.game;
  if (G.phase !== 'turn' && G.phase !== 'color' && G.phase !== 'swap') return;
  const v = S.v;
  // inserimento al volo dei bot
  if (G.options.jumpIn && G.lastPlay !== lastJumpCheck) {
    lastJumpCheck = G.lastPlay; clearTimeout(jumpTimer);
    jumpTimer = setTimeout(() => {
      if (!S || S.v !== v || !S.game) return;
      const g = S.game;
      const cands = E.activeIdx(g).filter(i => g.players[i].bot && B.botJump(g, i));
      if (cands.length && Math.random() < 0.55) { const i = cands[Math.floor(Math.random() * cands.length)]; gameAct(B.botJump(g, i), true); }
    }, 500 + Math.random() * 450);
  }
  const ai = E.actorIdx(G); if (ai < 0) return;
  const p = G.players[ai];
  if (!p.bot) return;
  const key = S.code + ':' + v;
  if (botFor === key) return; botFor = key;
  clearTimeout(botTimer);
  const delay = G.phase === 'color' || G.phase === 'swap' ? 650 : 900 + Math.random() * 500;
  botTimer = setTimeout(() => {
    if (!S || S.v !== v || !S.game) return;
    const g = S.game; const i = E.actorIdx(g);
    if (i < 0 || !g.players[i].bot) return;
    const a = B.botAction(g, i);
    if (!(a && gameAct(a, true))) gameAct(E.autoAction(g), true);
  }, delay);
}

/* =========================================================
   INTERFACCIA DI GIOCO
   ========================================================= */
const G_ = () => S && S.game;
const myIdx = () => S && S.game ? S.game.players.findIndex(p => p.id === myId) : -1;
function myHand() { const i = myIdx(); return i >= 0 ? S.game.players[i].hand : []; }

function renderGame() {
  const G = S.game; if (!G) return;
  const key = S.code + ':' + (S.started || 0);
  if (key !== gameKey) { // nuova partita: azzera lo stato dell'interfaccia
    gameKey = key; ultimaArmed = false; selected = []; reveals = []; resultsReadyAt = 0;
    lastEventN = G.events.length ? G.events[G.events.length - 1].n : 0;
    lastJumpCheck = G.lastPlay;
  }
  if (builtKey !== key || !$('#game')) { buildGameUI(); builtKey = key; }
  const me = myIdx();
  const v = E.viewFor(G, myId);
  const ai = E.actorIdx(G);
  selected = selected.filter(id => handCard(id));
  if (!v.legal || !v.legal.myTurn || v.phase !== 'turn') selected = [];
  renderTop(v);
  renderOpponents(v, ai);
  renderCenter(v);
  renderMe(v, ai, me);
  renderFeed();
  handleEvents(v);
  renderAway();
  renderModal(v);
  tickUI();
  scheduleBots();
}

    t = (o.mode === 'torneo' ? `Torneo · mano ${v.round} di ${o.rounds}` : 'Partita singola') + ` · codice <b>${esc(S.code)}</b>`;
