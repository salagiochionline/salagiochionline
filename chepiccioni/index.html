<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1d1a2f">
<title>Che Piccioni! · gioco di carte e dadi online con gli amici</title>
<meta name="description" content="Che Piccioni!: il gioco di carte e dadi in cui attiri i piccioni sulla tua panchina, li rubi agli altri e lanci la cacca con la fionda. Vince chi riempie per primo la panchina. Gioca online gratis con gli amici, da 2 a 5, anche con i bot e senza account.">
<meta property="og:title" content="Che Piccioni! · gioco di carte e dadi online">
<meta property="og:description" content="Briciole, pane fresco, furti, NON! e cacca con la fionda: riempi per primo la tua panchina di piccioni. Da 2 a 5 giocatori, anche con i bot, senza account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d1a2f'/><rect x='12' y='72' width='76' height='9' rx='3' fill='%23b5835a'/><ellipse cx='46' cy='56' rx='24' ry='16' fill='%23adb5bd'/><circle cx='68' cy='38' r='12' fill='%23adb5bd'/><path d='M58 48q8 7 18 0' fill='none' stroke='%23a9e34b' stroke-width='5' stroke-linecap='round'/><circle cx='71' cy='35' r='3' fill='%231d1a2f'/><path d='M79 37l9 3-9 3z' fill='%23ffa94d'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d1a2f; --bg2:#22263a; --panel:#262a44; --panel2:#30365a; --line:rgba(255,255,255,.10);
  --text:#f3f7ec; --muted:#aeb7c8; --accent:#a9e34b; --accent2:#d8f5a2; --deep:#5c940d;
  --ok:#22c55e; --bad:#f43f5e; --radius:14px;
  --c-prendi:#69db7c; --c-attacco:#ff6b6b; --c-dado:#ffd43b; --c-non:#4dabf7; --c-speciale:#b197fc;
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{background:radial-gradient(1200px 700px at 50% -10%,#2f4a1a 0%,var(--bg) 62%) fixed}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- pulsanti ---------- */
.btn{border:1px solid var(--line);background:var(--panel2);padding:.55em 1em;border-radius:12px;cursor:pointer;font-weight:600;transition:transform .12s,background .12s,opacity .12s;white-space:nowrap;touch-action:manipulation}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#3b4370}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(135deg,#74b816,#a9e34b 55%,#d8f5a2);border:none;color:#1a2e05}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#82c91e,#c0eb75 55%,#e9fac8)}
.btn.go{background:#22c55e;color:#06260f;border:none}
.btn.pulse:not(:disabled){animation:pulse 1.4s infinite}
.btn.warn{background:#c2410c;border:none}
.btn.non{background:linear-gradient(135deg,#1864ab,#4dabf7);border:none;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn.ghost{background:transparent}
.btn.sm{padding:.4em .75em;font-size:.86rem;border-radius:9px}
.btn.big{padding:.8em 1.6em;font-size:1.08rem}
.btn.on{outline:2px solid var(--accent);outline-offset:1px;background:#33461f}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(169,227,75,.55)}50%{box-shadow:0 0 0 9px rgba(169,227,75,0)}}

/* ---------- logo ---------- */
.logo{font-weight:700;font-size:3.5rem;letter-spacing:-.02em;line-height:1;display:inline-flex;align-items:center;gap:.18em;transform:rotate(-3deg);filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.logo .lt{background:linear-gradient(90deg,#e9fac8,#a9e34b 45%,#74b816);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .ico{display:inline-flex;width:1.25em;height:1.1em}
.logo .ico svg{width:100%;height:100%}
.logo.sm{font-size:1.7rem}
.logo.xs{font-size:1.3rem}

/* ---------- home e lobby ---------- */
body.v-home,body.v-lobby{overflow-y:auto}
body.v-game{overflow:hidden}
.home{max-width:780px;margin:0 auto;padding:30px 16px 60px;display:flex;flex-direction:column;gap:16px;position:relative}
.hero{text-align:center;margin-bottom:4px}
.gamepill{display:table;margin:0 auto 14px;background:#d8f5a2;color:#1a2e05;font-weight:700;letter-spacing:.14em;font-size:.75rem;padding:5px 16px;border-radius:99px}
.tagline{color:var(--muted);margin:16px auto 0;max-width:58ch}
.hubbtn{text-decoration:none;color:var(--text);width:max-content;display:inline-flex;align-items:center;gap:6px}
.panel{background:rgba(38,42,68,.8);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(6px)}
.panel h3{margin:0 0 12px;font-size:1.15rem;font-weight:600}
.mut{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.mid{justify-content:center}
.banner{background:#3a2a10;border:1px solid #7c5a10;color:#ffe2a8;border-radius:14px;padding:12px 14px;font-size:.9rem}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gitem{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.medal{font-size:1.2rem;font-weight:700;color:var(--accent);width:40px;text-align:center}
.bigcode{font-size:2.6rem;font-weight:700;letter-spacing:8px;color:var(--accent);margin:4px 0}
.netst{color:#fde68a}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.seat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.seat select{padding:.3em .4em;font-size:.82rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.tile{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tile b{font-size:1.4rem;color:var(--accent)}.tile span{font-size:.78rem;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sitem span{color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);background:#1c2036;border:1px solid var(--line);border-radius:10px;padding:.6em .7em}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.flabel{font-size:.85rem;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.seg button{background:#1c2036;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.seg button small{color:var(--muted);font-size:.8rem}
.seg button.on{border-color:var(--accent);background:#2a3d1c}
.inline{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.group{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.group h4{margin:4px 0 6px;font-size:1rem;color:var(--accent2);font-weight:600}
.opt{border-radius:12px;padding:8px 10px;margin:4px 0;background:rgba(255,255,255,.03)}
.opt.dis{opacity:.55}
.opt-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.opt-label{font-weight:500}
.opt select{max-width:58%}
.opt details{margin-top:4px}
.opt summary{cursor:pointer;color:var(--muted);font-size:.82rem;list-style:none;display:inline-flex;gap:4px;align-items:center}
.opt summary::-webkit-details-marker{display:none}
.opt summary::before{content:'▸';transition:transform .15s}
.opt details[open] summary::before{transform:rotate(90deg)}
.opt .help{font-size:.88rem;color:#eef3e6;line-height:1.45;padding:6px 2px 2px}
.opt .help ul{margin:.3em 0;padding-left:1.2em}
.opt .note{display:block;margin-top:4px}
.opt select:disabled,.seg button:disabled{opacity:.6;cursor:default}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.deckgrid .dg{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.05);border-radius:10px;padding:6px 8px;font-size:.82rem}
.deckgrid .dg .ci{font-size:1.4rem}
.deckgrid .dg b{display:block;font-size:.86rem}

/* ---------- avatar ---------- */
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:1.1rem;color:#1a1238;box-shadow:0 0 0 2px rgba(255,255,255,.25);position:relative}
.av .sh{position:absolute;right:-4px;bottom:-4px;font-size:.62em;background:#1d1a2f;border-radius:50%;width:1.55em;height:1.55em;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.4)}

/* ---------- carte ---------- */
.pc{--w:92px;--cc:#69db7c;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.12);position:relative;flex:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(170deg,#fffdf5,#f1efe2);border:2px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.42);color:#1d1a2f;display:flex;flex-direction:column;align-items:center;overflow:hidden;font-size:calc(var(--w)*.12)}
.pc .hd{width:100%;background:var(--cc);color:#14121f;font-weight:700;text-align:center;font-size:calc(var(--w)*.125);line-height:1.15;padding:calc(var(--w)*.06) calc(var(--w)*.04);min-height:calc(var(--w)*.34);display:flex;align-items:center;justify-content:center;letter-spacing:-.01em}
.pc .ic{font-size:calc(var(--w)*.4);line-height:1;margin-top:calc(var(--w)*.07);filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.pc .tx{font-size:calc(var(--w)*.098);line-height:1.2;text-align:center;padding:0 calc(var(--w)*.06);margin-top:calc(var(--w)*.05);color:#3a3550}
.pc .cs{position:absolute;bottom:calc(var(--w)*.04);right:calc(var(--w)*.06);font-size:calc(var(--w)*.13);font-weight:700;color:var(--cc);text-shadow:0 0 1px #000}
.pc.k-prendi{--cc:var(--c-prendi)}.pc.k-attacco{--cc:var(--c-attacco)}.pc.k-dado{--cc:var(--c-dado)}.pc.k-non{--cc:var(--c-non)}.pc.k-speciale{--cc:var(--c-speciale)}
.pc.back{background:repeating-linear-gradient(45deg,#4f7d16 0 8px,#5c940d 8px 16px);border-color:#c0eb75;justify-content:center}
.pc.back .bk{width:70%;height:70%;display:grid;place-items:center;border-radius:50%;background:rgba(0,0,0,.18)}
.pc.back .bk svg{width:80%;height:80%}
.pc.closed{background:linear-gradient(170deg,#3b4370,#262a44);border-color:#5c6599;justify-content:center;color:var(--muted)}
.pc.closed .ic{font-size:calc(var(--w)*.3)}
.pc.mini{--w:30px;font-size:0}
.pc.mini .hd,.pc.mini .tx,.pc.mini .cs{display:none}
.pc.mini .ic{font-size:calc(var(--w)*.5);margin-top:calc(var(--w)*.35)}
.pc.sel{transform:translateY(-18px) scale(1.04);box-shadow:0 0 0 3px #ffd43b,0 0 26px rgba(255,212,59,.55),0 8px 18px rgba(0,0,0,.45)}
.pc.can{cursor:grab}
.pc.nope{filter:grayscale(.6) brightness(.75)}

/* ---------- piccioni e panchine ---------- */
.bench{--s:26px;position:relative;display:flex;flex-direction:column;align-items:center}
.bench .plank{position:relative;height:calc(var(--s)*1.15);display:flex;align-items:flex-end;padding:0 calc(var(--s)*.2);border-radius:6px;background:linear-gradient(#c08a5b,#9a6b42);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 3px 0 #6b4a2c;border-top:3px solid var(--pc,#a9e34b)}
.bench .slot{width:var(--s);height:var(--s);position:relative;display:grid;place-items:end center;margin-bottom:calc(var(--s)*.16)}
.bench .slot::after{content:'';position:absolute;bottom:-2px;width:60%;height:4px;border-radius:2px;background:rgba(0,0,0,.18)}
.bench .slot svg{width:115%;height:115%;position:relative;z-index:1;transform-origin:50% 100%}
.bench .slot.newp svg{animation:land .5s ease-out both;animation-delay:var(--dl,0s)}
.bench .legs{display:flex;justify-content:space-between;width:86%;height:calc(var(--s)*.35)}
.bench .legs i{width:5px;background:#6b4a2c;border-radius:0 0 3px 3px}
@keyframes land{0%{transform:translateY(-40px) scale(.6);opacity:0}70%{transform:translateY(2px) scale(1.05);opacity:1}100%{transform:none}}
.bench.hit .plank{animation:shake .45s}
.bench.full .plank{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 3px 0 #6b4a2c,0 0 22px rgba(169,227,75,.8)}
.flypig{position:fixed;z-index:85;pointer-events:none;width:28px;height:28px;transition:transform .62s cubic-bezier(.35,.9,.4,1),opacity .62s;will-change:transform}
.flypig svg{width:100%;height:100%;animation:flap .18s linear infinite alternate}
@keyframes flap{to{transform:scaleY(.82) rotate(-6deg)}}
.flycard{position:fixed;z-index:86;pointer-events:none;transition:left .5s cubic-bezier(.3,.8,.4,1),top .5s cubic-bezier(.3,.8,.4,1),transform .5s}
.dragcard{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-50%) rotate(-5deg)}

/* ---------- partita ---------- */
#game{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(29,26,47,.6);backdrop-filter:blur(6px)}
.roundinfo{flex:1;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-actions{display:flex;gap:4px}
.layout{flex:1;display:grid;grid-template-columns:1fr 320px;min-height:0}
.maincol{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(20,18,34,.6)}
.side-head{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600}
.feed{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.msg{padding:4px 8px;border-radius:8px;color:var(--muted);line-height:1.35}
.msg.sys{color:#e9fac8}
.msg.warn{color:#ffd0c2;background:rgba(194,65,12,.22)}
.msg.win{color:#d1ffe0;background:rgba(34,197,94,.2);font-weight:600}
.msg.non{color:#d0ebff;background:rgba(77,171,247,.16)}
.msg.hit{color:#ffe8cc;background:rgba(255,146,43,.16)}
.msg.chat{color:var(--text);background:rgba(116,184,22,.2)}
.msg.emo{font-size:1.2rem}
.chatform{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.chatform input{flex:1;min-width:0}
.emobar{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;width:100%}
.emobar button{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;font-size:1.2rem;padding:.12em .38em;cursor:pointer}
.emobar button:hover{background:rgba(255,255,255,.15)}

.status{text-align:center;font-weight:600;font-size:1.02rem;padding:6px 10px 4px;min-height:32px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.status.mine{color:#ffe066}
.status .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;font-size:.9rem}

.tablewrap{flex:1;min-height:0;position:relative;margin:0 10px;border-radius:22px;background:radial-gradient(ellipse at 50% 46%,#4d6b2a 0%,#36501c 45%,#25371a 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),inset 0 10px 40px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}
.tablewrap::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.04) 0 2px,transparent 3px) 0 0/34px 34px,radial-gradient(circle at 70% 60%,rgba(0,0,0,.08) 0 2px,transparent 3px) 0 0/46px 46px;pointer-events:none}
.others{display:flex;justify-content:center;gap:10px;padding:10px 8px 0;flex-wrap:wrap;position:relative;z-index:1}
.oseat{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;padding:6px 8px 8px;border-radius:16px;transition:background .3s,box-shadow .3s;border:2px solid transparent}
.oseat .top{display:flex;align-items:center;gap:6px;max-width:100%}
.oseat .pn{font-weight:600;font-size:.9rem;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oseat .cnt{font-weight:700;color:var(--accent2);font-size:.95rem}
.oseat .ps{font-size:.74rem;color:var(--muted);min-height:1.1em;white-space:nowrap}
.oseat .mini-hand{display:flex;gap:2px;align-items:center}
.oseat .mini-hand .pc{--w:16px;border-width:1px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.oseat.turn{background:rgba(255,212,59,.12);border-color:rgba(255,212,59,.55)}
.oseat.off{opacity:.55}
.oseat.tgt{cursor:pointer;border-color:#ff8787;background:rgba(255,107,107,.14);animation:tgt 1.2s infinite}
.oseat.tgt.sel{border-color:#ffd43b;background:rgba(255,212,59,.18);animation:none}
.oseat.drop{border-color:#ffd43b;background:rgba(255,212,59,.22)}
@keyframes tgt{50%{box-shadow:0 0 0 5px rgba(255,107,107,.2)}}
.oseat .take{position:absolute;top:-8px;right:-6px;background:#ffd43b;color:#3a2a00;border-radius:99px;font-weight:700;font-size:.85rem;padding:1px 8px;z-index:3}
.shieldb{font-size:.9em}
.bubble{position:absolute;top:-10px;right:-6px;font-size:1.5rem;animation:bub 2.6s ease-out forwards;pointer-events:none;z-index:4}
@keyframes bub{0%{transform:scale(0) translateY(10px);opacity:0}15%{transform:scale(1.2);opacity:1}80%{opacity:1}100%{transform:translateY(-20px);opacity:0}}

.center{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,44px);position:relative;min-height:0;padding:6px;z-index:1}
.flock{position:relative;width:clamp(120px,24vw,210px);height:clamp(84px,15vh,130px);border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.1),rgba(255,255,255,.03) 70%);display:grid;place-items:center}
.flock .fp{position:absolute;width:24px;height:24px}
.flock .fp svg{width:100%;height:100%}
.flock .fcount{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:#1d1a2f;border:2px solid var(--accent);border-radius:99px;padding:1px 10px;font-weight:700;font-size:.85rem;white-space:nowrap;z-index:3}
.piles{display:flex;gap:12px;align-items:flex-end}
.pilebox{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.pile{position:relative;--w:clamp(58px,min(12vw,13vh),88px);width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.12);border:2px dashed rgba(216,245,162,.28);display:grid;place-items:center}
.pile .pc{position:absolute;inset:0;--w:inherit;width:100%;height:100%}
.pile .pc.u1{transform:rotate(-7deg) translate(-5px,2px);filter:brightness(.8)}
.pile.drop{border-color:#ffd43b;background:rgba(255,212,59,.14)}
.pilelab{font-size:.76rem;color:var(--muted);text-align:center}
.pilecount{position:absolute;top:-10px;right:-10px;background:#1d1a2f;border:2px solid var(--accent);border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:700;font-size:.8rem;z-index:3;padding:0 5px}
.die{--d:56px;width:var(--d);height:var(--d);border-radius:calc(var(--d)*.2);background:linear-gradient(150deg,#fff,#e9ecef);border:2px solid #1d1a2f;display:grid;place-items:center;box-shadow:0 5px 0 #adb5bd,0 8px 18px rgba(0,0,0,.4);color:#1d1a2f;font-weight:700;position:relative;flex:none}
.die .f{display:flex;flex-direction:column;align-items:center;line-height:1}
.die .f b{font-size:calc(var(--d)*.42)}
.die .f small{font-size:calc(var(--d)*.2)}
.die.rolling{animation:roll .9s cubic-bezier(.3,.7,.4,1)}
@keyframes roll{0%{transform:rotate(0) translateY(-30px) scale(.7)}40%{transform:rotate(320deg) translateY(-14px)}70%{transform:rotate(520deg) translateY(4px)}100%{transform:rotate(720deg)}}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:6;pointer-events:none;text-align:center;padding:10px}
.ovbox{background:rgba(20,18,32,.93);border:1px solid rgba(216,245,162,.2);border-radius:18px;padding:12px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:96%;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:rise .3s ease-out}
.ovbox .who{font-weight:600}
.ovrow{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.ovrow .pc{--w:clamp(86px,15vw,118px)}
.ring{--p:1;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*360deg),rgba(255,255,255,.12) 0);display:grid;place-items:center;flex:none}
.ring b{width:36px;height:36px;border-radius:50%;background:#1d1a2f;display:grid;place-items:center;font-size:.95rem}
.stamp{position:absolute;font-size:clamp(3rem,10vw,5.4rem);font-weight:700;color:#ff6b6b;border:6px solid #ff6b6b;border-radius:16px;padding:0 .3em;transform:rotate(-12deg);text-shadow:0 3px 0 rgba(0,0,0,.25);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both;background:rgba(20,18,32,.6);z-index:7;pointer-events:none}
.stamp.blue{color:#74c0fc;border-color:#74c0fc}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}}
.chainx{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);flex-wrap:wrap;justify-content:center}

.mezone{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px 6px}
.mebench{display:flex;align-items:center;gap:10px;border-radius:16px;padding:4px 10px;border:2px solid transparent}
.mebench.turn{background:rgba(255,212,59,.1);border-color:rgba(255,212,59,.45)}
.mebench .lab{display:flex;flex-direction:column;align-items:center;font-size:.8rem;color:var(--muted)}
.mebench .lab b{font-size:1.2rem;color:var(--accent2)}
.mebench.tgt{cursor:pointer;border-color:#ff8787}
.hand{display:flex;justify-content:center;align-items:flex-end;gap:8px;min-height:calc(var(--hw,92px)*1.4 + 20px);padding-top:18px;max-width:100%}
.hand .pc{--w:var(--hw,92px);transition:transform .2s;touch-action:none}
.hand .pc.drawn{animation:drawin .5s ease-out both}
@keyframes drawin{from{transform:translateY(60px) rotate(8deg);opacity:0}}
.handlab{font-size:.78rem;color:var(--muted);min-height:1.1em;text-align:center}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px 10px;flex-wrap:wrap;justify-content:center;background:rgba(20,18,34,.8);border-top:1px solid var(--line);min-height:62px}
.bar .hint{color:var(--muted);font-size:.9rem;text-align:center}
.playbtn{font-size:1.1rem;padding:.72em 1.3em}
.nonbtn{font-size:1.2rem;padding:.7em 1.4em}

/* ---------- fionda ---------- */
.sling{position:absolute;inset:0;z-index:20;background:rgba(14,18,10,.82);display:flex;flex-direction:column;align-items:center;padding:8px;gap:6px;backdrop-filter:blur(2px)}
.sling .tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sling .tabs .btn{font-size:.85rem;padding:.4em .7em}
.sling .field{flex:1;min-height:0;width:100%;display:flex;justify-content:center;margin:0}
.sling svg.fld{height:100%;max-width:100%;touch-action:none;cursor:crosshair;user-select:none}
.sling .tip{font-size:.85rem;color:var(--muted);text-align:center}
.splat{animation:splat .5s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes splat{from{transform:scale(0)}60%{transform:scale(1.3)}}

/* ---------- modali ---------- */
.modal{position:fixed;inset:0;background:rgba(10,8,20,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(3px)}
#info{z-index:60}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:720px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.modal-box h2{margin:0 0 6px}
.modal-box p{color:var(--muted)}
.winner{font-size:1.4rem;font-weight:700;margin:4px 0 8px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;align-items:center}
.rules-list{padding-left:1.1em;line-height:1.6}
.rules-list b{color:var(--accent2);font-weight:600}
.check{font-size:.88rem;border-radius:10px;padding:8px 10px;margin:8px 0}
.check.good{background:rgba(34,197,94,.15);color:#d1ffe0}
.check.bad{background:rgba(244,63,94,.18);color:#ffd5dc}
.check.wait{background:rgba(255,255,255,.06);color:var(--muted)}
.rank{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rank .rr{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}
.rank .rr.w{background:rgba(169,227,75,.16)}
.rank .rr .bar2{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.rank .rr .bar2 i{display:block;height:100%;background:var(--accent)}
.stwrap{overflow-x:auto;border-radius:12px;background:rgba(0,0,0,.2)}
.sttab{border-collapse:collapse;width:100%;font-size:.86rem}
.sttab th,.sttab td{padding:7px 9px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
.sttab th{font-weight:600;font-size:.78rem;vertical-align:bottom}
.sttab th .av{display:inline-grid;width:26px;height:26px;font-size:.8rem;margin-bottom:2px}
.sttab td:first-child{text-align:left;color:var(--muted)}
.note{font-size:.72rem;color:#fdba74;font-weight:500}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- avvisi ---------- */
.toasts{position:fixed;top:18vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:70;pointer-events:none;align-items:center;width:max-content;max-width:92vw}
.toast{background:#111;border:1px solid var(--line);padding:9px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:rise .2s ease-out;text-align:center}
.toast.warn{background:#c2410c}
.toast.good{background:#15803d}
.toast.big{background:var(--accent);color:#1a2e05;font-size:1.15rem}
.toast.out{opacity:0;transition:opacity .4s}
.awaybar{background:rgba(194,65,12,.88);display:flex;flex-direction:column;gap:4px;padding:6px 14px;font-size:.92rem;z-index:5}
.awayrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.awayrow .btn{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.35)}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:.7rem;font-weight:700;margin-left:3px;padding:0 5px;text-align:center}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;right:0;top:50px;bottom:0;width:min(340px,92vw);z-index:40;transform:translateX(100%);transition:transform .25s;background:#1b1830}
  .side.open{transform:none;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
}
@media (max-width:600px){
  .hide-sm{display:none}
  .topbar{gap:6px;padding:6px 8px}
  .tb-actions .btn{padding:.45em .6em}
  .logo{font-size:2.5rem}
  .logo.xs{font-size:1.05rem}
  .logo.xs .ico{display:none}
  .seg{grid-template-columns:1fr}
  .sgrid{grid-template-columns:1fr}
  .tablewrap{margin:0 4px;border-radius:14px}
  .others{gap:2px;padding-top:4px}
  .oseat{padding:3px 4px 5px}
  .oseat .pn{font-size:.76rem;max-width:70px}
  .oseat .ps{font-size:.66rem}
  .oseat .av{width:24px;height:24px;font-size:.75rem}
  .bar{padding:6px 6px 8px;gap:6px}
  .playbtn{font-size:1rem;padding:.7em .9em}
  .bigcode{font-size:2.1rem;letter-spacing:6px}
  .opt select{max-width:100%}
  .opt-head{flex-wrap:wrap}
  .modal{padding:8px;align-items:flex-end}
  .modal-box{padding:16px;max-height:88vh;border-radius:18px}
  .die{--d:44px}
  .status{font-size:.92rem;min-height:28px;padding:4px 6px 2px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="chat-toggle-css">
/* 💬 Chat: si apre e si chiude col pulsante anche sugli schermi grandi */
@media (min-width:901px){
  #side:not(.open){display:none!important}
    .layout.chat-chiusa{grid-template-columns:minmax(0,1fr)!important}
}
@media (min-width:901px){
  .layout:has(#side:not(.open)){grid-template-columns:minmax(0,1fr)!important}
}
</style>

/* 💬 Chat: aperta di default sugli schermi grandi, chiusa sul telefono; la scelta viene ricordata */

function chatAperta() { if (innerWidth <= CHAT_BP) return false; try { return localStorage.getItem('tavolata-chat') !== 'chiusa'; } catch (e) { return true; } }
</script>

      const ids = inIds(G), i = ids.indexOf(id);
      G.final = { queue: ids.slice(i + 1).concat(ids.slice(0, i + 1)) };
      log(G, '🃏 È stata pescata l\'ultima carta: ancora un turno a testa, poi vince chi ha più piccioni!', 'sys');
      emit(G, { k: 'last' });
    }
    return got.length;
  }

  /* ---------------- piccioni ---------------- */
  const room = (G, id) => Math.max(0, G.cap - (G.bench[id] || 0));
  function track(G, id) { const p = pl(G, id); if (p) p.st.maxBench = Math.max(p.st.maxBench, G.bench[id] || 0); }
  // sposta n piccioni (from/to: id di un giocatore oppure 'flock'); ritorna quanti si sono mossi
  function move(G, from, to, n, why, actor) {
    if (n <= 0) return 0;
    const avail = from === 'flock' ? G.flock : (G.bench[from] || 0);
    const space = to === 'flock' ? Infinity : room(G, to);
    const k = Math.max(0, Math.min(n, avail, space));
    if (!k) return 0;
    if (from === 'flock') G.flock -= k; else G.bench[from] -= k;
    if (to === 'flock') G.flock += k; else { G.bench[to] += k; track(G, to); }
    emit(G, { k: 'mv', from, to, n: k, why: why || '' });
    const P = id => pl(G, id);
    if (from === 'flock' && to !== 'flock') P(to).st.gained += k;
    if (from !== 'flock' && to !== 'flock') { P(to).st.stolen += k; P(from).st.lost += k; P(to).st.tg[from] = (P(to).st.tg[from] || 0) + k; P(from).st.by[to] = (P(from).st.by[to] || 0) + k; }
    if (from !== 'flock' && to === 'flock') { P(from).st.lost += k; if (actor && actor !== from && P(actor)) { P(actor).st.tg[from] = (P(actor).st.tg[from] || 0) + k; P(from).st.by[actor] = (P(from).st.by[actor] || 0) + k; } }
    return k;
  }
  // ruba "amount" secondo il piano {id:n}; il resto dallo stormo
  function stealPlan(G, by, plan, amount) {
    let got = 0;
    for (const id of G.order) { const n = plan[id] || 0; if (!n || id === by) continue; got += move(G, id, by, Math.min(n, amount - got), 'ruba', by); }
    if (got < amount) got += move(G, 'flock', by, amount - got, 'resto');
    return got;
  }
  const protectedP = (G, id) => !!G.shield[id];
  const targetsOf = (G, by) => inIds(G).filter(id => id !== by && !protectedP(G, id));
  // chi si può scegliere con questa carta: null = nessuna scelta
  function targetsFor(G, by, t) {
    if (t === 'why') { const ids = inIds(G), max = Math.max(...ids.map(id => G.bench[id])); const top = ids.filter(id => G.bench[id] === max); return top.length > 1 && max > 0 ? top : null; }
    if (TYPES[t] && TYPES[t].target) return targetsOf(G, by);
    return null;
  }
  function whyVictim(G, target) { const ids = inIds(G), max = Math.max(...ids.map(id => G.bench[id])); const top = ids.filter(id => G.bench[id] === max); return top.includes(target) ? target : top[0]; }

  /* ---------------- turni ---------------- */
  function deadline(G) { return G.options.turnTime ? G.now + G.options.turnTime * 1000 : null; }
  function startTurn(G, id) {
    G.phase = 'turn'; G.pend = null; G.choose = null;
    G.turn = { id, n: ++G.turnNo, until: deadline(G) }; G.turnStartAt = G.now;
    if (G.shield[id]) { delete G.shield[id]; log(G, `🛡️ Lo scudo di ${nm(G, id)} è finito.`, 'sys'); }
    const p = pl(G, id); p.st.turns++; G.myTurns[id] = (G.myTurns[id] || 0) + 1;
    // "ultimo" per le rimonte
    const ids = inIds(G), min = Math.min(...ids.map(x => G.bench[x]));
    ids.forEach(x => { if (G.bench[x] === min && ids.some(y => G.bench[y] > min)) G.wasLast[x] = true; });
    emit(G, { k: 'turn', id });
    if (!G.hand[id].length && !(G.owed[id] > 0)) { log(G, `${nm(G, id)} non ha carte: passa.`, 'sys'); return endTurn(G); }
  }
  function nextAfter(G, id) {
    const ids = G.order, i = ids.indexOf(id);
    for (let k = 1; k <= ids.length; k++) { const x = ids[(i + k) % ids.length]; if (isIn(G, x)) return x; }
    return null;
  }
  function endTurn(G) {
    if (G.phase === 'over' || G.phase === 'gameEnd') return;
    const id = G.turn ? G.turn.id : null;
    if (G.final) { if (G.final.queue[0] === id) G.final.queue.shift(); }
    else if (id && isIn(G, id)) drawUpTo(G, id);
    if (G.phase === 'over' || G.phase === 'gameEnd') return;
    if (G.final) {
      G.final.queue = G.final.queue.filter(x => isIn(G, x));
      if (!G.final.queue.length) return endByCount(G);
      return startTurn(G, G.final.queue[0]);
    }
    const nx = id ? nextAfter(G, id) : inIds(G)[0];
    if (!nx) return;
    startTurn(G, nx);
  }

  /* ---------------- fine partita ---------------- */
  function checkWin(G, active) {
    const ids = inIds(G); const i = Math.max(0, ids.indexOf(active));
    const ord = ids.slice(i).concat(ids.slice(0, i));
    const w = ord.find(id => G.bench[id] >= G.cap);
    if (w) { endRound(G, [w], 'full'); return true; }
    return false;
  }
  function endByCount(G) {
    const ids = inIds(G); const max = Math.max(...ids.map(id => G.bench[id]));
    endRound(G, ids.filter(id => G.bench[id] === max), 'deck');
  }
  function endRound(G, winners, how) {
    G.pend = null; G.choose = null; G.hold = null;
    const ids = inIds(G);
    winners.forEach(w => { G.score[w] = (G.score[w] || 0) + 1; const p = pl(G, w); p.st.wins++; const t = G.myTurns[w] || 0; if (how === 'full' && (p.st.fastWin == null || t < p.st.fastWin)) p.st.fastWin = t; if (G.wasLast[w]) p.st.comeback++; });
    const r = { gameNo: G.gameNo, winners, how, benches: Object.assign({}, G.bench), ids, turns: G.turnNo, cap: G.cap, left: deckLeft(G), turnsOf: Object.assign({}, G.myTurns) };
    G.results.push(r); G.res = r;
    const wn = winners.map(w => nm(G, w)).join(' e ');
    if (how === 'full') log(G, `🏆 ${wn} ha riempito la panchina e vince!`, 'win');
    else if (how === 'deck') log(G, winners.length > 1 ? `🤝 Pareggio: ${wn} con ${G.bench[winners[0]]} piccioni!` : `🏆 Mazzo finito: vince ${wn} con ${G.bench[winners[0]]} piccioni!`, 'win');
    else log(G, `🏆 ${wn} vince: è rimasto solo in piazza!`, 'win');
    emit(G, { k: 'win', ids: winners, how });
    const best = Math.max(...G.order.map(id => G.score[id] || 0));
    const over = G.target <= 1 || best >= G.target || inIds(G).length < 2;
    G.phase = over ? 'gameEnd' : 'over';
    if (over && G.target > 1) { const ch = G.order.filter(id => (G.score[id] || 0) === best); log(G, `👑 Torneo: ${ch.map(id => nm(G, id)).join(' e ')} ${ch.length > 1 ? 'vincono' : 'vince'} con ${best} ${best === 1 ? 'vittoria' : 'vittorie'}!`, 'win'); }
  }

  /* ---------------- effetti ---------------- */
  function needsTarget(t) { return !!(TYPES[t] && TYPES[t].target); }
  function applyEffect(G, by, t, target, pd) {
    const P = pl(G, by);
    const fromBy = () => { const ids = inIds(G), i = ids.indexOf(by); return ids.slice(i).concat(ids.slice(0, i)); };
    switch (t) {
      case 'heart': move(G, 'flock', by, target === 2 ? 4 : 1, 'briciole'); break; // target=2: due cuori
      case 'bread': move(G, 'flock', by, 3, 'pane'); break;
      case 'steal': if (target && isIn(G, target) && !protectedP(G, target)) move(G, target, by, 1, 'ruba', by); break;
      case 'bye': if (target && isIn(G, target) && !protectedP(G, target)) move(G, target, 'flock', 2, 'ciao', by); break;
      case 'attack': targetsOf(G, by).forEach(id => move(G, id, by, 1, 'attacco', by)); break;
      case 'scare': targetsOf(G, by).forEach(id => move(G, id, 'flock', 1, 'aaah', by)); break;
      case 'why': { const v = whyVictim(G, target); if (v) { const n = move(G, v, 'flock', 3, 'perche', by); log(G, `😭 ${nm(G, v)} ha più piccioni di tutti: ne rimanda ${n} nello stormo.`, 'sys'); } break; }
      case 'isthis': fromBy().forEach(id => move(G, 'flock', id, 1, 'tutti')); break;
      case 'party': { const who = fromBy().filter(id => G.bench[id] <= 3); who.forEach(id => move(G, 'flock', id, 2, 'festa')); if (!who.length) log(G, '🎉 Nessuno ha 3 piccioni o meno: festa deserta!', 'sys'); break; }
      case 'fear': move(G, 'flock', by, 2, 'nontemere'); if (target && isIn(G, target)) move(G, 'flock', target, 1, 'regalo'); break;
      case 'mail': {
        const pick = pd && pd.pick; if (pick == null) break;
        const i = G.discard.lastIndexOf(pick); if (i < 0) break;
        G.discard.splice(i, 1); G.mailed++;
        const pk = 'd' + (++G.dseq) + ':' + pick; G.hand[by].push(pk);
        emit(G, { k: 'mail', by, c: pick });
        log(G, `📬 ${nm(G, by)} riprende dagli scarti ${TYPES[typeOf(pick)].ico} ${TYPES[typeOf(pick)].name}.`, 'sys');
        break;
      }
      case 'swap': if (target && isIn(G, target) && !protectedP(G, target) && target !== by) {
        const a = G.bench[by], b = G.bench[target]; G.bench[by] = b; G.bench[target] = a; P.st.swaps++;
        track(G, by); track(G, target); emit(G, { k: 'swap', a: by, b: target, na: b, nb: a }); }
        break;
      case 'left': case 'right': {
        const ids = inIds(G), old = ids.map(id => G.bench[id]), n = ids.length;
        ids.forEach((id, i) => { G.bench[id] = t === 'left' ? old[(i - 1 + n) % n] : old[(i + 1) % n]; track(G, id); });
        emit(G, { k: 'slide', dir: t, ids, before: old, after: ids.map(id => G.bench[id]) });
        break;
      }
    }
  }

  /* ---------------- la fionda ---------------- */
  // campo 100 × 150: dado in (50,135), panchina sulla linea y=25 tra x=10 e x=90
  const SLING = { facile: { sp: .022, band: 13, rad: 1.5 }, normale: { sp: .035, band: 10, rad: 1.35 }, difficile: { sp: .05, band: 8, rad: 1.2 } };
  const FIELD = { x0: 50, y0: 135, by: 25, bx0: 10, bx1: 90, dmax: 150 };
  function seatX(cap, i) { return FIELD.bx0 + (i + .5) * (FIELD.bx1 - FIELD.bx0) / cap; }
  // i posti si riempiono dal centro verso l'esterno
  function fillOrder(cap) { const c = (cap - 1) / 2, a = Array.from({ length: cap }, (_, i) => i); return a.sort((x, y) => Math.abs(x - c) - Math.abs(y - c) || x - y); }
  function seatsOf(cap, n) { return fillOrder(cap).slice(0, Math.max(0, Math.min(cap, n))).sort((a, b) => a - b); }
  function landing(th, pull) { const d = Math.max(0, Math.min(1, pull)) * FIELD.dmax; return { x: FIELD.x0 + d * Math.sin(th), y: FIELD.y0 - d * Math.cos(th) }; }
  function slingHits(cap, n, x, y, lvl) {
    const s = SLING[lvl] || SLING.normale, dy = Math.abs(y - FIELD.by);
    if (dy > s.band || x < FIELD.bx0 - 4 || x > FIELD.bx1 + 4) return [];
    const w = (FIELD.bx1 - FIELD.bx0) / cap;
    const r = w * s.rad * (1 - dy / (s.band * 1.6));
    return seatsOf(cap, n).filter(i => Math.abs(seatX(cap, i) - x) <= r);
  }
  // mira perfetta verso un punto x della panchina
  function aimAt(x) { const dx = x - FIELD.x0, dy = FIELD.y0 - FIELD.by; return { th: Math.atan2(dx, dy), pull: Math.hypot(dx, dy) / FIELD.dmax }; }
  function gauss() { let u = 0, v = 0; while (!u) u = rand(); while (!v) v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  /* ---------------- reazioni (NON) ---------------- */
  function lastAuthor(pd) { return pd.chain.length ? pd.chain[pd.chain.length - 1].by : pd.by; }
  function reactors(G) {
    const pd = G.pend; if (!pd) return [];
    if (pd.chain.length && G.options.nonChain === 'no') return [];
    const la = lastAuthor(pd);
    return inIds(G).filter(id => id !== la && G.hand[id].length > 0);
  }
  function openWindow(G) {
    if (!G.hasNon) { G.pend.step = (G.pend.step || 0) + 1; return resolve(G); } // senza NON nel mazzo non serve aspettare
    G.phase = 'react'; G.pend.passes = {}; G.pend.step = (G.pend.step || 0) + 1; G.pend.start = G.now;
    G.pend.until = G.now + G.options.react * 1000;
    if (!reactors(G).length) return resolve(G);
  }
  function maybeResolve(G) { const r = reactors(G); if (r.every(id => G.pend.passes[id])) resolve(G); }
  function resolve(G) {
    const pd = G.pend; if (!pd) return;
    const cancelled = pd.chain.length % 2 === 1;
    const by = pd.by;
    if (pd.chain.length) {
      // chi ha giocato i NON
      pd.chain.forEach((x, i) => { const p = pl(G, x.by); if (p && (pd.chain.length - i) % 2 === 1) p.st.nonOk++; });
    }
    G.pend = null;
    if (cancelled) {
      pl(G, by).st.cancelled++;
      log(G, `✋ La carta di ${nm(G, by)} è stata annullata!`, 'non');
      emit(G, { k: 'cancel', by });
      return endTurn(G);
    }
    if (pd.chain.length) log(G, `↩️ Il NON è stato annullato: la carta di ${nm(G, by)} vale!`, 'non');
    if (pd.t === 'omp') return applyFace(G, by, pd.face);
    applyEffect(G, by, pd.t, pd.t === 'heart' ? pd.cards.length : pd.target, pd);
    if (checkWin(G, by)) return;
    endTurn(G);
  }
  function applyFace(G, by, face) {
    if (face === '3' || face === '5') { move(G, 'flock', by, +face, 'dado'); if (checkWin(G, by)) return; return endTurn(G); }
    if (face === 'r2' || face === 'r4') {
      const amount = face === 'r4' ? 4 : 2;
      const ts = targetsOf(G, by).filter(id => G.bench[id] > 0);
      const tot = ts.reduce((a, id) => a + G.bench[id], 0);
      if (tot <= amount || ts.length <= 1) {
        const plan = {}; ts.forEach(id => plan[id] = G.bench[id]);
        stealPlan(G, by, plan, amount);
        if (checkWin(G, by)) return; return endTurn(G);
      }
      G.phase = 'choose'; G.choose = { by, kind: 'steal', amount, until: deadline(G) }; G.chooseAt = G.now;
      return;
    }
    // cacca
    const ts = targetsOf(G, by).filter(id => G.bench[id] > 0);
    if (!ts.length) { log(G, `💩 Nessuna panchina da colpire: la cacca di ${nm(G, by)} cade nel vuoto.`, 'sys'); return endTurn(G); }
    G.phase = 'choose'; G.choose = { by, kind: 'sling', until: deadline(G) }; G.chooseAt = G.now;
  }
  function doSling(G, by, target, th, pull) {
    const lvl = G.options.sling, s = SLING[lvl];
    const t2 = th + gauss() * s.sp * .9, p2 = pull + gauss() * s.sp * .9;
    const L = landing(t2, p2);
    const hit = slingHits(G.cap, G.bench[target], L.x, L.y, lvl);
    const P = pl(G, by); P.st.throws++;
    emit(G, { k: 'sling', by, target, x: L.x, y: L.y, th: t2, pull: p2, hit, before: G.bench[target], cap: G.cap });
    if (hit.length) { P.st.hits++; P.st.knocked += hit.length; P.st.knockBest = Math.max(P.st.knockBest, hit.length); move(G, target, 'flock', hit.length, 'cacca', by); }
    log(G, hit.length ? `💩 ${nm(G, by)} colpisce la panchina di ${nm(G, target)}: ${hit.length} ${hit.length === 1 ? 'piccione vola' : 'piccioni volano'} via!` : `💩 ${nm(G, by)} manca la panchina di ${nm(G, target)}.`, hit.length ? 'hit' : 'sys');
    G.choose = null;
    endTurn(G);
  }
  function autoChoose(G) {
    const ch = G.choose; if (!ch) return;
    if (ch.kind === 'steal') { const plan = botStealPlan(G, ch.by, ch.amount, 'medio'); G.choose = null; stealPlan(G, ch.by, plan, ch.amount); if (checkWin(G, ch.by)) return; return endTurn(G); }
    const ts = targetsOf(G, ch.by).filter(id => G.bench[id] > 0);
    if (!ts.length) { G.choose = null; return endTurn(G); }
    const t = ts.sort((a, b) => G.bench[b] - G.bench[a])[0];
    const a = aimAt(50); return doSling(G, ch.by, t, a.th + gauss() * .12, a.pull + gauss() * .12);
  }

  /* =========================================================
     AZIONI
     ========================================================= */
  function applyAction(G, actorId, a) { try { G.now = (a && a.now) || Date.now(); return applyInner(G, actorId, a || {}); } catch (e) { return err('Errore: ' + (e && e.message || e)); } }
  function handHas(G, id, pk) { return (G.hand[id] || []).includes(pk); }
  function checkCard(G, id, x) {
    if (!x || typeof x.pk !== 'string' || !handHas(G, id, x.pk)) return 'Questa carta non è nella tua mano';
    const p = pl(G, id);
    const c = +x.c, t = typeOf(c); if (!t) return 'Carta sconosciuta';
    if (isDisc(x.pk)) return +x.pk.split(':')[1] === c ? null : 'Carta non valida';
    const g = +x.pk.split(':')[0], gen = G.gens[g]; if (!gen || !gen.cards.includes(c)) return 'Carta non valida';
    if (G.plays.some(y => y.c === c && y.g === g)) return 'Carta già giocata';
    if (p.bot) { const m = botMap(G, id); if (m[x.pk] !== c) return 'Carta del bot sbagliata'; }
    return null;
  }
  function takeCard(G, id, x) {
    G.hand[id] = G.hand[id].filter(pk => pk !== x.pk);
    const g = isDisc(x.pk) ? x.pk.split(':')[0] : +x.pk.split(':')[0];
    G.plays.push({ by: id, pk: x.pk, g, c: +x.c });
    G.discard.push(+x.c);
    pl(G, id).st.cards++;
  }
  function applyInner(G, pid, a) {
    const t = a.type;
    if (t === 'bot') return botAct(G, a.id);
    if (t === 'tick') return tick(G);
    if (t === 'mixed') {
      const D = G.gens[a.g]; if (!D || D.ready || D !== curGen(G)) return err('mescolata già pronta');
      D.ready = true;
      if (G.phase === 'deal' && inIds(G).every(id => !G.hand[id].length && !(G.owed[id] > 0))) {
        const ids = inIds(G), f = G.order[G.first], i = Math.max(0, ids.indexOf(f));
        for (let r = 0; r < HAND; r++) ids.slice(i).concat(ids.slice(0, i)).forEach(id => assign(G, id, 1));
        log(G, '🃏 Carte distribuite: 3 a testa.', 'sys');
      } else {
        for (const id of G.order) if (G.owed[id] > 0 && isIn(G, id)) { const k = G.owed[id]; G.owed[id] = 0; assignOwed(G, id, k); }
        log(G, '🔀 Mazzo rimescolato: si continua.', 'sys');
        dealDone(G);
      }
      return { ok: true };
    }
    if (t === 'botHands') {
      for (const id in a.hands || {}) { const p = pl(G, id); if (!p || !p.bot) continue; const m = Object.assign(botMap(G, id), a.hands[id]); G.bh[id] = scramble(m, 'cp:' + id); }
      if (G.phase === 'deal') { G.players.filter(p => p.bot && isIn(G, p.id)).forEach(p => { if (G.hand[p.id].length && G.hand[p.id].every(pk => botMap(G, p.id)[pk] != null)) G.opened[p.id] = true; }); dealDone(G); }
      return { ok: true };
    }
    if (t === 'opened') {
      if (G.phase !== 'deal' || !isIn(G, pid)) return { ok: true };
      const mine = (G.hand[pid] || []).slice().sort().join(','), got = (a.pks || []).slice().sort().join(',');
      if (!mine || mine !== got) return { ok: true };
      G.opened[pid] = true; dealDone(G); return { ok: true };
    }
    if (t === 'hold') { if (!G.hold && ['turn', 'choose'].includes(G.phase)) { const u = G.phase === 'turn' ? G.turn.until : G.choose.until; G.hold = { who: a.who, left: u ? Math.max(10000, u - G.now) : null }; } return { ok: true }; }
    if (t === 'resume') { if (G.hold) { const left = G.hold.left; G.hold = null; if (left) { if (G.phase === 'turn') G.turn.until = G.now + left; if (G.phase === 'choose') G.choose.until = G.now + left; } } return { ok: true }; }
    if (t === 'checked') { G.checks.push({ gameNo: a.gameNo, ok: a.ok, why: a.why || [], complete: a.complete }); return { ok: true }; }
    if (t === 'next') { if (G.phase !== 'over') return err('Non ora'); newRound(G); return { ok: true }; }
    if (t === 'botLost') { const p = pl(G, a.id); if (!p || !p.bot) return err('non è un bot'); pid = a.id; a = { pks: a.pks }; }
    if (t === 'lost' || t === 'botLost') {
      // carte che il dispositivo non riesce ad aprire (chiave persa, o manca la quota di chi è uscito)
      if (!isIn(G, pid) || G.phase === 'over' || G.phase === 'gameEnd') return { ok: true };
      const pks = (a.key ? G.hand[pid].slice() : (a.pks || []).filter(pk => handHas(G, pid, pk)));
      if (!pks.length && !a.key) return { ok: true };
      G.hand[pid] = G.hand[pid].filter(pk => !pks.includes(pk));
      G.owed[pid] = Math.min(HAND, (G.owed[pid] || 0) + pks.length);
      G.opened[pid] = false;

  waitDoc(p, ms) { return new Promise(res => { if (this.cache.get(p)) return res(true); const f = () => { if (this.cache.get(p)) { this.L.delete(f); res(true) } }; this.L.add(f); setTimeout(() => { this.L.delete(f); res(!!this.cache.get(p)) }, ms); }); }
};

function loadStats() { try { return JSON.parse(ls.get('cp-stats') || '[]') } catch (e) { return [] } }
function saveGameStats() {
  if (!S || !S.game) return;
  const G = S.game, me = G.players.find(p => p.id === myId); if (!me) return;
  const ended = S.status === 'ended', removed = me.status === 'disconnesso';
  if (!ended && !removed) return;
  const all = loadStats(); const k = S.code + ':' + myId + ':' + (S.started || 0);
  if (all.some(r => r.k === k)) return;
  const nameOfId = id => { const p = G.players.find(x => x.id === id); return p ? p.name : '?'; };
  const topOf = o => { const e = Object.entries(o || {}).sort((a, b) => b[1] - a[1])[0]; return e ? [nameOfId(e[0]), e[1]] : null; };
  const best = Math.max(...G.order.map(id => G.score[id] || 0));
  all.push({ k, code: S.code, t: Date.now(), name: me.name, n: G.players.length, bots: G.players.filter(p => p.bot).length, mode: G.options.mode, target: G.target,
    rounds: G.results.map(r => ({ won: r.winners.includes(myId), tie: r.winners.length > 1, mine: r.benches[myId] || 0, cap: r.cap, how: r.how, turns: (r.turnsOf || {})[myId] || 0, played: r.ids.includes(myId) })),
    champ: G.target > 1 && (G.score[myId] || 0) === best && best >= G.target, st: me.st, fav: topOf(me.st.tg), nem: topOf(me.st.by), disc: (S.disc && S.disc[myId]) || 0, removed });
  ls.set('cp-stats', JSON.stringify(all.slice(-200)));
}

      ${item('✋ NON giocati', sum('nonPlayed'))}${item('🙅 Tue carte annullate', sum('cancelled'))}

      ${item('📈 Rimonte (vinto dopo essere ultimo)', sum('comeback'))}${item('🔄 Panchine scambiate', sum('swaps'))}

  let h = `<h2 data-res>${end && G.target > 1 ? 'Fine del torneo' : G.target > 1 ? `Fine della partita ${r.gameNo}` : 'Partita finita'}</h2>`;
  h += `<div class="winner">${r.winners.length > 1 ? `🤝 Pareggio: ${wn}!` : `🏆 Vince ${wn}!`}</div>`;
  h += `<p>${r.how === 'full' ? `Ha riempito la panchina (${r.cap} piccioni) al suo ${(r.turnsOf || {})[r.winners[0]] || r.turns}° turno.` : r.how === 'deck' ? 'Il mazzo è finito: vince chi ha più piccioni.' : 'Gli altri sono usciti dalla partita.'}</p>`;
  const ids = r.ids.slice().sort((a, b) => (r.benches[b] || 0) - (r.benches[a] || 0));
  h += `<div class="rank">${ids.map(id => `<div class="rr ${r.winners.includes(id) ? 'w' : ''}">${avOf(id, 28)}<b style="min-width:80px">${esc(nameOf(id))}</b><div class="bar2"><i style="width:${Math.min(100, 100 * (r.benches[id] || 0) / r.cap)}%"></i></div><b>${r.benches[id] || 0}/${r.cap}</b></div>`).join('')}</div>`;
  h += checkLine(G, r.gameNo);
  if (G.target > 1) {
    const ord = G.order.slice().sort((a, b) => (G.score[b] || 0) - (G.score[a] || 0));
    h += `<h3 style="margin:14px 0 4px">Torneo a ${G.target} vittorie</h3><div class="glist">${ord.map(id => `<div class="gitem">${avOf(id, 28)}<div style="flex:1"><b>${esc(nameOf(id))}</b></div><span>${'🏆'.repeat(G.score[id] || 0) || '—'}</span><b style="min-width:24px;text-align:right">${G.score[id] || 0}</b></div>`).join('')}</div>`;
  }
  if (end) h += statsTable(G) + '<div class="small mut" style="margin-top:8px">Le tue statistiche sono salvate nella home del gioco, su questo dispositivo.</div>';
  const isHost = S.host === myId;
  h += '<div class="mbtns"><button class="btn ghost" id="vb">👀 Guarda il tabellone</button>';
  if (end) h += `<button class="btn" data-home>🏠 Torna alla home</button>${isHost ? '<button class="btn" id="lob">⚙️ Cambia impostazioni</button><button class="btn primary" id="rm">🔁 Rivincita</button>' : '<span class="small mut">La rivincita la propone chi ha creato la partita</span>'}`;
  else if (amIn()) h += `<button class="btn primary" id="nx">▶ Prossima partita <span class="cd" data-next="${(S.rAt || Date.now()) + 25000}"></span></button>`;
  else h += '<span class="small mut">In attesa della prossima partita…</span>';
  return h + '</div>';
}
function statsTable(G) {
  const ps = G.players.filter(p => p.st.turns > 0 || p.status === 'in');
  const row = (l, f) => `<tr><td>${l}</td>${ps.map(p => `<td>${f(p)}</td>`).join('')}</tr>`;
  const disc = p => (S.disc && S.disc[p.id]) || 0;
  const best = f => { const m = Math.max(...ps.map(f)); return m > 0 ? ps.filter(p => f(p) === m) : []; };
  const names = a => a.map(p => esc(p.name)).join(', ');
  const fun = [];
  const thief = best(p => p.st.stolen); if (thief.length) fun.push(`🦹 Ladro del giorno: <b>${names(thief)}</b> (${thief[0].st.stolen} piccioni rubati)`);
  const snip = best(p => p.st.knockBest); if (snip.length) fun.push(`🎯 Cecchino: <b>${names(snip)}</b>, ${snip[0].st.knockBest} ${snip[0].st.knockBest === 1 ? 'piccione' : 'piccioni'} giù con una cacca sola`);
  const wall = best(p => p.st.nonOk); if (wall.length) fun.push(`✋ Muro di gomma: <b>${names(wall)}</b> (${wall[0].st.nonOk} NON ${wall[0].st.nonOk === 1 ? 'riuscito' : 'riusciti'})`);
  const poor = best(p => p.st.lost); if (poor.length) fun.push(`😢 Il più bersagliato: <b>${names(poor)}</b> (${poor[0].st.lost} piccioni persi)`);
  const lucky = best(p => p.st.rolls['5']); if (lucky.length) fun.push(`🍀 Fortuna al dado: <b>${names(lucky)}</b> (${lucky[0].st.rolls['5']} volte il 5)`);
  const back = best(p => p.st.comeback); if (back.length) fun.push(`📈 Rimonta: <b>${names(back)}</b> ha vinto partendo dall'ultimo posto`);
  // bersaglio preferito di tutta la partita
  const pairs = []; ps.forEach(p => Object.entries(p.st.tg || {}).forEach(([v, n]) => pairs.push([p, v, n]))); pairs.sort((a, b) => b[2] - a[2]);
  if (pairs.length && pairs[0][2] >= 3) fun.push(`😈 Coppia di rivali: <b>${esc(pairs[0][0].name)}</b> ha tolto ${pairs[0][2]} piccioni a <b>${esc(nameOf(pairs[0][1]))}</b>`);
  return `<h3 style="margin:18px 0 6px">Statistiche</h3>${fun.length ? `<p class="small" style="line-height:1.7">${fun.join('<br>')}</p>` : ''}<div class="stwrap"><table class="sttab"><thead><tr><th></th>${ps.map(p => `<th>${avOf(p.id, 26)}<br>${esc(p.name)}${p.status === 'disconnesso' ? '<div class="note">uscito</div>' : p.bot ? `<div class="small mut">${p.level}</div>` : ''}</th>`).join('')}</tr></thead><tbody>
    ${row('🏆 Vittorie', p => `<b>${p.st.wins}</b>`)}${row('🐦 Presi dallo stormo', p => p.st.gained)}${row('🦹 Rubati agli altri', p => p.st.stolen)}${row('😢 Persi', p => p.st.lost)}
    ${row('💩 Lanci a segno', p => `${p.st.hits}/${p.st.throws}`)}${row('🎯 Miglior lancio', p => p.st.knockBest || '—')}
    ${row('✋ NON giocati (riusciti)', p => `${p.st.nonPlayed} (${p.st.nonOk})`)}${row('🙅 Carte annullate', p => p.st.cancelled)}
    ${row('🎲 Dadi: 3 · 5 · 🦹2 · 🦹4 · 💩', p => `${p.st.rolls['3']}·${p.st.rolls['5']}·${p.st.rolls.r2}·${p.st.rolls.r4}·${p.st.rolls.poo}`)}
    ${row('📈 Panchina più piena', p => p.st.maxBench)}${row('⚡ Vittoria più veloce', p => p.st.fastWin != null ? p.st.fastWin + ' turni' : '—')}
    ${row('🔄 Scambi di panchina', p => p.st.swaps)}${row('⏰ Turni saltati', p => p.st.timeouts)}${row('Disconnessioni', p => p.bot ? '–' : disc(p))}
  </tbody></table></div>`;
}
function rulesHTML() {
  const G = S.game, o = G.options;
  return `<h2>Regole di questa partita</h2><ul class="rules-list">
    <li><b>Partita:</b> ${G.target > 1 ? `torneo, vince chi arriva prima a ${G.target} vittorie` : 'partita singola'} · panchine da <b>${G.cap}</b> posti · si parte con 3 piccioni.</li>
    <li><b>Il turno:</b> giochi una carta (o due ❤️ insieme) e poi peschi fino a 3. Le carte ⛔ in due giocatori: ${o.two === 'tolte' ? 'tolte' : 'tenute'}.</li>
    <li><b>Il dado:</b> 🍞3 · 🍞5 piccioni dallo stormo · 🦹2 · 🦹4 piccioni rubati agli altri (il resto dallo stormo) · 💩💩 cacca con la fionda (${o.sling}).</li>
    <li><b>✋ NON:</b> ${o.react} secondi per rispondere a ogni carta · NON contro NON: ${o.nonChain === 'si' ? 'sì' : 'no'}.</li>
    <li><b>Fine:</b> vince subito chi riempie la panchina; se il mazzo finisce, un ultimo turno a testa e vince chi ha più piccioni.</li>
    <li><b>Tempo per turno:</b> ${o.turnTime ? fmtTime(o.turnTime * 1000) : 'nessuno'} · <b>Attesa per chi si disconnette:</b> ${fmtTime(o.disconnectWait * 1000)}.</li>
    <li><b>Comandi:</b> tocca una carta e premi il pulsante grande, oppure trascinala sugli scarti (o sulla panchina di chi vuoi colpire). Al computer: tasti 1, 2, 3 per scegliere, Invio per giocare, N per il NON, spazio per lasciar fare.</li>
  </ul><h3>Le carte</h3>${deckHTML()}<div class="mbtns"><button class="btn primary" data-close-info>Chiudi</button></div>`;
}

/* ---------------- diario e chat ---------------- */
function renderFeed() {
  const f = $('#feed'); if (!f || !S || !S.game) return;
  const log = S.game.log.slice(-140).map(l => ({ t: l.t || 0, html: `<div class="msg ${l.kind || ''}">${esc(l.msg)}</div>` }));
  const ch = chat.map(m => ({ t: m.t, html: `<div class="msg chat ${m.e ? 'emo' : ''}"><b style="color:${/^#[0-9a-f]{3,8}$/i.test(m.c) ? m.c : '#ccc'};font-size:.88rem">${esc(m.by)}:</b> ${esc(m.x)}</div>` }));
  const all = log.concat(ch).sort((a, b) => a.t - b.t);
  const k = all.length + ':' + (all.length ? all[all.length - 1].t : 0) + ':' + S.game.logSeq + ':' + chat.length;
  if (k === feedKey) return; feedKey = k;
  const near = f.scrollHeight - f.scrollTop - f.clientHeight < 80;
  f.innerHTML = all.map(x => x.html).join('') || '<div class="small mut">Nessun messaggio.</div>';
  if (near || !f._init) { f.scrollTop = f.scrollHeight; f._init = 1; }
}
function onChat() {
  if (!S || view !== 'game' || S.status === 'lobby') return;
  renderFeed();
  const last = chat[chat.length - 1], narrow = true /* chat a scomparsa su ogni schermo */, seen = !narrow || sideOpen;
  if (last && last.t > chatSeenT) {
    if (!seen && last.id !== myId && !last.e) toast(`💬 ${last.by}: ${last.x}`);
    if (seen) chatSeenT = last.t;
  }
  updBadge();
  if (S.game) renderOthers(S.game);
}
function updBadge() { const b = $('#chatBadge'); if (!b) return; const unread = chat.filter(m => m.t > chatSeenT && m.id !== myId && !m.e).length; b.hidden = !unread; b.textContent = unread; }
function sendChat(x, emo) {
  if (!x || !code) return;
  const i = S.game ? S.game.players.findIndex(p => p.id === myId) : -1; const p = i >= 0 ? S.game.players[i] : null;
  DB.collection(`games/${code}/chat`).add({ t: Date.now(), id: myId, by: p ? p.name : (myName || 'Spettatore'), c: PCOL[(i >= 0 ? i : 2) % PCOL.length], x: x.slice(0, 200), e: emo ? 1 : 0 }).then(pruneChat).catch(writeErr);
  chatSeenT = Date.now();
  if (emo) toast(x);
}
function pruneChat() {
  if (MODE !== 'p2p' || !code) return;
  const pre = `games/${code}/chat/`; const ks = [...Net.cache.keys()].filter(k => k.startsWith(pre));
  if (ks.length > 60) ks.map(k => [k, (Net.cache.get(k) || {}).t || 0]).sort((a, b) => a[1] - b[1]).slice(0, ks.length - 60).forEach(([k]) => DB.doc(k).delete().catch(() => { }));
}

/* ---------------- barra "giocatore disconnesso" e orologi ---------------- */
function renderAway() {
  const bar = $('#awaybar'); if (!bar) return;
  const list = Object.entries((S && S.status === 'playing' && S.away) || {});
  if (!list.length) { bar.hidden = true; bar.innerHTML = ''; bar._k = ''; return; }
  const k = JSON.stringify(list); if (bar._k === k) return; bar._k = k;
  bar.hidden = false;
  bar.innerHTML = list.map(([id, a]) => `<div class="awayrow">⏳ <b>${esc(nameOf(id))}</b> ${id === myId ? '(tu): risulta che hai perso la connessione' : 'ha perso la connessione'}. Aspettiamo ancora <b class="cd" data-until="${a.until}">${fmtTime(a.until - Date.now())}</b>
    <button class="btn sm" data-more="${esc(id)}">+1 minuto</button></div>`).join('');
  $$('[data-more]', bar).forEach(b => b.onclick = () => send({ type: 'more', pid: b.dataset.more }));
}
function tickUI() {
  if (!S || view !== 'game' || !S.game || S.status === 'lobby') return;
  $$('#awaybar .cd').forEach(el => el.textContent = fmtTime(+el.dataset.until - Date.now()));
  $$('#status .tm').forEach(el => el.textContent = '⏱ ' + fmtTime(+el.dataset.until - T()));
  $$('.netst').forEach(el => el.textContent = netText());
  $$('[data-next]').forEach(el => el.textContent = '(' + Math.max(0, Math.ceil((+el.dataset.next - Date.now()) / 1000)) + ')');
  const G = S.game;
  renderOverlay(G);
  if (Object.keys(bubbles).length) renderOthers(G);
}

function bindGlobal() {
  document.addEventListener('click', e => {
    if (e.target.closest('[data-close-info]')) hideInfo();
    if (e.target.id === 'info') hideInfo();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hideInfo();
    const G = G_(); if (!G || view !== 'game' || /input|textarea|select/i.test((e.target.tagName || ''))) return;
    if (['1', '2', '3'].includes(e.key)) { const x = myCards(G)[+e.key - 1]; if (x) toggleSel(x.pk); }
    else if (e.key === 'Enter' && isMyTurn(G) && sel.length) { const b = $('#bPlay2') || $('#bPlay') || $('#bPlay1'); if (b && !b.disabled) b.click(); }
    else if ((e.key === 'n' || e.key === 'N') && G.phase === 'react') playNon();
    else if (e.key === ' ' && G.phase === 'react' && E.reactors(G).includes(myId) && !G.pend.passes[myId]) { e.preventDefault(); send({ type: 'pass', step: G.pend.step }); }
  });
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (/^[A-Z0-9]{5}$/.test(h) && h !== code && h !== opening && myName) openGame(h, true); });
}
bindGlobal();
init();

</script>
<script>
/* 💬 Chat: il pulsante apre e chiude il pannello su ogni schermo */
(function () {
  var SEL = '#chatToggle,#bSide,#chatBtn,#bSideX';
  var wide = function () { return innerWidth > CHAT_BP; }, was = wide();
  function aperta() { try { return !!sideOpen; } catch (e) { return true; } }
  function sync() {
    var open = aperta();
    var L = document.querySelector('.layout'); if (L) L.classList.toggle('chat-chiusa', !open);
    var x = document.getElementById('bSideX'); if (x) x.hidden = !open;
    document.querySelectorAll('#chatToggle,#bSide,#chatBtn').forEach(function (b) {
      b.setAttribute('aria-pressed', open ? 'true' : 'false');
      b.title = open ? 'Nascondi la chat' : 'Mostra la chat';
    });
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest(SEL)) return;
    if (wide()) { try { localStorage.setItem('tavolata-chat', aperta() ? 'aperta' : 'chiusa'); } catch (er) {} }
    sync();
    if (wide()) dispatchEvent(new Event('resize'));
  });
  addEventListener('resize', function () {
    var w = wide(); if (w === was) return; was = w;
    try { sideOpen = chatAperta(); } catch (e) { return; }
    var s = document.getElementById('side'); if (s) s.classList.toggle('open', sideOpen);
    sync();
  });
  new MutationObserver(function () { if (document.getElementById('side')) sync(); }).observe(document.getElementById('app') || document.body, { childList: true });
  sync();
})();
</script>
</body>
