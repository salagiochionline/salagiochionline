<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1d1a2f">
<title>Texas Hold'em · poker online gratis con gli amici, senza account</title>
<meta name="description" content="Gioca a Texas Hold'em online con gli amici: due carte tue, cinque in tavola, fiches finte e tanto bluff. Da 2 a 9 giocatori, anche con i bot, senza account e senza soldi veri. Torneo a eliminazione, mani contate o gioco libero, con Omaha e Short deck.">
<meta property="og:title" content="Texas Hold'em · poker online con gli amici">
<meta property="og:description" content="Il poker più famoso, gratis e senza account: crea un tavolo, manda il link e gioca con gli amici (e con i bot). Fiches finte, carte segrete davvero.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d1a2f'/><g transform='rotate(-12 38 52)'><rect x='18' y='22' width='38' height='56' rx='6' fill='%23fff'/><text x='37' y='62' text-anchor='middle' font-size='30' fill='%231d1a2f'>♠</text></g><g transform='rotate(10 62 50)'><rect x='44' y='20' width='38' height='56' rx='6' fill='%23fff'/><text x='63' y='60' text-anchor='middle' font-size='30' fill='%23e03131'>♥</text></g><circle cx='76' cy='80' r='13' fill='%2351cf66' stroke='%23fff' stroke-width='4' stroke-dasharray='5 4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d1a2f; --bg2:#22263a; --panel:#262a44; --panel2:#30365a; --line:rgba(255,255,255,.10);
  --text:#f1f7f2; --muted:#aab6c4; --accent:#51cf66; --accent2:#b2f2bb; --deep:#2b8a3e; --gold:#ffd43b;
  --ok:#22c55e; --bad:#f43f5e; --radius:14px;
  --s0:#1d1a2f; --s1:#e03131; --s2:#e03131; --s3:#1d1a2f;
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
}
body.four{--s2:#1c7ed6;--s3:#2b8a3e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{background:radial-gradient(1200px 700px at 50% -10%,#1d4a2a 0%,var(--bg) 62%) fixed}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- pulsanti ---------- */
.btn{border:1px solid var(--line);background:var(--panel2);padding:.55em 1em;border-radius:12px;cursor:pointer;font-weight:600;transition:transform .12s,background .12s,opacity .12s;white-space:nowrap;touch-action:manipulation}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#3b4370}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(135deg,#2f9e44,#51cf66 55%,#b2f2bb);border:none;color:#06260f}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#37b24d,#69db7c 55%,#d3f9d8)}
.btn.warn{background:#c2410c;border:none}
.btn.ghost{background:transparent}
.btn.sm{padding:.4em .75em;font-size:.86rem;border-radius:9px}
.btn.big{padding:.8em 1.6em;font-size:1.08rem}
.btn.on{outline:2px solid var(--accent);outline-offset:1px;background:#21452b}
.btn.pulse:not(:disabled){animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(81,207,102,.55)}50%{box-shadow:0 0 0 9px rgba(81,207,102,0)}}

/* ---------- logo ---------- */
.logo{font-weight:700;font-size:3.3rem;letter-spacing:-.02em;line-height:1;display:inline-flex;align-items:center;gap:.18em;transform:rotate(-2deg);filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.logo .lt{background:linear-gradient(90deg,#d3f9d8,#51cf66 45%,#2f9e44);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.logo .ico{display:inline-flex;width:1.3em;height:1.12em}
.logo .ico svg{width:100%;height:100%}
.logo.sm{font-size:1.7rem}
.logo.xs{font-size:1.25rem}

/* ---------- home e lobby ---------- */
body.v-home,body.v-lobby{overflow-y:auto}
body.v-game{overflow:hidden}
.home{max-width:780px;margin:0 auto;padding:30px 16px 60px;display:flex;flex-direction:column;gap:16px;position:relative}
.hero{text-align:center;margin-bottom:4px}
.gamepill{display:table;margin:0 auto 14px;background:#b2f2bb;color:#0b3d17;font-weight:700;letter-spacing:.14em;font-size:.75rem;padding:5px 16px;border-radius:99px}
.tagline{color:var(--muted);margin:16px auto 0;max-width:60ch}
.hubbtn{text-decoration:none;color:var(--text);width:max-content;display:inline-flex;align-items:center;gap:6px}
.panel{background:rgba(38,42,68,.8);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(6px)}
.panel h3{margin:0 0 12px;font-size:1.15rem;font-weight:600}
.mut{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.mid{justify-content:center}
.banner{background:#3a2a10;border:1px solid #7c5a10;color:#ffe2a8;border-radius:14px;padding:12px 14px;font-size:.9rem}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gitem{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.medal{font-size:1.2rem;font-weight:700;color:var(--accent);width:40px;text-align:center}
.bigcode{font-size:2.6rem;font-weight:700;letter-spacing:8px;color:var(--accent);margin:4px 0}
.netst{color:#fde68a}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.seat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.seat select{padding:.3em .4em;font-size:.82rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.tile{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tile b{font-size:1.35rem;color:var(--accent)}.tile span{font-size:.78rem;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sitem span{color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);background:#1c2036;border:1px solid var(--line);border-radius:10px;padding:.6em .7em}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.flabel{font-size:.85rem;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg button{background:#1c2036;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.seg button small{color:var(--muted);font-size:.8rem}
.seg button.on{border-color:var(--accent);background:#1f3d29}
.inline{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.group{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.group h4{margin:4px 0 6px;font-size:1rem;color:var(--accent2);font-weight:600}
.opt{border-radius:12px;padding:8px 10px;margin:4px 0;background:rgba(255,255,255,.03)}
.opt.dis{opacity:.5}
.opt-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.opt-label{font-weight:500}
.opt select{max-width:58%}
.opt details{margin-top:4px}
.opt summary{cursor:pointer;color:var(--muted);font-size:.82rem;list-style:none;display:inline-flex;gap:4px;align-items:center}
.opt summary::-webkit-details-marker{display:none}
.opt summary::before{content:'▸';transition:transform .15s}
.opt details[open] summary::before,.opt[open]>summary::before{transform:rotate(90deg)}
.opt .help{font-size:.88rem;color:#eef6ef;line-height:1.45;padding:6px 2px 2px}
.opt .help ul{margin:.3em 0;padding-left:1.2em}
.opt .note{display:block;margin-top:4px}
.opt select:disabled,.seg button:disabled{opacity:.6;cursor:default}
.levels{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.levels span{background:rgba(255,255,255,.06);border-radius:8px;padding:2px 7px;font-size:.78rem}

/* ---------- avatar ---------- */
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:1.1rem;color:#14231a;box-shadow:0 0 0 2px rgba(255,255,255,.25);position:relative}
.av .sh{position:absolute;right:-4px;bottom:-4px;font-size:.62em;background:#1d1a2f;border-radius:50%;width:1.55em;height:1.55em;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.4)}

/* ---------- carte francesi (disegno originale) ---------- */
.pk{--w:56px;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.11);position:relative;flex:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(165deg,#ffffff,#f1f3ef);border:1px solid #cfd6cf;box-shadow:0 3px 8px rgba(0,0,0,.4);color:var(--sc);font-weight:700;overflow:hidden}
.pk .r{position:absolute;left:calc(var(--w)*.08);top:calc(var(--w)*.04);font-size:calc(var(--w)*.36);line-height:1;letter-spacing:-.04em}
.pk .s1{position:absolute;left:calc(var(--w)*.09);top:calc(var(--w)*.42);font-size:calc(var(--w)*.28);line-height:1}
.pk .s2{position:absolute;right:calc(var(--w)*.05);bottom:calc(var(--w)*.0);font-size:calc(var(--w)*.62);line-height:1;opacity:.92}
.pk.s-0{--sc:var(--s0)}.pk.s-1{--sc:var(--s1)}.pk.s-2{--sc:var(--s2)}.pk.s-3{--sc:var(--s3)}
.pk.back{background:#1f6b35;border:2px solid #e9f7ec;background-image:radial-gradient(circle at 50% 50%,rgba(255,255,255,.16) 0 18%,transparent 19%),repeating-linear-gradient(45deg,#237a3c 0 5px,#1c6432 5px 10px)}
.pk.back::after{content:'♠';position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.75);font-size:calc(var(--w)*.34)}
.pk.closed{background:linear-gradient(170deg,#3b4370,#262a44);border-color:#5c6599;display:grid;place-items:center;color:var(--muted);font-size:calc(var(--w)*.18);font-weight:500}
.pk.slot{background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.14);box-shadow:none}
.pk.dim{filter:brightness(.55) saturate(.6)}
.pk.win{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(255,212,59,.7)}
.pk.flip{animation:flip .55s ease-out both}
@keyframes flip{0%{transform:perspective(500px) rotateY(90deg) scale(.9)}100%{transform:none}}
.pk.dealt{animation:dealin .45s cubic-bezier(.3,.8,.4,1) both}
@keyframes dealin{from{transform:translateY(-40px) rotate(-14deg) scale(.6);opacity:0}}

/* ---------- fiches ---------- */
.chips{display:inline-flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap}
.stack{position:relative;width:20px;height:18px;flex:none}
.chip{position:absolute;left:0;width:20px;height:7px;border-radius:50%;border:1.5px solid rgba(0,0,0,.55);background:var(--cc);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.chip.c1{--cc:#f8f9fa}.chip.c5{--cc:#e03131}.chip.c25{--cc:#2f9e44}.chip.c100{--cc:#212529}.chip.c500{--cc:#7048e8}.chip.c1k{--cc:#f08c00}.chip.c5k{--cc:#1c7ed6}
.amt{background:rgba(0,0,0,.55);border-radius:99px;padding:1px 8px;font-size:.82rem;color:#fff}

/* ---------- partita ---------- */
#game{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(29,26,47,.6);backdrop-filter:blur(6px)}
.roundinfo{flex:1;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.roundinfo b{color:var(--text);font-weight:600}
.tb-actions{display:flex;gap:4px}
.layout{flex:1;display:grid;grid-template-columns:1fr 320px;min-height:0}
.maincol{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(20,18,34,.6)}
.side-head{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600}
.feed{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.msg{padding:3px 8px;border-radius:8px;color:var(--muted);line-height:1.35}
.msg.sys{color:#d3f9d8}
.msg.hand{color:#fff;font-weight:600;margin-top:6px;border-top:1px solid var(--line);border-radius:0;padding-top:6px}
.msg.brd{color:#e7f5ff}
.msg.warn{color:#ffd0c2;background:rgba(194,65,12,.22)}
.msg.win{color:#d1ffe0;background:rgba(34,197,94,.2);font-weight:600}
.msg.show{color:#fff3bf}
.msg.fold{opacity:.7}
.msg.chat{color:var(--text);background:rgba(81,207,102,.16)}
.msg.emo{font-size:1.2rem}
.chatform{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.chatform input{flex:1;min-width:0}
.emobar{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;width:100%}
.emobar button{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;font-size:1.2rem;padding:.12em .38em;cursor:pointer}
.emobar button:hover{background:rgba(255,255,255,.15)}

.status{text-align:center;font-weight:600;font-size:1.02rem;padding:6px 10px 4px;min-height:32px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.status.mine{color:#ffe066}
.status .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;font-size:.9rem}
.status .tm.hurry{color:#ff8787}

/* il tavolo */
.tablewrap{flex:1;min-height:0;position:relative;margin:2px 10px 4px}
.felt{position:absolute;left:7%;right:7%;top:12%;bottom:14%;border-radius:50%/50%;
  background:radial-gradient(ellipse at 50% 42%,#2f9e44 0%,#237a3c 48%,#185c2c 100%);
  box-shadow:0 0 0 10px #3b2a1f,0 0 0 13px #5a3f2c,0 0 0 15px #1e1611,0 18px 40px rgba(0,0,0,.55),inset 0 0 50px rgba(0,0,0,.45)}
.felt::before{content:'';position:absolute;inset:7%;border-radius:50%;border:2px solid rgba(255,255,255,.08)}
.felt::after{content:'TAVOLATA';position:absolute;left:50%;top:22%;transform:translateX(-50%);letter-spacing:.5em;font-weight:700;color:rgba(255,255,255,.07);font-size:clamp(.8rem,2.4vw,1.4rem)}
.felt.drop{box-shadow:0 0 0 10px #3b2a1f,0 0 0 13px #ffd43b,0 0 0 15px #1e1611,0 18px 40px rgba(0,0,0,.55),inset 0 0 50px rgba(0,0,0,.45)}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:2;width:min(72%,520px)}
.board{display:flex;gap:clamp(3px,.8vw,8px);justify-content:center}
.board .pk{--w:var(--bw,clamp(38px,min(7.4vw,9vh),70px))}
.board.b2 .pk{--w:calc(var(--bw,clamp(38px,min(7.4vw,9vh),70px))*.8)}
.boardlab{font-size:.72rem;color:rgba(255,255,255,.65);margin-bottom:-3px}
.pot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;min-height:24px}
.pot .main{font-size:1rem}
.pot .side2{font-size:.78rem;color:#e6fcf5;opacity:.85}
.handname{font-size:.85rem;background:rgba(0,0,0,.45);border-radius:99px;padding:2px 10px;color:#fff3bf;min-height:1.4em}
.handname:empty{visibility:hidden}

.pseat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:3;width:clamp(86px,13vw,128px);transition:opacity .3s}
.pseat .box{display:flex;align-items:center;gap:6px;background:rgba(18,16,30,.88);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:4px 8px 4px 4px;width:100%;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.pseat .nm{font-weight:600;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.pseat .ck{font-weight:700;font-size:.86rem;color:var(--accent2);line-height:1.15;font-variant-numeric:tabular-nums}
.pseat .info{min-width:0;flex:1;display:flex;flex-direction:column}
.pseat .av{width:32px;height:32px;font-size:.95rem}
.pseat .cards{display:flex;gap:2px;justify-content:center;min-height:calc(var(--sw,30px)*1.4);margin-bottom:-6px;position:relative;z-index:1}
.pseat .cards .pk{--w:var(--sw,30px)}
.pseat .cards.om .pk{--w:calc(var(--sw,30px)*.8);margin-left:calc(var(--sw,30px)*-.28)}
.pseat .cards.om .pk:first-child{margin-left:0}
.pseat .tag{font-size:.72rem;color:#fff;background:rgba(0,0,0,.55);border-radius:99px;padding:1px 8px;white-space:nowrap;min-height:1.25em;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pseat .tag:empty{visibility:hidden}
.pseat .tag.allin{background:#c92a2a;font-weight:700}
.pseat .tag.win{background:#2b8a3e;font-weight:700}
.pseat .tag.hn{background:rgba(255,212,59,.92);color:#2b2100;font-weight:600}
.pseat.turn .box{border-color:#ffd43b;box-shadow:0 0 0 3px rgba(255,212,59,.3),0 4px 14px rgba(0,0,0,.4)}
.pseat.fold{opacity:.5}
.pseat.out{opacity:.35}
.pseat.me{width:clamp(120px,22vw,220px);transform:translate(-50%,-100%)}
.pseat.me .cards .pk{--w:var(--mw,clamp(52px,min(9vw,10vh),78px))}
.pseat.me .cards{margin-bottom:-10px;gap:4px}
.pseat.me .cards.om .pk{--w:calc(var(--mw,clamp(52px,min(9vw,10vh),78px))*.82);margin-left:calc(var(--mw,60px)*-.18)}
.pseat.me .cards .pk{cursor:grab;touch-action:none}
.pseat .eq{position:absolute;top:-10px;right:-8px;background:#1c7ed6;color:#fff;border-radius:99px;font-size:.75rem;font-weight:700;padding:1px 7px;z-index:4}
.pseat .eq.fav{background:#2b8a3e}
.pseat .ring{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(#ffd43b calc(var(--p)*360deg),transparent 0);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%);pointer-events:none}
.pseat .avw{position:relative;flex:none}
.pseat .off{font-size:.66rem;color:#ffc9c9}
.bubble{position:absolute;top:-14px;left:50%;font-size:1.5rem;animation:bub 2.6s ease-out forwards;pointer-events:none;z-index:6}
@keyframes bub{0%{transform:scale(0) translateY(10px);opacity:0}15%{transform:scale(1.2);opacity:1}80%{opacity:1}100%{transform:translateY(-20px);opacity:0}}
.pbet{position:absolute;transform:translate(-50%,-50%);z-index:2;pointer-events:none;transition:opacity .3s}
.dbtn{position:absolute;transform:translate(-50%,-50%);z-index:2;width:24px;height:24px;border-radius:50%;background:#fff;color:#1d1a2f;font-weight:700;font-size:.8rem;display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.5),inset 0 0 0 2px #adb5bd;transition:left .6s,top .6s}
.blindt{font-size:.62rem;flex:none;font-weight:700;background:#1c7ed6;color:#fff;border-radius:6px;padding:0 4px;margin-left:3px}
.blindt.bb{background:#f08c00}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:8;pointer-events:none;text-align:center;padding:10px}
.ovbox{background:rgba(20,18,32,.93);border:1px solid rgba(178,242,187,.25);border-radius:18px;padding:10px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:96%;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:rise .3s ease-out}
.stamp{position:absolute;font-size:clamp(2.4rem,8vw,4.6rem);font-weight:700;color:#ff6b6b;border:6px solid #ff6b6b;border-radius:16px;padding:0 .3em;transform:rotate(-10deg);text-shadow:0 3px 0 rgba(0,0,0,.25);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both;z-index:9;pointer-events:none;left:50%;top:40%;translate:-50% -50%}
.stamp.gold{color:#ffd43b;border-color:#ffd43b}
@keyframes stamp{from{transform:rotate(-10deg) scale(2.4);opacity:0}}

/* barra delle mosse */
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 10px 10px;background:rgba(20,18,34,.85);border-top:1px solid var(--line);min-height:62px}
.bar .hint{color:var(--muted);font-size:.9rem;text-align:center}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.acts .btn{font-size:1.04rem;padding:.7em 1.1em;min-width:110px}
.b-fold{background:#5c2b2b;border-color:#8f3b3b}
.b-call{background:#1c4f7a;border-color:#2f6ea8}
.b-raise{background:linear-gradient(135deg,#2f9e44,#51cf66);border:none;color:#06260f}
.b-allin{background:linear-gradient(135deg,#c92a2a,#ff6b6b);border:none}
.sizer{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%;max-width:680px}
.sizer input[type=range]{flex:1;min-width:140px;accent-color:#51cf66;height:28px}
.sizer .amtin{width:96px;text-align:center;font-weight:700}
.sizer .btn{padding:.35em .6em;font-size:.82rem}
.chipdrag{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle,#51cf66 0 42%,#fff 43% 50%,#2b8a3e 51%);border:3px dashed #fff;cursor:grab;touch-action:none;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.45)}
.flychip{position:fixed;z-index:85;pointer-events:none;transition:transform .55s cubic-bezier(.35,.9,.4,1),opacity .55s}
.flycard{position:fixed;z-index:86;pointer-events:none;transition:left .45s cubic-bezier(.3,.8,.4,1),top .45s cubic-bezier(.3,.8,.4,1),transform .45s}
.dragghost{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-50%) rotate(-5deg)}
.pre{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.pre label{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.06);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.9rem}

/* ---------- modali ---------- */
.modal{position:fixed;inset:0;background:rgba(10,8,20,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(3px)}
#info{z-index:60}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.modal-box h2{margin:0 0 6px}
.modal-box p{color:var(--muted)}
.winner{font-size:1.4rem;font-weight:700;margin:4px 0 8px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;align-items:center}
.rules-list{padding-left:1.1em;line-height:1.6}
.rules-list b{color:var(--accent2);font-weight:600}
.check{font-size:.88rem;border-radius:10px;padding:8px 10px;margin:8px 0}
.check.good{background:rgba(34,197,94,.15);color:#d1ffe0}
.check.bad{background:rgba(244,63,94,.18);color:#ffd5dc}
.check.wait{background:rgba(255,255,255,.06);color:var(--muted)}
.rank{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.rank .rr{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}
.rank .rr.w{background:rgba(81,207,102,.18)}
.rank .rr .pl{font-weight:700;width:30px;text-align:center;font-size:1.05rem}
.rank .rr .bar2{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;min-width:40px}
.rank .rr .bar2 i{display:block;height:100%;background:var(--accent)}
.stwrap{overflow-x:auto;border-radius:12px;background:rgba(0,0,0,.2)}
.sttab{border-collapse:collapse;width:100%;font-size:.86rem}
.sttab th,.sttab td{padding:7px 9px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
.sttab th{font-weight:600;font-size:.78rem;vertical-align:bottom}
.sttab th .av{display:inline-grid;width:26px;height:26px;font-size:.8rem;margin-bottom:2px}
.sttab td:first-child{text-align:left;color:var(--muted)}
.note{font-size:.72rem;color:#fdba74;font-weight:500}
.hhrow{background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px;margin:6px 0;display:flex;flex-direction:column;gap:6px}
.hhrow .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem}
.hhrow .cs{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.hhrow .cs .pk{--w:26px}
.hhrow .who{display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.hhrow .who span{display:inline-flex;gap:3px;align-items:center}
.hhrow .who .pk{--w:22px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- avvisi ---------- */
.toasts{position:fixed;top:16vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:70;pointer-events:none;align-items:center;width:max-content;max-width:92vw}
.toast{background:#111;border:1px solid var(--line);padding:9px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:rise .2s ease-out;text-align:center}
.toast.warn{background:#c2410c}
.toast.good{background:#15803d}
.toast.big{background:var(--accent);color:#06260f;font-size:1.15rem}
.toast.out{opacity:0;transition:opacity .4s}
.awaybar{background:rgba(194,65,12,.88);display:flex;flex-direction:column;gap:4px;padding:6px 14px;font-size:.92rem;z-index:5}
.awayrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.awayrow .btn{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.35)}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:.7rem;font-weight:700;margin-left:3px;padding:0 5px;text-align:center}

/* ---------- schermi piccoli ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;right:0;top:50px;bottom:0;width:min(340px,92vw);z-index:40;transform:translateX(100%);transition:transform .25s;background:#1b1830}
  .side.open{transform:none;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
}
@media (max-width:600px){
  .hide-sm{display:none}
  .topbar{gap:6px;padding:6px 8px}
  .tb-actions .btn{padding:.45em .55em}
  .logo{font-size:2.3rem}
  .logo.xs{font-size:1rem}
  .logo.xs .ico{display:none}
  .seg{grid-template-columns:1fr}
  .sgrid{grid-template-columns:1fr}
  .tablewrap{margin:0 2px}
  .bigcode{font-size:2.1rem;letter-spacing:6px}
  .opt select{max-width:100%}
  .opt-head{flex-wrap:wrap}
  .modal{padding:8px;align-items:flex-end}
  .modal-box{padding:16px;max-height:88vh;border-radius:18px}
  .status{font-size:.92rem;min-height:26px;padding:3px 6px 1px}
  .acts .btn{min-width:0;flex:1;padding:.7em .5em;font-size:.95rem}
  .pseat .av{width:26px;height:26px;font-size:.8rem}
  .pseat .box{padding:3px 6px 3px 3px;gap:4px;border-radius:12px}
  .pseat .nm{font-size:.74rem}.pseat .ck{font-size:.76rem}
  .pseat .tag{font-size:.64rem;padding:0 6px}
  .pseat{--sw:24px;width:clamp(76px,22vw,110px)}
  body.v-game .toasts{top:36vh}
}
@media (orientation:portrait) and (max-width:700px){
  .felt{left:10%;right:10%;top:9%;bottom:12%}
  .center{width:86%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style id="chat-toggle-css">
/* 💬 Chat: si apre e si chiude col pulsante anche sugli schermi grandi */
@media (min-width:901px){
  #side:not(.open){display:none!important}
    .layout.chat-chiusa{grid-template-columns:minmax(0,1fr)!important}
}
@media (min-width:901px){
  .layout:has(#side:not(.open)){grid-template-columns:minmax(0,1fr)!important}
}
</style>

function chatAperta() { if (innerWidth <= CHAT_BP) return false; try { return localStorage.getItem('tavolata-chat') !== 'chiusa'; } catch (e) { return true; } }
</script>

    // ordine: per primo l'ultimo che ha puntato o rilanciato nell'ultimo giro, altrimenti il primo a sinistra del mazziere
    const first = H.lastAggSt && lv.includes(H.lastAggSt) ? H.lastAggSt : nextSeat(G, lv, H.btn);
    const order = []; let x = first; for (let i = 0; i < lv.length; i++) { order.push(x); x = nextSeat(G, lv, x); }
    const all = runout || G.options.muck === 'tutti';
    H.common = H.board.length;
    H.sd = { order, all, i: 0, shown: {}, mucked: {}, runout: !!runout };
    G.phase = 'show';
    emit(G, { k: 'showdown', runout: !!runout });
    if (runout) log(G, `🔥 Tutti all-in: si scoprono le carte${H.two ? ' e si corre due volte' : ''}!`, 'sys');
    checkShowDone(G);
  }
  // chi deve mostrare (o decidere se nascondere) adesso
  function showNeed(G) {
    const H = G.H; if (!H || G.phase !== 'show' || !H.sd) return [];
    const sd = H.sd, done = id => sd.shown[id] || sd.mucked[id];
    if (sd.all) return sd.order.filter(id => !done(id));
    const cur = sd.order.find(id => !done(id));
    return cur ? [cur] : [];
  }
  function gotShown(G, id, cards, voluntary) {
    const H = G.H; if (!H) return err('Nessuna mano');
    if (!Array.isArray(cards) || cards.length !== H.k) return err('Carte non valide');
    if (voluntary) {
      if (H.vol[id] || (H.sd && H.sd.shown[id])) return { ok: true };
      if (!(G.phase === 'pause' || G.phase === 'over' || G.phase === 'gameEnd') || !H.ids.includes(id)) return err('Puoi mostrare le carte solo a fine mano');
      H.vol[id] = cards; pl(G, id).st.shows++;
      log(G, `🃏 ${nm(G, id)} mostra ${cards.map(cardTxt).join(' ')}`, 'show');
      emit(G, { k: 'vol', id, cards });
      return { ok: true };
    }
    if (!showNeed(G).includes(id)) return err('Non devi mostrare adesso');
    H.sd.shown[id] = cards;
    const s = score(G.options.variant, cards, H.board);
    if (!H.sd.runout) log(G, `🃏 ${nm(G, id)} mostra ${cards.map(cardTxt).join(' ')}${H.board.length >= 3 ? ` — ${describe(s)}` : ''}`, 'show');
    emit(G, { k: 'shown', id, cards });
    checkShowDone(G);
    return { ok: true };
  }
  function doMuck(G, id) {
    const H = G.H; if (!showNeed(G).includes(id) || H.sd.all) return err('Non puoi nascondere le carte adesso');
    H.sd.mucked[id] = true; log(G, `🙈 ${nm(G, id)} non mostra le carte`, 'show'); emit(G, { k: 'muck', id });
    checkShowDone(G); return { ok: true };
  }
  function checkShowDone(G) {
    const H = G.H; if (showNeed(G).length) return;
    if (H.sd.runout) { calcEq(G); H.wait = G.now + 1500; G.phase = 'run'; return; }
    resolve(G);
  }
  // un giocatore che non mostra in tempo (o se n'è andato) perde il diritto al piatto
  function forceMuck(G, id) { const H = G.H; if (!H || !H.sd) return; H.sd.mucked[id] = true; delete H.sd.shown[id]; log(G, `🙈 ${nm(G, id)} non ha mostrato le carte in tempo`, 'warn'); checkShowDone(G); }

  // posso vincere qualcosa? (per chi può nascondere le carte)
  function couldWin(G, id, cards) {
    const H = G.H; if (!H || !H.sd) return true;
    const shownIds = Object.keys(H.sd.shown); if (!shownIds.length) return true;
    const mine = score(G.options.variant, cards, H.board);
    const ps = makePots(G);
    for (const p of ps) {
      if (!p.ids.includes(id)) continue;
      const rivals = p.ids.filter(x => H.sd.shown[x]);
      if (!rivals.length) return true;
      const best = Math.max(...rivals.map(x => score(G.options.variant, H.sd.shown[x], H.board)));
      if (mine >= best) return true;
    }
    return false;
  }

  /* ---------------- piatti ---------------- */
  function makePots(G) {
    const H = G.H, lv = live(G);
    const contrib = Object.entries(H.put).filter(([, v]) => v > 0);
    const levels = [...new Set(lv.map(id => H.put[id] || 0))].sort((a, b) => a - b).filter(v => v > 0);
    const pots = []; let prev = 0;
    for (const L of levels) {
      let amt = 0; for (const [, v] of contrib) amt += Math.max(0, Math.min(v, L) - Math.min(v, prev));
      const ids = lv.filter(id => (H.put[id] || 0) >= L);
      if (amt > 0) { const last = pots[pots.length - 1]; if (last && last.ids.join() === ids.join()) last.amt += amt; else pots.push({ amt, ids }); }
      prev = L;
    }
    let rest = 0; for (const [, v] of contrib) rest += Math.max(0, v - prev);
    if (!pots.length) pots.push({ amt: 0, ids: lv.slice() });
    pots[pots.length - 1].amt += rest;
    pots[0].amt += H.dead;
    return pots;
  }
  function award(G) {
    // tutti hanno lasciato: vince l'ultimo rimasto senza mostrare
    const H = G.H, w = live(G)[0];
    const amt = potTotal(H);
    G.chips[w] += amt;
    H.res = { pots: [{ amt, ids: [w], w: [w], b: 1 }], won: { [w]: amt }, sd: false };
    const st = pl(G, w).st; st.won++; st.wonNoSD++; st.bigPot = Math.max(st.bigPot, amt);
    log(G, `🏆 ${nm(G, w)} vince ${fmt(amt)} (gli altri hanno lasciato)`, 'win');
    emit(G, { k: 'win', ids: [w], amts: { [w]: amt }, sd: false });
    endHand(G, 3200);
  }
  function resolve(G) {
    const H = G.H, v = G.options.variant, lv = live(G).filter(id => !H.sd.mucked[id]);
    const pots = makePots(G);
    const boards = H.two ? [H.board, H.board2] : [H.board];
    const sc = boards.map(b => { const o = {}; lv.forEach(id => { if (H.sd.shown[id]) o[id] = score(v, H.sd.shown[id], b); }); return o; });
    const won = {}; const res = [];
    const seatFromBtn = ids => { const o = []; let x = nextSeat(G, ids, H.btn); for (let i = 0; i < ids.length; i++) { o.push(x); x = nextSeat(G, ids, x); } return o; };
    for (const p of pots) {
      const parts = boards.length === 2 ? [Math.ceil(p.amt / 2), Math.floor(p.amt / 2)] : [p.amt];
      parts.forEach((amt, bi) => {
        let elig = p.ids.filter(id => sc[bi][id] != null);
        if (!elig.length) elig = p.ids.filter(id => !H.sd.mucked[id]);
        if (!elig.length) elig = p.ids.slice();
        const best = Math.max(...elig.map(id => sc[bi][id] != null ? sc[bi][id] : -1));
        const ws = seatFromBtn(elig.filter(id => (sc[bi][id] != null ? sc[bi][id] : -1) === best));
        const each = Math.floor(amt / ws.length); let odd = amt - each * ws.length;
        ws.forEach(id => { const g = each + (odd > 0 ? 1 : 0); if (odd > 0) odd--; won[id] = (won[id] || 0) + g; G.chips[id] += g; });
        res.push({ amt, ids: p.ids, w: ws, b: bi + 1, sc: best, pi: pots.indexOf(p) });
      });
    }
    H.res = { pots: res, won, sd: true, sc: sc[0] };
    // statistiche
    const shownIds = Object.keys(H.sd.shown);
    shownIds.forEach(id => {
      const st = pl(G, id).st; st.sd++;
      const s0 = Math.max(...sc.map(o => o[id] != null ? o[id] : -1));
      if (s0 > st.best) { st.best = s0; st.bestHand = { s: s0, cards: H.sd.shown[id].slice(), board: H.board.slice() }; }
    });
    Object.keys(won).forEach(id => { const st = pl(G, id).st; st.won++; st.sdWon++; st.bigPot = Math.max(st.bigPot, won[id]); });
    if (H.sd.runout) {
      shownIds.forEach(id => { const st = pl(G, id).st; if (H.allin[id]) { if (won[id]) st.allinW++; else st.allinL++; } });
      // sfortuna: perso da grande favorito
      const e0 = H.eq0 || {};
      shownIds.forEach(id => { if ((e0[id] || 0) >= 70 && !won[id]) { pl(G, id).st.badBeat++; Object.keys(won).forEach(w => { if ((e0[w] || 0) <= 30) pl(G, w).st.suckout++; }); } });
    }
    const wn = Object.keys(won);
    res.forEach(r => {
      const who = r.w.map(id => nm(G, id)).join(' e ');
      const what = r.sc >= 0 ? describe(r.sc) : '';
      const tag = [pots.length > 1 ? (r.pi === 0 ? 'piatto principale' : 'piatto secondario') : '', H.two ? (r.b === 2 ? '2° tavolo' : '1° tavolo') : ''].filter(Boolean).join(', ');
      log(G, `🏆 ${who} ${r.w.length > 1 ? 'dividono' : 'vince'} ${fmt(r.amt)}${tag ? ' (' + tag + ')' : ''}${what ? ' con ' + what.charAt(0).toLowerCase() + what.slice(1) : ''}`, 'win');
    });
    emit(G, { k: 'win', ids: wn, amts: won, sd: true });
    endHand(G, H.two ? 9000 : 6500);
  }
  // equità (percentuale di vittoria) quando le carte sono scoperte
  function calcEq(G) {
    const H = G.H; if (!H.sd) return;
    const hands = {}; Object.keys(H.sd.shown).forEach(id => { if (!H.sd.mucked[id]) hands[id] = H.sd.shown[id]; });
    if (Object.keys(hands).length < 2) return;
    const board = H.board.slice();
    const e = equity(G.options.variant, hands, board, deckFor(G.options), board.length >= 3 ? 0 : G.options.variant === 'omaha' ? 500 : 1500);
    H.eq = e; if (!H.eq0) H.eq0 = e;
  }
  function equity(variant, hands, board, deck, samples) {
    const ids = Object.keys(hands), used = new Set(board); ids.forEach(id => hands[id].forEach(c => used.add(c)));
    const rest = deck.filter(c => !used.has(c)), need = 5 - board.length;
    const win = {}; ids.forEach(id => win[id] = 0); let tot = 0;
    const run = b => {
      let best = -1, ws = [];
      for (const id of ids) { const s = score(variant, hands[id], b); if (s > best) { best = s; ws = [id]; } else if (s === best) ws.push(id); }
      ws.forEach(id => win[id] += 1 / ws.length); tot++;
    };
    if (need === 0) run(board);
    else if (!samples || need <= 2) {
      if (need === 1) for (const a of rest) run(board.concat([a]));
      else for (let i = 0; i < rest.length; i++) for (let j = i + 1; j < rest.length; j++) run(board.concat([rest[i], rest[j]]));
    } else {
      const r = rest.slice();
      for (let s = 0; s < samples; s++) { for (let i = 0; i < need; i++) { const j = i + Math.floor(rand() * (r.length - i)); const t = r[i]; r[i] = r[j]; r[j] = t; } run(board.concat(r.slice(0, need))); }
    }
    const o = {}; ids.forEach(id => o[id] = Math.round(100 * win[id] / Math.max(1, tot))); return o;
  }

  /* ---------------- fine della mano ---------------- */
  function endHand(G, ms) {
    const H = G.H;
    G.phase = 'pause'; H.wait = G.now + ms; H.to = null; H.until = null; H.rv = null;
    H.ids.concat(Object.keys(H.put)).forEach(id => { const p = pl(G, id); if (p) p.st.maxChips = Math.max(p.st.maxChips, G.chips[id] || 0); });
    // eliminazioni
    if (G.options.mode !== 'libero') {
      const out = Object.keys(H.start).filter(id => (G.chips[id] || 0) <= 0 && isIn(G, id));
      if (out.length) {
        const winners = Object.keys((H.res && H.res.won) || {});
        out.sort((a, b) => H.start[b] - H.start[a]);
        // a pari fiches di partenza: stesso posto
        const alive = seated(G).length;
        let place = alive + out.length;
        const groups = []; out.forEach(id => { const g = groups[groups.length - 1]; if (g && H.start[g[0]] === H.start[id]) g.push(id); else groups.push([id]); });
        // il gruppo con più fiches di partenza si classifica meglio
        let pos = alive + 1;
        groups.forEach(g => { g.forEach(id => { G.busted.push({ id, place: pos, hand: H.no }); pl(G, id).st.places = pl(G, id).st.places; }); pos += g.length; });
        out.forEach(id => { log(G, `💀 ${nm(G, id)} è eliminato.`, 'warn'); emit(G, { k: 'out', id }); });
        winners.forEach(w => { pl(G, w).st.kos += out.filter(x => x !== w).length; });
      }
    }
    // storico compatto della mano (gli ultimi; l'archivio completo lo pubblica la regia)
    const rec = handRecord(G);
    G.hist.push(rec); if (G.hist.length > 12) G.hist.splice(0, G.hist.length - 12);
    G.lastRec = rec;
    emit(G, { k: 'handEnd', no: H.no });
  }
  function handRecord(G) {
    const H = G.H;
    return { no: H.no, g: H.g, ids: H.ids.slice(), btn: H.btn, board: H.board.slice(), board2: H.board2 ? H.board2.slice() : null,
      shown: H.sd ? Object.assign({}, H.sd.shown) : {}, vol: Object.assign({}, H.vol), won: H.res ? H.res.won : {}, sd: !!(H.res && H.res.sd),
      pot: potTotal(H), acts: H.acts.slice(-40), common: H.common || 0, folded: Object.keys(H.folded).filter(id => H.ids.includes(id)), voided: !!H.voided, k: H.k, start: Object.assign({}, H.start) };
  }
  function nextHand(G) {
    const H = G.H;
    if (H && G.lastRec && G.lastRec.no === H.no) Object.assign(G.lastRec, { vol: Object.assign({}, H.vol) });
    const sit = G.options.mode === 'libero' ? G.order.filter(id => isIn(G, id)) : seated(G);
    const ended = G.endReq || sit.length < 2 || (G.options.mode === 'mani' && G.handNo >= G.options.hands);
    if (ended) return endPartita(G, G.endReq ? 'host' : sit.length < 2 ? 'alone' : 'hands');
    startHand(G);
  }
  // mano annullata (qualcuno se n'è andato mentre servivano le sue carte)
  function voidHand(G, why) {
    const H = G.H; if (!H) return;
    Object.keys(H.put).forEach(id => { G.chips[id] = (G.chips[id] || 0) + H.put[id]; });
    if (H.dead && H.bb) G.chips[H.bb] += H.dead;
    H.voided = true; H.put = {}; H.dead = 0;
    log(G, `↩️ Mano ${H.no} annullata${why ? ' (' + why + ')' : ''}: le puntate tornano a chi le aveva fatte.`, 'warn');
    emit(G, { k: 'void', no: H.no });
    const rec = handRecord(G); G.hist.push(rec); G.lastRec = rec;
    G.phase = 'pause'; H.wait = G.now + 2500; H.to = null; H.until = null; H.rv = null; H.res = { pots: [], won: {}, sd: false, voided: true };
    // la prossima mano riparte con lo stesso mazziere
    G.button = prevSeatOf(G, H.btn);
  }
  function prevSeatOf(G, id) { const o = G.order, i = o.indexOf(id); return o[(i - 1 + o.length) % o.length]; }

  function standings(G) {
    const m = G.options.mode, ids = G.players.filter(p => p.status !== 'gone' || G.chips[p.id] != null).map(p => p.id);
    const val = id => m === 'libero' ? (G.chips[id] || 0) - (G.debt[id] || 0) : (G.chips[id] || 0);
    const bust = {}; G.busted.forEach(b => bust[b.id] = b.place);
    const alive = ids.filter(id => bust[id] == null && pl(G, id).status === 'in' && G.chips[id] != null);
    alive.sort((a, b) => val(b) - val(a));
    const out = [];
    let place = 0, prevV = null;
    alive.forEach((id, i) => { if (prevV === null || val(id) !== prevV) place = i + 1; prevV = val(id); out.push({ id, place, chips: G.chips[id] || 0, val: val(id), debt: G.debt[id] || 0 }); });
    G.busted.slice().sort((a, b) => a.place - b.place).forEach(b => out.push({ id: b.id, place: Math.max(b.place, alive.length + 1), chips: 0, val: m === 'libero' ? -(G.debt[b.id] || 0) : 0, out: true }));
    ids.filter(id => !out.some(o => o.id === id)).forEach(id => out.push({ id, place: out.length + 1, chips: G.chips[id] || 0, val: val(id), gone: true }));
    return out;
  }
  function endPartita(G, how) {
    clockStop(G);
    const st = standings(G), n = st.length;
    st.forEach(r => {
      const beaten = st.filter(x => x.place > r.place).length;
      const pts = beaten + (r.place === 1 ? 1 : 0);
      G.score[r.id] = (G.score[r.id] || 0) + pts; r.pts = pts;
      const p = pl(G, r.id); if (p) { p.st.places.push(r.place); if (r.place === 1) p.st.wins++; p.st.points += pts; p.st.net += r.val - stack0(G); }
    });
    const winners = st.filter(r => r.place === 1).map(r => r.id);
    G.res = { gameNo: G.gameNo, st, winners, how, hands: G.handNo, n };
    G.results.push(G.res);
    G.H = G.H || null; if (G.H) G.H.wait = null;
    log(G, `🏁 ${winners.map(id => nm(G, id)).join(' e ')} ${winners.length > 1 ? 'vincono' : 'vince'} la partita${G.target > 1 ? ' ' + G.gameNo : ''}!`, 'win');
    emit(G, { k: 'end', ids: winners });
    G.phase = G.gameNo >= G.target ? 'gameEnd' : 'over';
  }

  /* ---------------- tempo, pause, giocatori fuori ---------------- */
  function tick(G) {
    const H = G.H;
    if (G.hold) return { ok: true };
    if (G.phase === 'bet' && H && H.until && G.now >= H.until) {
      const id = H.to, L = legal(G, id); pl(G, id).st.timeouts++;
      log(G, `⏰ Tempo scaduto per ${nm(G, id)}`, 'warn');
      return doAct(G, id, { kind: L && L.check ? 'check' : 'fold' });
    }
    if (G.phase === 'run' && H && H.wait && G.now >= H.wait) { H.wait = null; G.phase = 'reveal'; runNext(G); return { ok: true }; }
    if (G.phase === 'pause' && H && H.wait && G.now >= H.wait) { nextHand(G); return { ok: true }; }
    return { ok: true };
  }
  function hold(G, who) {
    if (G.hold) return;
    const H = G.H; G.hold = { who, left: H && H.until ? Math.max(3000, H.until - G.now) : null };
    if (H) H.until = null; clockStop(G);
  }
  function resume(G) {
    if (!G.hold) return; const H = G.H;
    if (H && G.hold.left && G.phase === 'bet') H.until = G.now + G.hold.left;
    G.hold = null; if (G.phase !== 'wait' && G.phase !== 'over' && G.phase !== 'gameEnd') clockGo(G);
  }
  // giocatore seduto fuori (disconnesso a lungo): non riceve più carte finché torna
  function sitOut(G, id) {
    if (!isIn(G, id) || G.sitout[id]) return;
    G.sitout[id] = true; log(G, `🪑 ${nm(G, id)} è seduto fuori finché non torna.`, 'warn'); emit(G, { k: 'sitout', id });
    const H = G.H;
    if (H && H.ids.includes(id) && !H.folded[id]) {
      if (G.phase === 'bet' && H.to === id) { const L = legal(G, id); doAct(G, id, { kind: L && L.check ? 'check' : 'fold' }); }
      else if (G.phase === 'show' && showNeed(G).includes(id)) forceMuck(G, id);
      else if (G.phase === 'deal') { H.folded[id] = true; H.op[id] = true; if (live(G).length === 1) { G.phase = 'bet'; closeStreet(G); } else maybeBegin(G); }
    }
  }
  function back(G, id) {
    if (!G.sitout[id]) return;
    delete G.sitout[id]; log(G, `✅ ${nm(G, id)} torna al tavolo dalla prossima mano.`, 'sys');
    if (G.phase === 'wait') startHand(G);
  }

  /* ---------------- chi serve adesso (per pause e disconnessioni) ---------------- */
  function needs(G, id) {
    const H = G.H; if (!H) return false;
    if (G.phase === 'bet') return H.to === id;
    if (G.phase === 'show') return showNeed(G).includes(id);
    if (G.phase === 'deal') return H.ids.includes(id) && !H.folded[id] && !pl(G, id).bot && !H.op[id];
    return false;
  }

  /* =========================================================
     AZIONI
     ========================================================= */
  function applyAction(G, actorId, a) { try { G.now = (a && a.now) || Date.now(); return applyInner(G, actorId, a || {}); } catch (e) { return err('Errore: ' + (e && e.message || e)); } }
  function applyInner(G, pid, a) {
    const H = G.H;
    switch (a.type) {
      case 'act': {
        if (G.hold) return err('Partita in pausa');
        if (!H || G.phase !== 'bet') return err('Adesso non si punta');
        if (H.to !== pid) return err('Non tocca a te');
        if (a.no != null && a.no !== H.no) return err('Mossa di un\'altra mano');
        return doAct(G, pid, a);
      }
      case 'mixed': { const gen = G.gens[a.h]; if (!gen || (a.g && gen.g !== a.g)) return err('Mazzo sconosciuto'); gen.ready = true; maybeBegin(G); return { ok: true }; }
      case 'opened': { if (!H || a.no !== H.no || !H.ids.includes(pid)) return { ok: true }; H.op[pid] = true; maybeBegin(G); return { ok: true }; }
      case 'botHands': { G.bh = G.bh || {}; for (const id in a.hands) { if (!H || !H.ids.includes(id) || a.no !== H.no) continue; G.bh[id] = scramble(a.hands[id], 'th:' + id); } maybeBegin(G); return { ok: true }; }
      case 'lost': { // il dispositivo non ha più le chiavi delle carte: la mano si rifà
        if (!H || !H.ids.includes(pid) || ['pause', 'over', 'gameEnd'].includes(G.phase)) return { ok: true };
        log(G, `⚠️ Il dispositivo di ${nm(G, pid)} non ha le chiavi del mazzo (forse è un altro browser): si rimescola.`, 'warn');
        voidHand(G, 'chiavi del mazzo perse');
        delete G.gens[H.no + 1];
        return { ok: true };
      }
      case 'board': return gotBoard(G, a);
      case 'shown': return gotShown(G, a.id || pid, a.cards, !!a.vol);
      case 'muck': return doMuck(G, pid);
      case 'tick': return tick(G);
      case 'hold': hold(G, a.who); return { ok: true };
      case 'resume': resume(G); return { ok: true };
      case 'sitout': sitOut(G, a.id); return { ok: true };
      case 'back': back(G, a.id); return { ok: true };

function makeOps(C) {
  return {
    mix(a) { const H = C.jointKey(a.hs.map(C.dec)); const inp = a.prev ? C.des(a.prev) : C.deck0(a.ids); return C.ser(C.passDeck(inp, H)); },
    shares(a) { const x = C.dec(a.x), o = {}; for (const p of a.pos) o[p] = C.enc(C.share(C.des(a.fin[p]), x)); return o; },
    open(a) {
      const x = a.x ? C.dec(a.x) : null;
      return a.items.map(it => { const ct = C.des(it.ct); const parts = it.parts.map(C.dec); if (x != null) parts.push(C.share(ct, x)); return C.decodeCard(C.open(ct, parts), a.ids); });
    },
    // quote con prova per mostrare le proprie carte
    prove(a) { const x = C.dec(a.x), h = C.dec(a.h), o = {}; for (const p of a.pos) { const r = C.proveShare(C.des(a.fin[p]), x, h, a.rk + ':' + p); o[p] = { d: C.enc(r.d), c: C.enc(r.c), s: C.enc(r.s) }; } return o; },
    // la regia controlla le prove e apre le carte mostrate
    openShow(a) {
      const h = C.dec(a.h), out = [];
      for (const it of a.items) {
        const ct = C.des(it.ct), sw = it.sw;
        if (!C.checkShare(ct, h, { d: C.dec(sw.d), c: C.dec(sw.c), s: C.dec(sw.s) }, a.rk + ':' + it.p)) return { bad: true };
        out.push(C.decodeCard(C.open(ct, it.parts.map(C.dec).concat([C.dec(sw.d)])), a.ids));
      }
      return { cards: out };
    },
    verify(a) {
      return C.verifyHand({ cards: a.cards, names: a.names, keys: a.keys.map(C.dec), xs: a.xs.map(x => x == null ? null : C.dec(x)), fin: C.des(a.fin), claims: a.claims });
    }
  };
}
const OPS = makeOps(C);
let worker = null, wseq = 0; const wjobs = {};
try {
  const src = document.getElementById('cryptosrc').textContent + '\nconst OPS = (' + makeOps.toString() + ')(self.THCrypto);\nself.onmessage = e => { const { id, op, a } = e.data; let r = null, err = null; try { r = OPS[op](a); } catch (x) { err = String(x && x.message || x); } self.postMessage({ id, r, err }); };';
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  worker.onmessage = e => { const j = wjobs[e.data.id]; if (!j) return; delete wjobs[e.data.id]; e.data.err ? j.rej(new Error(e.data.err)) : j.res(e.data.r); };
  worker.onerror = () => { worker = null; Object.values(wjobs).forEach(j => j.retry()); };
} catch (e) { worker = null; }
function runOp(op, a) {
  return new Promise((res, rej) => {
    const local = () => setTimeout(() => { try { res(OPS[op](a)); } catch (e) { rej(e); } }, 0);
    if (!worker) return local();
    const id = ++wseq; wjobs[id] = { res, rej, retry: local };
    try { worker.postMessage({ id, op, a }); } catch (e) { delete wjobs[id]; local(); }
  });
}

let KV = null;
function makeDB(kv) {
  KV = kv;
  const snap = p => { const d = kv.get(p); return { id: p.split('/').pop(), exists: !!d, data: () => d ? clone(d) : undefined } };
  const docRef = p => ({
    id: p.split('/').pop(), path: p, get: async () => snap(p), set: d => kv.write('set', p, clone(d)),
    delete: () => kv.write('delete', p, null),
    onSnapshot(next) { let last; const f = () => { const raw = JSON.stringify(kv.get(p)); if (raw !== last) { last = raw; next(snap(p)) } }; const un = kv.listen(f); setTimeout(f, 0); return un }
  });
  const collRef = (p, q = { o: null, l: null }) => {
    const run = () => {
      const dep = p.split('/').length + 1; let docs = kv.keys().filter(k => k.startsWith(p + '/') && k.split('/').length === dep).map(snap).filter(d => d.exists);
      if (q.o) { const [f, dir] = q.o; docs.sort((a, b) => { const x = a.data()[f], y = b.data()[f]; return (x > y ? 1 : x < y ? -1 : 0) * (dir === 'desc' ? -1 : 1) }) } else docs.sort((a, b) => a.id < b.id ? -1 : 1);
      if (q.l) docs = docs.slice(0, q.l); return { docs, size: docs.length, empty: !docs.length }
    };
    return {
      path: p, orderBy: (f, d = 'asc') => collRef(p, { ...q, o: [f, d] }), limit: n => collRef(p, { ...q, l: n }),
      get: async () => run(), onSnapshot(next) { let last; const f = () => { const s = run(); const raw = JSON.stringify(s.docs.map(d => [d.id, (d.data() || {}).t, (d.data() || {}).rk, JSON.stringify(d.data()).length])); if (raw !== last) { last = raw; next(s) } }; const un = kv.listen(f); setTimeout(f, 0); return un },
      doc: id => docRef(p + '/' + (id || rid(14))), add: async d => { const r = docRef(p + '/' + rid(14)); await r.set(d); return r }
    }
  };

}
function makeLocalKV() {
  const PFX = 'th-db:'; const mem = {}; const fresh = new Map();
  const st = {
    get(p) { if (fresh.has(p)) return fresh.get(p); try { const v = localStorage.getItem(PFX + p); return v ? JSON.parse(v) : null } catch (e) { return mem[p] !== undefined ? mem[p] : null } },
    set(p, d) { fresh.set(p, d); try { localStorage.setItem(PFX + p, JSON.stringify(d)) } catch (e) { mem[p] = d } },
    del(p) { fresh.set(p, null); try { localStorage.removeItem(PFX + p) } catch (e) { delete mem[p] } },
    keys() { let k = []; try { k = Object.keys(localStorage).filter(k => k.startsWith(PFX)).map(k => k.slice(PFX.length)) } catch (e) { k = Object.keys(mem) } const s = new Set(k); fresh.forEach((v, p) => { if (v) s.add(p); else s.delete(p) }); return [...s] }

    get: p => st.get(p), keys: () => st.keys(), listen(f) { L.add(f); return () => L.delete(f) },
    write(op, p, d) { if (op === 'set') st.set(p, d); else st.del(p); setTimeout(() => L.forEach(f => f()), 0); try { bc && bc.postMessage({ p, d: st.get(p) }) } catch (e) { } return Promise.resolve(); }

  });

  const kk = S.code + ':' + myId + ':' + (S.started || 0) + ':st';
  if (S.status === 'ended' && !all.some(x => x.k === kk)) {
    const best = Math.max(...G.order.map(id => G.score[id] || 0));

}

/* ogni messaggio di un giocatore (mossa, chat, carte) conta come segno di vita */
function alive(id) { if (id && presT[id] !== undefined) lastSeen[id] = Date.now(); }
function onPres(x) {
  const now = Date.now();
  if (presT[x.id] === undefined) lastSeen[x.id] = now - x.t < 30000 ? now : x.t;
  else if (presT[x.id] !== x.t) lastSeen[x.id] = now;
  presT[x.id] = x.t; lastVis[x.id] = x.vis !== false;
}
let cTickT = null;
function cryptoSoon() { clearTimeout(cTickT); cTickT = setTimeout(cryptoTick, 30); }
let openTok = 0, opening = null;
async function openGame(c, join) {
  closeGame(); view = 'game';
  const tok = ++openTok; opening = c;
  try { if (location.hash !== '#' + c) location.hash = c; } catch (e) { }
  if (MODE === 'p2p') {
    busy('Mi collego alla partita ' + c + '…');
    const ok = await Net.connect();
    if (view !== 'game' || tok !== openTok) return;
    let found = false;
    if (ok) { Net.sub(c); found = await Net.waitDoc('games/' + c, 9000); }
    if (view !== 'game' || tok !== openTok) return;
    if (!found) {
      $('#app').innerHTML = `<div class="home"><div class="panel"><h3>${ok ? 'Non trovo la partita ' + esc(c) : 'Non riesco a collegarmi al server del gioco'}</h3><p class="mut">${ok ? 'Controlla che il codice sia giusto (5 caratteri, come te l’ha mandato chi ha creato la partita).' : 'Controlla la connessione a internet e riprova.'}</p><div class="row"><button class="btn primary" id="rt">Riprova</button><button class="btn" id="bk">Indietro</button></div></div></div>`;
      $('#rt').onclick = () => openGame(c, join); $('#bk').onclick = leave; return;
    }
    const g = Net.cache.get('games/' + c); addRecent(c, g && g.hostName);
  } else addRecent(c, myName);
  code = c;
  busy('Apro la partita ' + c + '…');
  let first = true;
  const t = setTimeout(() => { if (first && code === c) { $('#app').innerHTML = '<div class="home"><div class="panel">Non riesco a raggiungere la partita. Controlla la connessione. <button class="btn sm" id="bk">Indietro</button></div></div>'; $('#bk').onclick = leave; } }, 10000);
  unsubs.push(DB.doc('games/' + c).onSnapshot(snap => {
    clearTimeout(t);
    if (!snap.exists) { if (first) { first = false; $('#app').innerHTML = '<div class="home"><div class="panel">Partita non trovata. <button class="btn sm" id="bk">Indietro</button></div></div>'; $('#bk').onclick = leave; } return; }
    const d = clone(snap.data()); serverS = d;
    if (first && join && d.status === 'lobby' && !seats.some(s => s.id === myId) && (!window.Tavolata || Tavolata.puoEntrare(d))) DB.doc(`games/${c}/seats/${myId}`).set({ id: myId, name: myName || 'Giocatore', t: Date.now() }).catch(writeErr);
    first = false;
    if (S && (d.v || 0) < (S.v || 0)) return;
    if (S && d.v === S.v && d.w === myId) return;
    if (d.w && d.w !== myId && d.upd) clockSample(Date.now() - d.upd);
    if (d.w) alive(d.w);

}

/* ---------------- barra delle mosse ---------------- */
function stepOf(G) { const bb = G.H ? G.H.bbAmt : 20; return bb >= 100 ? bb / 2 : bb >= 20 ? 10 : 5; }

      <input type="range" id="rng" min="${L.minTo}" max="${L.maxTo}" step="${stepOf(G)}" value="${betAmt}" aria-label="Quanto puntare">
      <input class="amtin" id="amtin" inputmode="numeric" value="${betAmt}" aria-label="Puntata"></div>` : (L.canRaise ? `<div class="sizer"><div class="chipdrag" id="chipdrag" title="Trascina sul tavolo per puntare"></div><span class="small mut">Trascina la fiche sul tavolo o usa i pulsanti</span></div>` : '');
    h = `${sizer}<div class="acts">

      ${L.canRaise ? `<button class="btn ${betAmt >= L.allinTo ? 'b-allin' : 'b-raise'}" id="aR">${raiseTxt}</button>` : ''}</div>`;
  } else if (H && amIn() && H.ids.includes(myId) && !H.folded[myId] && !H.allin[myId] && ['bet', 'deal', 'reveal'].includes(G.phase)) {

    h = `<div class="pre"><label><input type="checkbox" id="pCF" ${preAct && preAct.k === 'cf' ? 'checked' : ''}> Bussa o lascia</label><label><input type="checkbox" id="pCK" ${preAct && preAct.k === 'ck' ? 'checked' : ''}> Bussa se si può</label><span class="hint small">Le mosse "prenotate" partono da sole quando tocca a te</span></div>`;
  } else if (H && G.phase === 'pause' && H.ids.includes(myId) && !(H.sd && H.sd.shown[myId]) && !H.vol[myId] && !H.res.voided && myHole(G)) {
    key = 'show:' + H.no;
    h = `<div class="acts"><button class="btn" id="aShow">🃏 Mostra le mie carte</button></div>`;
  } else {
    const me = G.players.find(p => p.id === myId);
    const busted = (G.busted || []).find(b => b.id === myId);
    const t = !me ? '👀 Stai guardando la partita' : busted ? `💀 Sei stato eliminato (${busted.place}° posto): guarda come va a finire` : G.sitout[myId] ? '🪑 Sei seduto fuori: rientri dalla prossima mano' : H && H.folded[myId] && H.ids.includes(myId) ? '✋ Hai lasciato: aspetta la prossima mano' : H && H.allin[myId] ? '🔥 Sei all-in: incrocia le dita!' : G.phase === 'show' && E.showNeed(G).includes(myId) ? '🃏 Scopro le tue carte…' : '';

  on('#aR', () => doRaise());
  on('#aShow', () => showVoluntary());
  const cf = $('#pCF', bar); if (cf) cf.onchange = () => { preAct = cf.checked ? { k: 'cf', no: G_().H.no } : null; bar._k = ''; renderBar(G_()); };
  const ck = $('#pCK', bar); if (ck) ck.onchange = () => { preAct = ck.checked ? { k: 'ck', no: G_().H.no } : null; bar._k = ''; renderBar(G_()); };
  $$('[data-sz]', bar).forEach(b => b.onclick = () => { const G2 = G_(), L = E.legal(G2, myId); if (!L) return; const v = b.dataset.sz; betAmt = clampBet(G2, L, v === 'min' ? L.minTo : v === 'all' ? L.allinTo : L.cur + (+v) * (L.pot + L.toCall)); bar._k = ''; renderBar(G2); });
  const rng = $('#rng', bar); if (rng) rng.oninput = () => { betAmt = +rng.value; const ai = $('#amtin', bar); if (ai) ai.value = betAmt; const L = E.legal(G_(), myId); const b = $('#aR', bar); if (b && L) { const v = clampBet(G_(), L, betAmt); b.textContent = v >= L.allinTo ? `All-in ${fmt(L.allinTo)}` : `${L.cur === 0 ? 'Punta' : 'Rilancia a'} ${fmt(v)}`; b.className = 'btn ' + (v >= L.allinTo ? 'b-allin' : 'b-raise'); } };
  if (rng) rng.onchange = () => { bar._k = ''; renderBar(G_()); };
  const ai = $('#amtin', bar); if (ai) { ai.onchange = () => { const L = E.legal(G_(), myId); if (!L) return; betAmt = clampBet(G_(), L, +String(ai.value).replace(/\D/g, '') || L.minTo); bar._k = ''; renderBar(G_()); }; ai.onkeydown = e => { if (e.key === 'Enter') { ai.onchange(); doRaise(); } }; }
}
function doFold() {

  if (L.check) return showInfo(`<h2>Lasciare la mano?</h2><p>Nessuno ha puntato: puoi <b>bussare</b> gratis e vedere la prossima carta.</p><div class="mbtns"><button class="btn" id="fk">👊 Bussa</button><button class="btn warn" id="fy">✋ Lascia lo stesso</button></div>`, m => { $('#fk', m).onclick = () => { hideInfo(); send({ type: 'act', no: G.H.no, kind: 'check' }); }; $('#fy', m).onclick = () => { hideInfo(); send({ type: 'act', no: G.H.no, kind: 'fold' }); }; });

function doRaise() {
  const G = G_(); if (!isMyTurn(G)) return; const L = E.legal(G, myId); if (!L) return;
  if (!L.canRaise) return send({ type: 'act', no: G.H.no, kind: L.check ? 'check' : 'call' });
  const v = clampBet(G, L, betAmt || L.minTo);
  send({ type: 'act', no: G.H.no, kind: 'raise', to: v });
  if (v >= L.allinTo) buzz(60);

/* ---------------- trascinamento: carte al centro = lascia, fiche sul tavolo = punta ---------------- */
function bindDrag() {
  const tw = $('#tw'); if (!tw) return;
  let drag = null;
  const start = (e, kind, el) => {
    const G = G_(); if (!isMyTurn(G)) return;
    e.preventDefault();
    const p = e.touches ? e.touches[0] : e;
    const ghost = document.createElement('div'); ghost.className = 'dragghost';
    ghost.innerHTML = kind === 'cards' ? (myHole(G) || []).map(c => cardHTML(c, { w: 44 })).join('') : chipsHTML(betAmt || E.legal(G, myId).minTo);
    ghost.style.display = 'flex'; ghost.style.gap = '3px';
    ghost.style.left = p.clientX + 'px'; ghost.style.top = p.clientY + 'px';
    document.body.appendChild(ghost);
    drag = { kind, ghost, x0: p.clientX, y0: p.clientY, moved: false };
  };
  const overFelt = (x, y) => { const r = $('#felt').getBoundingClientRect(); const cx = r.left + r.width / 2, cy = r.top + r.height / 2; return ((x - cx) / (r.width / 2)) ** 2 + ((y - cy) / (r.height / 2)) ** 2 < .62; };
  const move = e => { if (!drag) return; const p = e.touches ? e.touches[0] : e; drag.ghost.style.left = p.clientX + 'px'; drag.ghost.style.top = p.clientY + 'px'; if (Math.hypot(p.clientX - drag.x0, p.clientY - drag.y0) > 12) drag.moved = true; $('#felt').classList.toggle('drop', drag.moved && overFelt(p.clientX, p.clientY)); };
  const end = e => {
    if (!drag) return; const d = drag; drag = null; d.ghost.remove(); $('#felt').classList.remove('drop');
    const p = e.changedTouches ? e.changedTouches[0] : e;
    if (!d.moved || !overFelt(p.clientX, p.clientY)) return;
    if (d.kind === 'cards') doFold(); else doRaise();
  };
  tw.addEventListener('mousedown', e => { const c = e.target.closest('.pseat.me .pk'); if (c) start(e, 'cards', c); });
  tw.addEventListener('touchstart', e => { const c = e.target.closest('.pseat.me .pk'); if (c) start(e, 'cards', c); }, { passive: false });
  document.addEventListener('mousedown', e => { if (e.target.id === 'chipdrag') start(e, 'chip', e.target); });
  document.addEventListener('touchstart', e => { if (e.target.id === 'chipdrag') start(e, 'chip', e.target); }, { passive: false });
  document.addEventListener('mousemove', move); document.addEventListener('touchmove', move, { passive: true });
  document.addEventListener('mouseup', end); document.addEventListener('touchend', end);
}

/* ---------------- animazioni ---------------- */
function seatEl(id) { return $(`[data-seat="${id}"] .box`); }
function flyChips(fromEl, toEl, amt, delay) {
  if (reduced() || !fromEl || !toEl) return;
  setTimeout(() => {
    const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
    const d = document.createElement('div'); d.className = 'flychip'; d.innerHTML = chipsHTML(amt);
    d.style.left = (a.left + a.width / 2 - 20) + 'px'; d.style.top = (a.top + a.height / 2 - 10) + 'px';
    document.body.appendChild(d);
    requestAnimationFrame(() => requestAnimationFrame(() => { d.style.transform = `translate(${b.left + b.width / 2 - a.left - a.width / 2}px,${b.top + b.height / 2 - a.top - a.height / 2}px)`; d.style.opacity = '.85'; }));
    setTimeout(() => d.remove(), 600);
  }, delay || 0);
}
function stamp(txt, gold) {
  const w = $('#tw'); if (!w || reduced()) return;
  const s = document.createElement('div'); s.className = 'stamp' + (gold ? ' gold' : ''); s.textContent = txt;
  w.appendChild(s); setTimeout(() => s.remove(), 1300);
}
function handleEvents(G) {
  const first = lastEventN < 0;
  const evs = G.events.filter(e => e.n > lastEventN); lastEventN = G.evSeq;
  if (first || !evs.length) return;
  let delay = 0;
  const visible = document.visibilityState !== 'hidden';
  for (const e of evs) {
    switch (e.k) {
      case 'chips': { const b = $(`[data-bet="${e.id}"]`); flyChips(seatEl(e.id), b || $('#pot'), e.amt, 0); break; }
      case 'allin': stamp('ALL-IN!'); if (G.H && G.H.ids.includes(myId) && e.id !== myId && !G.H.folded[myId]) buzz([40, 40, 40]); break;
      case 'turn': if (e.id === myId && visible) { buzz(35); const st = $('#status'); if (st && !reduced()) { st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); } } break;
      case 'win': {
        const pot = $('#pot');
        Object.keys(e.amts || {}).forEach((id, i) => flyChips(pot, seatEl(id), e.amts[id], 300 + i * 150));
        if (e.amts && e.amts[myId]) { buzz([60, 40, 120]); if (e.sd) toast(`🏆 Vinci ${fmt(e.amts[myId])}!`, 'good'); }
        break;
      }
      case 'out': if (e.id === myId) { buzz([200, 80, 200]); toast('💀 Hai finito le fiches: sei eliminato', 'warn'); } else toast(`💀 ${nameOf(e.id)} è eliminato`); break;
      case 'level': toast(`⬆️ I bui salgono: ${fmt(E.blindsAt(e.lvl).sb)}/${fmt(E.blindsAt(e.lvl).bb)}`, 'big'); break;
      case 'end': resultsReadyAt = Date.now() + 2600; if (e.ids.includes(myId)) { confetti(); buzz([80, 60, 160]); } else buzz(60); break;
      case 'void': toast('↩️ Mano annullata: le puntate tornano a tutti', 'warn'); break;
      case 'sitout': if (e.id !== myId) toast(`🪑 ${nameOf(e.id)} è seduto fuori`); break;
      case 'rebuy': toast(`💳 ${nameOf(e.id)} ricarica le fiches`); break;
      case 'showdown': if (e.runout && G.H && G.H.ids.includes(myId)) buzz(50); break;
      case 'partita': if (G.gameNo > 1) toast(`🃏 Partita ${G.gameNo}: si ricomincia!`, 'big'); break;
    }
  }
}

function showModal(html, onMount) { const box = $('#modalBox'); if (box._h === html && !$('#modal').hidden) return; box._h = html; box.innerHTML = html; $('#modal').hidden = false; if (onMount) onMount(box); }

function hideInfo() { const m = $('#info'); if (m && !m.hidden) { m.hidden = true; const f = infoClose; infoClose = null; if (f) f(); } }
function renderModal(G, force) {

    const k = gameKey() + ':' + G.gameNo + ':' + G.phase;

}

  on('#nx', () => send({ type: 'next' }));

}
function checkLine(G, gameNo) {

  return `<div class="check good">✓ Carte controllate: ${c.n} ${c.n === 1 ? 'mazzo regolare' : 'mazzi regolari'}, nessuna carta cambiata o doppia${c.complete ? '' : ' (controllo parziale: per alcune mani mancava qualche chiave)'}.</div>`;
}
function resultsHTML(G) {

  const wn = r.winners.map(id => `<span style="color:${pcol(id)}">${esc(nameOf(id))}</span>`).join(' e ');
  const libero = G.options.mode === 'libero';
  let h = `<h2 data-res>${end && G.target > 1 ? 'Fine della serie' : G.target > 1 ? `Fine della partita ${r.gameNo} di ${G.target}` : 'Partita finita'}</h2>`;
  h += `<div class="winner">${r.winners.length > 1 ? `🤝 Pari: ${wn}!` : `🏆 Vince ${wn}!`}</div>`;
  h += `<p>${r.how === 'alone' ? `Ha preso tutte le fiches in ${r.hands} mani.` : r.how === 'hands' ? `Dopo ${r.hands} mani ha più fiches di tutti.` : `Partita chiusa da chi l'ha creata dopo ${r.hands} mani.`}</p>`;
  const maxV = Math.max(1, ...r.st.map(x => Math.max(0, x.val)));

function statsTable(G) {
  const ps = G.players.filter(p => p.st.hands > 0);

  const ko = best(p => p.st.kos); if (ko.length) fun.push(`💀 Lo sterminatore: <b>${names(ko)}</b> (${ko[0].st.kos} ${ko[0].st.kos === 1 ? 'giocatore eliminato' : 'giocatori eliminati'})`);
  const bb = best(p => p.st.badBeat); if (bb.length) fun.push(`😭 Il più sfortunato: <b>${names(bb)}</b> (perso ${bb[0].st.badBeat} ${bb[0].st.badBeat === 1 ? 'volta' : 'volte'} da grande favorito)`);
  const so = best(p => p.st.suckout); if (so.length) fun.push(`🍀 Il più fortunato: <b>${names(so)}</b> (vinto ${so[0].st.suckout} ${so[0].st.suckout === 1 ? 'volta' : 'volte'} da sfavorito)`);
  const loose = best(p => p.st.hands >= 8 ? Math.round(100 * p.st.vpip / p.st.hands) : 0); if (loose.length) fun.push(`🎰 Gioca tutto: <b>${names(loose)}</b> (entra nel ${Math.round(100 * loose[0].st.vpip / loose[0].st.hands)}% delle mani)`);
  const rock = ps.filter(p => p.st.hands >= 8).sort((a, b) => a.st.vpip / a.st.hands - b.st.vpip / b.st.hands)[0]; if (rock && ps.length > 1) fun.push(`🪨 La roccia: <b>${esc(rock.name)}</b> (entra solo nel ${Math.round(100 * rock.st.vpip / rock.st.hands)}% delle mani)`);
  return `<h3 style="margin:18px 0 6px">Statistiche</h3>${fun.length ? `<p class="small" style="line-height:1.7">${fun.join('<br>')}</p>` : ''}<div class="stwrap"><table class="sttab"><thead><tr><th></th>${ps.map(p => `<th>${avOf(p.id, 26)}<br>${esc(p.name)}${p.bot ? `<div class="small mut">${p.level}</div>` : ''}</th>`).join('')}</tr></thead><tbody>
    ${row('🏆 Partite vinte', p => `<b>${p.st.wins}</b>`)}${row('📊 Piazzamenti', p => p.st.places.map(x => x === 1 ? '🏆' : x + '°').join(' ') || '—')}
    ${row('🃏 Mani giocate', p => p.st.hands)}${row('✅ Mani vinte', p => p.st.won)}${row('👀 …senza mostrare', p => p.st.wonNoSD)}
    ${row('🎯 Entra nelle mani', p => pct(p.st.vpip, p.st.hands))}${row('⬆️ Rilancia prima del flop', p => pct(p.st.pfr, p.st.hands))}
    ${row('🔥 Aggressività (puntate/viste)', p => p.st.calls ? (p.st.aggr / p.st.calls).toFixed(1) : p.st.aggr ? '∞' : '—')}
    ${row('⚖️ Confronti vinti', p => `${p.st.sdWon}/${p.st.sd}`)}${row('💰 Piatto più grande', p => fmt(p.st.bigPot))}
    ${row('🏅 Punto migliore', p => p.st.best >= 0 ? esc(E.describe(p.st.best)) : '—')}${row('💥 All-in vinti', p => `${p.st.allinW}/${p.st.allinW + p.st.allinL}`)}
    ${row('🎭 Bluff riusciti', p => G.options.reveal === 'svelate' ? p.st.bluffs : '?')}${row('💀 Eliminati da lui', p => p.st.kos)}
    ${row('📈 Fiches massime', p => fmt(p.st.maxChips))}${G.options.mode === 'libero' ? row('💳 Ricariche', p => p.st.rebuys) : ''}
    ${row('⏰ Tempo scaduto', p => p.st.timeouts)}${row('Disconnessioni', p => p.bot ? '–' : disc(p))}
  </tbody></table></div>`;
}
const replayOf = gameNo => { const d = raw(`games/${code}/replay/${S.started || 0}-${gameNo}`); return d && d.hands ? d.hands : null; };
function histHTML(full) {
  const G = G_(); if (!G) return '';
  const gameNo = G.gameNo;
  let list = archived(gameNo);
  G.hist.forEach(r => { if (!list.some(x => x.no === r.no)) list.push(r); });
  list = list.sort((a, b) => b.no - a.no);
  const rp = replayOf(gameNo);
  const mini = cs => (cs || []).map(c => cardHTML(c, {})).join('');
  const rows = list.slice(0, full ? 400 : 60).map(r => {
    const won = Object.entries(r.won || {});
    const wtxt = r.voided ? 'Mano annullata' : won.map(([id, a]) => `<b style="color:${pcol(id)}">${esc(nameOf(id))}</b> +${fmt(a)}`).join(' · ');
    const shown = Object.assign({}, r.vol || {}, r.shown || {});
    const holes = rp && rp[r.no] ? rp[r.no] : null;
    const who = r.ids.map(id => { const cs = shown[id] || (holes && holes[id]); if (!cs) return ''; const f = (r.folded || []).includes(id); return `<span>${esc(nameOf(id))}: ${mini(cs)}${f ? ' <i>(ha lasciato)</i>' : ''}${!shown[id] && !f ? ' <i>(nascoste)</i>' : ''}</span>`; }).filter(Boolean).join('');
    return `<div class="hhrow"><div class="top"><span><b>Mano ${r.no}</b> · piatto ${fmt(r.pot || 0)}</span><span>${wtxt}</span></div>${r.board && r.board.length ? `<div class="cs">${mini(r.board)}${r.board2 ? ' &nbsp;|&nbsp; ' + mini(r.board2) : ''}</div>` : ''}${who ? `<div class="who">${who}</div>` : ''}</div>`;
  }).join('');
  return `<h2>Le mani di questa partita</h2>${rp ? '<p class="small">Le chiavi sono state mostrate: ecco anche le carte di chi ha lasciato.</p>' : G.options.reveal === 'svelate' ? '<p class="small">Le carte di chi ha lasciato si vedranno a fine partita.</p>' : '<p class="small">Si vedono solo le carte mostrate.</p>'}${rows || '<p class="mut">Nessuna mano finita.</p>'}<div class="mbtns"><button class="btn primary" data-close-info>Chiudi</button></div>`;
}
function rulesHTML() {
  const G = S.game, o = G.options, b = E.blindsAt(G.lvl);
  return `<h2>Regole di questa partita</h2><ul class="rules-list">
    <li><b>Gioco:</b> ${({ holdem: "Texas Hold'em: 2 carte a testa, la miglior combinazione di 5 carte su 7", omaha: 'Omaha: 4 carte a testa, si usano esattamente 2 carte tue e 3 del tavolo', short: 'Short deck: mazzo senza 2-3-4-5 (36 carte); il colore batte il full, il tris batte la scala, A-6-7-8-9 è scala' })[o.variant]}.</li>
    <li><b>Puntate:</b> ${({ nl: 'senza limite: si può andare all-in in qualsiasi momento', pl: 'limite al piatto: al massimo quanto c\'è nel piatto', fl: 'limite fisso: il grande buio prima del flop e al flop, il doppio a turn e river; al massimo 4 puntate per giro (senza limite quando si è in due)' })[o.limit]}. Il rilancio minimo è l'ultimo rilancio (almeno il grande buio).</li>
    <li><b>Partita:</b> ${({ elim: `torneo a eliminazione, ${fmt(E.stack0(G))} fiches a testa, ${o.speed ? `i bui salgono ogni ${o.speed} minuti` : 'bui fissi'}${o.ante === 'si' ? ', ante dal 3° livello' : ''}`, mani: `${o.hands} mani, vince chi ha più fiches`, libero: 'gioco libero: chi finisce le fiches ricarica (conta come debito), chi ha creato la partita la chiude' })[o.mode]}${G.target > 1 ? ` · serie di ${G.target} partite (punti: 1 per ogni giocatore dietro di te, +1 al vincitore)` : ''}.</li>
    <li><b>Bui adesso:</b> ${fmt(b.sb)}/${fmt(b.bb)}${E.anteOn(G) ? ' + ante ' + fmt(b.bb) : ''}. In due il mazziere paga il piccolo buio e parla per primo prima del flop.</li>
    <li><b>Confronto finale:</b> ${o.muck === 'tutti' ? 'tutti scoprono le carte' : 'chi non può vincere nasconde le carte'}; quando tutti sono all-in le carte si scoprono e il tavolo esce da solo${o.runTwice === 'si' ? ', due volte (metà piatto per tavolo)' : ''}. A parità si divide; la fiche dispari va al primo a sinistra del mazziere.</li>
    <li><b>Carte di chi lascia:</b> ${o.reveal === 'svelate' ? 'si vedono a fine partita, con il controllo di tutti i mazzi' : 'restano segrete per sempre'}.</li>
    <li><b>Tempo per decidere:</b> ${o.turnTime ? fmtTime(o.turnTime * 1000) + ' (poi bussa se può, altrimenti lascia)' : 'nessuno'} · <b>Attesa per chi si disconnette:</b> ${fmtTime(o.disconnectWait * 1000)}, poi resta seduto fuori.</li>
    <li><b>Comandi:</b> pulsanti in basso; trascina le tue carte al centro per lasciare, trascina la fiche verde sul tavolo per puntare. Al computer: F lascia, C bussa/vedi, R punta/rilancia, A all-in, frecce su/giù per la puntata.</li>
  </ul><h3>I punti</h3>${handsHTML()}<div class="mbtns"><button class="btn primary" data-close-info>Chiudi</button></div>`;
}

/* ---------------- diario e chat ---------------- */
function renderFeed() {
  const f = $('#feed'); if (!f || !S || !S.game) return;
  const log = S.game.log.slice(-160).map(l => ({ t: l.t || 0, html: `<div class="msg ${l.kind || ''}">${esc(l.msg)}</div>` }));
  const ch = chat.map(m => ({ t: m.t, html: `<div class="msg chat ${m.e ? 'emo' : ''}"><b style="color:${/^#[0-9a-f]{3,8}$/i.test(m.c) ? m.c : '#ccc'};font-size:.88rem">${esc(m.by)}:</b> ${esc(m.x)}</div>` }));
  const all = log.concat(ch).sort((a, b) => a.t - b.t);
  const k = all.length + ':' + (all.length ? all[all.length - 1].t : 0) + ':' + S.game.logSeq + ':' + chat.length;
  if (k === feedKey) return; feedKey = k;
  const near = f.scrollHeight - f.scrollTop - f.clientHeight < 80;
  f.innerHTML = all.map(x => x.html).join('') || '<div class="small mut">Nessun messaggio.</div>';
  if (near || !f._init) { f.scrollTop = f.scrollHeight; f._init = 1; }
}
function onChat() {
  if (!S || view !== 'game' || S.status === 'lobby') return;
  renderFeed();
  const last = chat[chat.length - 1], narrow = true /* chat a scomparsa su ogni schermo */, seen = !narrow || sideOpen;
  if (last && last.t > chatSeenT) {
    if (!seen && last.id !== myId && !last.e) toast(`💬 ${last.by}: ${last.x}`);
    if (seen) chatSeenT = last.t;
  }
  updBadge();
  if (S.game) renderTable(S.game);
}
function updBadge() { const b = $('#chatBadge'); if (!b) return; const unread = chat.filter(m => m.t > chatSeenT && m.id !== myId && !m.e).length; b.hidden = !unread; b.textContent = unread; }
function sendChat(x, emo) {
  if (!x || !code) return;
  const i = S.game ? S.game.players.findIndex(p => p.id === myId) : -1; const p = i >= 0 ? S.game.players[i] : null;
  DB.collection(`games/${code}/chat`).add({ t: Date.now(), id: myId, by: p ? p.name : (myName || 'Spettatore'), c: PCOL[(i >= 0 ? i : 2) % PCOL.length], x: x.slice(0, 200), e: emo ? 1 : 0 }).then(pruneChat).catch(writeErr);
  chatSeenT = Date.now();
  if (emo) { bubbles[myId] = { x, t: Date.now() }; if (S.game) renderTable(S.game); }
}
function pruneChat() {
  if (MODE !== 'p2p' || !code) return;
  const pre = `games/${code}/chat/`; const ks = [...Net.cache.keys()].filter(k => k.startsWith(pre));
  if (ks.length > 60) ks.map(k => [k, (Net.cache.get(k) || {}).t || 0]).sort((a, b) => a[1] - b[1]).slice(0, ks.length - 60).forEach(([k]) => DB.doc(k).delete().catch(() => { }));
}

/* ---------------- barra "giocatore disconnesso" e orologi ---------------- */
function renderAway() {
  const bar = $('#awaybar'); if (!bar) return;
  const list = Object.entries((S && S.status === 'playing' && S.away) || {});
  if (!list.length) { bar.hidden = true; bar.innerHTML = ''; bar._k = ''; return; }
  const k = JSON.stringify(list); if (bar._k === k) return; bar._k = k;
  bar.hidden = false;
  bar.innerHTML = list.map(([id, a]) => `<div class="awayrow">⏳ <b>${esc(nameOf(id))}</b> ${id === myId ? '(tu): risulta che hai perso la connessione' : 'ha perso la connessione'}. Aspettiamo ancora <b class="cd" data-until="${a.until}">${fmtTime(a.until - Date.now())}</b>
    <button class="btn sm" data-more="${esc(id)}">+1 minuto</button></div>`).join('');
  $$('[data-more]', bar).forEach(b => b.onclick = () => send({ type: 'more', pid: b.dataset.more }));
}
function tickUI() {
  if (!S || view !== 'game' || !S.game || S.status === 'lobby') return;
  $$('#awaybar .cd').forEach(el => el.textContent = fmtTime(+el.dataset.until - Date.now()));
  $$('#status .tm').forEach(el => { const left = +el.dataset.until - T(); el.textContent = '⏱ ' + fmtTime(left); el.classList.toggle('hurry', left < 8000); });
  $$('[data-ring]').forEach(el => { const left = +el.dataset.ring - T(), tot = +el.dataset.tot || 30000; el.style.setProperty('--p', Math.max(0, Math.min(1, left / tot)).toFixed(3)); });
  const lv = $('#lvlT'); if (lv && S.game.phase !== 'wait' && !S.game.hold) lv.textContent = 'salgono tra ' + fmtTime(+lv.dataset.lvl - (Date.now() - +lv.dataset.at));
  $$('.netst').forEach(el => el.textContent = netText());
  $$('[data-next]').forEach(el => el.textContent = '(' + Math.max(0, Math.ceil((+el.dataset.next - Date.now()) / 1000)) + ')');
  if (Object.keys(bubbles).some(id => Date.now() - bubbles[id].t > 2700)) { for (const id in bubbles) if (Date.now() - bubbles[id].t > 2700) delete bubbles[id]; renderTable(S.game); }
}

function bindGlobal() {
  document.addEventListener('click', e => {
    if (e.target.closest('[data-close-info]')) hideInfo();
    if (e.target.id === 'info') hideInfo();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hideInfo();
    const G = G_(); if (!G || view !== 'game' || /input|textarea|select/i.test((e.target.tagName || ''))) return;
    if (!$('#info').hidden) return;
    if (!isMyTurn(G)) return;
    const L = E.legal(G, myId); if (!L) return;
    const k = e.key.toLowerCase();
    if (k === 'f') doFold();
    else if (k === 'c' || k === ' ') { e.preventDefault(); send({ type: 'act', no: G.H.no, kind: L.check ? 'check' : 'call' }); }
    else if (k === 'r' || k === 'enter') doRaise();
    else if (k === 'a' && L.canRaise) { betAmt = L.allinTo; $('#bar')._k = ''; renderBar(G); }
    else if ((k === 'arrowup' || k === 'arrowdown') && L.canRaise) { e.preventDefault(); betAmt = clampBet(G, L, (betAmt || L.minTo) + (k === 'arrowup' ? 1 : -1) * Math.max(stepOf(G), G.H.bbAmt)); $('#bar')._k = ''; renderBar(G); }
  });
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (/^[A-Z0-9]{5}$/.test(h) && h !== code && h !== opening && myName) openGame(h, true); });
}
bindGlobal();
init();

<script>
/* 💬 Chat: il pulsante apre e chiude il pannello su ogni schermo */
(function () {
  var SEL = '#chatToggle,#bSide,#chatBtn,#bSideX';
  var wide = function () { return innerWidth > CHAT_BP; }, was = wide();
  function aperta() { try { return !!sideOpen; } catch (e) { return true; } }
  function sync() {
    var open = aperta();
    var L = document.querySelector('.layout'); if (L) L.classList.toggle('chat-chiusa', !open);
    var x = document.getElementById('bSideX'); if (x) x.hidden = !open;
    document.querySelectorAll('#chatToggle,#bSide,#chatBtn').forEach(function (b) {
      b.setAttribute('aria-pressed', open ? 'true' : 'false');
      b.title = open ? 'Nascondi la chat' : 'Mostra la chat';
    });
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest(SEL)) return;
    if (wide()) { try { localStorage.setItem('tavolata-chat', aperta() ? 'aperta' : 'chiusa'); } catch (er) {} }
    sync();
    if (wide()) dispatchEvent(new Event('resize'));
  });
  addEventListener('resize', function () {
    var w = wide(); if (w === was) return; was = w;
    try { sideOpen = chatAperta(); } catch (e) { return; }
    var s = document.getElementById('side'); if (s) s.classList.toggle('open', sideOpen);
    sync();
  });
  new MutationObserver(function () { if (document.getElementById('side')) sync(); }).observe(document.getElementById('app') || document.body, { childList: true });
  sync();
})();
</script>
<script>
/* 👤 Account Tavolata: profilo, amici, inviti e stanze (codice comune in ../comune/tavolata.js) */
(function () {
  if (!window.Tavolata) return;
  if (typeof avatar === 'function') { const _av = avatar; avatar = function (p) { return Tavolata.conFoto(_av.apply(this, arguments), p); }; }
  const scrive = () => { const a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#app')); };
  const lobby = () => { if (view === 'game' && S && S.status === 'lobby') renderLobby(); };
  Tavolata.collegaGioco({
    id: 'texasholdem',
    stato: () => ({ view, code, S, seats, myId, DB, MODE }),
    act: fn => act(fn),
    max: () => { try { return MAXP; } catch (e) { return 0; } },
    entra: c => { if (view !== 'home') leave(); setTimeout(() => { const j = document.getElementById('jc'), b = document.getElementById('joinc'); if (j && b) { j.value = c; b.click(); } }, 30); },
    riapri: () => { if (code) openGame(code, true); },
    impostaPosti: r => { seats = r.slice().sort((a, b) => a.t - b.t); },
    ridisegna: lobby,
    impostaNome: n => { myName = n; const nm = document.getElementById('nm'); if (nm && document.activeElement !== nm) nm.value = n; }
  });
  addEventListener('tavolata:stats', () => { if (view === 'home' && !scrive()) renderHome(); });
  addEventListener('tavolata:profili', () => { if (!scrive()) lobby(); });
})();
</script>
