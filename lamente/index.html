<style>
:root{
  --bg:#1d1a2f; --bg2:#262142; --panel:#2b2550; --panel2:#342d60; --line:rgba(255,255,255,.10);
  --text:#f4f1ff; --muted:#b4acd6; --accent:#da77f2; --accent2:#f3d9fa; --deep:#9c36b5; --violet:#7c4dff;
  --ok:#22c55e; --bad:#f43f5e; --radius:14px; --red:#ff6b6b;
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{background:radial-gradient(1200px 700px at 50% -10%,#4a1d5c 0%,var(--bg) 62%) fixed}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- pulsanti ---------- */
.btn{border:1px solid var(--line);background:var(--panel2);padding:.55em 1em;border-radius:12px;cursor:pointer;font-weight:600;transition:transform .12s,background .12s,opacity .12s;white-space:nowrap;touch-action:manipulation}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#3e3672}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(135deg,#ae3ec9,#da77f2 55%,#f3d9fa);border:none;color:#2a0838}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#be4bdb,#e599f7 55%,#f8e7fc)}
.btn.go{background:#22c55e;color:#06260f;border:none}
.btn.go:hover:not(:disabled){background:#34d36d}
.btn.pulse:not(:disabled){animation:pulse 1.4s infinite}
.btn.warn{background:#c2410c;border:none}
.btn.ghost{background:transparent}
.btn.sm{padding:.4em .75em;font-size:.86rem;border-radius:9px}
.btn.big{padding:.8em 1.6em;font-size:1.08rem}
.btn.on{outline:2px solid var(--accent);outline-offset:1px;background:#4a2058}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(218,119,242,.55)}50%{box-shadow:0 0 0 9px rgba(218,119,242,0)}}

/* ---------- logo ---------- */
.logo{font-weight:700;font-size:3.6rem;letter-spacing:-.02em;line-height:1;display:inline-flex;align-items:center;gap:.22em;transform:rotate(-3deg);filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.logo .lt{background:linear-gradient(90deg,#f8e7fc,#da77f2 45%,#9c36b5);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .ico{display:inline-flex;width:1.1em;height:1.1em}
.logo .ico svg{width:100%;height:100%}
.logo.sm{font-size:1.7rem}
.logo.xs{font-size:1.35rem}

/* ---------- home e lobby ---------- */
body.v-home,body.v-lobby{overflow-y:auto}
body.v-game{overflow:hidden}
.home{max-width:780px;margin:0 auto;padding:30px 16px 60px;display:flex;flex-direction:column;gap:16px;position:relative}
.hero{text-align:center;margin-bottom:4px}
.gamepill{display:table;margin:0 auto 14px;background:#f3d9fa;color:#2a0838;font-weight:700;letter-spacing:.14em;font-size:.75rem;padding:5px 16px;border-radius:99px}
.tagline{color:var(--muted);margin:16px auto 0;max-width:56ch}
.hubbtn{text-decoration:none;color:var(--text);width:max-content;display:inline-flex;align-items:center;gap:6px}
.panel{background:rgba(43,37,80,.78);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(6px)}
.panel h3{margin:0 0 12px;font-size:1.15rem;font-weight:600}
.mut{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.mid{justify-content:center}
.banner{background:#3a2a10;border:1px solid #7c5a10;color:#ffe2a8;border-radius:14px;padding:12px 14px;font-size:.9rem}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gitem{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.medal{font-size:1.2rem;font-weight:700;color:var(--accent);width:40px;text-align:center}
.bigcode{font-size:2.6rem;font-weight:700;letter-spacing:8px;color:var(--accent);margin:4px 0}
.netst{color:#fde68a}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.seat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.seat select{padding:.3em .4em;font-size:.82rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.tile{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tile b{font-size:1.4rem;color:var(--accent)}.tile span{font-size:.78rem;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sitem span{color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);background:#1f1b38;border:1px solid var(--line);border-radius:10px;padding:.6em .7em}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.flabel{font-size:.85rem;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.seg button{background:#1f1b38;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.seg button small{color:var(--muted);font-size:.8rem}
.seg button.on{border-color:var(--accent);background:#3a1c46}
.inline{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.group{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.group h4{margin:4px 0 6px;font-size:1rem;color:var(--accent2);font-weight:600}
.opt{border-radius:12px;padding:8px 10px;margin:4px 0;background:rgba(255,255,255,.03)}
.opt.dis{opacity:.55}
.opt-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.opt-label{font-weight:500}
.opt select{max-width:58%}
.opt details{margin-top:4px}
.opt summary{cursor:pointer;color:var(--muted);font-size:.82rem;list-style:none;display:inline-flex;gap:4px;align-items:center}
.opt summary::-webkit-details-marker{display:none}
.opt summary::before{content:'▸';transition:transform .15s}
.opt details[open] summary::before{transform:rotate(90deg)}
.opt .help{font-size:.88rem;color:#ece6ff;line-height:1.45;padding:6px 2px 2px}
.opt .help ul{margin:.3em 0;padding-left:1.2em}
.opt .note{display:block;margin-top:4px}
.opt select:disabled,.seg button:disabled{opacity:.6;cursor:default}

/* ---------- avatar ---------- */
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:1.1rem;color:#1a1238;box-shadow:0 0 0 2px rgba(255,255,255,.25);position:relative}
.av .sh{position:absolute;right:-4px;bottom:-4px;font-size:.62em;background:#1d1a2f;border-radius:50%;width:1.55em;height:1.55em;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.4)}

/* ---------- carte ---------- */
.nc{--w:74px;width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.14);position:relative;flex:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(160deg,#fffaff,#f3e3f8);border:2px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 0 0 calc(var(--w)*.05) #ead0f2;color:#7b1fa2;display:grid;place-items:center;overflow:hidden}
.nc::before{content:'';position:absolute;inset:14%;border-radius:50%;border:2px dashed rgba(156,54,181,.18)}
.nc .num{font-weight:700;font-size:calc(var(--w)*.46);line-height:1;letter-spacing:-.03em;position:relative}
.nc .cn{position:absolute;font-size:calc(var(--w)*.15);font-weight:700;opacity:.75;line-height:1}
.nc .cn.a{left:8%;top:6%}.nc .cn.b{right:8%;bottom:6%;transform:rotate(180deg)}
.nc.red{color:#d6336c;background:linear-gradient(160deg,#fff6f6,#ffe3e3);box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 0 0 calc(var(--w)*.05) #ffc9c9}
.nc.red::before{border-color:rgba(214,51,108,.18)}
.nc .dir{position:absolute;bottom:7%;left:50%;transform:translateX(-50%);font-size:calc(var(--w)*.14);opacity:.8}
.nc.back{background:radial-gradient(circle at 50% 50%,#c25ee0 0 12%,#9c36b5 13% 24%,#7b2a96 25% 36%,#9c36b5 37% 48%,#5f2075 49% 100%);border-color:#e599f7;color:transparent}
.nc.back::before{border:2px solid rgba(255,255,255,.25);inset:10%}
.nc.back .bq{color:#f3d9fa;font-size:calc(var(--w)*.3);font-weight:700;position:relative}
.nc.dim{filter:grayscale(.7) brightness(.7)}
.nc.gone{opacity:.35;filter:grayscale(1)}
.nc.gone::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.6);color:#f43f5e;font-weight:700}
.nc.next{box-shadow:0 0 0 3px #ffd43b,0 0 24px rgba(255,212,59,.6),0 6px 16px rgba(0,0,0,.4)}
.nc.bad{box-shadow:0 0 0 3px #f43f5e,0 0 18px rgba(244,63,94,.7)}
.nc.good{box-shadow:0 0 0 3px #69db7c}
.mini{display:inline-grid;--w:26px;vertical-align:middle;margin:1px}
.mini .cn,.mini::before,.mini .dir{display:none}
.mini .num{font-size:calc(var(--w)*.5)}

.hud{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 12px 2px;flex-wrap:wrap;min-height:40px}

.fan{display:flex;height:34px;align-items:flex-end;justify-content:center}

.center{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,40px);position:relative;min-height:0;padding:6px}

.pile{position:relative;--w:clamp(78px,min(17vw,19vh),132px);width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.14);border:2px dashed rgba(243,217,250,.25);display:grid;place-items:center}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:6;pointer-events:none;text-align:center;padding:10px}

.ovbox{background:rgba(20,14,32,.78);border:1px solid rgba(243,217,250,.18);border-radius:18px;padding:12px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:96%;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.cdring{width:150px;height:150px;border-radius:50%;background:rgba(20,14,32,.72);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,212,59,.35),0 10px 30px rgba(0,0,0,.45)}
.bignum{font-size:6rem;line-height:1;font-weight:700;color:#ffd43b;text-shadow:0 6px 20px rgba(0,0,0,.5);animation:cd .9s ease-out both}

.ovtitle{font-size:1.6rem;font-weight:700;text-shadow:0 4px 14px rgba(0,0,0,.6);animation:rise .4s ease-out}

.ovcards{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:94%}
.ovcards .who{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem}
.dealing{display:flex;gap:6px;height:90px;align-items:center}
.dealing .nc{--w:46px;animation:shufl 1.1s ease-in-out infinite}
.dealing .nc:nth-child(2){animation-delay:.15s}.dealing .nc:nth-child(3){animation-delay:.3s}.dealing .nc:nth-child(4){animation-delay:.45s}
@keyframes shufl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(6deg)}}
.prog{width:200px;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}

.handzone{position:relative;padding:4px 8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}

.bar{display:flex;align-items:center;gap:8px;padding:8px 12px 10px;flex-wrap:wrap;justify-content:center;background:rgba(20,18,34,.78);border-top:1px solid var(--line);min-height:62px}

.vote{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}

<script id="cryptosrc">
/* =========================================================
   LA MENTE — mescolata segreta a più mani (come in Impostore)
   Cifratura ElGamal sul gruppo MODP a 1536 bit (RFC 3526):
   - ogni giocatore (e ogni bot, tramite la regia) ha una chiave
     segreta x_i per ogni distribuzione; la chiave comune è H = Π g^x_i;
   - a turno ognuno ricifra e mescola il mazzo di 100 carte;
   - il giocatore al posto j riceve le carte nelle posizioni
     j·k … j·k+k−1: gli altri pubblicano la loro "quota" per quelle
     carte e solo lui può completare la decifratura con la sua chiave;
   - a fine livello tutti pubblicano la chiave e ogni dispositivo
     controlla che la mescolata sia stata regolare e che le carte
     calate fossero davvero quelle di chi le ha calate.

  }
  const inLevel = (G, id) => !!(G.L && G.L.ids.includes(id) && (pl(G, id) || {}).status === 'in');
  const withCards = G => G.L.ids.filter(id => G.L.cnt[id] > 0 && (pl(G, id) || {}).status === 'in');
  const totalLeft = G => G.L.ids.reduce((a, id) => a + (G.L.cnt[id] || 0), 0);

  /* ---------------- passaggi di fase ---------------- */
  function toSync(G) {
    const L = G.L; G.phase = 'sync'; L.ready = {};
    L.ids.forEach(id => { const p = pl(G, id); if (p.bot) L.ready[id] = true; });
    emit(G, { type: 'sync' });
    maybeGo(G);
  }
  function maybeGo(G) {
    const L = G.L;
    if (!['sync', 'pause'].includes(G.phase)) return;
    const need = withCards(G);
    if (!need.length) return checkDone(G);
    if (need.every(id => L.ready[id])) go(G, GO_MS);
  }
  function go(G, ms) {
    const L = G.L, now = G.now;
    G.phase = 'play'; L.goAt = now + ms; L.lastT = { w: L.goAt, r: L.goAt }; L.ready = {};
    emit(G, { type: 'go', at: L.goAt, ms });
  }
  function pause(G, reason, by) {
    const L = G.L;
    if (G.options.restart === 'auto' && reason !== 'stop' && reason !== 'away') { go(G, AUTO_MS); emit(G, { type: 'pause', reason, by, auto: true }); return; }
    G.phase = 'pause'; L.ready = {}; L.pauseWhy = reason;
    L.ids.forEach(id => { if (pl(G, id).bot) L.ready[id] = true; });
    emit(G, { type: 'pause', reason, by });
    maybeGo(G);
  }
  function checkDone(G) {
    if (G.phase === 'check' || !G.L) return false;
    if (totalLeft(G) > 0) return false;
    toCheck(G, 'done');
    return true;
  }
  function toCheck(G, why) {
    const L = G.L; L.end = why; G.phase = 'check'; L.star = null;
    emit(G, { type: 'check', why });
  }

  /* ---------------- errori e vite ---------------- */
  function loseLives(G, n, ev) {
    const L = G.L; if (n <= 0) return;
    G.lives = Math.max(0, G.lives - n); L.lost += n; G.ts.livesLost += n;
    emit(G, { type: 'life', n, ev, lives: G.lives });
  }
  function errorOn(G, ev, cards) {
    // cards: quante carte vengono scartate per questo evento
    const L = G.L, first = !L.errs[ev];
    const pile = L.piles.w.concat(L.piles.r).find(e => e.ev === ev);
    if (first) {
      L.errs[ev] = true; G.ts.errors++;
      if (pile) { const p = pl(G, pile.by); if (p) p.st.early++; }
      if (G.options.lifeLoss === 'errore') loseLives(G, 1, ev);
    }
    if (G.options.lifeLoss === 'carta') loseLives(G, cards, ev);
    if (G.lives <= 0) { log(G, '💔 Vite finite!', 'warn'); toCheck(G, 'lost'); return; }
    if (first && G.phase === 'play') pause(G, 'error', pile ? pile.by : null);
  }
  function discardCards(G, id, c, vals, ev, late) {
    const L = G.L, p = pl(G, id);
    vals = vals.slice().sort((x, y) => c === 'w' ? x - y : y - x);
    vals.forEach(v => { L.acts.push({ by: id, k: late ? 'late' : 'disc', c, v, ev, t: G.now }); });
    L.cnt[id] = Math.max(0, L.cnt[id] - vals.length);
    if (p) p.st.late += vals.length;
    const top = L.piles[c].find(e => e.ev === ev);
    log(G, `✋ ${nm(G, id)} aveva ${vals.map(v => fmtCard(G, c, v)).join(', ')}: ${vals.length === 1 ? 'scartata' : 'scartate'}${top ? ` (era più ${c === 'w' ? 'basso' : 'alto'} del ${top.v})` : ''}.`, 'warn', { by: id });
    emit(G, { type: 'disc', by: id, c, vals, ev });
  }
  const fmtCard = (G, c, v) => isExt(G) ? (c === 'w' ? `${v}▲` : `${v}▼`) : String(v);
  /* bot: scartano subito le carte superate */
  function botsDiscard(G, c, ev) {
    const L = G.L, X = L.top[c];
    for (const id of L.ids) {
      const p = pl(G, id); if (!p.bot || p.status !== 'in' || !L.cnt[id]) continue;
      const h = botHand(G, id); if (!h) continue;
      const rm = removedBy(L, id);
      const low = remainingOf(h, c, rm[c]).filter(x => c === 'w' ? valOf(x) < X : valOf(x) > X).map(valOf);
      if (low.length) { discardCards(G, id, c, low, ev, false); errorOn(G, ev, low.length); if (G.phase === 'check') return; }
    }
  }

  /* ---------------- calare una carta ---------------- */
  function playCard(G, id, c, v) {
    const L = G.L, p = pl(G, id), now = G.now;
    const blind = L.blind[c];
    const elapsed = Math.max(0, now - Math.max(L.goAt, L.lastT[c]));
    G.ts.plays++;
    if (blind) {
      // coperta: nessuno sa il valore; la regia stima solo il tempo
      L.ev++;
      const e = { by: id, v: null, ev: L.ev, t: now, el: elapsed, ai: L.acts.length };
      L.acts.push({ by: id, k: 'play', c, v: null, ev: L.ev, t: now });
      L.piles[c].push(e); L.cnt[id]--;
      const pace = teamPace(G, null);
      L.est[c] = c === 'w' ? Math.min(100, Math.max(L.est[c] + 1, L.est[c] + elapsed / pace)) : Math.max(0, Math.min(L.est[c] - 1, L.est[c] - elapsed / pace));
      L.lastT[c] = now; L.lastBy[c] = id;
      emit(G, { type: 'play', by: id, c, v: null, ev: L.ev, blind: true });
      checkDone(G);
      return;
    }
    const top = L.top[c];
    const late = c === 'w' ? v < top : v > top;
    if (late) {
      // carta più bassa di quella in cima: andava calata prima → scartata, errore sull'ultima carta
      const lastEv = (L.piles[c][L.piles[c].length - 1] || {}).ev;
      L.cnt[id]--;
      L.acts.push({ by: id, k: 'late', c, v, ev: lastEv, t: now });
      p.st.late++;
      log(G, `✋ ${p.name} cala ${fmtCard(G, c, v)}, ma in cima c'è già ${fmtCard(G, c, top)}: scartata.`, 'warn', { by: id });
      emit(G, { type: 'disc', by: id, c, vals: [v], ev: lastEv, late: true });
      if (lastEv) errorOn(G, lastEv, 1);
      if (G.phase !== 'check') checkDone(G);
      return;
    }
    L.ev++;
    const gap = c === 'w' ? v - top : top - v;
    const e = { by: id, v, ev: L.ev, t: now, el: elapsed, ai: L.acts.length };
    L.acts.push({ by: id, k: 'play', c, v, ev: L.ev, t: now });
    L.piles[c].push(e); L.cnt[id]--; L.top[c] = v; L.est[c] = v;
    // statistiche di tempo
    const prevBy = L.lastBy[c];
    if (gap >= 2) { (G.samples[id] = G.samples[id] || []).push(elapsed / gap); if (G.samples[id].length > 10) G.samples[id].shift(); }
    p.st.longest = Math.max(p.st.longest, elapsed);
    if (prevBy && prevBy !== id) {
      if (p.st.fastest == null || elapsed < p.st.fastest) p.st.fastest = elapsed;
      if (gap === 1) { p.st.consec++; }
      const prev = L.piles[c][L.piles[c].length - 2];
      if (prev && (!G.ts.close || elapsed < G.ts.close.ms)) G.ts.close = { a: prevBy, b: id, va: prev.v, vb: v, c, ms: elapsed, n: L.n };
    }
    p.st.bigGap = Math.max(p.st.bigGap, gap);
    L.lastT[c] = now; L.lastBy[c] = id;
    emit(G, { type: 'play', by: id, c, v, ev: L.ev, el: elapsed });
    botsDiscard(G, c, L.ev);
    if (G.phase !== 'check') checkDone(G);
  }

  /* ---------------- stella ninja ---------------- */
  function starStart(G, id) {
    const L = G.L, p = pl(G, id);
    p.st.starsProp++;
    L.star = { by: id, votes: { [id]: true }, prev: G.phase, picks: {}, shows: {}, stage: 'vote' };
    G.phase = 'star';
    log(G, `⭐ ${p.name} propone di usare una stella ninja.`, 'sys', { by: id });
    emit(G, { type: 'star', by: id });
    if (G.options.starVote === 'uno') return starAccepted(G);
    for (const v of L.ids) { const q = pl(G, v); if (q.bot && q.status === 'in' && L.cnt[v] > 0 && L.star.votes[v] === undefined) L.star.votes[v] = botVote(G, v); }
    starVotesCheck(G);
  }
  function voters(G) { const L = G.L; return withCards(G).concat(L.star && !withCards(G).includes(L.star.by) && inLevel(G, L.star.by) ? [L.star.by] : []); }
  function starVotesCheck(G) {
    const L = G.L, s = L.star; if (!s || s.stage !== 'vote') return;
    const vs = voters(G);
    const no = vs.find(id => s.votes[id] === false);
    if (no) {
      log(G, `🙅 ${nm(G, no)} non è d'accordo: niente stella.`, 'sys', { by: no });
      emit(G, { type: 'starNo', by: no });
      L.star = null; pause(G, 'starNo', no); return;
    }
    if (vs.every(id => s.votes[id] === true)) starAccepted(G);
  }
  function starAccepted(G) {
    const L = G.L, s = L.star;
    s.stage = isExt(G) ? 'pick' : 'show';
    G.phase = 'reveal';
    const p = pl(G, s.by); if (p) p.st.starsOk++;
    emit(G, { type: 'starYes' });
    // i bot scelgono e mostrano subito
    for (const id of withCards(G)) {
      const q = pl(G, id); if (!q.bot) continue;
      const card = botStarCard(G, id);
      if (card != null) { s.picks[id] = 'bot'; s.shows[id] = card; }
    }
    starProgress(G);
  }
  function starProgress(G) {
    const L = G.L, s = L.star; if (!s) return;
    const need = withCards(G);
    if (!need.length) { L.star = null; checkDone(G); return; }
    if (s.stage === 'pick' && need.every(id => s.picks[id])) { s.stage = 'show'; emit(G, { type: 'starShow' }); }
    if (s.stage === 'show' && need.every(id => s.shows[id] != null)) {
      const shown = [];
      for (const id of need) {
        const card = s.shows[id], c = colorOf(card), v = valOf(card);
        L.acts.push({ by: id, k: 'star', c, v, t: G.now });
        L.cnt[id]--; shown.push({ by: id, card });
      }
      L.revealed = (L.revealed || []).concat(shown);
      G.stars--; G.ts.starsUsed++;
      L.star = null;
      log(G, `⭐ Stella ninja! ${shown.map(x => `${nm(G, x.by)} ${fmtCard(G, colorOf(x.card), valOf(x.card))}`).join(' · ')}`, 'sys');
      emit(G, { type: 'starDone', shown });
      if (!checkDone(G)) pause(G, 'star', null);
    }
  }

  /* ---------------- azioni ---------------- */
  function applyAction(G, actorId, a) { try { if (a && a.now) G.now = a.now; else G.now = Date.now(); return applyInner(G, actorId, a); } catch (e) { return err('Errore: ' + (e && e.message || e)); } }
  function applyInner(G, actorId, a) {
    if (!a || !a.type) return err('Azione non valida');
    const L = G.L, p = pl(G, actorId);
    const me = p && p.status === 'in' && L && L.ids.includes(p.id);
    const sameDeal = () => a.deal == null || (L && a.deal === L.deal);
    switch (a.type) {
      case 'botHands': {
        if (G.phase !== 'deal' || !sameDeal()) return err('Niente da fare');
        for (const id in (a.hands || {})) {
          const q = pl(G, id); if (!q || !q.bot || !L.ids.includes(id)) continue;
          const h = a.hands[id].slice().sort((x, y) => x - y);
          G.bh[id] = { d: L.deal, h: scramble(h, id + ':' + L.deal) };
          L.opened[id] = true;
        }
        if (L.ids.every(id => L.opened[id] || pl(G, id).status !== 'in')) toSync(G);
        return { ok: true };
      }
      case 'opened': {
        if (G.phase !== 'deal' || !me || !sameDeal()) return err('Niente da fare');
        L.opened[actorId] = true;
        if (L.ids.every(id => L.opened[id] || pl(G, id).status !== 'in')) toSync(G);
        return { ok: true };
      }
      case 'ready': {
        if (!['sync', 'pause'].includes(G.phase) || !me || !sameDeal()) return err('Niente da fare');
        if (a.v === false) delete L.ready[actorId]; else L.ready[actorId] = true;
        emit(G, { type: 'ready', by: actorId, v: a.v !== false });
        maybeGo(G);
        return { ok: true };
      }
      case 'stop': {
        if (G.phase !== 'play' || !me || !sameDeal()) return err('Niente da fermare');
        log(G, `✋ ${p.name} dice stop: concentrazione!`, 'sys', { by: actorId });
        pause(G, 'stop', actorId);
        return { ok: true };
      }
      case 'play': {
        if (!me || !sameDeal()) return err('Non sei in questo livello');
        if (G.phase !== 'play') return err('Aspetta: non si gioca adesso');
        if (G.now < L.goAt - 400) return err('Aspetta il via!');
        if (!(L.cnt[actorId] > 0)) return err('Non hai più carte');
        const c = a.c === 'r' && isExt(G) ? 'r' : 'w';
        let v = null;
        if (p.bot) { const h = botHand(G, actorId); const nx = h && nextOf(h, c, removedBy(L, actorId)[c]); if (nx == null) return err('Niente da calare'); v = L.blind[c] ? null : valOf(nx); }
        else if (!L.blind[c]) { v = Math.round(+a.v); const max = isExt(G) ? 50 : 100; if (!(v >= 1 && v <= max)) return err('Carta non valida'); }
        if (v != null && (v === L.top[c] || claimed(L, actorId, c).has(v))) return err('Questa carta è già sul tavolo');
        playCard(G, actorId, c, v);
        return { ok: true };
      }
      case 'disc': {
        if (!me || !sameDeal()) return err('Niente da fare');
        if (!['play', 'pause', 'star', 'reveal', 'sync'].includes(G.phase)) return err('Niente da scartare');
        const c = a.c === 'r' && isExt(G) ? 'r' : 'w';
        const top = L.piles[c].find(e => e.ev === a.ev);
        if (!top || top.v == null) return err('Evento sconosciuto');
        let vals = (Array.isArray(a.vals) ? a.vals : []).map(x => Math.round(+x)).filter(x => c === 'w' ? x >= 1 && x < top.v : x > top.v && x <= 50);
        const cl = claimed(L, actorId, c);
        vals = [...new Set(vals)].filter(x => !cl.has(x)).slice(0, L.cnt[actorId] || 0);
        if (!vals.length) return { ok: true };
        discardCards(G, actorId, c, vals.sort((x, y) => c === 'w' ? x - y : y - x), a.ev, false);
        errorOn(G, a.ev, vals.length);
        if (G.phase === 'reveal') starProgress(G);
        else if (G.phase === 'star') starVotesCheck(G);
        if (G.phase !== 'check' && !checkDone(G) && ['sync', 'pause'].includes(G.phase)) maybeGo(G);
        return { ok: true };
      }
      case 'star': {
        if (!me || !sameDeal()) return err('Non sei in questo livello');
        if (!['sync', 'play', 'pause'].includes(G.phase)) return err('Non adesso');
        if (G.stars < 1) return err('Non avete stelle ninja');
        if (!withCards(G).length) return err('Non ci sono più carte');
        starStart(G, actorId);
        return { ok: true };
      }
      case 'starVote': {
        if (G.phase !== 'star' || !L.star || !me) return err('Niente da votare');
        if (L.star.votes[actorId] !== undefined) return { ok: true };
        L.star.votes[actorId] = !!a.yes;
        emit(G, { type: 'starVote', by: actorId, yes: !!a.yes });
        starVotesCheck(G);
        return { ok: true };
      }
      case 'pick': {
        if (G.phase !== 'reveal' || !L.star || L.star.stage !== 'pick' || !me || !(L.cnt[actorId] > 0)) return err('Niente da scegliere');
        if (typeof a.h !== 'string' || a.h.length < 16) return err('Scelta non valida');
        L.star.picks[actorId] = a.h;
        starProgress(G);
        return { ok: true };
      }
      case 'show': {
        if (G.phase !== 'reveal' || !L.star || L.star.stage !== 'show' || !me || !(L.cnt[actorId] > 0)) return err('Niente da mostrare');
        if (L.star.shows[actorId] != null) return { ok: true };
        let card = Math.round(+a.card);
        const okCard = isExt(G) ? ((card >= 1 && card <= 50) || (card >= 101 && card <= 150)) : (card >= 1 && card <= 100);
        if (!okCard) return err('Carta non valida');
        if (claimed(L, actorId, colorOf(card)).has(valOf(card))) return err('Carta già usata');
        if (isExt(G) && a.hashOk === false) { log(G, `⚠️ La carta mostrata da ${p.name} non corrisponde a quella scelta.`, 'warn'); }
        L.star.shows[actorId] = card;
        starProgress(G);
        return { ok: true };
      }
      case 'bot': {
        // di sistema: un bot cala (o propone una stella) quando è il suo momento
        const b = pl(G, a.id); if (!b || !b.bot || !inLevel(G, a.id)) return err('Bot non in gioco');
        const plan = botPlan(G, a.id);
        if (!plan || plan.at > G.now + 30) return err('Non è ancora il momento');
        if (plan.kind === 'star') { L.starAsked[a.id] = (L.starAsked[a.id] || 0) + 1; if (G.stars < 1 || !['play', 'sync', 'pause'].includes(G.phase)) return err('Niente stella'); starStart(G, a.id); return { ok: true }; }
        return applyInner(G, a.id, { type: 'play', c: plan.c, deal: L.deal });
      }
      case 'hold': {
        // di sistema: manca qualcuno che ha ancora carte → tutti fermi (poi di nuovo pronti)
        if (G.phase !== 'play' || !L) return err('Niente da fermare');
        log(G, `⏸️ Pausa: ${nm(G, a.who)} ha perso la connessione.`, 'sys');
        pause(G, 'away', a.who);
        return { ok: true };
      }
      case 'checked': return checked(G, a);
      case 'next': {
        if (G.phase !== 'over') return err('Niente da fare');
        startGame(G); return { ok: true };
      }
      default: return err('Azione sconosciuta');
    }
  }

  /* ---------------- fine livello: il controllo con le mani vere ---------------- */
  function countMistakes(seq, c) {
    // seq: valori nell'ordine in cui sono stati calati. Errore = carta calata quando ne restava una "prima" (più bassa per le bianche).
    const key = v => c === 'w' ? v : 51 - v;
    let top = -Infinity; const placed = [], skipped = [];
    seq.forEach((x, i) => { if (x.v == null) return; if (key(x.v) > top) { top = key(x.v); placed.push(i); } else skipped.push(i); });
    const mist = placed.filter(i => seq.slice(i + 1).some(y => y.v != null && key(y.v) < key(seq[i].v)));
    return { mist, skipped };
  }
  function checked(G, a) {
    if (G.phase !== 'check' || !G.L || (a.deal != null && a.deal !== G.L.deal)) return err('Niente da fare');
    const L = G.L, hands = a.hands || {}, why = (a.why || []).slice(0, 6);
    // ricostruisco il valore di ogni carta tolta (sempre dall'estremo)
    const used = {};
    const left = {};
    for (const id of L.ids) { const h = hands[id]; if (!h) continue; left[id] = { w: remainingOf(h, 'w', 0), r: remainingOf(h, 'r', 0) }; }
    let mismatch = {};
    for (const act of L.acts) {
      const lf = left[act.by]; if (!lf) continue;
      if (act.k === 'gone') { continue; }
      const arr = lf[act.c]; if (!arr.length) { mismatch[act.by] = 1; continue; }
      const card = act.c === 'w' ? arr.shift() : arr.pop();
      act.real = valOf(card);
      if (act.v != null && act.v !== act.real) mismatch[act.by] = 1;
    }
    for (const id in mismatch) why.push(`${nm(G, id)} ha calato o mostrato una carta diversa da quelle che aveva`);
    // carte rimaste in mano a chi le ha tolte prima (scartate da sé senza motivo, o nascoste): controllo che non ci fosse niente di più basso in giro
    L.hands = {}; for (const id of L.ids) L.hands[id] = hands[id] ? hands[id].slice().sort((x, y) => x - y) : null;
    // pile coperte: valori veri ed errori
    let blindMist = 0, blindSkipped = 0;
    const res = { mist: {}, skipped: {} };
    for (const c of ['w', 'r']) {
      L.piles[c].forEach(e => { if (e.v == null) { const act = L.acts[e.ai]; e.real = act && act.real != null ? act.real : null; } });
      if (!L.blind[c]) continue;
      const seq = L.piles[c].map(e => ({ v: e.real, by: e.by }));
      const { mist, skipped } = countMistakes(seq, c);
      res.mist[c] = mist.map(i => L.piles[c][i].ev); res.skipped[c] = skipped.map(i => L.piles[c][i].ev);
      blindMist += mist.length; blindSkipped += skipped.length;
      mist.forEach(i => { const q = pl(G, L.piles[c][i].by); if (q) q.st.early++; });
      skipped.forEach(i => { const q = pl(G, L.piles[c][i].by); if (q) q.st.late++; });
    }
    L.blindRes = res;
    // carte giuste (per le statistiche): calate senza errori
    for (const c of ['w', 'r']) {
      const seq = L.piles[c];
      const bad = new Set([...(res.mist[c] || []), ...(res.skipped[c] || [])].concat(Object.keys(L.errs).map(Number)));
      seq.forEach(e => { if (!bad.has(e.ev) && (e.v != null || e.real != null)) { const q = pl(G, e.by); if (q) q.st.cards++; } });
    }
    if (blindMist + blindSkipped > 0) {
      const n = G.options.lifeLoss === 'carta' ? blindSkipped + blindMist : blindMist;
      G.ts.errors += blindMist;
      log(G, `🙈 Carte girate: ${blindMist} ${blindMist === 1 ? 'errore' : 'errori'}${n ? ` → −${n} ${n === 1 ? 'vita' : 'vite'}` : ''}.`, 'warn');
      if (n) loseLives(G, Math.min(n, G.lives), 'blind');
    } else if (L.blind.w || L.blind.r) log(G, '✨ Carte girate: tutto in ordine!', 'win');
    L.check = { ok: !!a.ok && !why.length, why, complete: !!a.complete };
    // risultato del livello
    const lostNow = L.end === 'lost' || G.lives <= 0;

   RETE SENZA ACCOUNT: server pubblico MQTT (messaggi "conservati")
   ========================================================= */
const BROKER = PARAMS.get('broker') || 'wss://broker.emqx.io:8084/mqtt';
const TP = 'tavolata-lamente/v1/';
let lastTrouble = Date.now();
const Net = {
  client: null, status: '', cache: new Map(), L: new Set(), subs: new Set(), ready: null, nt: null,
  setStatus(s) { if (s !== 'ok') lastTrouble = Date.now(); this.status = s; $$('.netst').forEach(el => el.textContent = netText()); },
  notify() { clearTimeout(this.nt); this.nt = setTimeout(() => this.L.forEach(f => f()), 0); },
  connect() {
    if (this.client && this.client.connected) return Promise.resolve(true);
    if (this.ready) return this.ready;
    this.ready = new Promise(res => {
      let done = false; const fin = v => { if (!done) { done = true; if (!v) this.ready = null; res(v) } };
      let c; try { c = mqtt.connect(BROKER, { clientId: 'lm_' + rid(12), keepalive: 30, reconnectPeriod: 2500, connectTimeout: 10000, clean: true, resubscribe: true }); } catch (e) { return fin(false) }
      this.client = c;
      c.on('connect', () => { this.setStatus('ok'); this.subs.forEach(t => c.subscribe(t, { qos: 1 })); fin(true); });
      c.on('reconnect', () => this.setStatus('offline')); c.on('offline', () => this.setStatus('offline')); c.on('error', () => { });
      c.on('message', (topic, payload) => {
        if (!topic.startsWith(TP)) return; const p = topic.slice(TP.length); let d = null;
        if (payload && payload.length) { try { d = JSON.parse(typeof payload === 'string' ? payload : payload.toString()) } catch (e) { return } }
        const old = this.cache.get(p);
        if (d && old && typeof d.v === 'number' && typeof old.v === 'number' && d.v < old.v) return;
        if (d) this.cache.set(p, d); else this.cache.delete(p);
        if (d && d.id && p.includes('/pres/')) onPres(d);
        if (d && d.rk) keepDoc(p, d);
        this.notify();
      });
      setTimeout(() => { if (!done) { try { c.end(true) } catch (e) { } this.client = null; fin(false) } }, 14000);
    });
    return this.ready;
  },
  sub(code) { [TP + 'games/' + code, TP + 'games/' + code + '/#'].forEach(t => { if (!this.subs.has(t)) { this.subs.add(t); if (this.client) this.client.subscribe(t, { qos: 1 }); } }); },
  unsub(code) {
    [TP + 'games/' + code, TP + 'games/' + code + '/#'].forEach(t => { this.subs.delete(t); try { this.client && this.client.unsubscribe(t) } catch (e) { } });
    [...this.cache.keys()].forEach(k => { if (k === 'games/' + code || k.startsWith('games/' + code + '/')) this.cache.delete(k) });
  },
  kv() {
    return {
      get: p => this.cache.get(p) || null, keys: () => [...this.cache.keys()], listen: f => { this.L.add(f); return () => this.L.delete(f) },
      write: (op, p, d) => {
        const v = op === 'set' ? d : null;
        if (v) this.cache.set(p, v); else this.cache.delete(p); if (v && v.rk) keepDoc(p, v); this.notify();
        return new Promise(res => { try { this.client.publish(TP + p, v ? JSON.stringify(v) : '', { qos: 1, retain: true }, () => res()); } catch (e) { res() } });
      }
    };
  },
  waitDoc(p, ms) { return new Promise(res => { if (this.cache.get(p)) return res(true); const f = () => { if (this.cache.get(p)) { this.L.delete(f); res(true) } }; this.L.add(f); setTimeout(() => { this.L.delete(f); res(!!this.cache.get(p)) }, ms); }); }
};

/* scrive il nuovo stato (solo la regia, o chi ha creato la partita nella lobby) */
function act(fn) {
  if (!S) return false;

/* =========================================================
   MOSSE: le mando alla regia (o le applico io se sono la regia)
   ========================================================= */
let mySeq = 0;
function nextSeq() { mySeq = Math.max(Date.now(), mySeq + 1, +(ls.get('lm-seq') || 0) + 1); ls.set('lm-seq', mySeq); return mySeq; }
function send(a) {

  const cur = reqDocs[myId] && reqDocs[myId].acts ? reqDocs[myId].acts.slice() : [];
  const done = (S.reqDone && S.reqDone[myId]) || 0;

  const doc = { id: myId, acts, t: Date.now() };

  }

}
const SYSTEM = ['botHands', 'checked', 'bot', 'hold'];

    }

    const back = p.repl && isPresent(p.repl) ? G.players.find(q => q.id === p.repl) : null;

function startMatch() {
  const all = lobbyPlayers().slice(0, MAXP).map(p => ({ id: p.id, name: p.name || 'Giocatore', bot: !!p.bot, level: p.level }));

/* =========================================================
   REGIA (bot, disconnessioni, mescolata dei bot, controllo)
   La svolge un solo dispositivo: chi ha creato la partita,
   oppure, se è offline o in secondo piano, il primo giocatore collegato.
   ========================================================= */
const isBotId = id => { const G = S && S.game; const p = G && G.players.find(p => p.id === id); return !!(p && p.bot); };
function isPresent(id) { return id === myId || isBotId(id) || (lastSeen[id] && Date.now() - lastSeen[id] < 16000); }
function isVisible(id) { return id === myId ? document.visibilityState !== 'hidden' : lastVis[id] !== false; }
function dutyId() {
  if (!S) return null;
  if (!S.game) return S.host;
  const humans = S.game.players.filter(p => !p.bot && p.status === 'in').map(p => p.id);
  const order = [S.host, ...humans.filter(id => id !== S.host)];
  for (const id of order) if ((humans.includes(id) || id === S.host) && isPresent(id) && isVisible(id)) return id;
  for (const id of order) if ((humans.includes(id) || id === S.host) && isPresent(id)) return id;
  return S.host;
}
const rkOf = G => S.code + ':' + (S.started || 0) + ':' + G.L.deal;
function needed(G, pid) {
  if (E.needs(G, pid)) return true;
  const L = G.L; if (!L) return false;
  if (G.phase === 'check') { const p = G.players.find(p => p.id === pid); return L.ids.includes(pid) && !!p && p.status === 'in' && !p.bot && !cdoc('end', pid, rkOf(G)); }

}
function dutyTick() {
  if (!S || view !== 'game' || !S.game) return;
  checkFalseAlarm();
  cryptoTick();
  autoActions();
  if (dutyId() !== myId) { clearTimeout(botTimer); botKey = ''; return; }
  processReqs();
  if (S.status !== 'playing') return;
  scheduleBots();
  const G = S.game, now = Date.now(), o = G.options;
  const wait = (o.disconnectWait || 60) * 1000;
  const judge = now - openedAt > 15000 && now - visibleSince > 8000;
  for (const p of G.players) {
    if (p.bot || p.status !== 'in' || p.id === myId) continue;
    const here = isPresent(p.id), away = S.away && S.away[p.id];
    if (!here && !away && judge && needed(G, p.id)) {
      act(N => { N.away = N.away || {}; N.disc = N.disc || {}; N.away[p.id] = { since: now, until: now + wait }; N.disc[p.id] = (N.disc[p.id] || 0) + 1; sysLog(N, `🔌 ${p.name} ha perso la connessione: aspettiamo ${fmtTime(wait)}.`); });
      if (S.game.phase === 'play') handleReq(myId, null, { type: 'hold', who: p.id });
      return;
    }
    if (here && away) return act(N => { delete N.away[p.id]; sysLog(N, `✅ ${p.name} è di nuovo qui!`); });
    if (away && now > away.until) return act(N => { delete N.away[p.id]; E.removePlayer(N.game, p.id, T()); afterAction(N); });
  }
  if (G.phase === 'over' && S.rAt && now - S.rAt > 25000) handleReq(myId, null, { type: 'next' });
}
/* i bot calano quando "sentono" che è il momento */
function scheduleBots() {
  if (!S || S.status !== 'playing' || !S.game || dutyId() !== myId) { clearTimeout(botTimer); botKey = ''; return; }
  const nx = E.botNext(S.game);
  if (!nx) { clearTimeout(botTimer); botKey = ''; return; }
  const key = S.v + ':' + nx.id + ':' + Math.round(nx.at);
  if (key === botKey) return; botKey = key;
  clearTimeout(botTimer);
  botTimer = setTimeout(() => {
    botKey = '';
    if (!S || dutyId() !== myId || S.status !== 'playing') return;
    const e = handleReq(myId, null, { type: 'bot', id: nx.id });
    if (e) setTimeout(scheduleBots, 250);
  }, Math.max(0, nx.at - T()));
}
let falseSent = 0;
function checkFalseAlarm() {
  const a = S && S.away && S.away[myId];
  if (!a || falseSent === a.since) return;
  if (Net.status !== 'ok' && MODE === 'p2p') return;
  if (document.visibilityState === 'hidden') return;
  falseSent = a.since;
  if (lastTrouble < a.since - 4000) send({ type: 'here' });
}

/* =========================================================
   MESCOLATA SEGRETA (ogni dispositivo fa la sua parte da solo)
   ========================================================= */
function getX(rk) {
  let all = {}; try { all = JSON.parse(ls.get('lm-xs') || '{}') } catch (e) { }
  if (!all[rk]) { all[rk] = C.enc(C.rand256()); const ks = Object.keys(all); if (ks.length > 60) ks.slice(0, ks.length - 60).forEach(k => delete all[k]); ls.set('lm-xs', JSON.stringify(all)); }
  return C.dec(all[rk]);
}
function hasX(rk) { try { return !!JSON.parse(ls.get('lm-xs') || '{}')[rk] } catch (e) { return false } }
function pub(kind, id, doc) { keepDoc(`games/${code}/${kind}/${id}`, doc); cryptoSoon(); return DB.doc(`games/${code}/${kind}/${id}`).set(doc).catch(() => { }); }
function keyValid(rk, d) {
  if (!d) return false; const k = rk + '|' + d.h + '|' + d.c;
  if (!keyOk.has(k)) { let ok = false; try { ok = C.schnorrVerify(C.dec(d.h), { c: C.dec(d.c), s: C.dec(d.s) }, rk); } catch (e) { } keyOk.set(k, ok); }
  return keyOk.get(k);
}
function job(k, fn) { if (jobs[k]) return; jobs[k] = 1; Promise.resolve().then(fn).catch(e => { console.warn('la mente', k, e); setTimeout(() => delete jobs[k], 3000); }); }
function loadHand(rk) { if (myHands[rk]) return myHands[rk]; try { const c = JSON.parse(ls.get('lm-hand:' + rk) || 'null'); if (c) myHands[rk] = c; return c; } catch (e) { return null } }
function botX(rk, id) { const b = S && S.bk; if (!b || b.rk !== rk || !b.x || !b.x[id]) return null; try { return C.dec(E.unscramble(b.x[id], id + rk)[0]); } catch (e) { return null; } }
function cryptoTick() {
  if (!S || S.status === 'lobby' || !S.game || !S.game.L || view !== 'game') return;
  const G = S.game, L = G.L, rk = rkOf(G), N = L.ids.length, k = L.k, ids = E.deckIds(G.options.variant);
  const me = L.ids.indexOf(myId);
  const meP = G.players.find(p => p.id === myId), meIn = me >= 0 && !!meP && meP.status === 'in';
  const regia = dutyId() === myId && S.status === 'playing';
  const final = cdoc('mix', String(N - 1), rk);
  const posOf = j => Array.from({ length: k }, (_, i) => j * k + i);
  const bots = L.ids.filter(isBotId);
  if (G.phase === 'deal') {
    if (regia && bots.length) {
      if (!S.bk || S.bk.rk !== rk) { act(N2 => { const x = {}; bots.forEach(id => x[id] = E.scramble([C.enc(C.rand256())], id + rk)); N2.bk = { rk, x }; }); return; }
      bots.forEach(id => { if (!cdoc('key', id, rk) && botX(rk, id) != null) job('key:' + rk + ':' + id, () => { const x = botX(rk, id), h = C.gpow(x), pr = C.schnorrProve(x, h, rk); return pub('key', id, { rk, h: C.enc(h), c: C.enc(pr.c), s: C.enc(pr.s) }); }); });
    }
    if (meIn && !cdoc('key', myId, rk)) job('key:' + rk, () => { const x = getX(rk), h = C.gpow(x), pr = C.schnorrProve(x, h, rk); return pub('key', myId, { rk, h: C.enc(h), c: C.enc(pr.c), s: C.enc(pr.s) }); });
    const keys = L.ids.map(id => cdoc('key', id, rk));
    if (keys.every(d => keyValid(rk, d))) {
      for (let s = 0; s < N; s++) {
        const id = L.ids[s];
        if (!((id === myId && meIn) || (regia && isBotId(id)))) continue;
        if (cdoc('mix', String(s), rk)) continue;
        const prev = s === 0 ? true : cdoc('mix', String(s - 1), rk);
        if (!prev) continue;
        job('mix:' + rk + ':' + s, async () => {
          const out = await runOp('mix', { ids, hs: keys.map(d => d.h), prev: s > 0 ? prev.d : null });
          if (!S || !S.game || !S.game.L || rkOf(S.game) !== rk) return;

      }
    }
    if (final) {
      const doShares = (id, x) => job('sh:' + rk + ':' + id, async () => {
        const j = L.ids.indexOf(id), pos = []; for (let q = 0; q < N; q++) if (q !== j) pos.push(...posOf(q));
        const d = await runOp('shares', { fin: final.d, x: C.enc(x), pos });

      if (regia) bots.forEach(id => { if (!cdoc('sh', id, rk) && botX(rk, id) != null) doShares(id, botX(rk, id)); });
      // apro la mia mano

        const others = L.ids.filter(id => id !== myId).map(id => cdoc('sh', id, rk));
        if (others.every(Boolean)) job('open:' + rk, async () => {
          const items = posOf(me).map(p => ({ ct: final.d[p], parts: others.map(o => o.d[p]) }));
          const hand = await runOp('open', { items, x: C.enc(getX(rk)), ids });
          if (hand.some(x => x == null)) { toast('Le tue carte non sono leggibili: la mescolata non è andata bene', 'warn'); return; }
          hand.sort((a, b) => a - b);
          myHands[rk] = hand; ls.set('lm-hand:' + rk, JSON.stringify(hand));

  }
  // fine livello: ognuno mostra la sua chiave

  // controllo (tutti lo fanno per conto loro; la regia lo scrive)

    const ready = final && live.every(id => cdoc('end', id, rk)) && bots.every(id => botX(rk, id) != null);
    if (ready) job('ver:' + rk, async () => {
      const mix = []; for (let s = 0; s < N; s++) { const d = cdoc('mix', String(s), rk); mix.push(d ? d.d : null); }
      const xs = L.ids.map(id => isBotId(id) ? C.enc(botX(rk, id)) : ((cdoc('end', id, rk) || {}).x || null));
      const v = await runOp('verify', { ids, N, k, names: L.ids.map(id => nameOf(id)), keys: L.ids.map(id => (cdoc('key', id, rk) || {}).h || C.enc(1n)), xs, mix, shares: L.ids.map(id => (cdoc('sh', id, rk) || {}).d || null) });

}
function sendChecked(rk) {

/* =========================================================
   LE MIE CARTE (calcolate dallo stato: si tolgono sempre dall'estremo)
   ========================================================= */
function myState() {
  if (!S || !S.game || !S.game.L) return null;
  const G = S.game, L = G.L;
  if (!L.ids.includes(myId)) return null;
  const rk = rkOf(G), hand = loadHand(rk); if (!hand) return null;
  const rm = E.removedBy(L, myId);
  const pend = { w: 0, r: 0 }, flight = new Set();
  outbox.forEach(o => { if (o.type === 'play') pend[o.c]++; else if (o.type === 'disc') o.vals.forEach(x => flight.add(x)); });
  const left = {}, obs = {}, next = {};
  for (const c of E.colorsOf(G)) {
    const all = E.remainingOf(hand, c, rm[c] + pend[c]).filter(x => !flight.has(x));
    const isObs = x => !L.blind[c] && (c === 'w' ? valOf(x) < L.top.w : valOf(x) > L.top.r);
    left[c] = all; obs[c] = all.filter(isObs);
    const good = all.filter(x => !isObs(x));
    next[c] = good.length ? (c === 'w' ? good[0] : good[good.length - 1]) : null;
  }
  const gone = L.cnt[myId] === 0 && (rm.any > 0);

  return `<h2>Regole di questa partita</h2><ul class="rules-list">
    <li><b>Partita:</b> ${o.mode === 'maratona' ? `maratona, livelli senza fine (fino al ${s.levels})` : `classica, ${s.levels} livelli`}${G.target > 1 ? ` · serie di ${G.target} partite (si sommano i livelli superati)` : ''}${o.startLevel > 1 ? ` · si parte dal livello ${Math.min(o.startLevel, s.levels)}` : ''}</li>
    <li><b>Variante:</b> ${o.variant === 'extreme' ? 'Extreme: bianche ▲ crescenti a sinistra, rosse ▼ decrescenti a destra; carte coperte: bianche ai livelli 3, 7, 11, rosse ai livelli 4, 8, 12, tutte ai livelli 6 e 10' : 'normale, un solo mucchio da 1 a 100'}</li>
    ${o.variant === 'extreme' ? '' : `<li><b>Carte coperte:</b> ${o.blind === 'sempre' ? 'sempre' : o.blind === 'dopo' && o.mode === 'classica' ? 'dopo la vittoria si ricomincia dal livello 1 a carte coperte' : 'mai'}</li>`}
    <li><b>All'inizio:</b> ${s.lives} ${s.lives === 1 ? 'vita' : 'vite'} e ${s.stars} ${s.stars === 1 ? 'stella' : 'stelle'} ninja · <b>Premi:</b> ${o.diff === 'esperto' ? 'nessuno' : '⭐ dopo i livelli 2, 5, 8 · ❤️ dopo i livelli 3, 6, 9' + (o.mode === 'maratona' ? ' (e poi ogni 3 livelli)' : '')} · massimo 5 vite e 3 stelle</li>
    <li><b>Errore:</b> ${o.lifeLoss === 'carta' ? 'una vita per ogni carta saltata' : 'una vita per errore, anche se le carte saltate sono tante'}; le carte più basse vengono scartate da sole.</li>
    <li><b>Stella ninja:</b> ${o.starVote === 'uno' ? 'basta chi la propone' : 'serve l\'accordo di tutti'}. <b>Dopo un errore o una stella:</b> ${o.restart === 'auto' ? 'si riparte da soli dopo 3-2-1' : 'tutti di nuovo ✋ Pronto'}.</li>
    <li><b>Comandi:</b> trascina la carta evidenziata sul mucchio, oppure toccala e poi tocca il mucchio, oppure usa il pulsante grande. Al computer: barra spaziatrice${o.variant === 'extreme' ? ', ← per la bianca e → per la rossa' : ''}. ✋ Stop ferma tutti.</li>
    <li><b>Silenzio:</b> durante il livello in chat solo emoji. E niente segnali in chiamata! 🤫</li>
    <li><b>Attesa per chi si disconnette:</b> ${fmtTime(o.disconnectWait * 1000)}, poi le sue carte vengono messe da parte e dal livello dopo gioca un bot al suo posto.</li>
  </ul><div class="mbtns"><button class="btn primary" data-close-info>Chiudi</button></div>`;
}

/* ---------------- diario e chat ---------------- */
function emojiOnly() { const G = G_(); return !!G && S.status === 'playing' && LEVEL_PHASES.includes(G.phase); }
function renderChatForm() {
  const f = $('#chatf'); if (!f) return;
  const eo = emojiOnly();
  $('#chatin').hidden = eo; $('#chatgo').hidden = eo;
  const n = $('#emonote'); const t = eo ? 'Durante il livello solo emoji: niente indizi sulle carte! 🤫' : '';
  if (n.textContent !== t) n.textContent = t;
}
function renderFeed() {
  const f = $('#feed'); if (!f || !S || !S.game) return;
  const log = S.game.log.slice(-120).map(l => ({ t: l.t || 0, html: `<div class="msg ${l.kind || ''}">${esc(l.msg)}</div>` }));
  const ch = chat.map(m => ({ t: m.t, html: `<div class="msg chat ${m.e ? 'emo' : ''}"><b style="color:${/^#[0-9a-f]{3,8}$/i.test(m.c) ? m.c : '#ccc'};font-size:.88rem">${esc(m.by)}:</b> ${esc(m.x)}</div>` }));
  const all = log.concat(ch).sort((a, b) => a.t - b.t);
  const k = all.length + ':' + (all.length ? all[all.length - 1].t : 0) + ':' + S.game.logSeq + ':' + chat.length;
  if (k === feedKey) return; feedKey = k;
  const near = f.scrollHeight - f.scrollTop - f.clientHeight < 80;
  f.innerHTML = all.map(x => x.html).join('') || '<div class="small mut">Nessun messaggio.</div>';
  if (near || !f._init) { f.scrollTop = f.scrollHeight; f._init = 1; }
}
function onChat() {
  if (!S || view !== 'game' || S.status === 'lobby') return;
  renderFeed();
  const last = chat[chat.length - 1], narrow = true /* chat a scomparsa su ogni schermo */, seen = !narrow || sideOpen;
  if (last && last.t > chatSeenT) {
    if (!seen && last.id !== myId && !last.e) toast(`💬 ${last.by}: ${last.x}`);
    if (seen) chatSeenT = last.t;
  }
  updBadge();
  if (S.game) renderOthers(S.game);
}
function updBadge() { const b = $('#chatBadge'); if (!b) return; const unread = chat.filter(m => m.t > chatSeenT && m.id !== myId && !m.e).length; b.hidden = !unread; b.textContent = unread; }
function sendChat(x, emo) {
  if (!x || !code) return;
  if (emojiOnly() && !emo) return toast('Durante il livello solo emoji', 'warn');
  const i = S.game ? S.game.players.findIndex(p => p.id === myId) : -1; const p = i >= 0 ? S.game.players[i] : null;
  DB.collection(`games/${code}/chat`).add({ t: Date.now(), id: myId, by: p ? p.name : (myName || 'Spettatore'), c: PCOL[(i >= 0 ? i : 2) % PCOL.length], x: x.slice(0, 200), e: emo ? 1 : 0 }).then(pruneChat).catch(writeErr);
  chatSeenT = Date.now();
  if (emo) toast(x);
}
function pruneChat() {
  if (MODE !== 'p2p' || !code) return;
  const pre = `games/${code}/chat/`; const ks = [...Net.cache.keys()].filter(k => k.startsWith(pre));
  if (ks.length > 60) ks.map(k => [k, (Net.cache.get(k) || {}).t || 0]).sort((a, b) => a[1] - b[1]).slice(0, ks.length - 60).forEach(([k]) => DB.doc(k).delete().catch(() => { }));
}

/* ---------------- barra "giocatore disconnesso" e orologi ---------------- */
function renderAway() {
  const bar = $('#awaybar'); if (!bar) return;
  const list = Object.entries((S && S.status === 'playing' && S.away) || {});
  if (!list.length) { bar.hidden = true; bar.innerHTML = ''; bar._k = ''; return; }
  const k = JSON.stringify(list); if (bar._k === k) return; bar._k = k;
  bar.hidden = false;
  bar.innerHTML = list.map(([id, a]) => `<div class="awayrow">⏳ <b>${esc(nameOf(id))}</b> ${id === myId ? '(tu): risulta che hai perso la connessione' : 'ha perso la connessione'}. Aspettiamo ancora <b class="cd" data-until="${a.until}">${fmtTime(a.until - Date.now())}</b>
    <button class="btn sm" data-more="${esc(id)}">+1 minuto</button></div>`).join('');
  $$('[data-more]', bar).forEach(b => b.onclick = () => send({ type: 'more', pid: b.dataset.more }));
}
let wasCounting = false;
function tickUI() {
  if (!S || view !== 'game' || !S.game || S.status === 'lobby') return;
  $$('#awaybar .cd').forEach(el => el.textContent = fmtTime(+el.dataset.until - Date.now()));
  $$('.netst').forEach(el => el.textContent = netText());
  $$('[data-next]').forEach(el => el.textContent = '(' + Math.max(0, Math.ceil((+el.dataset.next - Date.now()) / 1000)) + ')');
  const G = S.game;
  const c = counting();
  if (c !== wasCounting) { wasCounting = c; if (!c && G.phase === 'play' && inLevel()) buzz(30); renderHand(G); renderStatus(G); renderBar(G); }
  renderOverlay(G); renderOthers(G);
}

function bindGlobal() {
  document.addEventListener('click', e => {
    if (e.target.closest('[data-close-info]')) hideInfo();
    if (e.target.id === 'info') hideInfo();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hideInfo(); });
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (/^[A-Z0-9]{5}$/.test(h) && h !== code && h !== opening && myName) openGame(h, true); });
}
bindGlobal();
init();

</script>
<script>
/* 💬 Chat: il pulsante apre e chiude il pannello su ogni schermo */
(function () {
  var SEL = '#chatToggle,#bSide,#chatBtn,#bSideX';
  var wide = function () { return innerWidth > CHAT_BP; }, was = wide();
  function aperta() { try { return !!sideOpen; } catch (e) { return true; } }
  function sync() {
    var open = aperta();
    var L = document.querySelector('.layout'); if (L) L.classList.toggle('chat-chiusa', !open);
    var x = document.getElementById('bSideX'); if (x) x.hidden = !open;
    document.querySelectorAll('#chatToggle,#bSide,#chatBtn').forEach(function (b) {
      b.setAttribute('aria-pressed', open ? 'true' : 'false');
      b.title = open ? 'Nascondi la chat' : 'Mostra la chat';
    });
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest(SEL)) return;
    if (wide()) { try { localStorage.setItem('tavolata-chat', aperta() ? 'aperta' : 'chiusa'); } catch (er) {} }
    sync();
    if (wide()) dispatchEvent(new Event('resize'));
  });
  addEventListener('resize', function () {
    var w = wide(); if (w === was) return; was = w;
    try { sideOpen = chatAperta(); } catch (e) { return; }
    var s = document.getElementById('side'); if (s) s.classList.toggle('open', sideOpen);
    sync();
  });
  new MutationObserver(function () { if (document.getElementById('side')) sync(); }).observe(document.getElementById('app') || document.body, { childList: true });
  sync();
})();
</script>
</body>
