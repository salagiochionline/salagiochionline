/* ---------- mosse ---------- */
function doTakeDeck() { if (myStep() === 'choose') gameAct({ type: 'take', player: myId, from: 'deck' }); }
function doTakeDiscard() { if (myStep() === 'choose') gameAct({ type: 'take', player: myId, from: 'discard' }); }
function doDiscard() { if (myStep() === 'place') gameAct({ type: 'discard', player: myId }); }
function doCell(i) {
  const G = G_(); if (!G) return;
  if (needReveal()) return pickCell(i);
  const st = myStep();
  if (st === 'place') return gameAct({ type: 'swap', player: myId, cell: i });
  if (st === 'flip') { const c = G.players[myIdx()].grid.cells[i]; if (c && c.up) return toast('Scegli una carta coperta', 'warn'); return gameAct({ type: 'flip', player: myId, cell: i }); }
  if (st === 'choose') return toast('Prima prendi una carta: dagli scarti o dal mazzo');
}
function pickCell(i) {
  const G = G_(); const p = G.players[myIdx()];
  if (!p.grid.cells[i] || p.grid.cells[i].up) return;
  if (myPicks.includes(i)) { if (myPicks.length >= 2) return; myPicks = myPicks.filter(x => x !== i); renderGame(); return; }
  if (myPicks.length >= 2) return;
  myPicks.push(i);
  renderGame();
  if (myPicks.length === 2) DB.doc(`games/${code}/picks/${myId}`).set({ id: myId, k: pickKey(), cells: myPicks.slice(), t: Date.now() }).then(() => dutyTick()).catch(writeErr);
}

/* ---------- trascinamento (mouse e dito) ---------- */
function onPointerDown(e) {
  if (e.button !== undefined && e.button !== 0) return;
  const el = e.target.closest('[data-drag]'); if (!el) return;
  drag = { kind: el.dataset.drag, el, x: e.clientX, y: e.clientY, started: false, pid: e.pointerId, over: null };
}
function dropTargetAt(x, y) {
  const t = document.elementFromPoint(x, y); if (!t) return null;
  const cell = t.closest('#meArea [data-cell]'); if (cell) return cell;
  const dp = t.closest('#discardPile');
  if (dp && drag.kind === 'hold' && S.game.hold && S.game.hold.from === 'deck') return dp;
  return null;
}
function onPointerMove(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 7) return;
    drag.started = true;
    const r = drag.el.getBoundingClientRect();
    const gh = drag.el.cloneNode(true); gh.removeAttribute('data-cid'); gh.classList.add('dragghost');
    gh.style.width = r.width + 'px'; gh.style.height = r.height + 'px'; gh.style.setProperty('--w', r.width + 'px');
    document.body.appendChild(gh); drag.gh = gh; drag.dx = drag.x - r.left; drag.dy = drag.y - r.top;
    drag.el.classList.add('dragging');
    try { drag.el.setPointerCapture(e.pointerId); } catch (_) { }
  }
  e.preventDefault();
  drag.gh.style.transform = `translate(${e.clientX - drag.dx}px,${e.clientY - drag.dy}px) rotate(-4deg) scale(1.06)`;
  const t = dropTargetAt(e.clientX, e.clientY);
  if (t !== drag.over) { if (drag.over) drag.over.classList.remove('over'); drag.over = t; if (t) t.classList.add('over'); }
}
function onPointerUp(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  if (!d.started) { drag = null; return; }
  const t = dropTargetAt(e.clientX, e.clientY);
  suppressClick = Date.now() + 400;
  endDrag();
  if (t && t.dataset.cell != null) {
    const i = +t.dataset.cell;
    if (d.kind === 'discard') gameAct([{ type: 'take', player: myId, from: 'discard' }, { type: 'swap', player: myId, cell: i }]);
    else gameAct({ type: 'swap', player: myId, cell: i });
  } else if (t && t.id === 'discardPile') doDiscard();
  if (pendingRender) { pendingRender = false; renderGame(); }
}
function endDrag() {
  if (!drag) return;
  if (drag.gh) drag.gh.remove();
  if (drag.el) drag.el.classList.remove('dragging');
  if (drag.over) drag.over.classList.remove('over');
  drag = null;
}

function bindGame() {
  const game = $('#game');
  game.addEventListener('pointerdown', onPointerDown);
  game.addEventListener('pointermove', onPointerMove, { passive: false });
  game.addEventListener('pointerup', onPointerUp);
  game.addEventListener('pointercancel', () => { endDrag(); if (pendingRender) { pendingRender = false; renderGame(); } });
  game.addEventListener('click', e => {
    if (Date.now() < suppressClick) { suppressClick = 0; return; }
    if (e.target.closest('#deckPile')) return doTakeDeck();
    if (e.target.closest('#discardPile')) { const st = myStep(); if (st === 'choose') return doTakeDiscard(); if (st === 'place') { if (S.game.hold.from === 'deck') return doDiscard(); return toast('La carta presa dagli scarti va messa nella tua griglia', 'warn'); } return; }
    const cell = e.target.closest('#meArea [data-cell]'); if (cell) return doCell(+cell.dataset.cell);
    const h = e.target.closest('[data-hilo]'); if (h) return gameAct({ type: 'pickHilo', player: myId, line: +h.dataset.hilo });
    const c = e.target.closest('[data-compact]'); if (c) return gameAct({ type: 'compact', player: myId, dir: c.dataset.compact });
    if (e.target.closest('#discardBtn')) return doDiscard();
    if (e.target.closest('#holdSlot') && myStep() === 'place') return toast(S.game.hold.from === 'deck' ? 'Tocca una casella della tua griglia, oppure gli scarti per buttarla' : 'Tocca la casella della tua griglia dove metterla');
  });
  $('#rulesBtn').addEventListener('click', () => showInfo(rulesHTML()));
  $('#scoreBtn').addEventListener('click', () => showInfo(scoresHTML()));
  $('#chatToggle').addEventListener('click', () => { sideOpen = !sideOpen; $('#side').classList.toggle('open', sideOpen); if (sideOpen && chat.length) chatSeenT = chat[chat.length - 1].t; updBadge(); });
  $('#quitBtn').addEventListener('click', () => showInfo(`<h2>Uscire dalla partita?</h2><p>${S.status === 'playing' ? 'Se esci durante la partita, gli altri ti aspetteranno per il tempo scelto e poi verrai tolto. Puoi rientrare con lo stesso link.' : 'Puoi rientrare quando vuoi con lo stesso link.'}</p>
    <div class="mbtns"><button class="btn" data-close-info>Resta</button><button class="btn warn" data-quit>Esci</button></div>`));
  $('#chatForm').addEventListener('submit', e => { e.preventDefault(); const t = $('#chatInput').value.trim(); if (!t) return; $('#chatInput').value = ''; sendChat(t); });
}
function bindGlobal() {
  $('#modal').addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if ('next' in t.dataset) { act(N => { const before = N.game.turnNo, ph = N.game.phase; const r = E.applyAction(N.game, { type: 'next', player: myId }); if (!r.ok) return false; afterGameChange(N, before, ph); N.tAt = Date.now(); }); }
    else if ('rematch' in t.dataset) act(N => { N.status = 'lobby'; N.game = null; N.away = {}; });
    else if ('home' in t.dataset) leave();
  });
  $('#info').addEventListener('click', e => {
    if (e.target.id === 'info') return hideInfo();
    const t = e.target.closest('button'); if (!t) return;
    if ('closeInfo' in t.dataset) hideInfo();
    if ('quit' in t.dataset) { hideInfo(); leave(); }
  });
  document.addEventListener('keydown', e => {
    if (/input|textarea|select/i.test((e.target.tagName || ''))) return;
    if (e.key === 'Escape') { endDrag(); hideInfo(); }
  });
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (view === 'game' && S && S.game && S.status !== 'lobby') renderGame(); }, 120); });
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (/^[A-Z0-9]{5}$/.test(h) && h !== code && myName) openGame(h, true); });
}

bindGlobal();
init();
window.__ab = { get S() { return S; }, get myId() { return myId; }, E, B, gameAct, act, doCell, doTakeDeck, doTakeDiscard, doDiscard };

</script>
<script>
/* 💬 Chat: il pulsante apre e chiude il pannello su ogni schermo */
(function () {
  var SEL = '#chatToggle,#bSide,#chatBtn,#bSideX';
  var wide = function () { return innerWidth > CHAT_BP; }, was = wide();
  function aperta() { try { return !!sideOpen; } catch (e) { return true; } }
  function sync() {
    var open = aperta();
    var L = document.querySelector('.layout'); if (L) L.classList.toggle('chat-chiusa', !open);
    var x = document.getElementById('bSideX'); if (x) x.hidden = !open;
    document.querySelectorAll('#chatToggle,#bSide,#chatBtn').forEach(function (b) {
      b.setAttribute('aria-pressed', open ? 'true' : 'false');
      b.title = open ? 'Nascondi la chat' : 'Mostra la chat';
    });
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest(SEL)) return;
    if (wide()) { try { localStorage.setItem('tavolata-chat', aperta() ? 'aperta' : 'chiusa'); } catch (er) {} }
    sync();
    if (wide()) dispatchEvent(new Event('resize'));
  });
  addEventListener('resize', function () {
    var w = wide(); if (w === was) return; was = w;
    try { sideOpen = chatAperta(); } catch (e) { return; }
    var s = document.getElementById('side'); if (s) s.classList.toggle('open', sideOpen);
    sync();
  });
  new MutationObserver(function () { if (document.getElementById('side')) sync(); }).observe(document.getElementById('app') || document.body, { childList: true });
  sync();
})();
</script>
