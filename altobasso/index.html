<style>
:root{
  --bg:#1d1a2f; --bg2:#262142; --panel:#2b2550; --panel2:#342d60; --line:rgba(255,255,255,.10);
  --text:#f4f1ff; --muted:#b4acd6; --accent:#ffcf3f; --teal:#38d9a9; --violet:#7c4dff;
  --ok:#22c55e; --bad:#f43f5e;
  --cw:clamp(48px,8vh,80px); --mw:22px; --radius:14px;
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{background:radial-gradient(1200px 700px at 50% -10%,#145a52 0%,var(--bg) 62%) fixed}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- pulsanti ---------- */
.btn{border:1px solid var(--line);background:var(--panel2);padding:.55em 1em;border-radius:12px;cursor:pointer;font-weight:600;transition:transform .12s,background .12s,opacity .12s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#3e3672}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(135deg,#12b886,#7c4dff);border:none}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#20c997,#8a5cff)}
.btn.go{background:#22c55e;color:#06260f;border:none}
.btn.go:hover:not(:disabled){background:#34d36d}
.btn.go:not(:disabled){animation:pulse 1.4s infinite}
.btn.warn{background:#c2410c;border:none}
.btn.ghost{background:transparent}
.btn.sm{padding:.4em .75em;font-size:.86rem;border-radius:9px}
.btn.big{padding:.8em 1.6em;font-size:1.08rem}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}50%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}

/* ---------- logo ---------- */
.logo{font-weight:700;font-size:3.5rem;letter-spacing:-.02em;line-height:1;display:inline-flex;align-items:center;gap:.2em;
  transform:rotate(-3deg);filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.logo .lt{background:linear-gradient(90deg,#63e6be,#38d9a9 40%,#ffd43b);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .lt b{font-weight:700;background:linear-gradient(90deg,#ffd43b,#ff922b);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .arr{display:inline-flex;flex-direction:column;font-size:.42em;line-height:.9;font-weight:700}
.logo .arr i{font-style:normal;color:#63e6be}.logo .arr i+i{color:#ff922b}
.logo.sm{font-size:1.7rem}
.logo.xs{font-size:1.35rem}

/* ---------- home e lobby ---------- */
body.v-home,body.v-lobby{overflow-y:auto}
body.v-game{overflow:hidden}
.home{max-width:760px;margin:0 auto;padding:30px 16px 60px;display:flex;flex-direction:column;gap:16px;position:relative}
.hero{text-align:center;margin-bottom:4px}
.gamepill{display:table;margin:0 auto 14px;background:var(--teal);color:#0b2a22;font-weight:700;letter-spacing:.14em;font-size:.75rem;padding:5px 16px;border-radius:99px}
.tagline{color:var(--muted);margin:16px auto 0;max-width:52ch}
.hubbtn{text-decoration:none;color:var(--text);width:max-content;display:inline-flex;align-items:center;gap:6px}
.panel{background:rgba(43,37,80,.78);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(6px)}
.panel h3{margin:0 0 12px;font-size:1.15rem;font-weight:600}
.mut{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.mid{justify-content:center}
.banner{background:#3a2a10;border:1px solid #7c5a10;color:#ffe2a8;border-radius:14px;padding:12px 14px;font-size:.9rem}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gitem{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.medal{font-size:1.2rem;font-weight:700;color:var(--accent);width:40px;text-align:center}
.bigcode{font-size:2.6rem;font-weight:700;letter-spacing:8px;color:var(--accent);margin:4px 0}
.netst{color:#fde68a}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.seat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.tile{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tile b{font-size:1.4rem;color:var(--accent)}.tile span{font-size:.78rem;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.sitem{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sitem span{color:var(--muted)}
.code-sm{letter-spacing:2px;font-weight:700;color:var(--accent)}
input,select{font:inherit;color:var(--text);background:#1f1b38;border:1px solid var(--line);border-radius:10px;padding:.6em .7em}
input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px}

/* impostazioni */
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.flabel{font-size:.85rem;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg button{background:#1f1b38;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.seg button small{color:var(--muted);font-size:.8rem}
.seg button.on{border-color:var(--teal);background:#17403b}
.inline{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.group{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.group h4{margin:4px 0 6px;font-size:1rem;color:var(--teal);font-weight:600}
.group .gnote{color:var(--muted);font-size:.82rem;margin:0 0 6px}
.opt{border-radius:12px;padding:8px 10px;margin:4px 0;background:rgba(255,255,255,.03)}
.opt-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.opt-label{font-weight:500}
.opt select{max-width:58%}
.opt details{margin-top:4px}
.opt summary{cursor:pointer;color:var(--muted);font-size:.82rem;list-style:none;display:inline-flex;gap:4px;align-items:center}
.opt summary::-webkit-details-marker{display:none}
.opt summary::before{content:'▸';transition:transform .15s}
.opt details[open] summary::before{transform:rotate(90deg)}
.opt .help{font-size:.88rem;color:#ddd6ff;line-height:1.45;padding:6px 2px 2px}
.opt .help ul{margin:.3em 0;padding-left:1.2em}
.switch{position:relative;width:46px;height:26px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#443c70;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:#22c55e}

/* ---------- avatar ---------- */

.ab .cv.neg{font-size:calc(var(--w,var(--cw))*.44)}

.ab.down .f{background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 4px,transparent 4px 9px),linear-gradient(150deg,#20c997,#0f766e 55%,#134e4a);border:calc(var(--w,var(--cw))*.045) solid #e6fcf5}
.ab.down .bk{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.85);font-weight:700;font-size:calc(var(--w,var(--cw))*.34);line-height:.8;text-align:center}
.ab.down .bk i{display:block;font-style:normal}
.ab.down .bk i+i{color:#ffd43b}
.ab.mini{--w:var(--mw)}
.ab.mini .cs.tl,.ab.xs .cs.tl{display:none}
.ab.mini .cs.br,.ab.xs .cs.br{display:block;bottom:3%;right:auto;left:50%;transform:translateX(-50%);font-size:calc(var(--w)*.36)}
.ab.mini .cv,.ab.xs .cv{inset:0 0 28% 0;font-size:calc(var(--w)*.5)}
.ab.mini.up .f::before{display:none}
.ab.mini.down .bk{font-size:calc(var(--w)*.4)}
.ab.mini.down .bk i+i{display:none}
.ab.xs{--w:24px}
.ab.xs.up .f::before{display:none}

/* griglie */

<script>
/* =========================================================
   ALTO BASSO — motore delle regole
   Funziona sia nel browser (window.ABEngine) sia in Node.
   Lo stato completo viene modificato solo con applyAction().
   ========================================================= */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.ABEngine = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* 8 colori, ognuno con un simbolo (per chi è daltonico) */
  const COLORS = [
    { name: 'rosso', sym: '●', bg: '#ff6b6b', ink: '#3b0a0a' },
    { name: 'arancio', sym: '▲', bg: '#ff922b', ink: '#3a1700' },
    { name: 'giallo', sym: '■', bg: '#ffd43b', ink: '#3a2c00' },
    { name: 'verde', sym: '◆', bg: '#51cf66', ink: '#05300f' },
    { name: 'azzurro', sym: '★', bg: '#3bc9db', ink: '#022f36' },
    { name: 'blu', sym: '♥', bg: '#5c7cfa', ink: '#ffffff' },
    { name: 'viola', sym: '✚', bg: '#b197fc', ink: '#24104f' },
    { name: 'rosa', sym: '⬢', bg: '#f783ac', ink: '#3d0a1f' }
  ];
  const MINV = -1, MAXV = 11;

  const DEFAULT_OPTIONS = {
    mode: 'soglia',         // 'soglia' (fino a 100) | 'singola' | 'torneo'
    rounds: 5,              // mani del torneo
    threshold: 100,         // la partita finisce quando qualcuno arriva a 100 (cioè supera 99)
    doubling: true,         // chi chiude e non ha il punteggio più basso raddoppia
    diagonal: true,         // tris di colore anche in diagonale
    turnTimer: 0,           // secondi per turno (0 = nessun limite)
    disconnectWait: 60      // secondi di attesa per chi si disconnette
  };

  let rand = Math.random;
  function setRandom(fn) { rand = fn || Math.random; }
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- carte ---------- */
  function buildDeck() {
    const d = [];
    for (let c = 0; c < 8; c++) for (let v = MINV; v <= MAXV; v++) d.push({ v, c });
    shuffle(d);
    // il numero della carta viene dato dopo il mescolamento: non svela niente
    d.forEach((x, i) => { x.id = i; x.up = false; });
    return d;
  }
  const vstr = v => v < 0 ? '−' + (-v) : String(v);
  function cardName(c) { return vstr(c.v) + ' ' + COLORS[c.c].name + ' ' + COLORS[c.c].sym; }

  /* ---------- griglia ----------
     grid = { r: righe, c: colonne, cells: [carta...] } in ordine per righe */
  function lines(g, diag) {
    const L = [];
    if (g.c === 3) for (let r = 0; r < g.r; r++) L.push({ kind: 'row', cells: [r * 3, r * 3 + 1, r * 3 + 2] });
    if (g.r === 3) for (let c = 0; c < g.c; c++) L.push({ kind: 'col', cells: [c, c + g.c, c + 2 * g.c] });
    if (diag && g.r === 3 && g.c === 3) { L.push({ kind: 'diag', cells: [0, 4, 8] }); L.push({ kind: 'diag', cells: [2, 4, 6] }); }
    return L;
  }
  function findHilos(g, diag) {
    return lines(g, diag).filter(l => {
      const a = l.cells.map(i => g.cells[i]);
      return a.every(x => x && x.up) && a[0].c === a[1].c && a[1].c === a[2].c;
    });
  }
  function gridScore(g) { return g.cells.reduce((s, x) => s + x.v, 0); }
  function visibleScore(g) { return g.cells.reduce((s, x) => s + (x.up ? x.v : 0), 0); }
  function allUp(g) { return g.cells.every(x => x.up); }
  function downCount(g) { return g.cells.filter(x => !x.up).length; }
  function cloneGrid(g) { return { r: g.r, c: g.c, cells: g.cells.map(x => Object.assign({}, x)) }; }

  /* toglie una linea; per la diagonale serve la direzione ('left' o 'down') */
  function removeLine(g, line, dir) {
    const rm = new Set(line.cells);
    const removed = line.cells.map(i => g.cells[i]);
    if (line.kind === 'row') { g.cells = g.cells.filter((x, i) => !rm.has(i)); g.r -= 1; }
    else if (line.kind === 'col') { g.cells = g.cells.filter((x, i) => !rm.has(i)); g.c -= 1; }
    else {
      const R = g.r, C = g.c;
      if (dir === 'down') {
        // ogni colonna scende di uno: 2 righe × 3 colonne
        const cols = [];
        for (let c = 0; c < C; c++) { const col = []; for (let r = 0; r < R; r++) { const i = r * C + c; if (!rm.has(i)) col.push(g.cells[i]); } cols.push(col); }
        const cells = [];
        for (let r = 0; r < R - 1; r++) for (let c = 0; c < C; c++) cells.push(cols[c][r]);
        g.cells = cells; g.r = R - 1;
      } else {
        // ogni riga scivola a sinistra: 3 righe × 2 colonne
        g.cells = g.cells.filter((x, i) => !rm.has(i)); g.c = C - 1;
      }
    }
    if (!g.cells.length) { g.r = 0; g.c = 0; }
    return removed;
  }

  /* a fine mano: toglie tutti i tris possibili scegliendo il modo più conveniente */
  function autoClean(g, diag) {
    const hs = findHilos(g, diag);
    if (!hs.length) return { grid: g, removed: 0 };
    let best = null;
    for (const h of hs) {
      const dirs = h.kind === 'diag' ? ['left', 'down'] : [null];
      for (const d of dirs) {
        const g2 = cloneGrid(g);
        removeLine(g2, h, d);
        const r = autoClean(g2, diag);
        const sc = gridScore(r.grid);
        if (!best || sc < best.sc || (sc === best.sc && r.removed + 1 > best.removed)) best = { sc, grid: r.grid, removed: r.removed + 1 };
      }
    }
    return { grid: best.grid, removed: best.removed };
  }

  /* ---------- utilità di stato ---------- */
  function activeIdx(s) { return s.players.map((p, i) => i).filter(i => s.players[i].status === 'in'); }
  function nextIdx(s, from) {
    const n = s.players.length;
    for (let k = 1; k <= n; k++) { const i = (from + k) % n; if (s.players[i].status === 'in') return i; }
    return from;
  }
  function idxOf(s, id) { return s.players.findIndex(p => p.id === id); }
  function log(s, msg, kind) {
    s.log.push({ n: ++s.logSeq, msg, kind: kind || 'sys', t: Date.now() });
    if (s.log.length > 150) s.log.shift();
  }
  function emit(s, ev) {
    ev.n = ++s.eventSeq;
    s.events.push(ev);
    if (s.events.length > 60) s.events.shift();
  }
  function totalRounds(s) { return s.options.mode === 'torneo' ? (s.options.rounds || 5) : (s.options.mode === 'singola' ? 1 : 0); }
  function topDiscard(s) { return s.discard.length ? s.discard[s.discard.length - 1] : null; }
  function actorIdx(s) {
    if (s.phase === 'turn') return s.turn;
    return -1;
  }

  /* ---------- creazione partita ---------- */
  function newStats() {
    return { hilos: 0, closes: 0, doubled: 0, best: null, fromDiscard: 0, fromDeck: 0, swaps: 0, flips: 0, roundsWon: 0, roundsPlayed: 0, sumScores: 0, negRounds: 0, minus: 0 };
  }
  function createGame(players, options) {
    const opts = Object.assign({}, DEFAULT_OPTIONS, options || {});
    const s = {
      options: opts,
      players: players.map(p => ({
        id: p.id, name: p.name, bot: !!p.bot,
        grid: { r: 0, c: 0, cells: [] }, revealed: false,
        total: 0, scores: [], status: 'in', roundsWon: 0,
        stats: newStats()
      })),
      round: 0, deck: [], discard: [], turn: 0, turnNo: 0,
      phase: 'reveal', step: null, hold: null, hiloChoices: null, pendingDiag: null, chain: false,
      closer: null, finalTurns: [], firstPlayer: null,
      log: [], logSeq: 0, events: [], eventSeq: 0,
      results: [], winner: null, winners: [], ranking: null, version: 0
    };
    startRound(s);
    return s;
  }

  function startRound(s) {
    s.round++;
    s.deck = buildDeck();
    s.discard = [];
    s.hold = null; s.step = null; s.hiloChoices = null; s.pendingDiag = null; s.chain = false;
    s.closer = null; s.finalTurns = [];
    const act = activeIdx(s);
    s.players.forEach(p => { p.grid = { r: 0, c: 0, cells: [] }; p.revealed = p.status !== 'in'; });
    for (const i of act) {
      const cells = [];
      for (let k = 0; k < 9; k++) cells.push(s.deck.pop());
      s.players[i].grid = { r: 3, c: 3, cells };
    }
    const first = s.deck.pop(); first.up = true; s.discard.push(first);
    s.phase = 'reveal'; s.turnNo++;
    const tot = totalRounds(s);
    let head = 'Mano ' + s.round + (s.options.mode === 'torneo' ? ' di ' + tot : '') + '. ';
    if (s.options.mode === 'singola') head = '';
    log(s, head + 'Carte distribuite: ognuno scopre 2 carte a scelta.');
    emit(s, { type: 'roundStart', round: s.round });
  }

  /* inizio dei turni dopo che tutti hanno scoperto 2 carte */
  function maybeStartTurns(s) {
    const act = activeIdx(s);
    if (s.phase !== 'reveal' || !act.every(i => s.players[i].revealed)) return;
    if (act.length < 2) return;
    let best = -Infinity, cand = [];
    for (const i of act) {
      const v = visibleScore(s.players[i].grid);
      if (v > best) { best = v; cand = [i]; } else if (v === best) cand.push(i);
    }
    const start = cand[Math.floor(rand() * cand.length)];
    s.phase = 'turn'; s.step = 'choose'; s.turn = start; s.turnNo++; s.firstPlayer = s.players[start].id;
    log(s, 'Comincia ' + s.players[start].name + (cand.length > 1 ? ' (pari con altri: scelto a sorte)' : '') + ': le sue due carte valgono ' + best + '.');
    emit(s, { type: 'turnsStart', player: s.players[start].id });
  }

  function drawFromDeck(s) {
    if (!s.deck.length) {
      if (s.discard.length <= 1) return null;
      const top = s.discard.pop();
      s.deck = shuffle(s.discard.map(c => Object.assign(c, { up: false })));
      s.discard = [top];
      log(s, '🔄 Il mazzo è finito: rimescolo gli scarti.');
      emit(s, { type: 'reshuffle' });
    }
    return s.deck.pop();
  }

  /* dopo aver messo o girato una carta: controlla i tris di colore */
  function afterPlacement(s, idx) {
    const p = s.players[idx];
    const hs = findHilos(p.grid, s.options.diagonal);
    if (!hs.length) return endTurn(s, idx);
    if (hs.length > 1) { s.step = 'pickHilo'; s.hiloChoices = hs; return; }
    doRemove(s, idx, hs[0]);
  }
  function doRemove(s, idx, line) {
    const p = s.players[idx];
    if (line.kind === 'diag') { s.step = 'compact'; s.pendingDiag = line; s.hiloChoices = null; return; }
    finishRemove(s, idx, line, null);
  }
  function finishRemove(s, idx, line, dir) {
    const p = s.players[idx];
    const removed = removeLine(p.grid, line, dir);
    removed.slice().sort((a, b) => b.v - a.v).forEach(c => { c.up = true; s.discard.push(c); });
    p.stats.hilos++;
    const col = COLORS[removed[0].c];
    log(s, '✨ ' + p.name + ' fa tris di colore (' + col.name + ' ' + col.sym + ': ' + removed.map(c => vstr(c.v)).join(', ') + ') e toglie ' + (line.kind === 'row' ? 'una riga' : line.kind === 'col' ? 'una colonna' : 'una diagonale') + '!', 'good');
    emit(s, { type: 'hilo', player: p.id, cards: removed.map(c => c.id), color: removed[0].c, kind: line.kind });
    s.hiloChoices = null; s.pendingDiag = null;
    if (line.kind === 'diag') {
      // dopo aver compattato la griglia può nascere un altro tris: si toglie anche quello
      const hs = findHilos(p.grid, s.options.diagonal);
      if (hs.length === 1) { s.chain = true; return finishRemove(s, idx, hs[0], null); }
      if (hs.length > 1) { s.chain = true; s.step = 'pickHilo'; s.hiloChoices = hs; return; }
    }
    endTurn(s, idx);
  }

  function endTurn(s, idx) {
    const p = s.players[idx];
    s.hold = null; s.hiloChoices = null; s.pendingDiag = null; s.chain = false;
    if (s.closer == null) {
      if (allUp(p.grid)) {
        s.closer = p.id;
        s.finalTurns = activeIdx(s).filter(i => i !== idx).map(i => s.players[i].id);
        p.stats.closes++;
        log(s, '🏁 ' + p.name + (p.grid.cells.length ? ' ha scoperto tutte le carte' : ' non ha più carte') + ': ultimo turno per tutti gli altri!', 'warn');
        emit(s, { type: 'closing', player: p.id });
      }
    } else s.finalTurns = s.finalTurns.filter(id => id !== p.id);
    if (s.closer != null && !s.finalTurns.length) return endRound(s, 'closed');
    s.turn = nextIdx(s, idx); s.turnNo++; s.step = 'choose';
  }

  /* ---------- fine mano ---------- */
  function endRound(s, reason) {
    const o = s.options;
    s.phase = 'roundEnd'; s.step = null; s.hold = null;
    const act = activeIdx(s);
    // si scopre tutto e si tolgono gli eventuali tris rimasti
    for (const i of act) {
      const p = s.players[i];
      const before = p.grid.cells.filter(x => !x.up).length;
      p.grid.cells.forEach(x => { x.up = true; });
      const r = autoClean(p.grid, o.diagonal);
      if (r.removed) {
        const keep = new Set(r.grid.cells.map(x => x.id));
        p.grid.cells.filter(x => !keep.has(x.id)).sort((a, b) => b.v - a.v).forEach(x => s.discard.push(x));
        p.grid = r.grid; p.stats.hilos += r.removed; log(s, '✨ ' + p.name + ' scopre le ultime carte e toglie ' + (r.removed === 1 ? 'un tris di colore' : r.removed + ' tris di colore') + '!', 'good'); }
      p._lastDown = before;
    }
    const pts = {};
    act.forEach(i => { pts[i] = gridScore(s.players[i].grid); });
    const closerIdx = s.closer != null ? idxOf(s, s.closer) : -1;
    let doubled = false;
    if (o.doubling && closerIdx >= 0 && act.includes(closerIdx)) {
      const mine = pts[closerIdx];
      const someoneLower = act.some(i => i !== closerIdx && pts[i] <= mine);
      if (someoneLower && mine > 0) { pts[closerIdx] = mine * 2; doubled = true; s.players[closerIdx].stats.doubled++; }
    }
    const minPts = act.length ? Math.min(...act.map(i => pts[i])) : 0;
    const rows = [];
    s.players.forEach((p, i) => {
      let points = null, note = '';
      if (p.status === 'disconnesso') note = 'disconnesso';
      else {
        points = pts[i];
        p.total += points;
        p.stats.roundsPlayed++; p.stats.sumScores += points;
        if (p.stats.best == null || points < p.stats.best) p.stats.best = points;
        if (points < 0) p.stats.negRounds++;
        if (points === minPts) { p.roundsWon++; p.stats.roundsWon++; }
        if (i === closerIdx) note = doubled ? 'ha chiuso · punti raddoppiati' : 'ha chiuso';
      }
      p.scores.push(points);
      rows.push({ id: p.id, name: p.name, bot: p.bot, grid: cloneGrid(p.grid), raw: points == null ? null : gridScore(p.grid), points, total: p.total, note, status: p.status, closer: i === closerIdx, doubled: i === closerIdx && doubled });
    });
    s.results.push({ round: s.round, reason, closer: s.closer, doubled, rows, best: act.filter(i => pts[i] === minPts).map(i => s.players[i].id) });
    if (closerIdx >= 0) log(s, doubled ? '✖️2 ' + s.players[closerIdx].name + ' ha chiuso ma non ha il punteggio più basso: i suoi punti raddoppiano (' + pts[closerIdx] + ').' : '👍 ' + s.players[closerIdx].name + ' ha chiuso con ' + pts[closerIdx] + ' punti.', doubled ? 'warn' : 'good');
    emit(s, { type: 'roundEnd', reason, doubled, closer: s.closer });
    const alive = activeIdx(s);
    let over = false;
    if (alive.length < 2) over = true;
    else if (o.mode === 'singola') over = true;
    else if (o.mode === 'torneo') over = s.round >= totalRounds(s);
    else over = alive.some(i => s.players[i].total >= o.threshold);
    if (over) finishGame(s);
  }

  function finishGame(s) {
    s.phase = 'gameEnd'; s.step = null; s.hold = null;
    const order = s.players.map((p, i) => i);
    const disc = i => s.players[i].status === 'disconnesso' ? 1 : 0;
    order.sort((a, b) => disc(a) - disc(b) || s.players[a].total - s.players[b].total || s.players[b].roundsWon - s.players[a].roundsWon);
    s.ranking = order.map(i => s.players[i].id);
    const alive = order.filter(i => !disc(i));
    const min = alive.length ? s.players[alive[0]].total : 0;
    s.winners = alive.filter(i => s.players[i].total === min).map(i => s.players[i].id);
    s.winner = s.winners[0] || s.ranking[0];
    const names = s.winners.map(id => s.players[idxOf(s, id)].name);
    log(s, names.length > 1 ? '🎉 Pari! Vincono ' + names.join(' e ') + '!' : '🎉 ' + names[0] + ' vince la partita!', 'win');
    emit(s, { type: 'gameEnd' });
  }

  /* ---------- azioni ---------- */
  function err(e) { return { ok: false, error: e }; }
  function applyAction(s, a) {
    const r = applyInner(s, a);
    if (r.ok) s.version++;
    return r;
  }
  function applyInner(s, a) {
    if (!a || !a.type) return err('Azione non valida');
    const idx = idxOf(s, a.player);
    if (a.type === 'next') {
      if (s.phase !== 'roundEnd') return err('La mano non è finita');
      if (activeIdx(s).length < 2) { finishGame(s); return { ok: true }; }
      startRound(s);
      return { ok: true };
    }
    if (idx < 0) return err('Non sei in questa partita');
    const p = s.players[idx];
    if (p.status !== 'in') return err('Non sei più in gioco');

    if (a.type === 'reveal') {
      if (s.phase !== 'reveal') return err('Non è il momento');
      if (p.revealed) return err('Hai già scoperto le tue carte');
      const cs = (a.cells || []).map(Number);
      if (cs.length !== 2 || cs[0] === cs[1] || cs.some(i => !(i >= 0 && i < p.grid.cells.length))) return err('Scegli 2 carte diverse');
      cs.forEach(i => { p.grid.cells[i].up = true; });
      p.revealed = true;
      log(s, p.name + ' scopre ' + cs.map(i => cardName(p.grid.cells[i])).join(' e ') + (a.auto ? ' (scelte in automatico)' : '') + '.');
      emit(s, { type: 'reveal', player: p.id, cells: cs });
      maybeStartTurns(s);
      return { ok: true };
    }

    if (s.phase !== 'turn') return err('Aspetta');
    if (idx !== s.turn) return err('Non è il tuo turno');

    if (a.type === 'take') {
      if (s.step !== 'choose') return err('Hai già preso una carta');
      if (a.from === 'discard') {
        if (!s.discard.length) return err('Gli scarti sono vuoti');
        const c = s.discard.pop();
        s.hold = { card: c, from: 'discard' };
        p.stats.fromDiscard++;
        log(s, p.name + ' prende dagli scarti ' + cardName(c) + '.', 'play');
      } else {
        const c = drawFromDeck(s);
        if (!c) return err('Non ci sono più carte da pescare');
        c.up = true;
        s.hold = { card: c, from: 'deck' };
        p.stats.fromDeck++;
        log(s, p.name + ' pesca dal mazzo ' + cardName(c) + '.', 'play');
      }
      s.step = 'place';
      emit(s, { type: 'take', player: p.id, from: s.hold.from, card: s.hold.card.id });
      return { ok: true };
    }
    if (a.type === 'swap') {
      if (s.step !== 'place' || !s.hold) return err('Prima prendi una carta');
      const i = Number(a.cell);
      if (!(i >= 0 && i < p.grid.cells.length)) return err('Casella non valida');
      const old = p.grid.cells[i];
      const wasDown = !old.up;
      const nc = s.hold.card; nc.up = true;
      p.grid.cells[i] = nc;
      old.up = true; s.discard.push(old);
      s.hold = null;
      p.stats.swaps++;
      if (nc.v === -1) p.stats.minus++;
      log(s, p.name + ' mette ' + cardName(nc) + ' al posto di ' + (wasDown ? 'una carta coperta (era ' + cardName(old) + ')' : cardName(old)) + '.', 'play');
      emit(s, { type: 'swap', player: p.id, cell: i, card: nc.id, out: old.id, wasDown });
      afterPlacement(s, idx);
      return { ok: true };
    }
    if (a.type === 'discard') {
      if (s.step !== 'place' || !s.hold) return err('Prima prendi una carta');
      if (s.hold.from !== 'deck') return err('La carta presa dagli scarti va messa nella tua griglia');
      if (!downCount(p.grid)) return err('Non hai carte coperte da girare: devi scambiarla');
      const c = s.hold.card; c.up = true; s.discard.push(c); s.hold = null;
      s.step = 'flip';
      log(s, p.name + ' scarta ' + cardName(c) + '.', 'play');
      emit(s, { type: 'discard', player: p.id, card: c.id });
      return { ok: true };
    }
    if (a.type === 'flip') {
      if (s.step !== 'flip') return err('Non devi girare una carta adesso');
      const i = Number(a.cell);
      const c = p.grid.cells[i];
      if (!c) return err('Casella non valida');
      if (c.up) return err('Scegli una carta coperta');
      c.up = true;
      p.stats.flips++;
      log(s, p.name + ' gira ' + cardName(c) + '.', 'play');
      emit(s, { type: 'flip', player: p.id, cell: i, card: c.id });
      afterPlacement(s, idx);
      return { ok: true };
    }
    if (a.type === 'pickHilo') {
      if (s.step !== 'pickHilo' || !s.hiloChoices) return err('Non c\'è niente da scegliere');
      const l = s.hiloChoices[Number(a.line)];
      if (!l) return err('Scelta non valida');
      s.hiloChoices = null;
      if (s.chain) return finishRemove(s, idx, l, null), { ok: true };
      doRemove(s, idx, l);
      return { ok: true };
    }
    if (a.type === 'compact') {
      if (s.step !== 'compact' || !s.pendingDiag) return err('Non c\'è niente da compattare');
      const dir = a.dir === 'down' ? 'down' : 'left';
      finishRemove(s, idx, s.pendingDiag, dir);
      return { ok: true };
    }
    return err('Azione sconosciuta');
  }

  /* ---------- disconnessione ---------- */
  function removePlayer(s, id) {
    const i = idxOf(s, id);
    if (i < 0) return false;
    const p = s.players[i];
    if (p.status === 'disconnesso') return false;
    const wasTurn = s.phase === 'turn' && s.turn === i;
    p.status = 'disconnesso';
    if (wasTurn && s.hold) { const c = s.hold.card; c.up = true; s.discard.push(c); s.hold = null; }
    s.deck = shuffle(s.deck.concat(p.grid.cells.map(c => Object.assign(c, { up: false }))));
    p.grid = { r: 0, c: 0, cells: [] };
    s.finalTurns = s.finalTurns.filter(x => x !== id);
    log(s, '🔌 ' + p.name + ' è stato tolto dalla partita: le sue carte tornano nel mazzo.', 'warn');
    emit(s, { type: 'removed', player: p.id });
    const act = activeIdx(s);
    if (s.phase === 'reveal') {
      if (act.length < 2) finishGame(s); else maybeStartTurns(s);
    } else if (s.phase === 'turn') {
      if (act.length < 2) endRound(s, 'last');
      else if (s.closer != null && !s.finalTurns.length) endRound(s, 'closed');
      else if (wasTurn) { s.turn = nextIdx(s, i); s.turnNo++; s.step = 'choose'; s.hiloChoices = null; s.pendingDiag = null; s.chain = false; }
    } else if (s.phase === 'roundEnd' && act.length < 2) finishGame(s);
    s.version++;
    return true;
  }

  return {
    COLORS, MINV, MAXV, DEFAULT_OPTIONS,
    setRandom, shuffle, buildDeck, vstr, cardName,
    lines, findHilos, removeLine, autoClean, gridScore, visibleScore, allUp, downCount, cloneGrid,
    createGame, applyAction, removePlayer, startRound,
    actorIdx, activeIdx, nextIdx, idxOf, totalRounds, topDiscard
  };
});

<script>
/* =========================================================
   ALTO BASSO — bot
   Stima il punteggio della propria griglia (le carte coperte
   valgono in media 5) e sceglie la mossa che lo abbassa di più,
   stando attento a non chiudere quando rischia il raddoppio.
   ========================================================= */
(function (root, factory) {
  const E = (typeof module === 'object' && module.exports) ? require('./engine.js') : root.ABEngine;
  const api = factory(E);
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.ABBots = api;
})(typeof self !== 'undefined' ? self : this, function (E) {
  'use strict';
  const UNK = 5;

  function est(g, diag) {
    let s = 0;
    for (const x of g.cells) s += x.up ? x.v : UNK;
    // piccolo premio per le linee con due carte dello stesso colore
    for (const l of E.lines(g, diag)) {
      const a = l.cells.map(i => g.cells[i]);
      const up = a.filter(x => x.up);
      if (up.length < 2) continue;
      const cols = {};
      up.forEach(x => { cols[x.c] = (cols[x.c] || 0) + 1; });
      const two = Object.keys(cols).find(k => cols[k] === 2);
      if (two == null) continue;
      const sum2 = up.filter(x => x.c == two).reduce((t, x) => t + x.v, 0);
      if (sum2 <= 2) continue; // togliere carte basse non conviene
      s -= up.length === 2 ? 1.0 : 0.5;
    }
    return s;
  }
  function oppEst(G, idx) {
    let m = Infinity;
    G.players.forEach((p, i) => {
      if (i === idx || p.status !== 'in') return;
      const v = p.grid.cells.reduce((t, x) => t + (x.up ? x.v : UNK), 0);
      if (v < m) m = v;
    });
    return m === Infinity ? 0 : m;
  }
  function resolve(g, diag) { return E.autoClean(E.cloneGrid(g), diag).grid; }

  /* valore di una griglia dopo la mossa (più basso = meglio) */
  function value(G, idx, g) {
    const diag = G.options.diagonal;
    if (G.closer == null && E.allUp(g)) {
      const mine = E.gridScore(g);
      const other = oppEst(G, idx);
      if (G.options.doubling && mine > 0 && mine >= other - 1) return mine * 2 + 1;
      return mine - 3; // chiudere quando si è davanti è un buon affare
    }
    if (G.closer == null) {
      // se qualcuno sta per chiudere conviene stare bassi; resta una stima
      return est(g, diag);
    }
    return est(g, diag);
  }
  function swapValue(G, idx, card, cell) {
    const g = E.cloneGrid(G.players[idx].grid);
    g.cells[cell] = Object.assign({}, card, { up: true });
    return value(G, idx, resolve(g, G.options.diagonal));
  }
  function bestSwap(G, idx, card) {
    const n = G.players[idx].grid.cells.length;
    let best = { v: Infinity, cell: 0 };
    for (let i = 0; i < n; i++) { const v = swapValue(G, idx, card, i); if (v < best.v) best = { v, cell: i }; }
    return best;
  }
  function flipCell(G, idx) {
    const g = G.players[idx].grid, diag = G.options.diagonal;
    const downs = g.cells.map((x, i) => i).filter(i => !g.cells[i].up);
    // meglio girare una carta in una linea con due carte dello stesso colore
    let best = downs[Math.floor(Math.random() * downs.length)], bs = -1;
    for (const i of downs) {
      let sc = 0;
      for (const l of E.lines(g, diag)) {
        if (!l.cells.includes(i)) continue;
        const o = l.cells.filter(j => j !== i).map(j => g.cells[j]);
        if (o.every(x => x.up) && o[0].c === o[1].c) sc += 2;
        else sc += o.filter(x => x.up && x.v >= 7).length * 0.3;
      }
      if (sc > bs) { bs = sc; best = i; }
    }
    return best;
  }
  function flipValue(G, idx) {
    const g = E.cloneGrid(G.players[idx].grid);
    const downs = g.cells.filter(x => !x.up).length;
    if (!downs) return Infinity;
    if (downs === 1 && G.closer == null) {
      // girare l'ultima carta chiude la mano: punteggio atteso = stima attuale
      const mine = est(g, G.options.diagonal);
      const other = oppEst(G, idx);
      if (G.options.doubling && mine > 0 && mine >= other - 1) return mine * 2 + 1;
      return mine - 3;
    }
    return est(g, G.options.diagonal) - 0.2;
  }

  function botReveal(G, idx) {
    const n = G.players[idx].grid.cells.length;
    const a = Math.floor(Math.random() * n); let b = Math.floor(Math.random() * (n - 1)); if (b >= a) b++;
    return { type: 'reveal', player: G.players[idx].id, cells: [a, b], auto: false };
  }

  function botAction(G, idx) {
    const p = G.players[idx], id = p.id, diag = G.options.diagonal;
    if (G.phase === 'reveal') return p.revealed ? null : botReveal(G, idx);
    if (G.phase !== 'turn' || G.turn !== idx) return null;
    if (G.step === 'choose') {
      const d = E.topDiscard(G);
      const dBest = d ? bestSwap(G, idx, d).v : Infinity;
      let sum = 0, k = 0;
      for (let v = E.MINV; v <= E.MAXV; v++) {
        const c = { id: -1, v, c: -1, up: true };
        const sw = bestSwap(G, idx, c).v;
        sum += Math.min(sw, flipValue(G, idx)); k++;
      }
      const deckV = (G.deck.length || G.discard.length > 1) ? sum / k : Infinity;
      return { type: 'take', player: id, from: dBest < deckV - 0.4 ? 'discard' : 'deck' };
    }
    if (G.step === 'place') {
      const h = G.hold.card;
      const sw = bestSwap(G, idx, h);
      if (G.hold.from === 'deck') {
        const fv = flipValue(G, idx);
        if (fv <= sw.v) return { type: 'discard', player: id };
      }
      return { type: 'swap', player: id, cell: sw.cell };
    }
    if (G.step === 'flip') return { type: 'flip', player: id, cell: flipCell(G, idx) };
    if (G.step === 'pickHilo') {
      let best = 0, bv = Infinity;
      G.hiloChoices.forEach((l, i) => {
        const dirs = l.kind === 'diag' ? ['left', 'down'] : [null];
        for (const dir of dirs) {
          const g = E.cloneGrid(p.grid); E.removeLine(g, l, dir);
          const v = est(resolve(g, diag), diag);
          if (v < bv) { bv = v; best = i; }
        }
      });
      return { type: 'pickHilo', player: id, line: best };
    }
    if (G.step === 'compact') {
      let best = 'left', bv = Infinity;
      for (const dir of ['left', 'down']) {
        const g = E.cloneGrid(p.grid); E.removeLine(g, G.pendingDiag, dir);
        const v = est(resolve(g, diag), diag);
        if (v < bv) { bv = v; best = dir; }
      }
      return { type: 'compact', player: id, dir: best };
    }
    return null;
  }

  return { botAction, botReveal, est };
});

function makeDB(kv){
  const snap=p=>{const d=kv.get(p);return {id:p.split('/').pop(),exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}}};
  const docRef=p=>({id:p.split('/').pop(),path:p,get:async()=>snap(p),set:d=>kv.write('set',p,clone(d)),
    update:async d=>{if(!kv.get(p))throw{code:'invalid_argument'};return kv.write('update',p,clone(d))},
    delete:()=>kv.write('delete',p,null),
    onSnapshot(next){let last;const f=()=>{const raw=JSON.stringify(kv.get(p));if(raw!==last){last=raw;next(snap(p))}};const un=kv.listen(f);setTimeout(f,0);return un},
    collection:c=>collRef(p+'/'+c)});
  const collRef=(p,q={w:[],o:null,l:null})=>{
    const run=()=>{const dep=p.split('/').length+1;let docs=kv.keys().filter(k=>k.startsWith(p+'/')&&k.split('/').length===dep).map(snap).filter(d=>d.exists);
      for(const[f,op,v]of q.w)docs=docs.filter(d=>{const x=d.data()[f];return op==='=='?x===v:op==='!='?x!==v:op==='>'?x>v:op==='<'?x<v:op==='>='?x>=v:op==='<='?x<=v:op==='in'?v.includes(x):true});
      if(q.o){const[f,dir]=q.o;docs.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];return(x>y?1:x<y?-1:0)*(dir==='desc'?-1:1)})}else docs.sort((a,b)=>a.id<b.id?-1:1);
      if(q.l)docs=docs.slice(0,q.l);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}};
    return{path:p,where:(f,op,v)=>collRef(p,{...q,w:[...q.w,[f,op,v]]}),orderBy:(f,d='asc')=>collRef(p,{...q,o:[f,d]}),limit:n=>collRef(p,{...q,l:n}),
      get:async()=>run(),onSnapshot(next){let last;const f=()=>{const s=run();const raw=JSON.stringify(s.docs.map(d=>[d.id,d.data()]));if(raw!==last){last=raw;next(s)}};const un=kv.listen(f);setTimeout(f,0);return un},
      doc:id=>docRef(p+'/'+(id||rid(14))),add:async d=>{const r=docRef(p+'/'+rid(14));await r.set(d);return r}}};
  return{doc:docRef,collection:p=>collRef(p)};
}
function makeLocalKV(){
  const PFX='ab-db:';const mem={};const fresh=new Map();
  const st={get(p){if(fresh.has(p))return fresh.get(p);try{const v=localStorage.getItem(PFX+p);return v?JSON.parse(v):null}catch(e){return mem[p]!==undefined?mem[p]:null}},
    set(p,d){fresh.set(p,d);try{localStorage.setItem(PFX+p,JSON.stringify(d))}catch(e){mem[p]=d}},
    del(p){fresh.set(p,null);try{localStorage.removeItem(PFX+p)}catch(e){delete mem[p]}},
    keys(){let k=[];try{k=Object.keys(localStorage).filter(k=>k.startsWith(PFX)).map(k=>k.slice(PFX.length))}catch(e){k=Object.keys(mem)}const s=new Set(k);fresh.forEach((v,p)=>{if(v)s.add(p);else s.delete(p)});return[...s]}};
  const L=new Set();let bc=null;
  try{bc=new BroadcastChannel('ab-db');bc.onmessage=e=>{const m=e.data;if(m&&m.p)fresh.set(m.p,m.d);L.forEach(f=>f())}}catch(e){}
  try{addEventListener('storage',e=>{if(e.key&&e.key.startsWith(PFX)){fresh.delete(e.key.slice(PFX.length));L.forEach(f=>f())}})}catch(e){}
  return{get:p=>st.get(p),keys:()=>st.keys(),listen(f){L.add(f);return()=>L.delete(f)},
    write(op,p,d){if(op==='set')st.set(p,d);else if(op==='update'){const o=st.get(p);if(o)st.set(p,{...o,...d})}else st.del(p);
      setTimeout(()=>L.forEach(f=>f()),0);try{bc&&bc.postMessage({p,d:st.get(p)})}catch(e){}return Promise.resolve();}};
}
/* =========================================================
   RETE SENZA ACCOUNT: server pubblico MQTT (messaggi "conservati")
   Ogni documento è un messaggio conservato sul tema tavolata-altobasso/v1/<percorso>
   ========================================================= */
const BROKER=(()=>{try{const q=new URLSearchParams(location.search);if(q.get('broker'))return q.get('broker');}catch(e){}return'wss://broker.emqx.io:8084/mqtt';})();
const TP='tavolata-altobasso/v1/';
const Net={client:null,status:'',cache:new Map(),L:new Set(),subs:new Set(),ready:null,nt:null,
  setStatus(s){this.status=s;document.querySelectorAll('.netst').forEach(el=>el.textContent=netText());},
  notify(){clearTimeout(this.nt);this.nt=setTimeout(()=>this.L.forEach(f=>f()),0);},
  connect(){
    if(this.client&&this.client.connected)return Promise.resolve(true);
    if(this.ready)return this.ready;
    this.ready=new Promise(res=>{
      let done=false;const fin=v=>{if(!done){done=true;if(!v)this.ready=null;res(v)}};
      let c;try{c=mqtt.connect(BROKER,{clientId:'ab_'+rid(12),keepalive:30,reconnectPeriod:2500,connectTimeout:10000,clean:true,resubscribe:true});}catch(e){return fin(false)}
      this.client=c;
      c.on('connect',()=>{this.setStatus('ok');this.subs.forEach(t=>c.subscribe(t,{qos:1}));fin(true);});
      c.on('reconnect',()=>this.setStatus('offline'));c.on('offline',()=>this.setStatus('offline'));c.on('error',()=>{});
      c.on('message',(topic,payload)=>{
        if(!topic.startsWith(TP))return;const p=topic.slice(TP.length);let d=null;
        if(payload&&payload.length){try{d=JSON.parse(typeof payload==='string'?payload:payload.toString())}catch(e){return}}
        const old=this.cache.get(p);
        if(d&&old&&typeof d.v==='number'&&typeof old.v==='number'&&d.v<old.v)return;
        if(d)this.cache.set(p,d);else this.cache.delete(p);this.notify();
      });
      setTimeout(()=>{if(!done){try{c.end(true)}catch(e){}this.client=null;fin(false)}},14000);
    });
    return this.ready;
  },
  sub(code){[TP+'games/'+code,TP+'games/'+code+'/#'].forEach(t=>{if(!this.subs.has(t)){this.subs.add(t);if(this.client)this.client.subscribe(t,{qos:1});}});},
  unsub(code){[TP+'games/'+code,TP+'games/'+code+'/#'].forEach(t=>{this.subs.delete(t);try{this.client&&this.client.unsubscribe(t)}catch(e){}});
    [...this.cache.keys()].forEach(k=>{if(k==='games/'+code||k.startsWith('games/'+code+'/'))this.cache.delete(k)});},
  kv(){return{get:p=>this.cache.get(p)||null,keys:()=>[...this.cache.keys()],listen:f=>{this.L.add(f);return()=>this.L.delete(f)},
    write:(op,p,d)=>{let v=null;if(op==='set')v=d;else if(op==='update'){const o=this.cache.get(p);if(!o)return Promise.resolve();v={...o,...d};}
      if(v)this.cache.set(p,v);else this.cache.delete(p);this.notify();
      return new Promise(res=>{try{this.client.publish(TP+p,v?JSON.stringify(v):'',{qos:1,retain:true},()=>res());}catch(e){res()}});}};},
  waitDoc(p,ms){return new Promise(res=>{if(this.cache.get(p))return res(true);const f=()=>{if(this.cache.get(p)){this.L.delete(f);res(true)}};this.L.add(f);setTimeout(()=>{this.L.delete(f);res(!!this.cache.get(p))},ms);});}
};

/* ---------------- statistiche sul dispositivo ---------------- */
function loadStats() { try { return JSON.parse(ls.get('ab-stats') || '[]') } catch (e) { return [] } }
function saveGameStats() {
  if (!S || !S.game) return;
  const G = S.game;
  const me = G.players.find(p => p.id === myId);
  if (!me) return;
  const ended = S.status === 'ended';
  const removed = me.status === 'disconnesso';
  if (!ended && !removed) return;
  const all = loadStats();
  const k = S.code + ':' + myId + ':' + (S.started || 0);
  if (all.some(r => r.k === k)) return;
  const pos = G.ranking ? G.ranking.indexOf(myId) + 1 : G.players.length;
  const w = G.players.find(p => p.id === G.winner);
  all.push({ k, code: S.code, t: Date.now(), name: me.name, n: G.players.length, mode: G.options.mode, rounds: G.results.length,
    pos: removed ? G.players.length : pos, won: !removed && (G.winners || []).includes(myId), winner: w ? w.name : '', total: me.total,
    st: me.stats, disc: (S.disc && S.disc[myId]) || 0, removed });
  ls.set('ab-stats', JSON.stringify(all.slice(-200)));
}
let statName = null;
function statsHome() {
  const all = loadStats();
  if (!all.length) return `<div class="panel"><h3>Le tue statistiche</h3><div class="mut small">Ancora nessuna partita conclusa su questo dispositivo. Finisci una partita e qui troverai vittorie, tris di colore, mani chiuse, raddoppi e molto altro.</div></div>`;
  const names = [...new Set(all.map(r => r.name))];
  if (!statName || !names.includes(statName)) statName = names.includes(myName) ? myName : all[all.length - 1].name;
  const rs = all.filter(r => r.name === statName).sort((a, b) => b.t - a.t);
  const sum = k => rs.reduce((a, r) => a + ((r.st && r.st[k]) || 0), 0);
  const bests = rs.map(r => r.st && r.st.best).filter(x => x != null);
  const rounds = sum('roundsPlayed');
  const wins = rs.filter(r => r.won).length, avgPos = rs.reduce((a, r) => a + r.pos, 0) / rs.length;
  const disc = rs.reduce((a, r) => a + (r.disc || 0), 0);
  let streak = 0; for (const r of rs) { if (r.won) streak++; else break; }
  const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
  const item = (l, v) => `<div class="sitem"><span>${l}</span><b>${v}</b></div>`;
  const modeTxt = r => r.mode === 'torneo' ? 'torneo di ' + r.rounds + ' mani' : r.mode === 'soglia' ? 'fino a 100, ' + r.rounds + ' mani' : 'partita singola';
  return `<div class="panel">
    <div class="row between" style="margin-bottom:12px"><h3>Le tue statistiche</h3>${names.length > 1 ? `<select id="stn">${names.map(n => `<option ${n === statName ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : `<span class="mut">${esc(statName)}</span>`}</div>
    <div class="tiles">${tile(rs.length, 'partite')}${tile(wins, 'vittorie')}${tile(Math.round(wins / rs.length * 100) + '%', 'vinte')}${tile(avgPos.toFixed(1) + '°', 'piazzamento medio')}${tile(streak, 'vittorie di fila')}${tile(disc, 'disconnessioni')}</div>
    <div class="sgrid" style="margin-top:12px">
      ${item('✨ Tris di colore', sum('hilos'))}${item('🏁 Mani chiuse', sum('closes'))}
      ${item('✖️2 Raddoppi presi', sum('doubled'))}${item('🏆 Mani col punteggio più basso', sum('roundsWon'))}
      ${item('🥇 Mano migliore', bests.length ? Math.min(...bests) + ' punti' : '—')}${item('📊 Media per mano', rounds ? (sum('sumScores') / rounds).toFixed(1) + ' punti' : '—')}
      ${item('❄️ Mani sotto zero', sum('negRounds'))}${item('♻️ Carte prese dagli scarti', sum('fromDiscard'))}
    </div>
    <div class="small mut" style="margin:14px 0 8px">Ultime partite</div>
    <div class="glist">${rs.slice(0, 10).map(r => `<div class="gitem"><div class="medal">${r.removed ? '–' : r.pos + '°'}</div><div style="flex:1;min-width:0"><div><b>${r.removed ? 'Disconnesso' : r.won ? 'Vittoria!' : 'Ha vinto ' + esc(r.winner)}</b></div><div class="small mut">${new Date(r.t).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' })} · ${modeTxt(r)} · ${r.n} giocatori${r.disc ? ` · disconnesso ${r.disc} ${r.disc === 1 ? 'volta' : 'volte'}` : ''}</div></div><div style="text-align:right"><b>${r.total}</b><div class="small mut">punti</div></div></div>`).join('')}</div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost sm" id="stclr">Azzera statistiche</button></div>
  </div>`;
}

  const sn = $('#stn'); if (sn) sn.onchange = () => { statName = sn.value; renderHome(); };
  const c = $('#stclr'); if (c) c.onclick = () => showInfo(`<h2>Azzerare le statistiche?</h2><p>Verranno cancellate tutte le statistiche di ${esc(statName)} su questo dispositivo.</p>

/* =========================================================
   CREA / APRI / ESCI
   ========================================================= */
function busy(msg) { $('#app').innerHTML = `<div class="home"><div class="panel mut">${esc(msg)}</div></div>`; }
function writeErr(e) {
  if (e && e.code === 'invalid_argument') toast('Non hai il permesso di giocare qui.', 'warn');
  else toast('Connessione instabile, riprova.', 'warn');
}
async function createGame() {
  if (MODE === 'claude' && !CANWRITE) return toast('Non hai il permesso di creare partite', 'warn');
  const c = genCode();
  if (MODE === 'p2p') {
    busy('Preparo la partita…');
    if (!(await Net.connect())) { renderHome(); return toast('Non riesco a collegarmi al server del gioco. Controlla la connessione e riprova.', 'warn'); }
    Net.sub(c);
  }
  addRecent(c, myName);
  const g = { code: c, status: 'lobby', host: myId, hostName: myName, created: Date.now(), v: 1, settings: defaultSettings(), extras: [] };
  try { await DB.doc('games/' + c).set(g); await DB.doc(`games/${c}/seats/${myId}`).set({ id: myId, name: myName, t: Date.now() }); }
  catch (e) { return writeErr(e); }
  openGame(c, false);
}

function closeGame() {
  unsubs.forEach(u => { try { u() } catch (e) { } }); unsubs = [];
  clearInterval(hbTimer); clearInterval(dutyTimer); clearInterval(uiTick); clearTimeout(botTimer); clearTimeout(resultsTimer);
  S = null; serverS = null; seats = []; chat = []; picks = {}; code = null; inflight = 0; writeChain = Promise.resolve();
  builtKey = ''; gameKey = ''; feedKey = ''; myPicks = []; myPicksKey = ''; announcedTurn = '';
  endDrag();
  for (const k in lastSeen) delete lastSeen[k];
  for (const k in presT) delete presT[k];
  hideModal(); hideInfo();
}

async function openGame(c, join) {
  closeGame(); view = 'game';
  try { if (location.hash !== '#' + c) location.hash = c; } catch (e) { }
  if (MODE === 'p2p') {
    busy('Mi collego alla partita ' + c + '…');
    const ok = await Net.connect();
    if (view !== 'game') return;
    let found = false;
    if (ok) { Net.sub(c); found = await Net.waitDoc('games/' + c, 9000); }
    if (view !== 'game') return;
    if (!found) {
      $('#app').innerHTML = `<div class="home"><div class="panel"><h3>${ok ? 'Non trovo la partita ' + esc(c) : 'Non riesco a collegarmi al server del gioco'}</h3><p class="mut">${ok ? 'Controlla che il codice sia giusto (5 caratteri, come te l’ha mandato chi ha creato la partita).' : 'Controlla la connessione a internet e riprova.'}</p><div class="row"><button class="btn primary" id="rt">Riprova</button><button class="btn" id="bk">Indietro</button></div></div></div>`;
      $('#rt').onclick = () => openGame(c, join); $('#bk').onclick = leave; return;
    }
    const g = Net.cache.get('games/' + c); addRecent(c, g && g.hostName);
  } else addRecent(c, myName);
  code = c;
  busy('Apro la partita ' + c + '…');
  let first = true;
  const t = setTimeout(() => { if (first && code === c) $('#app').innerHTML = '<div class="home"><div class="panel">Non riesco a raggiungere la partita. Controlla la connessione. <button class="btn sm" id="bk">Indietro</button></div></div>', $('#bk') && ($('#bk').onclick = leave); }, 10000);
  unsubs.push(DB.doc('games/' + c).onSnapshot(snap => {
    clearTimeout(t);
    if (!snap.exists) { if (first) { first = false; $('#app').innerHTML = '<div class="home"><div class="panel">Partita non trovata. <button class="btn sm" id="bk">Indietro</button></div></div>'; $('#bk').onclick = leave; } return; }
    const d = clone(snap.data()); serverS = d;
    if (first && join && d.status === 'lobby' && !seats.some(s => s.id === myId)) {
      DB.doc(`games/${c}/seats/${myId}`).set({ id: myId, name: myName || 'Giocatore', t: Date.now() }).catch(writeErr);
    }
    first = false;
    if (S && inflight > 0 && (d.v || 0) < (S.v || 0)) return;
    applyState(d);
  }, () => toast('Connessione alla partita persa.', 'warn')));
  unsubs.push(DB.collection(`games/${c}/seats`).onSnapshot(s => { seats = s.docs.map(d => d.data()).sort((a, b) => a.t - b.t); if (S && S.status === 'lobby') renderLobby(); }, () => { }));
  unsubs.push(DB.collection(`games/${c}/chat`).orderBy('t', 'desc').limit(60).onSnapshot(s => { chat = s.docs.map(d => d.data()).reverse(); onChat(); }, () => { }));
  unsubs.push(DB.collection(`games/${c}/picks`).onSnapshot(s => { picks = {}; s.docs.forEach(d => { const x = d.data(); if (x && x.id) picks[x.id] = x; }); if (S && S.status === 'playing' && view === 'game') { renderGame(); dutyTick(); } }, () => { }));
  unsubs.push(DB.collection(`games/${c}/pres`).onSnapshot(s => {
    const now = Date.now();
    s.docs.forEach(d => { const x = d.data(); if (!x || !x.id) return;
      if (presT[x.id] === undefined) lastSeen[x.id] = now - x.t < 30000 ? now : x.t;
      else if (presT[x.id] !== x.t) lastSeen[x.id] = now;
      presT[x.id] = x.t; });
  }, () => { }));
  const beat = () => { if (code === c && DB) DB.doc(`games/${c}/pres/${myId}`).set({ id: myId, t: Date.now() }).catch(() => { }); };
  beat(); hbTimer = setInterval(beat, 5000);
  openedAt = Date.now();
  dutyTimer = setInterval(dutyTick, 1000);
  uiTick = setInterval(tickUI, 500);
}

function leave() {
  if (S && S.status === 'lobby' && code && DB) DB.doc(`games/${code}/seats/${myId}`).delete().catch(() => { });
  const cc = code; closeGame(); view = 'home';
  if (MODE === 'p2p' && cc) setTimeout(() => Net.unsub(cc), 400);
  try { history.replaceState(null, '', location.pathname + location.search) } catch (e) { try { location.hash = '' } catch (_) { } }
  renderHome();
}

/* scrive il nuovo stato (copia, modifica, pubblica) */
function act(fn) {
  if (!S) return false;
  if (MODE === 'claude' && !CANWRITE) { toast('Puoi solo guardare questa partita'); return false; }
  const N = clone(S);
  if (fn(N) === false) return false;
  N.v = (S.v || 0) + 1; N.upd = Date.now();
  applyState(N);
  inflight++;
  writeChain = writeChain.then(() => DB.doc('games/' + code).set(N)).then(() => { inflight--; }, e => { inflight--; writeErr(e); if (serverS) applyState(clone(serverS)); });
  return true;
}
function afterGameChange(N, before, ph) {
  if (N.game.phase === 'gameEnd') { N.status = 'ended'; N.ended = Date.now(); N.away = {}; }
  if (before !== N.game.turnNo || ph !== N.game.phase) N.tAt = Date.now();
}
/* una o più azioni di gioco passate al motore delle regole */
function gameAct(list, quiet) {
  if (!Array.isArray(list)) list = [list];
  let res = null;
  const ok = act(N => {
    if (!N.game || N.status !== 'playing') return false;
    const before = N.game.turnNo, ph = N.game.phase;
    for (const a of list) { if (!a) return false; res = E.applyAction(N.game, a); if (!res.ok) return false; }
    afterGameChange(N, before, ph);
  });
  if (!ok && res && !res.ok && !quiet) toast(res.error, 'warn');
  return ok;
}

function applyState(d) {
  S = d;
  if (view !== 'game') return;
  if (S.status === 'lobby') { builtKey = ''; renderLobby(); return; }
  renderGame();
  saveGameStats();
}

    <div class="panel">

  if (!isHost) return;

  document.querySelectorAll('#fMode button').forEach(b => b.onclick = () => upd('mode', b.dataset.v));
  const fr = $('#fRounds'); if (fr) fr.onchange = () => upd('rounds', +fr.value);
  document.querySelectorAll('[data-opt]').forEach(el => el.onchange = () => {
    const k = el.dataset.opt;
    upd(k, el.type === 'checkbox' ? el.checked : (/^\d+$/.test(el.value) ? +el.value : el.value));
  });
  $('#addbot').onclick = () => act(N => {
    const used = new Set((N.extras || []).map(x => x.name));

  $('#start').onclick = startMatch;
}

function startMatch() {
  const humans = seats.map(s => ({ id: s.id, name: s.name || 'Giocatore', bot: false }));
  act(N => {
    const ex = (N.extras || []).map(x => ({ id: x.id, name: x.name, bot: true }));
    const all = [...humans, ...ex].slice(0, MAXP);
    if (all.length < 2) return false;
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
    N.game = E.createGame(all, Object.assign({}, N.settings));
    N.status = 'playing'; N.started = Date.now(); N.away = {}; N.disc = {}; N.tAt = Date.now(); N.ended = null;
  });
}

/* =========================================================
   COMPITI DI "REGIA" (bot, timer, disconnessioni, carte scoperte)
   Li svolge un solo dispositivo: chi ha creato la partita,
   oppure, se è offline, il primo giocatore ancora collegato.
   ========================================================= */
function isPresent(id) { return id === myId || (lastSeen[id] && Date.now() - lastSeen[id] < 16000); }
function dutyId() {
  if (!S) return null;
  if (!S.game) return S.host;
  const humans = S.game.players.filter(p => !p.bot && p.status !== 'disconnesso');
  const order = [S.host, ...humans.map(p => p.id)];
  for (const id of order) if (humans.some(p => p.id === id) && isPresent(id)) return id;
  return S.host;
}
const pickKey = () => S ? (S.started || 0) + ':' + (S.game ? S.game.round : 0) : '';
function dutyTick() {
  if (!S || view !== 'game' || S.status !== 'playing' || !S.game) return;
  if (dutyId() !== myId) return;
  const G = S.game, now = Date.now();
  const wait = (G.options.disconnectWait || 60) * 1000;
  if (now - openedAt > 15000) for (const p of G.players) {
    if (p.bot || p.status === 'disconnesso' || p.id === myId) continue;
    const here = isPresent(p.id), away = S.away && S.away[p.id];
    if (!here && !away) {
      return act(N => { N.away = N.away || {}; N.disc = N.disc || {};
        N.away[p.id] = { since: now, until: now + wait }; N.disc[p.id] = (N.disc[p.id] || 0) + 1;
        chatSys(N, `🔌 ${p.name} si è disconnesso: lo aspettiamo ${fmtTime(wait)}.`); });
    }
    if (here && away) return act(N => { delete N.away[p.id]; chatSys(N, `✅ ${p.name} è tornato!`); });
    if (away && now > away.until) {
      return act(N => {
        delete N.away[p.id];
        E.removePlayer(N.game, p.id);
        if (N.game.phase === 'gameEnd') { N.status = 'ended'; N.ended = Date.now(); }
        N.tAt = Date.now();
      });
    }
  }
  const t = G.options.turnTimer;
  // inizio mano: raccolgo le carte scelte da tutti
  if (G.phase === 'reveal') {
    const list = [];
    const late = t && now - (S.tAt || now) > t * 1000 + 800;
    G.players.forEach((p, i) => {
      if (p.status !== 'in' || p.revealed) return;
      const pk = picks[p.id];
      if (pk && pk.k === pickKey() && Array.isArray(pk.cells) && pk.cells.length === 2) list.push({ type: 'reveal', player: p.id, cells: pk.cells });
      else if (p.bot && now - (S.tAt || now) > 1400) list.push(B.botReveal(G, i));
      else if (!p.bot && late && !(S.away && S.away[p.id])) { const a = B.botReveal(G, i); a.auto = true; list.push(a); }
    });
    if (list.length) return gameAct(list, true);
    return;
  }
  // tempo per turno: il gioco fa la mossa al posto tuo
  if (t && G.phase === 'turn') {
    const ap = G.players[G.turn];
    if (ap && !ap.bot && !(S.away && S.away[ap.id]) && now - (S.tAt || now) > t * 1000 + 800) autoTurn('⏱ Tempo scaduto per ' + ap.name + ': mossa automatica.');
  }
}
function autoTurn(msg) {
  act(N => {
    const G = N.game; if (!G || G.phase !== 'turn') return false;
    const before = G.turnNo, ph = G.phase, i = G.turn;
    chatSys(N, msg);
    for (let k = 0; k < 8 && G.phase === 'turn' && G.turn === i && G.turnNo === before; k++) {
      const a = B.botAction(G, i); if (!a) break;
      a.auto = true;
      if (!E.applyAction(G, a).ok) break;
    }
    afterGameChange(N, before, ph);
  });
}
function chatSys(N, msg) { if (!N.game) return; N.game.log.push({ n: ++N.game.logSeq, msg, kind: 'warn', t: Date.now() }); }

function scheduleBots() {
  if (!S || S.status !== 'playing' || !S.game) return;
  if (dutyId() !== myId) return;
  const G = S.game;
  if (G.phase !== 'turn') return;
  const p = G.players[G.turn];
  if (!p || !p.bot) return;
  const key = S.code + ':' + S.v;
  if (botFor === key) return; botFor = key;
  clearTimeout(botTimer);
  const v = S.v;
  const delay = G.step === 'choose' ? 1100 + Math.random() * 700 : G.step === 'place' ? 900 + Math.random() * 500 : 750;
  botTimer = setTimeout(() => {
    if (!S || S.v !== v || !S.game || S.game.phase !== 'turn') return;
    const g = S.game; const i = g.turn;
    if (!g.players[i].bot) return;
    const a = B.botAction(g, i);
    if (!(a && gameAct(a, true))) autoTurn('🤖 ' + g.players[i].name + ' ci ripensa.');
  }, delay);
}

/* =========================================================
   INTERFACCIA DI GIOCO
   ========================================================= */
const G_ = () => S && S.game;
const myIdx = () => S && S.game ? S.game.players.findIndex(p => p.id === myId) : -1;
function isMyTurn() { const G = G_(); return !!(G && S.status === 'playing' && G.phase === 'turn' && G.players[G.turn] && G.players[G.turn].id === myId && !(S.away && S.away[myId])); }
function myStep() { return isMyTurn() ? S.game.step : null; }
function needReveal() {
  const G = G_(); const i = myIdx();
  return !!(G && S.status === 'playing' && G.phase === 'reveal' && i >= 0 && G.players[i].status === 'in' && !G.players[i].revealed);
}
function syncPicks() {
  const k = pickKey();
  if (myPicksKey !== k) { myPicksKey = k; myPicks = []; const pk = picks[myId]; if (pk && pk.k === k) myPicks = pk.cells.slice(); }
}

/* posizioni delle carte prima di ridisegnare: servono per le animazioni */
function snapRects() {
  const m = new Map();
  document.querySelectorAll('#game [data-cid]').forEach(el => { if (!el.closest('.dragghost')) m.set(el.dataset.cid, { r: el.getBoundingClientRect(), up: el.classList.contains('up') }); });
  return m;
}

function renderGame() {
  const G = G_(); if (!G) return;
  if (drag && drag.started) { pendingRender = true; return; }
  const key = S.code + ':' + (S.started || 0);
  let fresh = false;
  if (key !== gameKey) { gameKey = key; resultsReadyAt = 0; lastEventN = G.events.length ? G.events[G.events.length - 1].n : 0; fresh = true; }
  const prev = (builtKey === key && $('#game') && !fresh) ? snapRects() : null;
  if (builtKey !== key || !$('#game')) { buildGameUI(); builtKey = key; }
  RKEY = G.round;
  syncPicks();
  const newEv = G.events.filter(e => e.n > lastEventN);
  const me = myIdx();
  renderTop(G, me);
  renderOpponents(G, me);
  renderCenter(G, me);
  renderMe(G, me);
  renderFeed();
  animateFrom(prev, newEv, G);
  handleEvents(G);
  renderAway();
  renderModal(G);
  tickUI();
  scheduleBots();
}

function renderTop(G, me) {
  const o = G.options;
  const small = window.innerWidth < 600;
  const p = me >= 0 ? G.players[me] : null;
  const tot = E.totalRounds(G);
  const modeT = o.mode === 'torneo' ? `Torneo · mano ${G.round} di ${tot}` : o.mode === 'soglia' ? `Fino a 100 · mano ${G.round}` : 'Partita singola';
  let t;
  if (small) t = o.mode !== 'singola' ? `Mano ${G.round}${o.mode === 'torneo' ? '/' + tot : ''}${p ? ` · <b>${p.total}</b> pt` : ''}` : `<span class="code-sm">${esc(S.code)}</span>`;
  else { t = modeT + ` · codice <b>${esc(S.code)}</b>`; if (o.mode !== 'singola' && p) t += ` · i tuoi punti: <b>${p.total}</b>`; }
  $('#roundInfo').innerHTML = t;
}

function renderOpponents(G, me) {
  const n = G.players.length, start = me >= 0 ? me : -1;
  let html = '', cnt = 0;
  for (let k = 1; k <= n; k++) {
    const i = (start + k + n) % n;
    if (i === me) continue;
    cnt++;
    const p = G.players[i];
    const away = S.away && S.away[p.id];
    const active = G.phase === 'turn' && G.turn === i;
    let tag = '';
    if (p.status === 'disconnesso') tag = '<span class="tag">disconnesso</span>';
    else if (away) tag = '<span class="tag off">offline</span>';
    else if (G.phase === 'reveal') tag = p.revealed ? '<span class="tag ok">✓ pronto</span>' : '<span class="tag think">sceglie…</span>';
    else if (active && p.bot) tag = '<span class="tag think">🤔</span>';
    if (G.closer === p.id && G.phase === 'turn') tag += '<span class="tag closer">🏁 ha chiuso</span>';
    const vis = E.visibleScore(p.grid), down = E.downCount(p.grid);
    html += `<div class="opp ${active ? 'active' : ''} ${p.status} ${away ? 'away' : ''}">
      <div class="ohead">${avatar(p, i)}<span class="oname">${esc(p.name)}</span>${tag}</div>
      ${p.status === 'disconnesso' ? '' : gridHTML(p.grid, { cls: 'mini', card: ['mini'], emptyText: 'vuota!' })}
      <div class="osc">${p.status === 'disconnesso' ? '' : `<b>${vis}</b> visibili${down ? ` · ${down} coperte` : ''}`}${G.options.mode !== 'singola' ? `<br>${p.total} punti` : ''}</div></div>`;
  }
  const el = $('#opponents'); el.innerHTML = html; el.classList.toggle('few', cnt <= 2);
}

function pileRot(id) { const h = (id * 2654435761) >>> 0; return { r: (h % 17) - 8, x: (h >> 5) % 7 - 3, y: (h >> 9) % 7 - 3 }; }
function renderCenter(G, me) {
  const step = myStep();
  const deck = $('#deckPile');
  const canDeck = step === 'choose';
  deck.className = 'stack deck' + (canDeck ? ' can' : '');
  deck.innerHTML = G.deck.length || G.discard.length > 1
    ? cardHTML({ v: 0, c: 0, up: false }, { noid: true }) + cardHTML({ v: 0, c: 0, up: false }, { noid: true }) + cardHTML({ v: 0, c: 0, up: false }, { noid: true })
    : '<div class="empty">vuoto</div>';
  $('#deckN').textContent = G.deck.length ? '· ' + G.deck.length : '';
  const dp = $('#discardPile');
  const canTake = step === 'choose' && G.discard.length;
  const canDrop = step === 'place' && G.hold && G.hold.from === 'deck';
  dp.className = 'stack discard' + (canTake || canDrop ? ' can' : '');
  const show = G.discard.slice(-4);
  dp.innerHTML = show.length ? show.map((c, k) => {
    const pr = pileRot(c.id), top = k === show.length - 1;
    return `<div style="position:absolute;inset:0;transform:rotate(${pr.r}deg) translate(${pr.x}px,${pr.y}px)">${cardHTML(c, { cls: top ? ['top'].concat(canTake ? ['can'] : []) : [], attrs: top && canTake ? 'data-drag="discard"' : '' })}</div>`;
  }).join('') : '<div class="empty">vuoto</div>';
  const hs = $('#holdSlot');
  if (G.hold && G.phase === 'turn') {
    const who = G.players[G.turn];
    const mine = who.id === myId && step === 'place';
    hs.className = 'holdslot has' + (mine ? ' mine' : '');
    hs.innerHTML = cardHTML(G.hold.card, { attrs: mine ? 'data-drag="hold"' : '' });
    $('#holdLbl').textContent = who.id === myId ? (G.hold.from === 'deck' ? 'HAI PESCATO' : 'DAGLI SCARTI') : (who.name.toUpperCase().slice(0, 12) + (G.hold.from === 'deck' ? ' HA PESCATO' : ' PRENDE'));
  } else { hs.className = 'holdslot'; hs.innerHTML = ''; $('#holdLbl').innerHTML = '&nbsp;'; }
  const st = $('#status');
  st.innerHTML = statusText(G, me);
  st.className = 'status' + (isMyTurn() || needReveal() ? ' mine' : '');
}

function statusText(G, me) {
  const last = G.phase === 'turn' && G.closer ? `<span class="lastround">🏁 Ultimo giro</span> ` : '';
  if (S.status === 'ended') return 'Partita finita';
  if (G.phase === 'reveal') {
    if (needReveal()) return myPicks.length >= 2 ? 'Fatto! Aspettiamo gli altri…' : `Tocca 2 carte della tua griglia per scoprirle (${myPicks.length}/2)`;
    return 'Tutti scoprono 2 carte: aspettiamo gli altri…';
  }
  if (G.phase !== 'turn') return '';
  const p = G.players[G.turn];
  if (p.id !== myId) {
    if (S.away && S.away[p.id]) return last + `Aspettiamo ${esc(p.name)}…`;
    return last + `Tocca a <b>${esc(p.name)}</b>`;
  }
  switch (G.step) {
    case 'choose': return last + 'Tocca a te! Prendi la carta degli scarti o pesca dal mazzo';
    case 'place': return last + (G.hold.from === 'discard' ? 'Mettila al posto di una carta della tua griglia' : 'Mettila nella tua griglia oppure buttala negli scarti');
    case 'flip': return last + 'Ora gira una delle tue carte coperte';
    case 'pickHilo': return '✨ Più di un tris di colore: scegli quale togliere';
    case 'compact': return '✨ Diagonale tolta! Scegli come avvicinare le carte';
  }
  return '';
}

function renderMe(G, me) {
  const box = $('#meArea');
  if (me < 0) { box.innerHTML = '<div class="mut small">Stai guardando la partita.</div>'; box.className = 'me'; return; }
  const p = G.players[me];
  if (p.status === 'disconnesso') { box.innerHTML = '<div class="mut">Sei stato tolto dalla partita perché eri disconnesso da troppo tempo.</div>'; box.className = 'me'; return; }
  const step = myStep(), rev = needReveal();
  const hiloCells = new Set();
  if (step === 'pickHilo' && G.hiloChoices) G.hiloChoices.forEach(l => l.cells.forEach(i => hiloCells.add(i)));
  if (step === 'compact' && G.pendingDiag) G.pendingDiag.cells.forEach(i => hiloCells.add(i));
  const grid = gridHTML(p.grid, {
    emptyText: 'Nessuna carta: 0 punti!',
    cell: (i, x) => {
      const r = { cls: '', attrs: `data-cell="${i}"` };
      if (rev) { if (myPicks.includes(i)) { r.cls = 'picked'; r.show = true; } else if (myPicks.length < 2 && !x.up) r.cls = 'pick'; }
      else if (step === 'place') r.cls = 'target';
      else if (step === 'flip' && !x.up) r.cls = 'pick';
      else if (hiloCells.has(i)) r.cls = 'hl';
      return r;
    }
  });
  const vis = E.visibleScore(p.grid) + (rev ? myPicks.reduce((t, i) => t + (p.grid.cells[i] && !p.grid.cells[i].up ? p.grid.cells[i].v : 0), 0) : 0);
  const down = E.downCount(p.grid) - (rev ? myPicks.length : 0);
  let actions = '', hint = '';
  if (step === 'choose') hint = 'Trascina la carta degli scarti su una casella, oppure tocca il mazzo per pescare.';
  else if (step === 'place') {
    if (G.hold.from === 'deck') { actions = `<button class="btn" id="discardBtn">🗑 Buttala negli scarti e gira una carta</button>`; hint = 'Trascinala (o tocca la casella) per scambiarla con una tua carta.'; }
    else hint = 'Presa dagli scarti: va messa per forza nella tua griglia.';
  } else if (step === 'pickHilo') {
    const name = l => { const kind = l.kind; const g = p.grid; if (kind === 'row') return 'la riga ' + (Math.floor(l.cells[0] / g.c) + 1); if (kind === 'col') return 'la colonna ' + (l.cells[0] % g.c + 1); return l.cells[0] === 0 ? 'la diagonale ↘' : 'la diagonale ↙'; };
    actions = G.hiloChoices.map((l, k) => { const sum = l.cells.reduce((t, i) => t + p.grid.cells[i].v, 0); return `<button class="btn primary" data-hilo="${k}">Togli ${name(l)} (${sum} punti)</button>`; }).join('');
  } else if (step === 'compact') {
    const prev = dir => { const g = E.cloneGrid(p.grid); E.removeLine(g, G.pendingDiag, dir); return gridHTML(g, { noid: true }); };
    actions = `<button class="choice" data-compact="left">${prev('left')}<b>⬅ Fai scivolare a sinistra</b></button><button class="choice" data-compact="down">${prev('down')}<b>⬇ Fai scendere</b></button>`;
    hint = 'Le carte della diagonale se ne vanno: scegli come richiudere la griglia.';
  } else if (rev && myPicks.length < 2) hint = 'Scegli bene: comincia chi scopre la somma più alta.';
  const closer = G.closer === p.id && G.phase === 'turn' ? '<span class="tag closer">🏁 hai chiuso</span>' : '';
  box.className = 'me' + (isMyTurn() || rev ? ' active' : '');
  box.innerHTML = `<div class="mehead">${avatar(p, me, 30)}<b>${esc(p.name)}</b>${closer}<span class="sc">carte scoperte: <b>${vis}</b>${down > 0 ? ` · ${down} coperte` : ''}${G.options.mode !== 'singola' ? ` · totale <b>${p.total}</b>` : ''}</span></div>
    <div class="mebody"><div>${grid}</div>${actions || hint ? `<div class="meside">${actions ? `<div class="actions">${actions}</div>` : ''}${hint ? `<div class="hint">${hint}</div>` : ''}</div>` : ''}</div>`;
  const sk = gameKey + ':' + G.turnNo + ':' + step;
  if ((step === 'pickHilo' || step === 'compact' || step === 'place') && box._sk !== sk) {
    box._sk = sk;
    const el = box.querySelector('.actions');
    if (el) setTimeout(() => { try { el.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' }); } catch (e) { } }, 60);
  }
}

/* ---------- animazioni: ogni carta vola dalla posizione di prima a quella nuova ---------- */
function animateFrom(prev, newEv, G) {
  if (!prev || reduced()) return;
  const hilo = new Set(); let deal = false;
  newEv.forEach(e => { if (e.type === 'hilo') e.cards.forEach(id => hilo.add(RKEY + ':' + id)); if (e.type === 'roundStart') deal = true; });
  const deckEl = $('#deckPile'); const dr = deckEl ? deckEl.getBoundingClientRect() : null;
  let k = 0;
  const sparkAt = [];
  document.querySelectorAll('#game [data-cid]').forEach(el => {
    const cid = el.dataset.cid; const p = prev.get(cid); const r = el.getBoundingClientRect();
    if (!r.width) return;
    const up = el.classList.contains('up');
    let from = p ? p.r : (dr && prev.size ? dr : null);
    let delay = 0;
    if (!p && deal) { delay = (k++) * 35; }
    if (from) {
      const dx = from.left - r.left, dy = from.top - r.top, sc = from.width / r.width;
      const moved = Math.abs(dx) > 2 || Math.abs(dy) > 2 || Math.abs(sc - 1) > .03;
      if (moved) {
        const base = `translate(${dx}px,${dy}px) scale(${sc})`;
        el.style.zIndex = 20;
        let a;
        if (hilo.has(cid)) {
          sparkAt.push(from);
          a = el.animate([
            { transform: base, filter: 'drop-shadow(0 0 0 rgba(255,212,59,0))' },
            { transform: base + ' scale(1.16)', filter: 'drop-shadow(0 0 14px rgba(255,212,59,.95))', offset: .3 },
            { transform: base + ' scale(1.16)', filter: 'drop-shadow(0 0 14px rgba(255,212,59,.95))', offset: .5 },
            { transform: 'none', filter: 'drop-shadow(0 0 0 rgba(255,212,59,0))' }], { duration: 1300, easing: 'ease-in-out' });
        } else a = el.animate([{ transform: base }, { transform: 'none' }], { duration: deal ? 420 : 520, delay, easing: 'cubic-bezier(.2,.8,.25,1)', fill: 'backwards' });
        a.onfinish = a.oncancel = () => { el.style.zIndex = ''; };
      }
    }
    // la carta si gira
    if (up && ((p && !p.up) || (!p && prev.size && !deal))) flipAnim(el, delay + (p ? 0 : 260));
  });
  sparkAt.slice(0, 3).forEach(r => sparks(r));
}
function flipAnim(el, delay) {
  const f = el.querySelector('.f'); if (!f) return;
  const back = document.createElement('div');
  back.className = 'f'; back.innerHTML = '<span class="bk"><i>▲</i><i>▼</i></span>';
  back.style.cssText = 'background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 4px,transparent 4px 9px),linear-gradient(150deg,#20c997,#0f766e 55%,#134e4a);border:calc(var(--w,var(--cw))*.045) solid #e6fcf5';
  back.querySelector('.bk').style.cssText = 'position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.85);font-weight:700;font-size:calc(var(--w,var(--cw))*.34);line-height:.8;text-align:center';
  el.appendChild(back);
  back.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: 170, delay, easing: 'ease-in', fill: 'forwards' });
  f.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(0)', offset: .5 }, { transform: 'scaleX(1)' }], { duration: 340, delay, easing: 'ease-out', fill: 'backwards' });
  setTimeout(() => back.remove(), delay + 200);
}
function sparks(r) {
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 7; i++) {
    const s = document.createElement('div'); s.className = 'spark'; s.textContent = ['✨', '⭐', '✦'][i % 3];
    s.style.left = cx + 'px'; s.style.top = cy + 'px'; document.body.appendChild(s);
    const ang = Math.PI * 2 * i / 7, d = 50 + Math.random() * 30;
    s.animate([{ transform: 'translate(-50%,-50%) scale(.4)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(ang) * d}px),calc(-50% + ${Math.sin(ang) * d}px)) scale(1)`, opacity: 0 }], { duration: 900, easing: 'ease-out' }).onfinish = () => s.remove();
  }
}

/* ---------- eventi -> avvisi ---------- */
function nameOf(id) { const p = S.game.players.find(p => p.id === id); return p ? p.name : '?'; }
function handleEvents(G) {
  for (const e of G.events) {
    if (e.n <= lastEventN) continue;
    lastEventN = e.n;
    switch (e.type) {
      case 'hilo': toast(e.player === myId ? '✨ Tris di colore!' : `✨ ${nameOf(e.player)} fa tris di colore!`, e.player === myId ? 'big' : 'good'); break;
      case 'closing': toast(e.player === myId ? '🏁 Hai chiuso: ultimo turno per gli altri!' : `🏁 ${nameOf(e.player)} ha chiuso: ultimo turno!`, 'warn'); break;
      case 'turnsStart': if (e.player !== myId) toast(`Comincia ${nameOf(e.player)}`); break;
      case 'reshuffle': toast('🔄 Mazzo finito: rimescolo gli scarti'); break;

}
function roundsTable(G) {
