<style>
:root{
  --bg:#1d1a2f; --bg2:#262142; --panel:#2b2550; --panel2:#342d60; --line:rgba(255,255,255,.10);
  --text:#f4f1ff; --muted:#b4acd6; --accent:#f06595; --accent2:#faa2c1; --violet:#7c4dff;
  --ok:#22c55e; --bad:#f43f5e; --radius:14px;
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{background:radial-gradient(1200px 700px at 50% -10%,#5a1838 0%,var(--bg) 62%) fixed}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- pulsanti ---------- */
.btn{border:1px solid var(--line);background:var(--panel2);padding:.55em 1em;border-radius:12px;cursor:pointer;font-weight:600;transition:transform .12s,background .12s,opacity .12s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#3e3672}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(135deg,#d6336c,#f06595 55%,#faa2c1);border:none;color:#2b0614}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#e64980,#f783ac 55%,#fcc2d7)}
.btn.go{background:#22c55e;color:#06260f;border:none}
.btn.go:hover:not(:disabled){background:#34d36d}
.btn.pulse:not(:disabled){animation:pulse 1.4s infinite}
.btn.warn{background:#c2410c;border:none}
.btn.ghost{background:transparent}
.btn.sm{padding:.4em .75em;font-size:.86rem;border-radius:9px}
.btn.big{padding:.8em 1.6em;font-size:1.08rem}
.btn.on{outline:2px solid var(--accent);outline-offset:1px;background:#4a2038}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,101,149,.55)}50%{box-shadow:0 0 0 8px rgba(240,101,149,0)}}

/* ---------- logo ---------- */
.logo{font-weight:700;font-size:3.6rem;letter-spacing:-.02em;line-height:1;display:inline-flex;align-items:center;gap:.2em;transform:rotate(-3deg);filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.logo .lt{background:linear-gradient(90deg,#ffdeeb,#f06595 45%,#c2255c);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .ico{display:inline-flex;width:1.15em;height:1.15em}
.logo .ico svg{width:100%;height:100%}
.logo.sm{font-size:1.7rem}
.logo.xs{font-size:1.35rem}

/* ---------- home e lobby ---------- */
body.v-home,body.v-lobby{overflow-y:auto}
body.v-game{overflow:hidden}
.home{max-width:780px;margin:0 auto;padding:30px 16px 60px;display:flex;flex-direction:column;gap:16px;position:relative}
.hero{text-align:center;margin-bottom:4px}
.gamepill{display:table;margin:0 auto 14px;background:#fcc2d7;color:#2b0614;font-weight:700;letter-spacing:.14em;font-size:.75rem;padding:5px 16px;border-radius:99px}
.tagline{color:var(--muted);margin:16px auto 0;max-width:54ch}
.hubbtn{text-decoration:none;color:var(--text);width:max-content;display:inline-flex;align-items:center;gap:6px}
.panel{background:rgba(43,37,80,.78);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(6px)}
.panel h3{margin:0 0 12px;font-size:1.15rem;font-weight:600}
.mut{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.mid{justify-content:center}
.banner{background:#3a2a10;border:1px solid #7c5a10;color:#ffe2a8;border-radius:14px;padding:12px 14px;font-size:.9rem}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gitem{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.medal{font-size:1.2rem;font-weight:700;color:var(--accent);width:40px;text-align:center}
.bigcode{font-size:2.6rem;font-weight:700;letter-spacing:8px;color:var(--accent);margin:4px 0}
.netst{color:#fde68a}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.seat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.tile{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tile b{font-size:1.4rem;color:var(--accent)}.tile span{font-size:.78rem;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sitem span{color:var(--muted)}
input,select,textarea{font:inherit;color:var(--text);background:#1f1b38;border:1px solid var(--line);border-radius:10px;padding:.6em .7em}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;min-height:90px;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.flabel{font-size:.85rem;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.seg button{background:#1f1b38;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.seg button small{color:var(--muted);font-size:.8rem}
.seg button.on{border-color:var(--accent);background:#3a1c2c}
.inline{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.group{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.group h4{margin:4px 0 6px;font-size:1rem;color:var(--accent2);font-weight:600}
.opt{border-radius:12px;padding:8px 10px;margin:4px 0;background:rgba(255,255,255,.03)}
.opt.dis{opacity:.55}
.opt-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.opt-label{font-weight:500}
.opt select{max-width:58%}
.opt details{margin-top:4px}
.opt summary{cursor:pointer;color:var(--muted);font-size:.82rem;list-style:none;display:inline-flex;gap:4px;align-items:center}
.opt summary::-webkit-details-marker{display:none}
.opt summary::before{content:'▸';transition:transform .15s}
.opt details[open] summary::before{transform:rotate(90deg)}
.opt .help{font-size:.88rem;color:#ece6ff;line-height:1.45;padding:6px 2px 2px}
.opt .help ul{margin:.3em 0;padding-left:1.2em}
.opt .note{display:block;margin-top:4px}
.switch{position:relative;width:46px;height:26px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#443c70;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:#22c55e}
.switch input:checked+span::after{transform:translateX(20px)}
.opt select:disabled,.seg button:disabled,.switch input:disabled+span{opacity:.6;cursor:default}

/* ---------- avatar ---------- */

.tablewrap{flex:1;min-height:0;position:relative;margin:0 10px;border-radius:22px;background:radial-gradient(ellipse at 50% 45%,#3b1d33 0%,#2a1628 55%,#1f1222 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),inset 0 10px 40px rgba(0,0,0,.35);overflow:hidden}

@keyframes shufl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(6deg)}}
.prog{width:200px;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.prog b{display:block;height:100%;background:var(--accent);transition:width .3s}
.bignum{font-size:5.5rem;line-height:1;font-weight:700;color:#ffd43b;text-shadow:0 6px 20px rgba(0,0,0,.5);animation:cd .9s ease-out both}

.bar{display:flex;align-items:center;gap:10px;padding:8px 12px 10px;flex-wrap:wrap;justify-content:center;background:rgba(20,18,34,.78);border-top:1px solid var(--line);margin-top:8px;min-height:60px}

.ballot.dragging{position:fixed;z-index:90;pointer-events:none;transform:translate(-50%,-50%) rotate(-6deg);cursor:grabbing}
.cluein{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.cluein .why{font-size:.82rem;min-height:1.1em}

/* ---------- modali ---------- */
.modal{position:fixed;inset:0;background:rgba(10,8,20,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(3px)}

#sheet{z-index:55}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:700px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:rise .25s ease-out}

.modal-box h2{margin:0 0 6px}

.winner{font-size:1.4rem;font-weight:700;margin:4px 0 8px}

.flipin .card-in{animation:flipin .8s ease-out both}

.check{font-size:.88rem;border-radius:10px;padding:8px 10px;margin:8px 0}
.check.good{background:rgba(34,197,94,.15);color:#d1ffe0}
.check.bad{background:rgba(244,63,94,.18);color:#ffd5dc}
.check.wait{background:rgba(255,255,255,.06);color:var(--muted)}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:10px 0}

.rolei .av{width:28px;height:28px;font-size:.85rem}

<script id="cryptosrc">
/* =========================================================
   IMPOSTORE — mescolata segreta a più mani
   Nessun dispositivo (nemmeno la regia) sa chi è l'impostore,
   e l'impostore non riceve mai la parola.
   Cifratura ElGamal sul gruppo MODP a 1536 bit (RFC 3526):
   - ogni giocatore ha una chiave segreta x_i; la chiave comune è
     H = prodotto delle h_i = g^x_i;
   - un messaggio si decifra solo con TUTTE le chiavi;
   - ogni giocatore, a turno, ricifra e mescola il mazzo delle
     parole e poi quello dei ruoli;
   - la carta j va al giocatore j: gli altri pubblicano la loro
     "quota" per la parte-parola di quella carta, e solo lui può
     completare la decifratura con la sua chiave;
   - la parte-ruolo si apre solo per l'accusato, con le quote di
     tutti (con prova di correttezza);

  function rbytes(n) {
    const a = new Uint8Array(n);
    const c = (typeof globalThis !== 'undefined' && globalThis.crypto) || null;

  const K = [], H0 = [];

<script>
/* =========================================================
   IMPOSTORE — motore delle regole (nessuna grafica, nessuna rete)
   La parte segreta (chi è l'impostore, la parola) NON passa da qui:
   il motore riceve solo i risultati pubblici (ruolo dell'accusato,
   controllo di fine manche) come azioni "di sistema".
   ========================================================= */
(function () {
  const W = (typeof module !== 'undefined') ? require('./words.js') : window.ImpWords;
  let rand = Math.random;
  function setRandom(fn) { rand = fn || Math.random; }
  const pick = a => a[Math.floor(rand() * a.length)];

  const DEFAULT_OPTIONS = {
    mode: 'singola',     // singola | torneo
    rounds: 12,          // torneo: 6 | 12 | 18 manche
    cat: 'caso',         // caso | chiave di una categoria
    words: 'classiche',  // classiche | miste | vostre
    custom: '',          // parole vostre (separate da virgole o a capo; coppie con "/")
    impInfo: 'niente',   // niente | categoria | simile
    giri: 0,             // 0 = automatico (3 fino a 6 giocatori, 2 da 7), oppure 1 | 2 | 3
    imps: 1,             // 1 | 2 (2 solo da 7 giocatori)
    wrongVote: 'vince',  // vince | continua
    fast: false,         // niente discussione
    anytime: false,      // l'impostore può tentare quando vuole
    written: false,      // indizi scritti
    clueTimer: 0, talkTimer: 0, voteTimer: 0,
    disconnectWait: 60
  };
  const MINP = 3, MAXP = 12;

  function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
  const stem = s => { const n = norm(s).replace(/ /g, ''); return n.length >= 4 ? n.replace(/[aeiou]$/, '') : n; };
  /* la parola indovinata è giusta? (accenti, maiuscole, singolare/plurale non contano) */
  function sameWord(a, b) { if (!a || !b) return false; const x = norm(a), y = norm(b); return x === y || (stem(x) === stem(y) && Math.abs(x.length - y.length) <= 1); }
  /* l'indizio scritto è troppo vicino alla parola segreta? */
  function clueProblem(clue, word) {
    const c = norm(clue); if (!c) return 'Scrivi un indizio';
    if (c.split(' ').length > 2) return 'Una sola parola';
    if (!word) return null;
    const cw = c.replace(/ /g, ''), w = norm(word).replace(/ /g, '');
    if (cw === w || stem(cw) === stem(w)) return 'È la parola segreta!';
    const sw = stem(w);
    if (sw.length >= 4 && (cw.startsWith(sw) || cw.endsWith(sw))) return 'Contiene la parola segreta';
    const sc = stem(cw);
    if (sc.length >= 4 && w.startsWith(sc)) return 'È troppo simile alla parola segreta';
    return null;
  }

  function parseCustom(txt) {
    const items = String(txt || '').split(/[,\n;]+/).map(s => s.trim()).filter(Boolean).slice(0, 200);
    const words = [], pairs = [];
    for (const it of items) {
      if (it.includes('/')) { const p = it.split('/').map(s => s.trim()).filter(Boolean); if (p.length === 2 && norm(p[0]) !== norm(p[1])) { pairs.push([p[0].slice(0, 30), p[1].slice(0, 30)]); words.push(p[0].slice(0, 30)); } }
      else words.push(it.slice(0, 30));
    }
    const seen = new Set();
    return { words: words.filter(w => { const k = norm(w); if (!k || seen.has(k)) return false; seen.add(k); return true; }), pairs };
  }
  const CUSTOM_MIN = 8, CUSTOM_PAIRS_MIN = 4;
  /* categorie disponibili con queste opzioni */
  function catsFor(o) {
    const simile = o.impInfo === 'simile';
    const cu = parseCustom(o.custom);
    const custom = { key: 'vostre', name: 'Le vostre parole', icon: '✍️', words: cu.words, pairs: cu.pairs };
    const customOk = simile ? cu.pairs.length >= CUSTOM_PAIRS_MIN : cu.words.length >= CUSTOM_MIN;
    if (o.words === 'vostre') return customOk ? [custom] : W.CATS;
    let cats = W.CATS;
    if (o.cat !== 'caso' && W.byKey[o.cat]) cats = [W.byKey[o.cat]];
    if (o.words === 'miste' && customOk) cats = cats.concat([custom]);
    return cats;
  }

  function err(e) { return { ok: false, error: e }; }
  const pl = (G, id) => G.players.find(p => p.id === id);
  const nm = (G, id) => { const p = pl(G, id); return p ? p.name : '?'; };
  function log(G, msg, kind, extra) { G.log.push(Object.assign({ n: ++G.logSeq, msg, kind: kind || 'play', t: Date.now() }, extra || {})); if (G.log.length > 200) G.log.splice(0, G.log.length - 200); }
  function emit(G, ev) { ev.n = ++G.evSeq; G.events.push(ev); if (G.events.length > 40) G.events.splice(0, G.events.length - 40); }
  function newStats() { return { rounds: 0, imp: 0, impWins: 0, civ: 0, civWins: 0, caught: 0, escaped: 0, guessRight: 0, guessWrong: 0, votes: 0, goodVotes: 0, gotVotes: 0, wrongOut: 0, clues: 0, skips: 0, pts: 0, streak: 0, bestStreak: 0, firstVoteHit: 0 }; }

  function createGame(players, options) {
    const o = Object.assign({}, DEFAULT_OPTIONS, options || {});
    const G = {
      options: o,
      players: players.slice(0, MAXP).map(p => ({ id: p.id, name: p.name, status: 'in', pts: 0, st: newStats() })),
      target: o.mode === 'torneo' ? (+o.rounds || 12) : 1,
      round: 0, played: 0, R: null, results: [], used: [], lastCat: null,
      phase: 'deal', winners: null, trick: null, log: [], logSeq: 0, events: [], evSeq: 0
    };
    startRound(G);
    return G;
  }
  const inPlayers = G => G.players.filter(p => p.status === 'in');

  function startRound(G) {
    G.round++;
    const o = G.options, ids = inPlayers(G).map(p => p.id), n = ids.length;
    const simile = o.impInfo === 'simile';
    let cats = catsFor(o);
    if (cats.length > 1 && G.lastCat) cats = cats.filter(c => c.key !== G.lastCat) ;
    const usable = c => (simile ? c.pairs.filter(p => !G.used.some(u => sameWord(u, p[0]))) : c.words.filter(w => !G.used.some(u => sameWord(u, w)))).length >= (simile ? 3 : 6);
    let ok = cats.filter(usable); if (!ok.length) { G.used = []; ok = cats; }
    const cat = pick(ok);
    let cands = simile ? cat.pairs.filter(p => !G.used.some(u => sameWord(u, p[0]))) : cat.words.filter(w => !G.used.some(u => sameWord(u, w)));
    if (cands.length < (simile ? 3 : 6)) cands = simile ? cat.pairs.slice() : cat.words.slice();
    G.lastCat = cat.key;
    const k = (+o.imps === 2 && n >= 7) ? 2 : 1;
    const giri = +o.giri || (n <= 6 ? 3 : 2);
    const starter = Math.floor(rand() * n);
    G.R = {
      n: G.round, cat: cat.key, catName: cat.name, catIcon: cat.icon, cands, simile, k, giri,
      ids, order: ids.slice(starter).concat(ids.slice(0, starter)),
      dealt: {}, out: [], roleOf: {}, caught: [], guesses: [], clues: [], votes: [],
      clue: null, ready: {}, vote: null, voteN: 0, acc: null, accN: 0, guesser: null, verdicts: null, pending: null, cycles: 0, tieOf: null
    };
    G.phase = 'deal';
    log(G, `🎴 Manche ${G.played + 1}${G.target > 1 ? '/' + G.target : ''}: si mescolano le carte…`, 'sys');
    emit(G, { type: 'round', round: G.round });
  }

  const alive = G => G.R.order.filter(id => !G.R.out.includes(id) && pl(G, id).status === 'in');
  const impsLeft = G => G.R.k - G.R.out.filter(id => G.R.roleOf[id] === 'imp' || G.R.guesses.some(g => g.by === id)).length;

  function startClues(G, giri, order, kind) {
    G.R.clue = { giri, giro: 1, order, pos: 0, kind };
    G.phase = 'clue';
    emit(G, { type: 'clues', kind, player: order[0] });
    if (kind === 'tie') log(G, `⚖️ Spareggio: ${order.map(id => nm(G, id)).join(' e ')} dicono un indizio in più.`, 'sys');
    else log(G, `🎤 ${giri > 1 ? `Indizi: ${giri} giri.` : 'Un giro di indizi.'} Comincia ${nm(G, order[0])}.`, 'sys');
  }
  function speaker(G) { const c = G.R.clue; return c ? c.order[c.pos] : null; }
  function advanceClue(G) {
    const c = G.R.clue;
    c.pos++;
    if (c.pos >= c.order.length) { c.pos = 0; c.giro++; }
    if (c.giro > c.giri) return afterClues(G);
    emit(G, { type: 'turn', player: speaker(G) });
  }
  function afterClues(G) {
    const R = G.R, kind = R.clue.kind; R.clue = null;
    if (kind === 'tie') {
      const voters = alive(G).filter(id => !R.tieOf.includes(id));
      return startVote(G, R.tieOf.slice(), voters.length ? voters : alive(G), true);
    }
    if (G.options.fast) return startVote(G, alive(G), alive(G), false);
    G.phase = 'talk'; R.ready = {};
    log(G, '🗣️ Discussione: accuse e difese a voce. Quando siete pronti, si vota.', 'sys');
    emit(G, { type: 'talk' });
  }
  function startVote(G, cands, voters, tie) {
    const R = G.R;
    R.vote = { n: ++R.voteN, cands, voters, commits: {}, reveals: {}, tie: !!tie };
    G.phase = 'vote';
    log(G, tie ? `🗳️ Si rivota solo tra ${cands.map(id => nm(G, id)).join(' e ')}.` : '🗳️ Votate chi pensate sia l\'impostore (voto segreto).', 'sys');
    emit(G, { type: 'vote', tie: !!tie });
  }
  function closeVote(G) {
    const v = G.R.vote; G.phase = 'count';
    if (!Object.keys(v.commits).length) return tally(G);
    emit(G, { type: 'count' });
  }

  function tally(G) {
    const R = G.R, v = R.vote, counts = {};
    for (const id in v.reveals) { const t = v.reveals[id]; if (t) counts[t] = (counts[t] || 0) + 1; }
    const max = Math.max(0, ...Object.values(counts));
    const leaders = max ? v.cands.filter(id => counts[id] === max) : [];
    const rec = { n: v.n, tie: v.tie, votes: Object.assign({}, v.reveals), counts, leaders };
    R.votes.push(rec);
    for (const id in v.reveals) { const p = pl(G, id); if (p && v.reveals[id]) p.st.votes++; }
    emit(G, { type: 'votes', counts, votes: rec.votes, leaders });
    if (leaders.length === 1) return accuse(G, leaders[0]);
    if (leaders.length > 1 && !v.tie) {
      R.tieOf = leaders.slice().sort((a, b) => R.order.indexOf(a) - R.order.indexOf(b));
      log(G, `⚖️ Pareggio tra ${R.tieOf.map(id => nm(G, id)).join(' e ')} (${max} ${max === 1 ? 'voto' : 'voti'}).`, 'warn');
      return startClues(G, 1, R.tieOf.slice(), 'tie');
    }
    log(G, leaders.length ? '⚖️ Di nuovo pareggio: nessuno viene scoperto.' : '🤷 Nessun voto: nessuno viene scoperto.', 'warn');
    noDecision(G);
  }
  function noDecision(G) {
    const R = G.R; R.tieOf = null;
    if (G.options.wrongVote !== 'continua' && R.k === 1) return toCheck(G, { win: 'imp', reason: 'pareggio' });
    R.cycles++;
    if (R.voteN >= R.ids.length + 3) return toCheck(G, { win: 'imp', reason: 'pareggio' });
    startClues(G, 1, alive(G), 'clue');
  }
  function accuse(G, id) {
    const R = G.R; R.tieOf = null;
    R.acc = { pid: id, a: ++R.accN };
    G.phase = 'accuse';
    const c = R.votes[R.votes.length - 1].counts[id] || 0;
    log(G, `👉 ${nm(G, id)} è il più votato (${c} ${c === 1 ? 'voto' : 'voti'}) e deve mostrare la sua carta…`, 'sys');
    emit(G, { type: 'accuse', player: id });
  }
  function afterOut(G) {
    const left = impsLeft(G), civ = alive(G).length - left;
    if (left <= 0) return toCheck(G, { win: 'civ', reason: 'scoperti' });
    if (left >= civ) return toCheck(G, { win: 'imp', reason: 'parita' });
    if (R_cap(G)) return toCheck(G, { win: 'imp', reason: 'pareggio' });
    startClues(G, 1, alive(G), 'clue');
  }
  const R_cap = G => G.R.voteN >= G.R.ids.length + 3;

  function toCheck(G, pending) {
    G.R.pending = pending; G.R.clue = null; G.R.vote = G.R.vote; G.phase = 'check';
    emit(G, { type: 'check', pending: pending.type || pending.win });
  }

  function applyAction(G, actorId, a) { try { return applyInner(G, actorId, a); } catch (e) { return err('Errore: ' + (e && e.message || e)); } }
  function applyInner(G, actorId, a) {
    if (!a || !a.type) return err('Azione non valida');
    const p = pl(G, actorId), R = G.R;
    const isIn = p && p.status === 'in' && R && R.ids.includes(p.id);
    const isAlive = isIn && !R.out.includes(p.id);
    switch (a.type) {
      case 'dealt': {
        if (G.phase !== 'deal' || !isIn) return err('Niente da fare');
        if (a.round !== R.n) return err('Manche diversa');
        R.dealt[p.id] = true;
        if (R.ids.every(id => R.dealt[id])) {
          log(G, '🃏 Carte distribuite: ognuno guarda la sua.', 'sys');
          emit(G, { type: 'dealt' });
          startClues(G, R.giri, R.order.slice(), 'clue');
        }
        return { ok: true };
      }
      case 'clue': {
        if (G.phase !== 'clue') return err('Non è il momento degli indizi');
        if (speaker(G) !== actorId) return err('Non è il tuo turno');
        let text = null;
        if (G.options.written) { text = String(a.text || '').trim().slice(0, 30); if (!norm(text)) return err('Scrivi il tuo indizio'); }
        R.clues.push({ by: p.id, text, giro: R.clue.giro, kind: R.clue.kind, v: R.voteN });
        p.st.clues++;
        log(G, text ? `🎤 ${p.name}: «${text}»` : `🎤 ${p.name} ha detto il suo indizio.`, 'clue', { by: p.id });
        emit(G, { type: 'clue', player: p.id, text });
        advanceClue(G);
        return { ok: true };
      }
      case 'ready': {
        if (G.phase !== 'talk' || !isAlive) return err('Niente da fare');
        if (a.v === false) delete R.ready[p.id]; else R.ready[p.id] = true;
        if (alive(G).every(id => R.ready[id])) startVote(G, alive(G), alive(G), false);
        return { ok: true };
      }
      case 'vote': {
        if (G.phase !== 'vote' || !R.vote.voters.includes(actorId)) return err('Non puoi votare adesso');
        if (a.n !== R.vote.n) return err('Votazione diversa');
        if (typeof a.h !== 'string' || a.h.length < 16) return err('Voto non valido');
        R.vote.commits[p.id] = a.h;
        emit(G, { type: 'voted', player: p.id });
        if (R.vote.voters.every(id => R.vote.commits[id] || pl(G, id).status !== 'in')) closeVote(G);
        return { ok: true };
      }
      case 'unveil': {
        if (G.phase !== 'count' || !R.vote.commits[actorId]) return err('Niente da fare');
        if (a.n !== R.vote.n || R.vote.reveals[actorId] !== undefined) return { ok: true };
        const t = a.target;
        R.vote.reveals[p.id] = (a.hashOk && R.vote.cands.includes(t) && t !== p.id) ? t : null;
        if (!a.hashOk) log(G, `⚠️ Il voto di ${p.name} non corrisponde a quello dato: non vale.`, 'warn');
        if (Object.keys(R.vote.commits).every(id => R.vote.reveals[id] !== undefined || pl(G, id).status !== 'in')) tally(G);
        return { ok: true };
      }
      case 'role': {
        // di sistema: il ruolo dell'accusato, ricostruito con le quote di tutti
        if (G.phase !== 'accuse' || !R.acc || a.pid !== R.acc.pid || a.a !== R.acc.a) return err('Niente da fare');

        if (payload && payload.length) { try { d = JSON.parse(typeof payload === 'string' ? payload : payload.toString()) } catch (e) { return } }
        const old = this.cache.get(p);
        if (d && old && typeof d.v === 'number' && typeof old.v === 'number' && d.v < old.v) return;
        if (d) this.cache.set(p, d); else this.cache.delete(p);
        if (d && d.id && p.includes('/pres/')) onPres(d);
        this.notify();
      });
      setTimeout(() => { if (!done) { try { c.end(true) } catch (e) { } this.client = null; fin(false) } }, 14000);
    });
    return this.ready;
  },
  sub(code) { [TP + 'games/' + code, TP + 'games/' + code + '/#'].forEach(t => { if (!this.subs.has(t)) { this.subs.add(t); if (this.client) this.client.subscribe(t, { qos: 1 }); } }); },
  unsub(code) {
    [TP + 'games/' + code, TP + 'games/' + code + '/#'].forEach(t => { this.subs.delete(t); try { this.client && this.client.unsubscribe(t) } catch (e) { } });
    [...this.cache.keys()].forEach(k => { if (k === 'games/' + code || k.startsWith('games/' + code + '/')) this.cache.delete(k) });
  },
  kv() {
    return {
      get: p => this.cache.get(p) || null, keys: () => [...this.cache.keys()], listen: f => { this.L.add(f); return () => this.L.delete(f) },
      write: (op, p, d) => {
        const v = op === 'set' ? d : null;
        if (v) this.cache.set(p, v); else this.cache.delete(p); this.notify();
        return new Promise(res => { try { this.client.publish(TP + p, v ? JSON.stringify(v) : '', { qos: 1, retain: true }, () => res()); } catch (e) { res() } });
      }
    };
  },
  waitDoc(p, ms) { return new Promise(res => { if (this.cache.get(p)) return res(true); const f = () => { if (this.cache.get(p)) { this.L.delete(f); res(true) } }; this.L.add(f); setTimeout(() => { this.L.delete(f); res(!!this.cache.get(p)) }, ms); }); }
};

/* scrive il nuovo stato (solo la regia, o chi ha creato la partita nella lobby) */
function act(fn) {

/* =========================================================
   MOSSE: le mando alla regia (o le applico io se sono la regia)
   ========================================================= */
let mySeq = 0;

  const n = nextSeq();

  const cur = reqDocs[myId] && reqDocs[myId].acts ? reqDocs[myId].acts.slice() : [];

function handleEvents(G) {

  for (const e of G.events) {
    if (e.n <= lastEventN) continue;
    lastEventN = e.n;
    switch (e.type) {
      case 'round': cardHidden = false; voteSel = null; viewTable = ''; roleFlash = null; break;
      case 'clues': case 'turn': if (e.player === myId) { buzz([60, 40, 60]); toast('🎤 Tocca a te!', 'big'); } break;
      case 'talk': if (inRound()) toast('🗣️ Discussione!'); break;
      case 'vote': voteSel = null; if (G.R.vote.voters.includes(myId)) { buzz(50); toast(e.tie ? '🗳️ Spareggio: rivota!' : '🗳️ Si vota!', 'big'); } break;

      case 'role': roleFlash = { pid: e.player, role: e.role, until: Math.max(Date.now(), revealAt) + 3000 };
        setTimeout(() => { if (e.role === 'imp') { flash('#ffd43b'); buzz([80, 50, 80]); } else { flash('#f43f5e'); shake($('#twrap')); } }, Math.max(0, revealAt - Date.now()));
        break;
      case 'guessTime': if (e.player === myId) { buzz([150, 80, 150]); toast('🎯 Indovina la parola!', 'big'); } break;
      case 'skip': if (e.player === myId) toast('⏱ Tempo scaduto', 'warn'); break;
      case 'wrong': flash('#f43f5e'); break;
      case 'roundEnd': resultsReadyAt = Date.now() + 1600; {
        const res = G.results[G.results.length - 1]; if (res && res.pts && res.pts[myId] > 0) { setTimeout(confetti, 700); buzz([60, 40, 60, 40, 120]); } }
        break;
      case 'annulled': toast('🚫 Manche annullata', 'warn'); resultsReadyAt = Date.now() + 1200; break;
      case 'removed': toast(e.player === myId ? 'Connessione persa troppo a lungo: sei fuori dalla partita' : `🔌 ${nameOf(e.player)} esce dalla partita (connessione persa)`, 'warn'); break;
      case 'trick': if (G.trick.voters.includes(myId)) buzz(60); break;
      case 'gameEnd': resultsReadyAt = Date.now() + 1600; if ((G.winners || []).includes(myId)) setTimeout(confetti, 600); break;
    }
  }
}

  const ps = G.players.slice().sort((a, b) => b.pts - a.pts || (a.status !== 'in') - (b.status !== 'in'));
  const max = Math.max(1, ...ps.map(p => p.pts));
  return `<div class="standings">${ps.map((p, i) => `<div class="stand ${i === 0 && p.pts > 0 ? 'first' : ''}"><span class="pos">${ps.findIndex(x => x.pts === p.pts) + 1}°</span>${avOf(p.id)}<b style="min-width:80px">${esc(p.name)}</b>${p.status !== 'in' ? '<span class="note">fuori</span>' : ''}<span class="bar2"><b style="width:${p.pts / max * 100}%"></b></span><span class="pt">${p.pts}</span></div>`).join('')}</div>`;
}
const REASON = {
  innocente: 'Avete votato un innocente: l\'impostore la fa franca!',
  pareggio: 'Pareggio nel voto: nessuno è stato scoperto.',
  parita: 'Gli impostori sono rimasti tanti quanti gli innocenti.',
  indovinata: 'L\'impostore è stato scoperto, ma ha indovinato la parola!',
  sbagliata: 'L\'impostore è stato scoperto e ha sbagliato la parola.',
  scoperti: 'Tutti gli impostori sono stati scoperti!',
  colpo: 'L\'impostore ha indovinato la parola prima di essere scoperto!',
  azzardo: 'L\'impostore ha provato a indovinare la parola… e ha sbagliato!'
};
function resultsHTML(G) {
  const res = G.results[G.results.length - 1], end = G.phase === 'gameEnd';
  let h = '';
  const title = end ? (G.target > 1 ? 'Fine del torneo' : 'Partita finita') : `Fine della manche ${res && !res.annulled ? res.n : ''}`;
  h += `<h2>${title}</h2>`;
  if (res && res.annulled) h += `<div class="winner">🚫 Manche annullata</div><p>${esc(nameOf(res.by))} ha perso la connessione: senza la sua carta non si può sapere chi era l'impostore. La manche non conta.</p>`;
  else if (res) {
    const imps = Object.keys(res.roles).filter(id => res.roles[id] === 'imp');
    const iWon = res.pts[myId] > 0;
    h += `<div class="winner">${res.win === 'imp' ? (res.k > 1 ? '🕵️ Vincono gli impostori!' : '🕵️ Vince l\'impostore!') : '😇 Vincono gli innocenti!'}${iWon ? ' 🎉' : ''}</div><p>${REASON[res.reason] || ''}</p>`;
    h += `<div class="reveal">
      <div class="who">${cardHTML({ word: res.civWord || '?' }, { cls: reduced() ? '' : 'flipin', cat: res.catIcon + ' ' + res.catName })}<span>La parola segreta</span></div>
      ${res.simile ? `<div class="who">${cardHTML({ word: res.impWord || '?' }, { cls: reduced() ? '' : 'flipin' })}<span>La parola ${imps.length > 1 ? 'degli impostori' : 'dell\'impostore'}</span></div>` : ''}
      <div class="who">${cardHTML({ imp: true }, { cls: reduced() ? '' : 'flipin' })}<span>${imps.length > 1 ? 'Gli impostori' : 'L\'impostore'}: <b>${imps.map(id => esc(nameOf(id))).join(' e ') || '?'}</b></span></div></div>`;
    const gs = res.guesses.filter(g => g.text);
    if (gs.length) h += `<p>${gs.map(g => `🎯 ${esc(nameOf(g.by))} ha provato «${esc(g.text)}»: ${g.right ? '<b style="color:#69db7c">giusto!</b>' : '<b style="color:#ff8787">sbagliato</b>'}`).join('<br>')}</p>`;
    h += `<div class="roles">${res.order.map(id => `<div class="rolei ${res.roles[id] === 'imp' ? 'imp' : ''}">${avOf(id)}<span>${esc(nameOf(id))}<br><span class="small mut">${res.roles[id] === 'imp' ? '🕵️ impostore' : res.roles[id] === 'civ' ? '😇 innocente' : '?'}</span></span><span class="pt">+${res.pts[id] || 0}</span></div>`).join('')}</div>`;
    if (res.votes.length) h += `<details class="opt"><summary>Com'è andato il voto</summary><div class="help vlist">${res.votes.map((v, i) => `<div><b>${v.tie ? 'Spareggio' : 'Voto ' + (i + 1)}:</b> ${Object.entries(v.votes).map(([a, t]) => `${esc(nameOf(a))} → ${t ? esc(nameOf(t)) : '<i>non valido</i>'}`).join(' · ') || 'nessun voto'}</div>`).join('')}</div></details>`;
    const rk = S.code + ':' + (S.started || 0) + ':' + res.round, mine = verRes[rk];
    if (mine) h += mine.ok && res.check.ok ? `<div class="check good">✓ Carte controllate: mescolata regolare, nessuno ha barato${mine.complete ? '' : ' (controllo parziale: qualcuno è uscito prima)'}.</div>` : `<div class="check bad">⚠️ ${esc([...new Set([...(mine.why || []), ...(res.check.why || [])])].join(' · '))}</div>`;
    else h += `<div class="check wait">⏳ Controllo delle carte in corso…</div>`;
  }
  if (G.target > 1) h += `<h3 style="margin:14px 0 4px">Classifica ${end ? 'finale' : `dopo ${G.played} di ${G.target} manche`}</h3>` + standingsHTML(G);
  if (end) {
    const ws = (G.winners || []).filter(Boolean);
    h += `<div class="winner" style="text-align:center">${ws.includes(myId) ? (ws.length > 1 ? '🤝 Vittoria condivisa!' : '🎉 Hai vinto!') : ws.length ? `🏆 ${ws.map(id => esc(nameOf(id))).join(' e ')}` : ''}</div>`;
    if (G.trick && G.trick.counts) h += `<p style="text-align:center" class="small">Voto del trucco migliore: ${G.trick.cands.map(id => `${esc(nameOf(id))} ${G.trick.counts[id] || 0}`).join(' · ')}</p>`;
    h += statsTable(G) + '<div class="small mut" style="margin-top:8px">Le tue statistiche sono salvate nella home del gioco, su questo dispositivo.</div>';
  }
  const isHost = S.host === myId;
  h += '<div class="mbtns"><button class="btn ghost" id="vb">👀 Guarda il tavolo</button>';
  if (end) h += `<button class="btn" data-home>🏠 Torna alla home</button>${isHost ? '<button class="btn" id="lob">⚙️ Cambia impostazioni</button><button class="btn primary" id="rm">🔁 Rivincita</button>' : '<span class="small mut">La rivincita la propone chi ha creato la partita</span>'}`;
  else if (amIn()) h += `<button class="btn primary" id="nx">▶ Prossima manche <span class="cd" data-next="${(S.rAt || Date.now()) + 25000}"></span></button>`;
  else h += '<span class="small mut">In attesa della prossima manche…</span>';
  return h + '</div>';
}
function statsTable(G) {
  const ps = G.players.slice().sort((a, b) => b.pts - a.pts);
  const row = (l, f) => `<tr><td>${l}</td>${ps.map(p => `<td>${f(p)}</td>`).join('')}</tr>`;
  const disc = p => (S.disc && S.disc[p.id]) || 0;
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
  const best = (k, f) => { const m = Math.max(...ps.map(f)); return m > 0 ? ps.filter(p => f(p) === m) : []; };
  const fun = [];
  const sly = best('imp', p => p.st.escaped); if (sly.length) fun.push(`🫥 Fatta franca più volte: <b>${sly.map(p => esc(p.name)).join(', ')}</b> (fatta franca ${sly[0].st.escaped} ${sly[0].st.escaped === 1 ? 'volta' : 'volte'})`);
  const nose = ps.filter(p => p.st.votes >= 2).sort((a, b) => b.st.goodVotes / b.st.votes - a.st.goodVotes / a.st.votes)[0]; if (nose && nose.st.goodVotes) fun.push(`🔎 Miglior fiuto: <b>${esc(nose.name)}</b> (${pct(nose.st.goodVotes, nose.st.votes)} dei voti sull'impostore)`);
  const sus = best('got', p => p.st.gotVotes); if (sus.length) fun.push(`😬 Più sospetti da innocente: <b>${sus.map(p => esc(p.name)).join(', ')}</b> (${sus[0].st.gotVotes} voti)`);
  const gr = best('gr', p => p.st.guessRight); if (gr.length) fun.push(`🎯 Lettura del pensiero: <b>${gr.map(p => esc(p.name)).join(', ')}</b> (${gr[0].st.guessRight} parole indovinate)`);
  const unl = ps.filter(p => p.st.imp === 0 && p.st.rounds > 0); if (unl.length && G.played > 2) fun.push(`🍀 Mai impostore: ${unl.map(p => esc(p.name)).join(', ')}`);
  return `<h3 style="margin:18px 0 6px">Statistiche</h3>${fun.length ? `<p class="small" style="line-height:1.7">${fun.join('<br>')}</p>` : ''}<div class="stwrap"><table class="sttab"><thead><tr><th></th>${ps.map(p => `<th>${avOf(p.id, 26)}<br>${esc(p.name)}${p.status === 'disconnesso' ? '<div class="note">fuori</div>' : ''}</th>`).join('')}</tr></thead><tbody>
    ${G.target > 1 ? row('Punti', p => `<b>${p.pts}</b>`) : ''}
    ${row('🕵️ Volte impostore', p => p.st.imp)}${row('Manche vinte da impostore', p => p.st.impWins)}
    ${row('🫥 Fatta franca', p => p.st.escaped)}${row('🎯 Parole indovinate', p => p.st.guessRight + ' / ' + (p.st.guessRight + p.st.guessWrong))}
    ${row('😇 Manche vinte da innocente', p => p.st.civWins + ' / ' + p.st.civ)}${row('🔎 Fiuto (voti giusti)', p => p.st.votes ? `${p.st.goodVotes}/${p.st.votes} · ${pct(p.st.goodVotes, p.st.votes)}` : '—')}
    ${row('🙈 Eliminazioni da innocente', p => p.st.wrongOut)}${row('😬 Voti ricevuti da innocente', p => p.st.gotVotes)}
    ${row('🔥 Miglior serie a punti', p => p.st.bestStreak)}${row('🎤 Indizi', p => p.st.clues + (p.st.skips ? ` <span class="note">(${p.st.skips} saltati)</span>` : ''))}
    ${row('Disconnessioni', disc)}
  </tbody></table></div>`;
}
function rulesHTML() {
  const o = S.game.options, R = S.game.R;
  const g = +o.giri ? o.giri + (o.giri == 1 ? ' giro' : ' giri') : 'automatici (3 fino a 6 giocatori, 2 da 7)';
  return `<h2>Regole di questa partita</h2><ul class="rules-list">
    <li><b>Modalità:</b> ${S.game.target > 1 ? `torneo a punti di ${S.game.target} manche` : 'partita singola'}</li>
    <li><b>Parole:</b> ${o.cat === 'caso' ? 'categoria a caso ogni manche' : esc((W.byKey[o.cat] || {}).name || '')}${o.words === 'miste' ? ' + le vostre parole' : o.words === 'vostre' ? ' — solo le vostre parole' : ''}</li>
    <li><b>L'impostore riceve:</b> ${o.impInfo === 'simile' ? 'una parola simile, senza sapere di essere l\'impostore' : o.impInfo === 'categoria' ? 'la categoria' : 'niente'}</li>
    <li><b>Impostori:</b> ${R ? R.k : (+o.imps === 2 ? 2 : 1)} · <b>Giri di indizi:</b> ${g}</li>
    <li><b>Se votate un innocente:</b> ${o.wrongVote === 'continua' || +o.imps === 2 ? 'esce e si continua' : 'vince l\'impostore'}</li>
    <li><b>Partita veloce:</b> ${o.fast ? 'sì, niente discussione' : 'no'} · <b>Tentativo quando vuole:</b> ${o.anytime ? 'sì' : 'no'} · <b>Indizi scritti:</b> ${o.written ? 'sì' : 'no, a voce'}</li>
    <li><b>Tempi:</b> indizio ${o.clueTimer ? fmtTime(o.clueTimer * 1000) : 'libero'}, discussione ${o.talkTimer ? fmtTime(o.talkTimer * 1000) : 'libera'}, voto ${o.voteTimer ? fmtTime(o.voteTimer * 1000) : 'libero'} · <b>Attesa per chi si disconnette:</b> ${fmtTime(o.disconnectWait * 1000)}</li>
    <li><b>Punti:</b> impostore non scoperto 3, scoperto ma indovina 2; se l'impostore perde, 1 a ciascun innocente.</li>
    <li><b>Comandi:</b> tocca la carta al centro per coprirla o scoprirla; per votare tocca un giocatore oppure trascina la tua scheda su di lui.</li>
  </ul><div class="mbtns"><button class="btn primary" data-close-info>Chiudi</button></div>`;
}

/* ---------------- indizi, chat e diario ---------------- */
function renderSide() {
  $$('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === sideTab));
  const book = $('#book'), feed = $('#feed'); if (!book) return;
  book.hidden = sideTab !== 'clues'; feed.hidden = sideTab !== 'chat';
  renderBook(); renderFeed();
}
function renderBook() {
  const el = $('#book'), G = G_(); if (!el || !G || !G.R) return;
  const R = G.R, k = R.n + ':' + R.clues.length + ':' + R.votes.length + ':' + R.out.length + ':' + G.phase;
  if (k === bookKey) return; bookKey = k;
  let h = '', last = '';
  R.clues.forEach(c => {
    const lab = c.kind === 'tie' ? 'Spareggio' : c.v > 0 ? `Dopo il voto ${c.v}` : `Giro ${c.giro}`;
    if (lab !== last) { h += `<h5>${lab}</h5>`; last = lab; }
    h += `<div class="cl">${avOf(c.by)}<span>${esc(nameOf(c.by))}</span><span class="w" style="margin-left:auto">${c.skip ? '<span class="mut">⏱ saltato</span>' : c.text ? '«' + esc(c.text) + '»' : '<span class="mut">🎤 a voce</span>'}</span></div>`;
  });
  if (R.votes.length) {
    h += '<h5>Voti</h5>' + R.votes.map((v, i) => `<div class="cl"><span class="small">${v.tie ? 'Spareggio' : 'Voto ' + (i + 1)}: ${Object.entries(v.counts).sort((a, b) => b[1] - a[1]).map(([id, c]) => `${esc(nameOf(id))} ${c}`).join(' · ') || 'nessuno'}</span></div>`).join('');
  }
  if (!h) h = `<div class="small mut">${G.options.written ? 'Qui compariranno gli indizi scritti.' : 'Gli indizi si dicono a voce: qui vedi chi ha già parlato.'}</div>`;
  el.innerHTML = h; el.scrollTop = el.scrollHeight;
}
function renderFeed() {
  const f = $('#feed'); if (!f || !S || !S.game) return;
  const log = S.game.log.slice(-120).map(l => ({ t: l.t || 0, html: `<div class="msg ${l.kind || ''}">${esc(l.msg)}</div>` }));
  const ch = chat.map(m => ({ t: m.t, html: `<div class="msg chat"><b style="color:${/^#[0-9a-f]{3,8}$/i.test(m.c) ? m.c : '#ccc'}">${esc(m.by)}:</b> ${esc(m.x)}</div>` }));
  const all = log.concat(ch).sort((a, b) => a.t - b.t);
  const k = all.length + ':' + (all.length ? all[all.length - 1].t : 0) + ':' + S.game.logSeq + ':' + chat.length;
  if (k === feedKey) return; feedKey = k;
  const near = f.scrollHeight - f.scrollTop - f.clientHeight < 80;
  f.innerHTML = all.map(x => x.html).join('') || '<div class="small mut">Nessun messaggio.</div>';
  if (near || !f._init) { f.scrollTop = f.scrollHeight; f._init = 1; }
}
function onChat() {
  if (!S || view !== 'game' || S.status === 'lobby') return;
  renderFeed();
  const last = chat[chat.length - 1], narrow = window.innerWidth <= 900, seen = sideTab === 'chat' && (!narrow || sideOpen);
  if (last && last.t > chatSeenT) {
    if (!seen && last.id !== myId) toast(`💬 ${last.by}: ${last.x}`);
    if (seen) chatSeenT = last.t;
  }
  updBadge();
}
function updBadge() { const b = $('#chatBadge'); if (!b) return; const unread = chat.filter(m => m.t > chatSeenT && m.id !== myId).length; b.hidden = !unread; b.textContent = unread; }
function sendChat(x) {
  if (!x || !code) return;
  const i = S.game ? S.game.players.findIndex(p => p.id === myId) : -1; const p = i >= 0 ? S.game.players[i] : null;
  DB.collection(`games/${code}/chat`).add({ t: Date.now(), id: myId, by: p ? p.name : (myName || 'Spettatore'), c: PCOL[(i >= 0 ? i : 2) % PCOL.length], x: x.slice(0, 200) }).then(pruneChat).catch(writeErr);
  chatSeenT = Date.now();
}
function pruneChat() {
  if (MODE !== 'p2p' || !code) return;
  const pre = `games/${code}/chat/`; const ks = [...Net.cache.keys()].filter(k => k.startsWith(pre));
  if (ks.length > 60) ks.map(k => [k, (Net.cache.get(k) || {}).t || 0]).sort((a, b) => a[1] - b[1]).slice(0, ks.length - 60).forEach(([k]) => DB.doc(k).delete().catch(() => { }));
}

/* ---------------- barra "giocatore disconnesso" e orologi ---------------- */
function renderAway() {
  const bar = $('#awaybar'); if (!bar) return;
  const list = Object.entries((S && S.status === 'playing' && S.away) || {});
  if (!list.length) { bar.hidden = true; bar.innerHTML = ''; bar._k = ''; return; }
  const k = JSON.stringify(list); if (bar._k === k) return; bar._k = k;
  bar.hidden = false;
  bar.innerHTML = list.map(([id, a]) => `<div class="awayrow">⏳ <b>${esc(nameOf(id))}</b> ${id === myId ? '(tu): risulta che hai perso la connessione' : 'ha perso la connessione'}. Aspettiamo ancora <b class="cd" data-until="${a.until}">${fmtTime(a.until - Date.now())}</b>
    <button class="btn sm" data-more="${esc(id)}">+1 minuto</button></div>`).join('');
  $$('[data-more]', bar).forEach(b => b.onclick = () => send({ type: 'more', pid: b.dataset.more }));
}
function tickUI() {
  if (!S || view !== 'game' || !S.game) return;
  $$('#awaybar .cd').forEach(el => el.textContent = fmtTime(+el.dataset.until - Date.now()));
  $$('.netst').forEach(el => el.textContent = netText());
  $$('[data-next]').forEach(el => el.textContent = '(' + Math.max(0, Math.ceil((+el.dataset.next - Date.now()) / 1000)) + ')');
  const G = S.game;
  if (S.status !== 'lobby') { renderCenter(G); if (revealAt && Date.now() >= revealAt && Date.now() - revealAt < 700) { renderTable(G); renderStatus(G); } }
  const el = $('#tclock'); if (!el) return;
  const o = G.options, tm = { clue: o.clueTimer, talk: o.talkTimer, vote: o.voteTimer, guess: o.voteTimer, trick: o.voteTimer }[G.phase];
  if (!tm || S.status !== 'playing' || Object.keys(S.away || {}).length) { el.textContent = ''; return; }
  const left = (S.tAt || Date.now()) + tm * 1000 - Date.now();
  el.textContent = '⏱ ' + fmtTime(left); el.classList.toggle('low', left < 10000);
}

function bindGlobal() {
  document.addEventListener('click', e => {
    if (e.target.closest('[data-close-info]')) hideInfo();
    if (e.target.id === 'info') hideInfo();
    if (e.target.id === 'sheet') hideSheet();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideInfo(); hideSheet(); } });
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (/^[A-Z0-9]{5}$/.test(h) && h !== code && h !== opening && myName) openGame(h, true); });
}
bindGlobal();
init();

</script>
