<style>
:root{
  --bg:#1d1a2f; --bg2:#262142; --panel:#2b2550; --panel2:#342d60; --line:rgba(255,255,255,.10);
  --text:#f4f1ff; --muted:#b4acd6; --accent:#ff922b; --accent2:#ffc078; --blue:#4dabf7; --violet:#7c4dff;
  --ok:#22c55e; --bad:#f43f5e; --cw:96px; --radius:14px;
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{background:radial-gradient(1200px 700px at 50% -10%,#5b3417 0%,var(--bg) 62%) fixed}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- pulsanti ---------- */
.btn{border:1px solid var(--line);background:var(--panel2);padding:.55em 1em;border-radius:12px;cursor:pointer;font-weight:600;transition:transform .12s,background .12s,opacity .12s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#3e3672}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(135deg,#f76707,#ff922b 55%,#fab005);border:none;color:#2a1300}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#ff7a1a,#ffa94d 55%,#ffc21a)}
.btn.go{background:#22c55e;color:#06260f;border:none}
.btn.go:hover:not(:disabled){background:#34d36d}
.btn.pulse:not(:disabled){animation:pulse 1.4s infinite}
.btn.warn{background:#c2410c;border:none}
.btn.ghost{background:transparent}
.btn.sm{padding:.4em .75em;font-size:.86rem;border-radius:9px}
.btn.big{padding:.8em 1.6em;font-size:1.08rem}
.btn.yes{background:#15803d;border:none;color:#fff}
.btn.no{background:#be123c;border:none;color:#fff}
.btn.on{outline:2px solid var(--accent);outline-offset:1px;background:#4a3320}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,146,43,.55)}50%{box-shadow:0 0 0 7px rgba(255,146,43,0)}}

/* ---------- logo ---------- */
.logo{font-weight:700;font-size:3.6rem;letter-spacing:-.02em;line-height:1;display:inline-flex;align-items:center;gap:.22em;transform:rotate(-3deg);filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.logo .lt{background:linear-gradient(90deg,#ffd8a8,#ff922b 45%,#f76707);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .ico{display:inline-flex;font-size:.55em}
.logo .ico i{font-style:normal;width:1.05em;height:1.35em;border-radius:.18em;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.3);font-weight:700}
.logo .ico i:first-child{background:#fff4e6;color:#f76707;transform:rotate(-12deg)}
.logo .ico i:last-child{background:#ff922b;color:#2a1300;transform:rotate(10deg) translateY(.06em);margin-left:-.3em}
.logo.sm{font-size:1.7rem}
.logo.xs{font-size:1.4rem}

/* ---------- home e lobby ---------- */
body.v-home,body.v-lobby{overflow-y:auto}
body.v-game{overflow:hidden}
.home{max-width:760px;margin:0 auto;padding:30px 16px 60px;display:flex;flex-direction:column;gap:16px;position:relative}
.hero{text-align:center;margin-bottom:4px}
.gamepill{display:table;margin:0 auto 14px;background:#ffd8a8;color:#2a1300;font-weight:700;letter-spacing:.14em;font-size:.75rem;padding:5px 16px;border-radius:99px}
.tagline{color:var(--muted);margin:16px auto 0;max-width:52ch}
.hubbtn{text-decoration:none;color:var(--text);width:max-content;display:inline-flex;align-items:center;gap:6px}
.panel{background:rgba(43,37,80,.78);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(6px)}
.panel h3{margin:0 0 12px;font-size:1.15rem;font-weight:600}
.mut{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.mid{justify-content:center}
.banner{background:#3a2a10;border:1px solid #7c5a10;color:#ffe2a8;border-radius:14px;padding:12px 14px;font-size:.9rem}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gitem{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.medal{font-size:1.2rem;font-weight:700;color:var(--accent);width:40px;text-align:center}
.bigcode{font-size:2.6rem;font-weight:700;letter-spacing:8px;color:var(--accent);margin:4px 0}
.netst{color:#fde68a}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.seat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.seat select{padding:.3em .4em;font-size:.82rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.tile{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tile b{font-size:1.4rem;color:var(--accent)}.tile span{font-size:.78rem;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sitem span{color:var(--muted)}
.sitem .fc{--cw:30px}
input,select{font:inherit;color:var(--text);background:#1f1b38;border:1px solid var(--line);border-radius:10px;padding:.6em .7em}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.flabel{font-size:.85rem;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.seg button{background:#1f1b38;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.seg button small{color:var(--muted);font-size:.8rem}
.seg button.on{border-color:var(--accent);background:#3a2a1c}
.seg .prev{display:flex;gap:4px;margin-top:6px}
.seg .prev .fc{--cw:34px}
.inline{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.group{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.group h4{margin:4px 0 6px;font-size:1rem;color:var(--accent2);font-weight:600}
.opt{border-radius:12px;padding:8px 10px;margin:4px 0;background:rgba(255,255,255,.03)}
.opt-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.opt-label{font-weight:500}
.opt select{max-width:58%}
.opt details{margin-top:4px}
.opt summary{cursor:pointer;color:var(--muted);font-size:.82rem;list-style:none;display:inline-flex;gap:4px;align-items:center}
.opt summary::-webkit-details-marker{display:none}
.opt summary::before{content:'▸';transition:transform .15s}
.opt details[open] summary::before{transform:rotate(90deg)}
.opt .help{font-size:.88rem;color:#ece6ff;line-height:1.45;padding:6px 2px 2px}
.opt .help ul{margin:.3em 0;padding-left:1.2em}
.switch{position:relative;width:46px;height:26px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#443c70;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:#22c55e}
.switch input:checked+span::after{transform:translateX(20px)}
.opt select:disabled,.seg button:disabled,.switch input:disabled+span{opacity:.6;cursor:default}

/* ---------- avatar ---------- */
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:1.1rem;color:#1a1238;box-shadow:0 0 0 2px rgba(255,255,255,.25);position:relative}
.av .sh{position:absolute;right:-4px;bottom:-4px;font-size:.62em;background:#1d1a2f;border-radius:50%;width:1.5em;height:1.5em;display:grid;place-items:center;color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.4)}

/* ---------- carte personaggio ---------- */
.fc{width:var(--cw);aspect-ratio:100/138;perspective:600px;position:relative;flex:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.fc-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,.7,.3,1.15);transform-origin:50% 50%}
.fc.down .fc-in{transform:rotateX(-180deg)}
.fc-front,.fc-back{position:absolute;inset:0;border-radius:calc(var(--cw)*.1);overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc-front{background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.25),0 5px 12px rgba(0,0,0,.3);border:2px solid #fff;display:flex;flex-direction:column}
.fc-front svg{display:block;width:100%;flex:1;min-height:0}
.fc-name{display:block;text-align:center;font-weight:600;color:#2a1a10;font-size:calc(var(--cw)*.15);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;background:#fff}
.fc-back{transform:rotateX(180deg);background:repeating-linear-gradient(45deg,#d9480f 0 8px,#e8590c 8px 16px);border:2px solid #ffa94d;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff3e6;box-shadow:inset 0 0 0 3px rgba(0,0,0,.15)}
.fc-back b{font-size:calc(var(--cw)*.42);line-height:1;opacity:.9}
.fc-back small{font-size:calc(var(--cw)*.13);font-weight:600;opacity:.85;max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .fc{cursor:pointer;touch-action:none}
.board .fc:hover .fc-front{box-shadow:0 0 0 3px rgba(255,192,120,.7),0 5px 12px rgba(0,0,0,.3)}
.picking .fc:not(.down) .fc-front{box-shadow:0 0 0 3px var(--accent),0 6px 16px rgba(255,146,43,.35)}
.picking .fc.sel .fc-front{box-shadow:0 0 0 4px #fff,0 0 22px var(--accent)}
.fc.mine .fc-front{box-shadow:0 0 0 3px var(--accent),0 5px 12px rgba(0,0,0,.3)}
.fc.secret-hit .fc-front{box-shadow:0 0 0 4px #22c55e,0 0 24px rgba(34,197,94,.7)}
.fc.secret-miss .fc-front{box-shadow:0 0 0 4px var(--bad)}
.fc.static{--cw:60px}
.fc.static .fc-in{transition:none}
.fc .tagx{position:absolute;top:-8px;right:-8px;z-index:3;background:var(--bad);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem;font-weight:700;box-shadow:0 0 0 2px #1d1a2f}

/* ---------- partita ---------- */
#game{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(29,26,47,.6);backdrop-filter:blur(6px)}
.roundinfo{flex:1;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tb-actions{display:flex;gap:4px}
.layout{flex:1;display:grid;grid-template-columns:1fr 320px;min-height:0}
.maincol{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(20,18,34,.6)}
.side-head{padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.known{padding:8px 10px;border-bottom:1px solid var(--line);max-height:38%;overflow:auto}
.known h5{margin:0 0 6px;font-size:.82rem;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.07);line-height:1.3}
.chip.y{background:rgba(34,197,94,.22);color:#d1ffe0}
.chip.n{background:rgba(244,63,94,.2);color:#ffd5dc}
.chip.f{border:1px dashed rgba(255,255,255,.35)}
.feed{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.msg{padding:4px 8px;border-radius:8px;color:var(--muted);line-height:1.35}
.msg.qa{color:#f1ecff}
.msg.qa .yn{font-weight:700}
.msg.qa .yn.y{color:#69db7c}.msg.qa .yn.n{color:#ff8787}
.msg.sys{color:#ffd8a8}
.msg.warn{color:#ffd0c2;background:rgba(194,65,12,.25)}
.msg.win{color:#d1ffe0;background:rgba(34,197,94,.22);font-weight:600}
.msg.chat{color:var(--text);background:rgba(124,77,255,.22)}
.chatform{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.chatform input{flex:1;min-width:0}

.duel{display:flex;align-items:stretch;justify-content:center;gap:10px;padding:8px 10px 2px}
.pl{display:flex;gap:8px;align-items:center;background:rgba(29,26,47,.78);border:2px solid transparent;border-radius:16px;padding:5px 12px 5px 5px;transition:.2s;min-width:0}
.pl.active{border-color:var(--accent);box-shadow:0 0 18px rgba(255,146,43,.25)}
.pl.off{opacity:.55}
.pl .pn{font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.pl .pd{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stars{color:var(--accent);letter-spacing:1px}
.upbar{display:inline-flex;gap:1px;vertical-align:middle}
.upbar i{width:4px;height:9px;border-radius:1px;background:var(--accent2)}
.upbar i.x{background:rgba(255,255,255,.15)}
.vs{align-self:center;color:var(--muted);font-weight:700}
.tag{display:inline-block;font-size:.7rem;padding:1px 6px;border-radius:99px;background:#443c70}
.tag.off{background:#c2410c}
.tag.think{background:var(--accent);color:#2a1300}

.statusline{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 12px;min-height:40px;text-align:center;flex-wrap:wrap}
.status{font-weight:600;font-size:1.04rem}
.status.mine{color:var(--accent2)}
.tclock{font-weight:700;color:var(--accent);min-width:4ch}
.tclock.low{color:#ff7a59}

.boardwrap{flex:1;min-height:0;position:relative;margin:0 10px;border-radius:18px;background:radial-gradient(ellipse at 50% 30%,#3a2a22 0%,#2a1f1b 60%,#211816 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),inset 0 10px 40px rgba(0,0,0,.35);overflow:hidden}
.board{position:absolute;inset:0;display:grid;justify-content:center;align-content:center;gap:var(--gap,8px);padding:10px}
.bubble{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:10;pointer-events:none;background:#fff;color:#2a1300;border-radius:22px;padding:14px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.55);max-width:86%;animation:pop .35s cubic-bezier(.2,.9,.3,1.4)}
.bubble .bq{font-size:.95rem;color:#6b4a35}
.bubble .ba{font-size:2.3rem;font-weight:700;line-height:1.1;margin-top:2px}
.bubble.y .ba{color:#15803d}.bubble.n .ba{color:#be123c}
.bubble.out{opacity:0;transform:translate(-50%,-60%);transition:all .4s}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}

.bar{display:flex;align-items:center;gap:10px;padding:8px 12px 10px;flex-wrap:wrap;justify-content:space-between;background:rgba(20,18,34,.78);border-top:1px solid var(--line);margin-top:8px}
.mysecret{display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:none;padding:0;text-align:left}
.mysecret .fc{--cw:44px}
.mysecret .lab{font-size:.78rem;color:var(--muted);line-height:1.2}
.mysecret .lab b{display:block;color:var(--text);font-size:.95rem}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* domande */
.qsheet .qg{margin:10px 0 4px;font-size:.82rem;color:var(--accent2);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.qbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.qb{background:#1f1b38;border:2px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:.92rem}
.qb:hover:not(:disabled){border-color:var(--accent2)}
.qb.sel{border-color:var(--accent);background:#3a2a1c}
.qb:disabled{cursor:default;opacity:.55}
.qb .ans{font-weight:700;font-size:.8rem;white-space:nowrap}
.qb .ans.y{color:#69db7c}.qb .ans.n{color:#ff8787}
.qb .cnt{font-size:.75rem;color:var(--muted);white-space:nowrap}
.sheetfoot{position:sticky;bottom:-20px;background:var(--panel);padding:12px 0 2px;margin-top:10px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}

/* domanda in arrivo */
.incoming{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.incoming .fc{--cw:110px}
.incoming .q{font-size:1.25rem;font-weight:600;margin:6px 0 12px}

/* ---------- modali ---------- */
.modal{position:fixed;inset:0;background:rgba(10,8,20,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(3px)}
#info{z-index:60}
#sheet{z-index:55}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:680px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.modal-box h2{margin:0 0 6px}
.modal-box p{color:var(--muted)}
.res{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}
.res th,.res td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.winner{font-size:1.3rem;font-weight:700;margin:4px 0 8px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;align-items:center}
.rules-list{padding-left:1.1em;line-height:1.6}
.rules-list b{color:var(--accent2);font-weight:600}
.reveal{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.reveal .who{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.88rem;max-width:46%;text-align:center}
.reveal .fc{--cw:104px}
.reveal .fc.flipin .fc-in{animation:flipin .7s ease-out both}
@keyframes flipin{from{transform:rotateY(180deg)}}
.check{font-size:.88rem;border-radius:10px;padding:8px 10px;margin:8px 0}
.check.good{background:rgba(34,197,94,.15);color:#d1ffe0}
.check.bad{background:rgba(244,63,94,.18);color:#ffd5dc}
.score{display:flex;justify-content:center;gap:14px;align-items:center;font-size:1.1rem;font-weight:700;margin:6px 0}
.score .n{font-size:2rem;color:var(--accent)}
.zoom{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.zoom .fc{--cw:150px}
.zoom .desc{flex:1;min-width:180px}
.zoom .desc ul{padding-left:1.1em;line-height:1.6;margin:6px 0}
.stwrap{overflow-x:auto;border-radius:12px;background:rgba(0,0,0,.2)}
.sttab{border-collapse:collapse;width:100%;font-size:.88rem}
.sttab th,.sttab td{padding:7px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
.sttab th{font-weight:600;font-size:.8rem;vertical-align:bottom}
.sttab th .av{display:inline-grid;font-size:.8rem;margin-bottom:2px}
.sttab td:first-child{text-align:left;color:var(--muted)}
.note{font-size:.72rem;color:#fdba74;font-weight:500}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- avvisi ---------- */
.toasts{position:fixed;top:24vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:70;pointer-events:none;align-items:center;width:max-content;max-width:92vw}
.toast{background:#111;border:1px solid var(--line);padding:9px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:rise .2s ease-out;text-align:center}
.toast.warn{background:#c2410c}
.toast.good{background:#15803d}
.toast.big{background:var(--accent);color:#2a1300;font-size:1.15rem}
.toast.out{opacity:0;transition:opacity .4s}
.awaybar{background:rgba(194,65,12,.88);display:flex;flex-direction:column;gap:4px;padding:6px 14px;font-size:.92rem;z-index:5}
.awayrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.awayrow .btn{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.35)}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:.7rem;font-weight:700;margin-left:3px;padding:0 5px;text-align:center}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;right:0;top:50px;bottom:0;width:min(340px,92vw);z-index:40;transform:translateX(100%);transition:transform .25s;background:#1b1830}
  .side.open{transform:none;box-shadow:-20px 0 40px rgba(0,0,0,.4)}
}
@media (max-width:600px){
  .hide-sm{display:none}
  .topbar{gap:6px;padding:6px 8px}
  .tb-actions .btn{padding:.45em .6em}
  .logo{font-size:2.6rem}
  .logo.xs{font-size:1.05rem}
  .logo.xs .ico{display:none}
  .seg{grid-template-columns:1fr}
  .sgrid{grid-template-columns:1fr}
  .duel{gap:6px;padding:6px 6px 0}
  .pl{padding:3px 8px 3px 3px;gap:6px}
  .pl .av{width:30px;height:30px;font-size:.9rem}
  .pl .pn{max-width:90px;font-size:.85rem}
  .pl .upbar{display:none}
  .vs{display:none}
  .statusline{padding:4px 8px;min-height:34px}
  .status{font-size:.92rem}
  .boardwrap{margin:0 4px;border-radius:12px}
  .board{padding:6px}
  .bar{padding:6px 8px 8px;gap:6px}
  .mysecret .fc{--cw:36px}
  .mysecret .lab{display:none}
  .actions .btn{padding:.5em .7em;font-size:.92rem}
  .bigcode{font-size:2.1rem;letter-spacing:6px}
  .opt select{max-width:100%}
  .opt-head{flex-wrap:wrap}
  .qbtns{grid-template-columns:1fr 1fr}
  .qb{font-size:.84rem;padding:8px}
  .modal{padding:8px;align-items:flex-end}
  .modal-box{padding:16px;max-height:88vh;border-radius:18px}
  .reveal .fc{--cw:88px}
  .incoming .fc{--cw:90px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* =========================================================

(function () {
  const ART = (typeof module !== 'undefined') ? require('./art.js') : window.CCArt;
  const SETS = ART.SETS;

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const DEFAULT_OPTIONS = {
    mode: 'singola',      // singola | torneo
    target: 3,            // torneo: vince chi arriva prima a N vittorie
    set: 'persone',       // persone | animali
    size: 24,             // 16 | 24 | 32
    secret: 'caso',       // caso | scelta
    free: false,          // domande libere (a voce o scritte)
    noBig: false,         // niente "uomo o donna?" / "cane o gatto?" nei primi 2 turni
    wrong: 'perdi',       // perdi | turno
    tie: false,           // ultimo turno per pareggiare
    autoDown: false,      // abbassa in automatico
    turnTimer: 0,         // secondi, 0 = nessun limite
    disconnectWait: 60
  };
  const BIG_FREE_TURNS = 2;

  function err(e) { return { ok: false, error: e }; }
  const idx = (G, id) => G.players.findIndex(p => p.id === id);
  const other = (G, i) => 1 - i;
  function log(G, msg, kind, extra) { G.log.push(Object.assign({ n: ++G.logSeq, msg, kind: kind || 'play', t: Date.now() }, extra || {})); if (G.log.length > 160) G.log.splice(0, G.log.length - 160); }
  function emit(G, ev) { ev.n = ++G.evSeq; G.events.push(ev); if (G.events.length > 30) G.events.splice(0, G.events.length - 30); }
  function setOf(G) { return SETS[G.options.set] || SETS.persone; }
  function charOf(G, id) { return setOf(G).byId[id]; }
  function qOf(G, qid) { return setOf(G).q[qid]; }
  function truth(G, sid, qid) { const c = charOf(G, sid), q = qOf(G, qid); return !!(c && q && q.test(c)); }

  // segreti dei bot: tenuti nello stato in forma mescolata
  function scramble(id, key) { let s = ''; const k = String(key); for (let i = 0; i < id.length; i++) s += String.fromCharCode(id.charCodeAt(i) ^ (k.charCodeAt(i % k.length) & 31)); return btoa(unescape(encodeURIComponent(s))).split('').reverse().join(''); }

  function botSecret(G, pid) { const x = G.bs && G.bs[pid]; return x ? unscramble(x, pid + G.round) : null; }

  function newStats() { return { asked: 0, free: 0, answered: 0, wrong: 0, right: 0, lucky: 0, bestQ: null, fastest: null, qWins: 0, timeouts: 0, draws: 0, rw: 0 }; }

  function createGame(players, options) {
    const o = Object.assign({}, DEFAULT_OPTIONS, options || {});
    if (!SETS[o.set]) o.set = 'persone';
    o.size = Math.max(8, Math.min(SETS[o.set].pool.length, +o.size || 24));
    const G = {
      options: o,
      players: players.slice(0, 2).map(p => ({ id: p.id, name: p.name, bot: !!p.bot, level: p.level || 'medio', status: 'in', wins: 0, st: newStats() })),
      round: 0, firstStarter: Math.floor(rand() * 2),
      phase: 'secret', turn: 0, starter: 0, board: [], commits: {}, bs: {}, qa: [], cand: {}, turns: {}, pending: null, lastChance: null,
      results: [], winner: null, ranking: null, log: [], logSeq: 0, events: [], evSeq: 0, turnNo: 0
    };
    startRound(G);
    return G;
  }

  function startRound(G) {
    G.round++;
    const st = setOf(G);
    G.board = shuffle(st.pool.map(c => c.id)).slice(0, G.options.size);
    // ordine del tabellone: alternato ma stabile (stesso per tutti)

    G.turn = G.starter; G.phase = 'secret'; G.commits = {}; G.bs = {}; G.qa = []; G.pending = null; G.lastChance = null; G.turnNo = 0;
    G.cand = {}; G.turns = {};

    });

  function canAskBig(G, pid) { return !G.options.noBig || (G.turns[pid] || 0) >= BIG_FREE_TURNS; }
  function askedBy(G, pid) { return G.qa.filter(x => x.by === pid && x.kind === 'q').map(x => x.q); }

  function applyAction(G, actorId, a) {
    try { return applyInner(G, actorId, a); } catch (e) { return err('Errore: ' + (e && e.message || e)); }
  }
  function applyInner(G, actorId, a) {

          if (!G.options.free) return err('Le domande libere non sono attive');

  function botAnswer(G) {

  function resolve(G, yes) {

      const q = qOf(G, pd.q);
      const before = G.cand[A.id].length;

function saveGameStats() {
  if (!S || !S.game) return;
  const G = S.game, me = G.players.find(p => p.id === myId); if (!me) return;
  const ended = S.status === 'ended', removed = me.status === 'disconnesso';
  if (!ended && !removed) return;
  const all = loadStats(); const k = S.code + ':' + myId + ':' + (S.started || 0);
  if (all.some(r => r.k === k)) return;
  const opp = G.players.find(p => p.id !== myId);
  const lucky = [], qs = {}; let mistakes = 0;
  for (const r of G.results) {
    if (r.winner === myId && r.reveals[myId]) lucky.push(r.set + ':' + r.reveals[myId].sid);
    if (r.mistakes[myId]) mistakes++;
    r.qa.forEach(x => { if (x.by === myId && x.kind === 'q') qs[r.set + ':' + x.q] = (qs[r.set + ':' + x.q] || 0) + 1; });
  }
  all.push({ k, code: S.code, t: Date.now(), name: me.name, set: G.options.set, mode: G.options.mode, target: G.options.target, opp: opp ? opp.name : '', oppBot: opp && opp.bot ? opp.level : '',
    won: !removed && G.winner === myId, draw: !removed && G.winner === null, my: me.wins, their: opp ? opp.wins : 0, rounds: G.results.length,
    st: me.st, mistakes, lucky, qs, disc: (S.disc && S.disc[myId]) || 0, removed });
  ls.set('cc-stats', JSON.stringify(all.slice(-200)));
}

  unsubs.forEach(u => { try { u() } catch (e) { } }); unsubs = [];

function onPres(x) {

  if (presT[x.id] === undefined) lastSeen[x.id] = now - x.t < 30000 ? now : x.t;
  else if (presT[x.id] !== x.t) lastSeen[x.id] = now;
  presT[x.id] = x.t; lastVis[x.id] = x.vis !== false;
}
async function openGame(c, join) {
  closeGame(); view = 'game';
  try { if (location.hash !== '#' + c) location.hash = c; } catch (e) { }
  if (MODE === 'p2p') {
    busy('Mi collego alla partita ' + c + '…');
    const ok = await Net.connect();
    if (view !== 'game') return;
    let found = false;
    if (ok) { Net.sub(c); found = await Net.waitDoc('games/' + c, 9000); }
    if (view !== 'game') return;
    if (!found) {
      $('#app').innerHTML = `<div class="home"><div class="panel"><h3>${ok ? 'Non trovo la partita ' + esc(c) : 'Non riesco a collegarmi al server del gioco'}</h3><p class="mut">${ok ? 'Controlla che il codice sia giusto (5 caratteri, come te l’ha mandato chi ha creato la partita).' : 'Controlla la connessione a internet e riprova.'}</p><div class="row"><button class="btn primary" id="rt">Riprova</button><button class="btn" id="bk">Indietro</button></div></div></div>`;
      $('#rt').onclick = () => openGame(c, join); $('#bk').onclick = leave; return;
    }
    const g = Net.cache.get('games/' + c); addRecent(c, g && g.hostName);
  } else addRecent(c, myName);
  code = c;
  busy('Apro la partita ' + c + '…');
  let first = true;
  const t = setTimeout(() => { if (first && code === c) { $('#app').innerHTML = '<div class="home"><div class="panel">Non riesco a raggiungere la partita. Controlla la connessione. <button class="btn sm" id="bk">Indietro</button></div></div>'; $('#bk').onclick = leave; } }, 10000);
  unsubs.push(DB.doc('games/' + c).onSnapshot(snap => {
    clearTimeout(t);
    if (!snap.exists) { if (first) { first = false; $('#app').innerHTML = '<div class="home"><div class="panel">Partita non trovata. <button class="btn sm" id="bk">Indietro</button></div></div>'; $('#bk').onclick = leave; } return; }
    const d = clone(snap.data()); serverS = d;
    if (first && join && d.status === 'lobby' && !seats.some(s => s.id === myId)) DB.doc(`games/${c}/seats/${myId}`).set({ id: myId, name: myName || 'Giocatore', t: Date.now() }).catch(writeErr);
    first = false;
    if (S && (d.v || 0) < (S.v || 0)) return;
    applyState(d);
  }));
  unsubs.push(DB.collection(`games/${c}/seats`).onSnapshot(s => { seats = s.docs.map(d => d.data()).sort((a, b) => a.t - b.t); if (S && S.status === 'lobby') renderLobby(); }));
  unsubs.push(DB.collection(`games/${c}/chat`).orderBy('t', 'desc').limit(60).onSnapshot(s => { chat = s.docs.map(d => d.data()).reverse(); onChat(); }));
  unsubs.push(DB.collection(`games/${c}/pres`).onSnapshot(s => { s.docs.forEach(d => { const x = d.data(); if (x && x.id) onPres(x); }); }));
  unsubs.push(DB.collection(`games/${c}/req`).onSnapshot(s => { reqDocs = {}; s.docs.forEach(d => { reqDocs[d.id] = d.data(); }); if (dutyId() === myId) processReqs(); }));

    const k = 'ans:' + roundKey(G) + ':' + G.turnNo; if (!sentFor[k]) {

      const sec = mySecret(G.round);
      setTimeout(() => {
        if (!sec) { send({ type: 'forfeit' }); return; }
        const pd = G.pending;
        send({ type: 'answer', yes: pd.kind === 'guess' ? pd.cid === sec.sid : E.truth(G, sec.sid, pd.q) });
      }, 500);
    }
  }
  // 3. a fine partita mostro il mio personaggio per il controllo
  for (const r of G.results) {
    if (r.reveals[myId] || !r.commits[myId]) continue;
    const k = 'rev:' + gameKey() + ':' + r.round; if (sentFor[k]) continue;
    const sec = mySecret(r.round); if (!sec) continue;
    sentFor[k] = 1; send({ type: 'reveal', round: r.round, sid: sec.sid, salt: sec.salt });
  }
}

function boardMode(G) {

function fitBoard() {
  const wrap = $('#bwrap'), b = $('#board'), G = G_(); if (!wrap || !b || !G) return;
  const W = wrap.clientWidth - 16, H = wrap.clientHeight - 16, n = G.board.length, ar = 1.38;
  const gap = W < 500 ? 5 : 8;
  let best = 0, bc = 6;
  for (let cols = 3; cols <= 10; cols++) {
    const rows = Math.ceil(n / cols);
    const cw = Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows / ar);
    if (cw > best) { best = cw; bc = cols; }
  }
  best = Math.max(30, Math.min(150, Math.floor(best)));
  b.style.setProperty('--cw', best + 'px'); b.style.setProperty('--gap', gap + 'px');
  b.style.gridTemplateColumns = `repeat(${bc}, ${best}px)`;
}
function statusText(G) {

  if (G.phase === 'secret') {

    return [`Aspetto che ${on} ${G.options.secret === 'scelta' ? 'scelga' : 'peschi'} il suo personaggio…`, false];
  }
  if (G.phase === 'turn') {

}

/* ---------------- tabellone: tocco, trascinamento, pressione lunga ---------------- */
function bindBoard() {
  const b = $('#board');
  b.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const card = e.target.closest('.fc'); if (!card) return;
    const G = G_(); if (!G) return;
    const mode = boardMode(G); const id = card.dataset.id;
    clearTimeout(longT);
    const sx = e.clientX, sy = e.clientY;
    longT = setTimeout(() => { if (paint && paint.moved) return; paint = null; zoom(G.options.set, id); }, 520);
    if (mode === 'flip') {
      paint = { val: !downs.has(id), seen: new Set([id]), moved: false, sx, sy, first: id, pid: e.pointerId };
      try { b.setPointerCapture(e.pointerId) } catch (er) { }
    } else paint = { tap: true, first: id, sx, sy, moved: false };
    e.preventDefault();
  });
  b.addEventListener('pointermove', e => {
    if (!paint) return;
    if (Math.abs(e.clientX - paint.sx) + Math.abs(e.clientY - paint.sy) > 10) { paint.moved = true; clearTimeout(longT); }
    if (paint.tap || !paint.moved) return;
    const G = G_(); if (!G) return;
    if (!paint.started) { paint.started = true; setDown(G, paint.first, paint.val); }
    const el = document.elementFromPoint(e.clientX, e.clientY); const card = el && el.closest && el.closest('#board .fc');
    if (card && !paint.seen.has(card.dataset.id)) { paint.seen.add(card.dataset.id); setDown(G, card.dataset.id, paint.val); }
  });
  const end = e => {
    clearTimeout(longT);
    const p = paint; paint = null; if (!p) return;
    const G = G_(); if (!G) return;
    if (p.tap) { if (!p.moved) tapPick(G, p.first); return; }
    if (!p.started) setDown(G, p.first, p.val);
    saveDowns(G);
  };
  b.addEventListener('pointerup', end);
  b.addEventListener('pointercancel', () => { clearTimeout(longT); const p = paint; paint = null; if (p && p.started) saveDowns(G_()); });
  b.addEventListener('contextmenu', e => { e.preventDefault(); const card = e.target.closest('.fc'); if (card && G_()) { paint = null; zoom(G_().options.set, card.dataset.id); } });
}
function tapPick(G, id) {
  const mode = boardMode(G);
  if (mode === 'choose') {
    pickSel = id; renderBoard(G);
    showInfo(`<h2>Il tuo personaggio segreto</h2><div class="zoom">${cardHTML(G.options.set, id, '')}<div class="desc"><p>Vuoi far indovinare <b>${esc(charName(id))}</b>?</p><p class="small">${esc(describe(G.options.set, id))}</p></div></div>
      <div class="mbtns"><button class="btn" data-close-info>Cambia</button><button class="btn primary" id="pkok">✓ Scelgo ${esc(charName(id))}</button></div>`, m => {
      $('#pkok', m).onclick = () => { hideInfo(); pickSel = null; secretShown = roundKey(G); commitSecret(G, id); renderGame(); };
    });
  } else if (mode === 'guess') {
    const o = opp(); pickSel = id; renderBoard(G);
    const risk = G.lastChance ? 'Se sbagli, vince ' + esc(o.name) + '.' : G.options.wrong === 'perdi' ? 'Attenzione: se sbagli, vince ' + esc(o.name) + '!' : 'Se sbagli, perdi il turno.';
    showInfo(`<h2>Provi a indovinare?</h2><div class="zoom">${cardHTML(G.options.set, id, '')}<div class="desc"><p>Il personaggio di ${esc(o.name)} è <b>${esc(charName(id))}</b>?</p><p>${risk}</p></div></div>
      <div class="mbtns"><button class="btn" data-close-info>Annulla</button><button class="btn go" id="gsok">🎯 Sì, è ${esc(charName(id))}!</button></div>`, m => {
      $('#gsok', m).onclick = () => { hideInfo(); guessing = false; pickSel = null; const g = G_(); send({ type: 'guess', cid: id, up: g.board.filter(x => !downs.has(x)).length }); renderGame(); };
    }, () => { pickSel = null; renderBoard(G_()); });
  }
}
function describe(set, id) { const st = A.SETS[set]; return st.describe(st.byId[id]); }
function zoom(set, id, title) {
  const st = A.SETS[set], c = st.byId[id]; if (!c) return;
  const items = describe(set, id).split(' · ');

}

function openQuestions() {

  const html = () => `<h2>Fai una domanda</h2><p class="small">Scegli una domanda: il gioco risponde subito al posto di ${esc(opp().name)}.</p><div class="qsheet">${st.groups.map(g => `<div class="qg">${g.title}</div><div class="qbtns">${g.qs.map(([id, text]) => {
    const done = id in asked, locked = id === st.bigQ && !E.canAskBig(G, myId);
    return `<button class="qb ${selQ === id ? 'sel' : ''}" data-q="${id}" ${done || locked ? 'disabled' : ''}><span>${esc(text)}</span>${done ? `<span class="ans ${asked[id] ? 'y' : 'n'}">${asked[id] ? '✓ Sì' : '✕ No'}</span>` : locked ? `<span class="cnt">🔒 dal 3° turno</span>` : ''}</button>`;
  }).join('')}</div>`).join('')}</div>
    <div class="sheetfoot"><button class="btn" id="qx">Annulla</button><button class="btn primary" id="qgo" ${selQ ? '' : 'disabled'}>${selQ ? 'Chiedi: «' + esc(st.q[selQ].text) + '»' : 'Scegli una domanda'}</button></div>`;
  const wire = m => {
    $$('[data-q]', m).forEach(b => b.onclick = () => { selQ = b.dataset.q; $('#sheetBox').innerHTML = html(); wire(m); });
    $('#qx', m).onclick = hideSheet;

  };
  showSheet(html(), wire);
}

function bubble(q, a, yes, cls) {

  setTimeout(() => d.classList.add('out'), 2300); setTimeout(() => d.remove(), 2800);
}
function handleEvents(G) {
  if (evKey !== gameKey()) { evKey = gameKey(); lastEventN = G.evSeq; return; }
  for (const e of G.events) {
    if (e.n <= lastEventN) continue;
    lastEventN = e.n;
    const o = opp(), on = o ? esc(o.name) : '';
    switch (e.type) {
      case 'round': guessing = false; pickSel = null; viewBoard = ''; break;
      case 'begin': if (e.player === myId && amIn()) toast('Cominci tu!', 'big'); break;
      case 'answer':
        if (e.player === myId) {
          bubble(e.free ? 'Domanda libera' : esc(E.qOf(G, e.q).text), e.yes ? '✓ Sì' : '✕ No', e.yes);
          if (!e.free && G.options.autoDown) autoFlip(G, e.q, e.yes);
        } else if (e.to === myId) {
          bubble(`${on} chiede: ${e.free ? 'domanda libera' : esc(E.qOf(G, e.q).text)}`, `${e.yes ? '✓ Sì' : '✕ No'}`, e.yes);
        }
        break;
      case 'guess': {
        const nm = esc(charName(e.cid));
        if (e.player === myId) {
          bubble(`È ${nm}?`, e.yes ? '🎯 Giusto!' : '✕ Sbagliato', e.yes);
          if (!e.yes) { const w = $('#bwrap'); if (w && !reduced()) { w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake'); } setDown(G, e.cid, true); saveDowns(G); }
        } else if (amIn()) {
          bubble(`${on} prova con ${nm}…`, e.yes ? 'Ha indovinato!' : 'Sbagliato!', !e.yes);
          buzz(e.yes ? [80, 60, 80] : 40);
        }
        break;
      }
      case 'turn': if (e.player === myId && amIn() && !G.lastChance) setTimeout(() => { const g = G_(); if (g && g.phase === 'turn' && g.players[g.turn].id === myId) toast('Tocca a te!'); }, 900); break;
      case 'timeout': if (e.player === myId) toast('Tempo scaduto: salti il turno', 'warn'); break;
      case 'lastChance': toast(e.player === myId ? 'Ultima occasione: indovina per pareggiare!' : `${nameOf(e.player)} ha un'ultima occasione per pareggiare`, 'big'); break;
      case 'removed': toast(e.player === myId ? 'Sei stato tolto dalla partita (disconnesso troppo a lungo)' : `🔌 ${nameOf(e.player)} è stato tolto dalla partita`, 'warn'); break;
      case 'roundEnd': resultsReadyAt = Date.now() + 1800; if (e.winner === myId) setTimeout(confetti, 600); break;
    }
  }
}
function autoFlip(G, qid, yes) {
  const q = E.qOf(G, qid), st = E.setOf(G); let k = 0;
  G.board.forEach(id => { if (!downs.has(id) && q.test(st.byId[id]) !== yes) { const d = reduced() ? 0 : 900 + (k++) * 45; setTimeout(() => { if (G_() && G_().round === G.round) { setDown(G, id, true); saveDowns(G); } }, d); } });
}

/* ---------------- finestre ---------------- */
function showModal(html, onMount) { const box = $('#modalBox'); if (box._h === html && !$('#modal').hidden) return; box._h = html; box.innerHTML = html; $('#modal').hidden = false; if (onMount) onMount(box); }
function hideModal() { const m = $('#modal'); if (m && !m.hidden) { m.hidden = true; $('#modalBox').innerHTML = ''; $('#modalBox')._h = ''; } }
let infoClose = null;
function showInfo(html, onMount, onClose) { $('#infoBox').innerHTML = html; $('#info').hidden = false; infoClose = onClose || null; if (onMount) onMount($('#infoBox')); }
function hideInfo() { const m = $('#info'); if (m && !m.hidden) { m.hidden = true; const f = infoClose; infoClose = null; if (f) f(); } }
function showSheet(html, onMount) { $('#sheetBox').innerHTML = html; $('#sheet').hidden = false; if (onMount) onMount($('#sheetBox')); }
function hideSheet() { const m = $('#sheet'); if (m) m.hidden = true; }

function renderModal(G, force) {
  // domanda libera da rispondere
  if (G.phase === 'answer' && G.pending && G.pending.to === myId && G.pending.kind === 'free' && amIn()) {
    const sec = mySecret(G.round), pd = G.pending, o = opp();
    return showModal(`<h2>${esc(o.name)} ti fa una domanda</h2><div class="incoming">${sec ? cardHTML(G.options.set, sec.sid, '') : ''}<div><div class="q">${pd.text ? '«' + esc(pd.text) + '»' : 'Domanda a voce: ascoltala in chiamata.'}</div><p class="small">Rispondi pensando al tuo personaggio${sec ? ', <b>' + esc(charName(sec.sid)) + '</b>' : ''}.</p>
      <div class="row"><button class="btn yes big" id="ay">✓ Sì</button><button class="btn no big" id="an">✕ No</button></div></div></div>`, m => {
      const k = 'free:' + roundKey(G) + ':' + G.turnNo;
      $('#ay', m).onclick = () => { if (sentFor[k]) return; sentFor[k] = 1; hideModal(); send({ type: 'answer', yes: true }); };
      $('#an', m).onclick = () => { if (sentFor[k]) return; sentFor[k] = 1; hideModal(); send({ type: 'answer', yes: false }); };
    });
  }
  // personaggio appena pescato
  if (G.phase !== 'roundEnd' && G.phase !== 'gameEnd' && amIn() && G.options.secret !== 'scelta') {
    const sec = mySecret(G.round);
    if (sec && secretShown !== roundKey(G)) {
      secretShown = roundKey(G);
      return showModal(`<h2>Il tuo personaggio segreto</h2><div class="reveal"><div class="who">${cardHTML(G.options.set, sec.sid, 'flipin')}<b>${esc(charName(sec.sid))}</b></div></div><p style="text-align:center">Solo tu lo vedi. ${esc(opp().name)} dovrà indovinarlo: lo trovi sempre in basso.</p><div class="mbtns"><button class="btn primary" id="okm">Ricordato!</button></div>`, m => { $('#okm', m).onclick = () => { hideModal(); }; });
    }
  }
  if (G.phase === 'roundEnd' || G.phase === 'gameEnd') {
    const k = roundKey(G);
    if (viewBoard === k && !force) return hideModal();
    const wait = resultsReadyAt - Date.now();
    if (wait > 0 && !force) { hideModal(); clearTimeout(resultsTimer); resultsTimer = setTimeout(() => { if (S && S.game) renderGame(); }, wait + 30); return; }
    return showModal(resultsHTML(G), wireResults);
  }
  const box = $('#modalBox');
  if (box && box._h && (box._h.includes('id="ay"') || box._h.includes('id="nx"') || box._h.includes('data-home'))) hideModal();
}
function wireResults(m) {
  const on = (s, f) => { const e = $(s, m); if (e) e.onclick = f; };
  on('#vb', () => { viewBoard = roundKey(G_()); hideModal(); });
  on('#nx', () => send({ type: 'next' }));
  on('[data-home]', () => leave());
  on('#rm', () => send({ type: 'rematch' }));
  on('#lob', () => send({ type: 'lobby' }));
}
function resultsHTML(G) {
  const res = G.results[G.results.length - 1], end = G.phase === 'gameEnd', o = G.options;
  const w = res.winner ? G.players.find(p => p.id === res.winner) : null;
  const loser = w ? G.players.find(p => p.id !== w.id) : null;
  let h = '';
  const last = res.qa.filter(x => x.kind === 'guess').slice(-1)[0];
  const how = !w ? 'Tutti e due avete indovinato: pareggio!'
    : res.reason === 'right' ? `${w.id === myId ? 'Hai' : esc(w.name) + ' ha'} indovinato con ${res.asked} ${res.asked === 1 ? 'domanda' : 'domande'}.`
    : res.reason === 'wrong' ? `${loser.id === myId ? 'Hai' : esc(loser.name) + ' ha'} provato con ${last ? esc(charName(last.cid)) : '…'}, ma era sbagliato.`
    : res.reason === 'lost' ? `${esc(loser.name)} non aveva più il personaggio segreto sul suo dispositivo.`
    : `${esc(loser.name)} ha lasciato la partita.`;
  const title = end ? (o.mode === 'torneo' && G.results.length > 1 ? 'Fine del torneo' : 'Partita finita') : `Fine della partita ${res.round}`;
  const big = end ? (G.winner === myId ? '🎉 Hai vinto!' : G.winner ? `🏆 Vince ${esc(nameOf(G.winner))}!` : '🤝 Pareggio!') : (res.winner === myId ? '🎉 Hai vinto questa partita!' : w ? `🏆 ${esc(w.name)} vince questa partita` : '🤝 Pareggio');
  h += `<h2>${title}</h2><div class="winner">${big}</div><p>${how}</p>`;
  // personaggi svelati
  h += `<div class="reveal">${G.players.map(p => { const rv = res.reveals[p.id]; return `<div class="who">${rv ? cardHTML(res.set, rv.sid, (reduced() ? '' : 'flipin') + (rv.ok ? '' : ' secret-miss')) : backCard()}<span>Il personaggio di <b>${esc(p.name)}</b></span><b>${rv ? esc(charName(rv.sid)) : 'in attesa…'}</b></div>`; }).join('')}</div>`;
  const all = G.players.every(p => res.reveals[p.id] || p.status !== 'in');
  const bad = G.players.filter(p => res.reveals[p.id] && !res.reveals[p.id].ok);
  if (bad.length) h += `<div class="check bad">⚠️ ${bad.map(p => `<b>${esc(p.name)}</b>: ${esc(res.reveals[p.id].why.join(', '))}`).join('<br>')}</div>`;
  else if (all) h += `<div class="check good">✓ Personaggi controllati: tutte le risposte erano giuste.</div>`;
  const frees = res.qa.filter(x => x.kind === 'free');
  if (frees.length) h += `<details class="opt"><summary>Domande libere (${frees.length}): controllatele voi</summary><div class="help">${frees.map(x => `<div>${esc(nameOf(x.by))}: ${x.text ? '«' + esc(x.text) + '»' : 'a voce'} → <b>${x.yes ? 'Sì' : 'No'}</b></div>`).join('')}</div></details>`;
  G.players.forEach(p => { if (res.mistakes[p.id]) { const ov = G.players.find(x => x.id !== p.id); const rv = ov && res.reveals[ov.id]; h += `<p>🙈 ${p.id === myId ? 'Avevi' : esc(p.name) + ' aveva'} abbassato per sbaglio proprio ${rv ? esc(charName(rv.sid)) : 'la faccia giusta'}!</p>`; } });
  if (o.mode === 'torneo') h += `<div class="score">${G.players.map((p, i) => `<span>${avatar(p, i, 28)}</span><span class="n">${p.wins}</span>`).join('<span class="mut">–</span>')}</div><p style="text-align:center" class="small">Vince chi arriva prima a ${o.target}.</p>`;
  if (end) h += statsTable(G) + '<div class="small mut" style="margin-top:8px">Le tue statistiche sono salvate nella home del gioco, su questo dispositivo.</div>';
  const isHost = S.host === myId;
  h += '<div class="mbtns"><button class="btn ghost" id="vb">👀 Guarda il tabellone</button>';
  if (end) h += `<button class="btn" data-home>🏠 Torna alla home</button>${isHost ? '<button class="btn" id="lob">⚙️ Cambia impostazioni</button><button class="btn primary" id="rm">🔁 Rivincita</button>' : '<span class="small mut">La rivincita la propone chi ha creato la partita</span>'}`;
  else if (amIn()) h += `<button class="btn primary" id="nx">▶ Prossima partita <span class="cd" data-next="${(S.rAt || Date.now()) + 25000}"></span></button>`;
  else h += '<span class="small mut">In attesa della prossima partita…</span>';
  return h + '</div>';
}
function statsTable(G) {
  const ps = G.players;
  const row = (l, f) => `<tr><td>${l}</td>${ps.map(p => `<td>${f(p)}</td>`).join('')}</tr>`;
  const disc = p => (S.disc && S.disc[p.id]) || 0;
  const mis = p => G.results.filter(r => r.mistakes[p.id]).length;
  const best = p => p.st.bestQ ? `«${esc(E.qOf(G, p.st.bestQ.q).text)}»<div class="note">−${p.st.bestQ.elim} facce</div>` : '—';
  return `<h3 style="margin:18px 0 6px">Statistiche</h3><div class="stwrap"><table class="sttab"><thead><tr><th></th>${ps.map((p, i) => `<th>${avatar(p, i, 26)}<br>${esc(p.name)}${p.status === 'disconnesso' ? '<div class="note">tolto</div>' : ''}</th>`).join('')}</tr></thead><tbody>
    ${G.options.mode === 'torneo' ? row('Partite vinte', p => p.wins) : ''}
    ${row('Domande fatte', p => p.st.asked)}${G.options.free ? row('di cui libere', p => p.st.free) : ''}
    ${row('Domande per indovinare (media)', p => p.st.rw ? (p.st.qWins / p.st.rw).toFixed(1) : '—')}${row('Record', p => p.st.fastest != null ? p.st.fastest + ' dom.' : '—')}
    ${row('Domanda migliore', best)}
    ${row('Tentativi giusti / sbagliati', p => p.st.right + ' / ' + p.st.wrong)}${row('🍀 Colpi di fortuna', p => p.st.lucky)}
    ${row('🙈 Faccia giusta abbassata', p => p.bot ? '–' : mis(p))}${G.options.turnTimer ? row('Turni saltati', p => p.st.timeouts) : ''}
    ${row('Disconnessioni', p => p.bot ? '–' : disc(p))}
  </tbody></table></div>`;
}
function rulesHTML() {
  const o = S.game.options;
  return `<h2>Regole di questa partita</h2><ul class="rules-list">
    <li><b>Modalità:</b> ${o.mode === 'torneo' ? `torneo, vince chi arriva prima a ${o.target} partite vinte` : 'partita singola'}</li>
    <li><b>Personaggi:</b> ${A.SETS[o.set].name.toLowerCase()}, ${o.size} facce sul tabellone</li>
    <li><b>Personaggio segreto:</b> ${o.secret === 'scelta' ? 'lo sceglie ognuno' : 'pescato a caso'}</li>
    <li><b>Domande:</b> dall'elenco, risponde il gioco${o.free ? '; anche domande libere a voce o scritte (risponde l\'avversario)' : ''}</li>
    ${o.noBig ? `<li><b>Niente ${bigText(o.set)}</b> nei primi 2 turni di ognuno</li>` : ''}
    <li><b>Se sbagli a indovinare:</b> ${o.wrong === 'perdi' ? 'vince l\'avversario' : 'perdi il turno'}</li>
    <li><b>Ultimo turno per pareggiare:</b> ${o.tie ? 'sì' : 'no'} · <b>Abbassa in automatico:</b> ${o.autoDown ? 'sì' : 'no'}</li>
    <li><b>Tempo per turno:</b> ${o.turnTimer ? fmtTime(o.turnTimer * 1000) : 'nessun limite'} · <b>Attesa per chi si disconnette:</b> ${fmtTime(o.disconnectWait * 1000)}</li>
    <li><b>Turno:</b> una domanda (o un tentativo), poi abbassi le facce e premi «✓ Fine turno»</li>
    <li><b>Comandi:</b> tocca una faccia per abbassarla o rialzarla, trascina per abbassarne tante insieme, tieni premuto (o clic destro) per vederla in grande con la descrizione.</li>
  </ul><div class="mbtns"><button class="btn primary" data-close-info>Chiudi</button></div>`;
}

/* ---------------- chat e diario ---------------- */
function renderFeed() {
  const f = $('#feed'); if (!f || !S || !S.game) return;
  const log = S.game.log.slice(-100).map(l => {
    let msg = esc(l.msg);
    if (l.kind === 'qa') msg = msg.replace(/— ([^:]+): (Sì|No)$/, (m, n, a) => `— ${n}: <span class="yn ${a === 'Sì' ? 'y' : 'n'}">${a === 'Sì' ? '✓ Sì' : '✕ No'}</span>`);
    return { t: l.t || 0, html: `<div class="msg ${l.kind || ''}">${msg}</div>` };
  });
  const ch = chat.map(m => ({ t: m.t, html: `<div class="msg chat"><b style="color:${/^#[0-9a-f]{3,8}$/i.test(m.c) ? m.c : '#ccc'}">${esc(m.by)}:</b> ${esc(m.x)}</div>` }));
  const all = log.concat(ch).sort((a, b) => a.t - b.t);
  const k = all.length + ':' + (all.length ? all[all.length - 1].t : 0) + ':' + S.game.logSeq + ':' + chat.length;
  if (k === feedKey) return; feedKey = k;
  const near = f.scrollHeight - f.scrollTop - f.clientHeight < 80;
  f.innerHTML = all.map(x => x.html).join('') || '<div class="small mut">Nessun messaggio.</div>';
  if (near || !f._init) { f.scrollTop = f.scrollHeight; f._init = 1; }
}
function onChat() {
  if (!S || view !== 'game' || S.status === 'lobby') return;
  renderFeed();
  const last = chat[chat.length - 1], narrow = window.innerWidth <= 900;
  if (last && last.t > chatSeenT) {
    if (narrow && !sideOpen && last.id !== myId) toast(`💬 ${last.by}: ${last.x}`);
    if (!narrow || sideOpen) chatSeenT = last.t;
  }
  updBadge();
}
function updBadge() { const b = $('#chatBadge'); if (!b) return; const unread = chat.filter(m => m.t > chatSeenT && m.id !== myId).length; b.hidden = !unread || (window.innerWidth > 900); b.textContent = unread; }
function sendChat(x) {
  if (!x || !code) return;
  const i = myIdx(); const p = i >= 0 ? S.game.players[i] : null;
  DB.collection(`games/${code}/chat`).add({ t: Date.now(), id: myId, by: p ? p.name : (myName || 'Spettatore'), c: PCOL[(i >= 0 ? i : 2) % PCOL.length], x: x.slice(0, 200) }).then(pruneChat).catch(writeErr);
}
function pruneChat() {
  if (MODE !== 'p2p' || !code) return;
  const pre = `games/${code}/chat/`; const ks = [...Net.cache.keys()].filter(k => k.startsWith(pre));
  if (ks.length > 60) ks.map(k => [k, (Net.cache.get(k) || {}).t || 0]).sort((a, b) => a[1] - b[1]).slice(0, ks.length - 60).forEach(([k]) => DB.doc(k).delete().catch(() => { }));
}

/* ---------------- barra "giocatore disconnesso" e orologi ---------------- */
function renderAway() {
  const bar = $('#awaybar'); if (!bar) return;
  const list = Object.entries((S && S.status === 'playing' && S.away) || {});
  if (!list.length) { bar.hidden = true; bar.innerHTML = ''; bar._k = ''; return; }
  const k = JSON.stringify(list); if (bar._k === k) return; bar._k = k;
  bar.hidden = false;
  bar.innerHTML = list.map(([id, a]) => `<div class="awayrow">⏳ <b>${esc(nameOf(id))}</b> ${id === myId ? '(tu) risulti disconnesso' : 'si è disconnesso'}. Lo aspettiamo ancora <b class="cd" data-until="${a.until}">${fmtTime(a.until - Date.now())}</b>
    <button class="btn sm" data-more="${esc(id)}">+1 minuto</button></div>`).join('');
  $$('[data-more]', bar).forEach(b => b.onclick = () => send({ type: 'more', pid: b.dataset.more }));
}
function tickUI() {
  if (!S || view !== 'game' || !S.game) return;
  $$('#awaybar .cd').forEach(el => el.textContent = fmtTime(+el.dataset.until - Date.now()));
  $$('.netst').forEach(el => el.textContent = netText());
  $$('[data-next]').forEach(el => el.textContent = '(' + Math.max(0, Math.ceil((+el.dataset.next - Date.now()) / 1000)) + ')');
  const G = S.game;
  // scelta del personaggio: 60 secondi, poi sceglie il gioco
  const pc = $('#pickclock');
  if (G.phase === 'secret' && boardMode(G) === 'choose') {
    const st = +(ss.get('cc-pick:' + roundKey(G)) || 0) || (ss.set('cc-pick:' + roundKey(G), Date.now()), Date.now());
    const left = st + 60000 - Date.now();
    if (pc) pc.textContent = '⏱ ' + fmtTime(left);
    if (left <= 0) { hideInfo(); pickSel = null; commitSecret(G, G.board[randInt(G.board.length)]); renderGame(); }
  }
  const el = $('#tclock'); if (!el) return;
  const t = G.options.turnTimer;
  if (!t || S.status !== 'playing' || (G.phase !== 'turn' && G.phase !== 'after')) { el.textContent = ''; return; }
  const ap = G.players[G.turn];
  if (ap && (ap.bot || (S.away && S.away[ap.id]))) { el.textContent = ''; return; }
  const left = (S.tAt || Date.now()) + t * 1000 - Date.now();
  el.textContent = '⏱ ' + fmtTime(left); el.classList.toggle('low', left < 10000);
}

function bindGlobal() {
  document.addEventListener('click', e => {
    if (e.target.closest('[data-close-info]')) hideInfo();
    if (e.target.id === 'info') hideInfo();
    if (e.target.id === 'sheet') hideSheet();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideInfo(); hideSheet(); } });
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (/^[A-Z0-9]{5}$/.test(h) && h !== code && myName) openGame(h, true); });
}
document.body.insertAdjacentHTML('afterbegin', A.DEFS);
bindGlobal();
init();
