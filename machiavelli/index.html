      <div class="tb-actions">
        <button class="btn ghost" id="rulesBtn" title="Regole attive">📜 <span class="hide-sm">Regole</span></button>
        <button class="btn ghost" id="scoreBtn" title="Punteggi e statistiche">🏆 <span class="hide-sm">Punti</span></button>
        <button class="btn ghost" id="chatToggle" title="Chat">💬<span id="chatBadge" class="badge" hidden></span></button>
        <button class="btn ghost" id="quitBtn" title="Esci">✕</button>
      </div>
    </header>
    <div id="awaybar" class="awaybar" hidden></div>
    <div class="layout">
      <main class="tablecol">
        <div id="opponents" class="opponents"></div>
        <div class="board" id="board"><div class="groups" id="groups"></div></div>
        <div class="boardbar"><div class="deckinfo" id="deckInfo"></div><div id="status" class="status"></div><span id="tclock" class="tclock"></span></div>
        <div class="me" id="meArea">
          <div class="mebar">
            <div class="row" style="gap:6px"><div id="meInfo" class="meinfo"></div><button class="btn ghost sm sortbtn" id="sortBtn" title="Cambia l'ordine delle carte in mano"></button></div>
            <div class="actions">
              <button id="undoBtn" class="btn sm" title="Annulla l'ultima mossa">↶ <span class="hide-sm">Annulla</span></button>
              <button id="resetBtn" class="btn sm" title="Rimetti tutto com'era all'inizio del turno">↺ <span class="hide-sm">Rimetti com'era</span></button>
              <button id="drawBtn" class="btn">Pesca e passa</button>
              <button id="commitBtn" class="btn go">✓ Fine turno</button>
            </div>
          </div>
          <div id="hint" class="hint"></div>
          <div class="handzone" id="handZone">
            <div id="hand" class="hand"></div>
          </div>
        </div>
      </main>
      <aside id="side" class="side ${sideOpen ? 'open' : ''}">
        <div class="side-head">Chat e cronaca <span class="small mut netst">${esc(netText())}</span></div>
        <div id="feed" class="feed"></div>
        <form id="chatForm" class="chatform" autocomplete="off"><input id="chatInput" placeholder="Scrivi un messaggio…" maxlength="200"><button class="btn primary" type="submit">Invia</button></form>
      </aside>
    </div>
  </section>`;
  bindGame();
  feedKey = ''; chatSeenT = chat.length ? chat[chat.length - 1].t : 0;
}

function renderGame() {
  const G = G_(); if (!G) return;
  if (drag && drag.started) { pendingRender = true; return; }
  const key = S.code + ':' + (S.started || 0);
  if (key !== gameKey) { gameKey = key; WS = null; resultsReadyAt = 0; lastEventN = G.events.length ? G.events[G.events.length - 1].n : 0; }
  if (builtKey !== key || !$('#game')) { buildGameUI(); builtKey = key; }
  ensureWS();
  if (WS && !WS.chk) sortGroups();
  const me = myIdx();
  $('#game').classList.toggle('editing', !!canEdit());
  renderTop(G, me);
  renderOpponents(G, me);
  renderBoard(G);
  renderMe(G, me);
  renderFeed();
  handleEvents(G);
  renderAway();
  renderModal(G);
  tickUI();
  scheduleBots();
}

function renderTop(G, me) {
  const o = G.options;
  const small = window.innerWidth < 600;
  const p = me >= 0 ? G.players[me] : null;
  const tot = E.totalRounds(G);
  let t;
  const modeT = o.mode === 'torneo' ? `Torneo · mano ${G.round} di ${tot}` : o.mode === 'soglia' ? `A soglia (${o.threshold}) · mano ${G.round}` : 'Partita singola';
  if (small) t = o.mode !== 'singola' ? `Mano ${G.round}${o.mode === 'torneo' ? '/' + tot : ''}${p ? ` · <b>${p.total}</b> pt` : ''}` : `<span class="code-sm">${esc(S.code)}</span>`;
  else {
    t = modeT + ` · codice <b>${esc(S.code)}</b>`;
    if (o.mode !== 'singola' && p) t += ` · i tuoi punti: <b>${p.total}</b>`;
  }
  $('#roundInfo').innerHTML = t;
}

function renderOpponents(G, me) {
  const n = G.players.length, start = me >= 0 ? me : -1;
  let html = '';
  for (let k = 1; k <= n; k++) {
    const i = (start + k + n) % n;
    if (i === me) continue;
    const p = G.players[i];
    const away = S.away && S.away[p.id];
    const active = G.phase === 'turn' && G.turn === i;
    const thinking = active && draftLive(G);
    const minis = Array.from({ length: Math.min(p.hand.length, 6) }, () => '<span class="mini"></span>').join('');
    html += `<div class="opp ${active ? 'active' : ''} ${p.status} ${away ? 'away' : ''}">
      ${avatar(p, i)}
      <div class="oinfo">
        <div class="oname">${esc(p.name)}</div>
        <div class="ocount"><span class="minis">${minis}</span><b>${p.hand.length}</b></div>
        ${thinking ? '<span class="tag think">✍ sta muovendo</span>' : active && p.bot ? '<span class="tag think">🤔 ci pensa</span>' : ''}
        ${away ? '<span class="tag off">offline</span>' : ''}
        ${p.status === 'fuori' ? '<span class="tag">eliminato</span>' : ''}
        ${p.status === 'disconnesso' ? '<span class="tag">disconnesso</span>' : ''}
        ${G.options.mode !== 'singola' ? `<div class="opts">${p.total} punti</div>` : ''}
      </div></div>`;
  }
  $('#opponents').innerHTML = html;
}

function draftLive(G) {
  if (!draft || G.phase !== 'turn') return false;
  const k = S.code + ':' + (S.started || 0) + ':' + turnKey(G);
  return draft.k === k && G.players[G.turn] && draft.by === G.players[G.turn].id;
}

function renderBoard(G) {
  const idx = cardIndex(G);
  const el = $('#groups');
  const editing = !!canEdit();
  let groups, chk = null, mode = 'view', fromHand = new Set();
  if (editing) {
    mode = 'edit'; chk = WS.chk || checkWS();
    groups = WS.groups.map(g => ({ gid: g.gid, ids: g.ids }));
    groups.forEach(g => g.ids.forEach(id => { if (!WS.origTable.has(id)) fromHand.add(id); }));
  } else if (draftLive(G)) {
    mode = 'watch';
    const ti = G.turn;
    const tset = new Set(E.tableCards(G).map(c => c.id));
    groups = draft.groups.map((ids, k) => ({ gid: 'd' + k, ids: ids.filter(id => idx.has(id)) })).filter(g => g.ids.length);
    groups.forEach(g => g.ids.forEach(id => { if (!tset.has(id)) fromHand.add(id); }));
    try { chk = E.checkArrangement(G, ti, groups.map(g => g.ids)); } catch (e) { chk = null; }
  } else {
    groups = G.table.map(g => ({ gid: g.gid, ids: g.cards.map(c => c.id) }));
  }
  $('#board').classList.toggle('watching', mode === 'watch');
  const lm = G.lastMove && mode !== 'watch' ? G.lastMove : null;
  const freshSet = new Set(lm ? lm.played : []);
  const newG = new Set(lm ? lm.groups : []);
  const sel = editing ? WS.sel : [];
  let html = '';
  groups.forEach((g, k) => {
    const a = chk ? chk.groups[k] : null;
    const cls = ['grp'];
    if (a) cls.push(a.ok ? 'ok' : 'bad');
    if (newG.has(g.gid) && mode === 'view') cls.push('new');
    const label = a && !a.ok ? shortErr(a.err) : '';
    const cards = g.ids.map(id => {
      const c = idx.get(id); if (!c) return '';
      const ex = [];
      if (sel.includes(id)) ex.push('sel');
      if (fromHand.has(id)) ex.push('fromhand');
      else if (freshSet.has(id)) ex.push('fresh');
      const asv = c.j && a && a.ok ? (a.as[id] || null) : undefined;
      return cardHTML(c, ex, `data-id="${id}"`, asv);
    }).join('');
    const showHere = editing && sel.length && !sel.every(id => g.ids.includes(id));
    html += `<div class="${cls.join(' ')}" data-g="${esc(g.gid)}">${label && mode !== 'view' ? `<span class="gk" title="${esc(a.err)}">${esc(label)}</span>` : ''}${cards}${showHere ? `<button class="here" data-here="${esc(g.gid)}" title="Metti qui le carte selezionate">＋</button>` : ''}</div>`;
  });
  if (editing) html += `<button class="newzone" data-new="1">${sel.length ? '＋ Nuova combinazione<br><span class="small">con le carte selezionate</span>' : '＋ Nuova<br>combinazione'}</button>`;
  if (!groups.length && !editing) html = `<div class="empty-table">Il tavolo è vuoto: la prima combinazione la cala ${G.phase === 'turn' ? esc(G.players[G.turn].name) : '…'}.</div>`;
  el.innerHTML = html;
  $('#deckInfo').innerHTML = `<span class="stackmini"></span><span><b>${G.deck.length}</b> ${G.deck.length === 1 ? 'carta' : 'carte'} nel mazzo</span>`;
}

function shortErr(e) {
  e = e || '';
  if (/almeno 3/.test(e)) return 'min. 3 carte';
  if (/un jolly/.test(e)) return 'max 1 jolly';
  if (/massimo 4/.test(e)) return 'max 4 carte';
  if (/semi/.test(e)) return 'semi ripetuti';
  if (/buco/.test(e)) return 'scala con buchi';
  return 'non valida';
}
function firstProblem(chk) {
  const bad = chk.groups.find(a => !a.ok);
  if (bad) return 'Combinazione in rosso: ' + bad.err.charAt(0).toLowerCase() + bad.err.slice(1) + '.';
  return chk.errors[0];
}
function statusText(G, me) {
  if (G.phase === 'roundEnd' || G.phase === 'gameEnd') return ['Mano finita', false];
  const ap = G.players[G.turn];
  if (me < 0) return [`Stai guardando la partita · tocca a ${ap ? ap.name : '…'}`, false];
  const p = G.players[me];
  if (p.status === 'disconnesso') return ['Sei stato tolto dalla partita perché sei rimasto disconnesso troppo a lungo. Puoi continuare a guardare.', false];
  if (p.status === 'fuori') return ['Sei stato eliminato: guarda come va a finire 👀', false];
  if (G.turn !== me) {
    if (S.away && ap && S.away[ap.id]) return [`In attesa che ${ap.name} torni online…`, false];
    return [draftLive(G) ? `${ap.name} sta muovendo le carte…` : `Tocca a ${ap.name}…`, false];
  }
  if (WS && WS.sel.length) return [`${WS.sel.length} ${WS.sel.length === 1 ? 'carta selezionata' : 'carte selezionate'}: tocca il ＋ dove metterle`, true];
  return ['Tocca a te!', true];
}

function renderMe(G, me) {
  const area = $('#meArea');
  const [txt, mine] = statusText(G, me);
  $('#status').textContent = txt;
  $('#status').className = 'status' + (mine ? ' mine' : '');
  if (me < 0) { area.hidden = true; return; }
  area.hidden = false;
  const p = G.players[me];
  const editing = !!canEdit();
  $('#meInfo').className = 'meinfo' + (G.phase === 'turn' && G.turn === me ? ' active' : '');
  const handN = editing ? WS.hand.length : p.hand.length;
  $('#meInfo').innerHTML = `${avatar(p, me)}<span class="hide-sm">${esc(p.name)}</span><span class="tag">${handN} ${handN === 1 ? 'carta' : 'carte'}</span>${G.options.firstMeld && !p.opened ? '<span class="tag" title="Prima calata tutta tua">da aprire</span>' : ''}`;
  ['undoBtn', 'resetBtn', 'drawBtn', 'commitBtn'].forEach(b => $('#' + b).hidden = !editing);
  const hint = $('#hint');
  if (editing) {
    const chk = WS.chk || checkWS();
    const played = WS.origHand.size - WS.hand.length;
    $('#undoBtn').disabled = !WS.history.length;
    $('#resetBtn').disabled = !WS.history.length && !played;
    const pen = WS.touched && G.options.restorePenalty && G.deck.length;
    const db = $('#drawBtn');
    db.textContent = !G.deck.length ? 'Passa' : pen ? 'Pesca 3 e passa' : 'Pesca e passa';
    db.className = 'btn' + (pen ? ' warn' : '');
    $('#commitBtn').disabled = !chk.ok;
    let h = '';
    if (chk.ok) { h = `Perfetto: hai calato ${played} ${played === 1 ? 'carta' : 'carte'}. Premi “Fine turno”.`; hint.className = 'hint good'; }
    else {
      hint.className = 'hint';
      h = played ? firstProblem(chk) : (G.options.firstMeld && !p.opened ? 'Prima calata: cala una combinazione fatta solo con carte tue (trascinala su “Nuova combinazione”).' : 'Trascina le carte (o toccale e poi tocca il ＋) per calare, attaccare o riorganizzare il tavolo.');
      if (!played && !WS.touched) hint.className = 'hint good';
    }
    if (pen) h += ` <span class="pen">· Hai spostato carte del tavolo: se rinunci peschi 3 carte.</span>`;
    hint.innerHTML = h;
  } else hint.innerHTML = '';
  // la mano
  const idx = cardIndex(G);
  const ids = editing ? WS.hand : p.hand.map(c => c.id);
  const cards = sortCards(ids.map(id => idx.get(id)).filter(Boolean));
  const sel = editing ? WS.sel : [];
  const back = editing && sel.length && sel.every(id => WS.origHand.has(id)) && sel.some(id => !WS.hand.includes(id));
  $('#hand').innerHTML = cards.map(c => cardHTML(c, sel.includes(c.id) ? ['sel'] : [], `data-id="${c.id}"`)).join('')
    + (back ? '<button class="btn sm" data-back="1" style="align-self:center;margin-left:10px">↩ Riporta in mano</button>' : '')
    + (!cards.length && editing ? '<div class="mut small" style="align-self:center">Hai calato tutto! Premi “Fine turno” per chiudere 🎉</div>' : '');
  $('#sortBtn').textContent = sortMode === 'valore' ? '⇅ per seme' : '⇅ per valore';
}

/* ---------- chat + cronaca ---------- */
function renderFeed() {
  const f = $('#feed'); if (!f || !S || !S.game) return;
  const log = S.game.log.slice(-80).map(l => ({ t: l.t || 0, html: `<div class="msg ${l.kind || ''}">${esc(l.msg)}</div>` }));
  const ch = chat.map(m => ({ t: m.t, html: `<div class="msg chat"><b style="color:${/^#[0-9a-f]{3,8}$/i.test(m.c) ? m.c : '#ccc'}">${esc(m.by)}:</b> ${esc(m.x)}</div>` }));
  const all = log.concat(ch).sort((a, b) => a.t - b.t);
  const k = all.length + ':' + (all.length ? all[all.length - 1].t : 0) + ':' + S.game.logSeq + ':' + chat.length;
  if (k === feedKey) return; feedKey = k;
  const near = f.scrollHeight - f.scrollTop - f.clientHeight < 80;
  f.innerHTML = all.map(x => x.html).join('') || '<div class="small mut">Nessun messaggio.</div>';
  if (near || !f._init) { f.scrollTop = f.scrollHeight; f._init = 1; }
}
function onChat() {
  if (!S || view !== 'game' || S.status === 'lobby') return;
  renderFeed();
  const last = chat[chat.length - 1];
  const narrow = true /* chat a scomparsa su ogni schermo */;
  if (last && last.t > chatSeenT) {
    if (narrow && !sideOpen && last.id !== myId) toast(`💬 ${last.by}: ${last.x}`);
    if (!narrow || sideOpen) chatSeenT = last.t;
  }
  updBadge();
}
function updBadge() {
  const b = $('#chatBadge'); if (!b) return;
  const unread = chat.filter(m => m.t > chatSeenT && m.id !== myId).length;
  b.hidden = !unread; b.textContent = unread;
}
function sendChat(x) {
  if (!x || !code) return;
  const i = myIdx(); const p = i >= 0 ? S.game.players[i] : null;
  DB.collection(`games/${code}/chat`).add({ t: Date.now(), id: myId, by: p ? p.name : (myName || 'Spettatore'), c: PCOL[(i >= 0 ? i : 0) % PCOL.length], x: x.slice(0, 200) }).then(pruneChat).catch(writeErr);
}
function pruneChat() {
  if (MODE !== 'p2p' || !code) return;
  const pre = `games/${code}/chat/`; const ks = [...Net.cache.keys()].filter(k => k.startsWith(pre));
  if (ks.length > 60) ks.map(k => [k, (Net.cache.get(k) || {}).t || 0]).sort((a, b) => a[1] - b[1]).slice(0, ks.length - 60).forEach(([k]) => DB.doc(k).delete().catch(() => { }));
}

/* ---------- eventi -> avvisi ---------- */
function nameOf(id) { const p = S.game.players.find(p => p.id === id); return p ? p.name : '?'; }
function handleEvents(G) {
  for (const e of G.events) {
    if (e.n <= lastEventN) continue;
    lastEventN = e.n;
    switch (e.type) {
      case 'commit':
        if (e.player !== myId) { if (e.freed) toast(`★ ${nameOf(e.player)} ha liberato un jolly!`); else if (e.count >= 4) toast(`🚀 ${nameOf(e.player)} cala ${e.count} carte!`); }
        else if (e.count >= 5) toast(`🚀 Hai calato ${e.count} carte!`, 'good');
        break;
      case 'draw':
        if (e.player === myId) toast(e.penalty ? `Il tavolo torna com'era: peschi ${e.count} carte` : e.auto ? 'Tempo scaduto: peschi una carta' : 'Hai pescato una carta', e.penalty || e.auto ? 'warn' : '');
        else if (e.penalty) toast(`↩️ ${nameOf(e.player)} rinuncia e pesca ${e.count} carte`);
        break;
      case 'pass': if (e.player === myId && e.auto) toast('Tempo scaduto: passi il turno', 'warn'); break;
      case 'removed': toast(e.player === myId ? 'Sei stato tolto dalla partita (disconnesso troppo a lungo)' : `🔌 ${nameOf(e.player)} è stato tolto dalla partita`, 'warn'); break;
      case 'roundEnd': resultsReadyAt = Date.now() + 1500; break;
    }
  }
  if (isMyTurn() && WS && !WS.announced) { WS.announced = true; if (G.players.filter(p => p.status === 'in').length > 1) toast('Tocca a te!', 'big'); }
}

/* ---------- barra "giocatore disconnesso" ---------- */
function renderAway() {
  const bar = $('#awaybar'); if (!bar) return;
  const list = Object.entries((S && S.status === 'playing' && S.away) || {});
  if (!list.length) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  bar.innerHTML = list.map(([id, a]) => `<div class="awayrow">⏳ <b>${esc(nameOf(id))}</b> si è disconnesso. Lo aspettiamo ancora <b class="cd" data-until="${a.until}">${fmtTime(a.until - Date.now())}</b>
    <button class="btn sm" data-more="${esc(id)}">+1 minuto</button></div>`).join('');
  bar.querySelectorAll('[data-more]').forEach(b => b.onclick = () => act(N => { if (N.away && N.away[b.dataset.more]) N.away[b.dataset.more].until += 60000; }));
}
function tickUI() {
  if (!S || view !== 'game' || !S.game) return;
  document.querySelectorAll('#awaybar .cd').forEach(el => el.textContent = fmtTime(+el.dataset.until - Date.now()));
  document.querySelectorAll('.netst').forEach(el => el.textContent = netText());
  const el = $('#tclock'); if (!el) return;
  const G = S.game, t = G.options.turnTimer;
  if (!t || S.status !== 'playing' || G.phase !== 'turn') { el.textContent = ''; return; }
  const ap = G.players[G.turn];
  if (ap && (ap.bot || (S.away && S.away[ap.id]))) { el.textContent = ''; return; }
  const left = (S.tAt || Date.now()) + t * 1000 - Date.now();
  el.textContent = '⏱ ' + fmtTime(left); el.classList.toggle('low', left < 20000);
}

/* ---------- finestre ---------- */
function showModal(html) { const box = $('#modalBox'); if (box._h === html && !$('#modal').hidden) return; box._h = html; box.innerHTML = html; $('#modal').hidden = false; }
function hideModal() { const m = $('#modal'); if (m && !m.hidden) { m.hidden = true; $('#modalBox').innerHTML = ''; $('#modalBox')._h = ''; } }
function showInfo(html, onMount) { $('#infoBox').innerHTML = html; $('#info').hidden = false; if (onMount) onMount($('#infoBox')); }
function hideInfo() { const m = $('#info'); if (m) m.hidden = true; }

function renderModal(G) {
  if (G.phase === 'roundEnd' || G.phase === 'gameEnd') {
    const wait = resultsReadyAt - Date.now();
    if (wait > 0) { hideModal(); clearTimeout(resultsTimer); resultsTimer = setTimeout(() => { if (S && S.game) renderGame(); }, wait + 30); return; }
    return showModal(resultsHTML(G));
  }
  hideModal();
}

function statsTable(G) {
  const ps = G.ranking ? G.ranking.map(id => G.players.find(p => p.id === id)) : G.players.slice();
  const row = (l, f) => `<tr><td>${l}</td>${ps.map(p => `<td>${f(p)}</td>`).join('')}</tr>`;
  const disc = p => (S.disc && S.disc[p.id]) || 0;
  return `<h3 style="margin:18px 0 6px">Statistiche della partita</h3><div class="stwrap"><table class="sttab"><thead><tr><th></th>${ps.map(p => `<th>${avatar(p, G.players.indexOf(p), 26)}<br>${esc(p.name)}${p.status === 'disconnesso' ? '<div class="note">disconnesso</div>' : ''}</th>`).join('')}</tr></thead><tbody>
    ${G.ranking ? row('Piazzamento', p => p.status === 'disconnesso' ? '–' : (G.ranking.indexOf(p.id) + 1) + '°') : ''}
    ${G.options.mode !== 'singola' ? row('Punti totali', p => p.status === 'disconnesso' ? '—' : p.total) + row('Mani vinte', p => p.roundsWon) : ''}
    ${row('Carte calate', p => p.stats.played)}${row('Combinazioni nuove', p => p.stats.combos)}
    ${row('Riorganizzazioni', p => p.stats.reorgs)}${row('Record in un turno', p => p.stats.best)}
    ${G.options.jolly ? row('Jolly liberati', p => p.stats.jokersFreed) : ''}
    ${row('Carte pescate', p => p.stats.drawn)}${row('Penalità da 3', p => p.stats.penalties)}
    ${row('Disconnessioni', p => p.bot ? '–' : disc(p))}
  </tbody></table></div>`;
}

function resultsHTML(G) {
  const o = G.options;
  const res = G.results[G.results.length - 1];
  const end = G.phase === 'gameEnd';
  const winName = nameOf(res.winner);
  const tot = E.totalRounds(G);
  let html = '';
  const how = res.reason === 'blocked' ? (res.winner === myId ? 'Hai meno carte di tutti: vinci la mano!' : esc(winName) + ' ha meno carte di tutti e vince la mano')
    : res.reason === 'last' ? esc(winName) + ' è rimasto da solo'
    : res.winner === myId ? 'Hai calato tutte le carte!' : esc(winName) + ' ha calato tutte le carte';
  if (end) {
    html += `<h2>${o.mode === 'torneo' ? 'Fine del torneo' : 'Partita finita'}</h2><div class="winner">🎉 ${G.winner === myId ? 'Hai vinto!' : esc(nameOf(G.winner)) + ' vince!'}</div>`;
    if (o.mode !== 'singola') html += `<p>${how}. ${o.mode === 'torneo' ? 'Vince chi ha totalizzato meno punti.' : 'Vince l\'ultimo rimasto sotto i ' + o.threshold + ' punti.'}</p>`;
    else html += `<p>${how}.</p>`;
  } else {
    html += `<h2>Fine della mano ${res.round}${o.mode === 'torneo' ? ' di ' + tot : ''}</h2><div class="winner">🏆 ${how}</div>`;
    if (res.reason === 'blocked') html += '<p>Il mazzo era finito e nessuno riusciva più a calare: tutti contano i punti delle carte in mano.</p>';
    if (res.out && res.out.length) html += `<p>💥 ${res.out.map(id => `<b>${esc(nameOf(id))}</b>`).join(', ')} ${res.out.length === 1 ? 'ha superato' : 'hanno superato'} la soglia ed ${res.out.length === 1 ? 'è eliminato' : 'sono eliminati'}.</p>`;
  }
  const rows = res.rows.slice();
  if (end && G.ranking) rows.sort((a, b) => G.ranking.indexOf(a.id) - G.ranking.indexOf(b.id));
  else rows.sort((a, b) => (a.status === 'disconnesso') - (b.status === 'disconnesso') || a.total - b.total);
  const showTot = o.mode !== 'singola';
  html += `<div style="overflow:auto"><table class="res"><tr><th>#</th><th>Giocatore</th><th>Carte rimaste</th><th class="num">Punti mano</th>${showTot ? '<th class="num">Totale</th>' : ''}</tr>`;
  rows.forEach((r, k) => {
    const cards = r.hand.length ? `<div class="cards-row">${sortCards(r.hand).slice(0, 16).map(c => cardHTML(c, ['xs'])).join('')}${r.hand.length > 16 ? ' …' : ''}</div>` : '—';
    html += `<tr class="${r.id === res.winner ? 'win' : ''} ${r.status === 'disconnesso' || r.status === 'fuori' ? 'off' : ''}"><td>${r.status === 'disconnesso' ? '–' : k + 1}</td>
      <td><b>${esc(r.name)}${r.id === myId ? ' (tu)' : ''}</b>${r.note ? `<div class="note">${r.note}</div>` : ''}</td><td>${cards}</td>
      <td class="num">${r.points == null ? '—' : r.points}</td>${showTot ? `<td class="num"><b>${r.status === 'disconnesso' ? '—' : r.total}</b></td>` : ''}</tr>`;
  });
  html += '</table></div>';
  if (end && o.mode !== 'singola' && G.results.length > 1) html += roundsTable(G);
  if (end) html += statsTable(G) + '<div class="small mut" style="margin-top:8px">Le tue statistiche sono salvate nella home del gioco, su questo dispositivo.</div>';
  const isHost = S.host === myId;
  const me = myIdx();
  const inGame = me >= 0 && G.players[me].status !== 'disconnesso';
  html += '<div class="mbtns">';
  if (end) html += `<button class="btn" data-home>🏠 Torna alla home</button>${isHost ? '<button class="btn primary" data-rematch>Rivincita</button>' : '<span class="small mut" style="align-self:center">La rivincita la propone chi ha creato la partita</span>'}`;
  else if (inGame) html += '<button class="btn primary" data-next>Prossima mano</button>';
  else html += '<span class="small mut">In attesa della prossima mano…</span>';
  html += '</div>';
  return html;
}
function roundsTable(G) {
  const R = G.results.length;
  const order = (G.ranking || G.players.map(p => p.id)).map(id => G.players.find(p => p.id === id));
  let h = `<h3 style="margin:18px 0 4px">Punti mano per mano</h3><div style="overflow:auto"><table class="res"><tr><th>Giocatore</th>`;
  for (let r = 1; r <= R; r++) h += `<th class="num">M${r}</th>`;
  h += '<th class="num">Totale</th></tr>';
  for (const p of order) {
    h += `<tr class="${p.status === 'disconnesso' ? 'off' : ''}"><td>${esc(p.name)}</td>`;
    for (let r = 0; r < R; r++) { const s = p.scores[r]; h += `<td class="num">${s == null ? '—' : s}</td>`; }
    h += `<td class="num"><b>${p.status === 'disconnesso' ? '—' : p.total}</b></td></tr>`;
  }
  return h + '</table></div>';
}

function rulesHTML() {
  const o = S.game.options, on = [];
  const tot = E.totalRounds(S.game);
  on.push(`<li><b>Modalità:</b> ${o.mode === 'torneo' ? `torneo su ${tot} mani, vince chi ha meno punti` : o.mode === 'soglia' ? `a soglia: chi arriva a ${o.threshold} punti è eliminato, vince l'ultimo rimasto` : 'partita singola, vince chi cala tutte le carte per primo'}</li>`);
  on.push(`<li><b>Carte a testa:</b> ${o.handSize} · <b>Mazzo:</b> 2 mazzi francesi${o.jolly ? ' + 4 jolly' : ', senza jolly'}</li>`);
  if (o.jolly) on.push('<li><b>Jolly:</b> al massimo uno per combinazione; sul tavolo resta legato alla carta che sostituisce finché non cali la carta vera.</li>');
  on.push(`<li><b>Prima calata tutta tua:</b> ${o.firstMeld ? 'sì' : 'no'}</li>`);
  on.push(`<li><b>Se tocchi il tavolo e rinunci:</b> ${o.restorePenalty ? 'peschi 3 carte' : 'peschi 1 carta come sempre'}</li>`);
  on.push(`<li><b>Tempo per turno:</b> ${o.turnTimer ? fmtTime(o.turnTimer * 1000) + ' minuti' : 'nessun limite'}</li>`);
  on.push(`<li><b>Attesa per chi si disconnette:</b> ${fmtTime(o.disconnectWait * 1000)}</li>`);
  const ex = [[EX(7, 'Q'), 'Numeri: il loro valore'], [EX(12, 'P'), 'J, Q, K: 10'], [EX(1, 'C'), 'Asso: 11'], [{ id: -1, j: true }, 'Jolly: 25']];
  return `<h2>Regole di questa partita</h2>${exampleGroups()}<ul class="rules-list">${on.join('')}
    <li><b>Il turno:</b> puoi calare, attaccare e riorganizzare tutto il tavolo; alla fine ogni combinazione deve essere valida e devi aver calato almeno una carta tua. Altrimenti peschi.</li>
    <li><b>Asso:</b> prima del 2 o dopo il K, niente giro K‑A‑2.</li>
    <li><b>Mazzo finito:</b> si continua senza pescare; se nessuno cala per un giro intero vince la mano chi ha meno carte.</li></ul>
    ${o.jolly ? `<details class="opt"><summary>Come funzionano i jolly</summary><div class="help">${JOLLY_HELP}</div></details>` : ''}
    <h3>Valore delle carte rimaste in mano</h3><p>Chi chiude prende 0 punti, gli altri sommano il valore delle carte che hanno ancora in mano.</p>
    <div class="values">${ex.map(([c, t]) => `<div>${cardHTML(c, ['xs'])}<span>${t}</span></div>`).join('')}</div>
    <div class="mbtns"><button class="btn primary" data-close-info>Chiudi</button></div>`;
}
function scoresHTML() {
  const G = S.game;
  const ps = G.players.slice().sort((a, b) => (a.status === 'disconnesso') - (b.status === 'disconnesso') || (a.status === 'fuori') - (b.status === 'fuori') || a.total - b.total);
  const head = G.options.mode !== 'singola' ? `<h2>Classifica</h2><p>${G.options.mode === 'torneo' ? `Mano ${G.round} di ${E.totalRounds(G)}. Vince chi ha meno punti.` : `Mano ${G.round}. Chi arriva a ${G.options.threshold} punti è eliminato.`}</p>
    <table class="res"><tr><th>#</th><th>Giocatore</th><th class="num">Mani vinte</th><th class="num">Punti</th></tr>
    ${ps.map((p, k) => `<tr class="${p.status === 'disconnesso' || p.status === 'fuori' ? 'off' : ''}"><td>${k + 1}</td><td>${esc(p.name)}${p.status === 'disconnesso' ? ' <span class="note">(disconnesso)</span>' : p.status === 'fuori' ? ' <span class="note">(eliminato)</span>' : ''}</td><td class="num">${p.roundsWon}</td><td class="num"><b>${p.total}</b></td></tr>`).join('')}</table>`
    : '<h2>Statistiche della partita</h2><p>Aggiornate a questo momento.</p>';
  const G2 = Object.assign({}, G, { ranking: null });
  return head + statsTable(G2) + '<div class="mbtns"><button class="btn primary" data-close-info>Chiudi</button></div>';
}

/* ---------- trascinamento (mouse e dito) ---------- */
function onPointerDown(e) {
  const el = e.target.closest('.pc[data-id]');
  if (!el || !canEdit() || (e.button != null && e.button > 0)) return;
  const id = +el.dataset.id;
  drag = { id, x: e.clientX, y: e.clientY, started: false, pid: e.pointerId, ids: null, ghost: null, target: null };
  document.addEventListener('pointermove', onPointerMove, { passive: false });
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerCancel);
}
function onPointerMove(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.started) {
    if (dx * dx + dy * dy < 49) return;
    if (!canEdit()) return endDrag();
    const G = G_(), me = G.players[myIdx()];
    let ids = WS.sel.includes(drag.id) ? WS.sel.slice() : [drag.id];
    if (G.options.firstMeld && !me.opened && ids.some(id => WS.origTable.has(id))) { toast('Prima calata: non puoi ancora toccare le carte del tavolo', 'warn'); return endDrag(); }
    drag.started = true; drag.ids = ids;
    const idx = cardIndex(G);
    const g = document.createElement('div'); g.className = 'dragghost';
    const gw = window.innerWidth < 600 ? 48 : 58;
    g.style.setProperty('--gw', gw + 'px');
    g.innerHTML = sortCards(ids.map(i => idx.get(i))).map(c => cardHTML(c)).join('');
    document.body.appendChild(g); drag.ghost = g;
    ids.forEach(i => document.querySelectorAll(`.pc[data-id="${i}"]`).forEach(x => x.classList.add('dragging')));
  }
  e.preventDefault();
  drag.ghost.style.transform = `translate(${e.clientX - 20}px,${e.clientY - 30}px) rotate(-4deg)`;
  // bersaglio sotto il dito
  const under = document.elementFromPoint(e.clientX, e.clientY);
  let t = null, tel = null;
  if (under) {
    const ge = under.closest('[data-g]'), ne = under.closest('[data-new]'), he = under.closest('#handZone');
    if (ge) { t = { g: ge.dataset.g }; tel = ge; }
    else if (ne) { t = { n: true }; tel = ne; }
    else if (he) { t = { h: true }; tel = he; }
  }
  document.querySelectorAll('.target').forEach(x => { if (x !== tel) x.classList.remove('target'); });
  if (tel) tel.classList.add('target');
  drag.target = t;
  // scorrimento automatico del tavolo
  const b = $('#board');
  if (b) { const r = b.getBoundingClientRect(); if (e.clientY < r.top + 30 && e.clientY > r.top - 40) b.scrollTop -= 12; else if (e.clientY > r.bottom - 30 && e.clientY < r.bottom + 10) b.scrollTop += 12; }
}
function onPointerUp(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag;
  endDrag();
  // il "click" che segue il tocco non deve finire sui pulsanti appena comparsi
  suppressClick = Date.now() + 600;
  if (!d.started) { toggleSel(d.id); return; }
  if (d.target) moveCards(d.ids, d.target);
  else if (pendingRender) { pendingRender = false; renderGame(); }
}
function onPointerCancel() { endDrag(); if (pendingRender) { pendingRender = false; renderGame(); } }
function endDrag() {
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  document.removeEventListener('pointercancel', onPointerCancel);
  if (drag && drag.ghost) drag.ghost.remove();
  document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging'));
  document.querySelectorAll('.target').forEach(x => x.classList.remove('target'));
  const was = drag; drag = null;
  if (was && was.started && pendingRender) { pendingRender = false; setTimeout(() => { if (!drag) renderGame(); }, 0); }
}

function bindGame() {
  const game = $('#game');
  game.addEventListener('pointerdown', onPointerDown);
  game.addEventListener('click', e => {
    if (Date.now() < suppressClick) { suppressClick = 0; return; }
    const here = e.target.closest('[data-here]');
    if (here && WS && WS.sel.length) return moveCards(WS.sel.slice(), { g: here.dataset.here });
    const nz = e.target.closest('[data-new]');
    if (nz) { if (WS && WS.sel.length) return moveCards(WS.sel.slice(), { n: true }); return toast('Seleziona (o trascina qui) le carte per la nuova combinazione'); }
    const back = e.target.closest('[data-back]');
    if (back && WS && WS.sel.length) return moveCards(WS.sel.slice(), { h: true });
    // tocco sul tavolo vuoto: deseleziona
    if (WS && WS.sel.length && e.target.closest('#board') && !e.target.closest('.pc')) { WS.sel = []; renderGame(); }
  });
  $('#undoBtn').addEventListener('click', undoMove);
  $('#resetBtn').addEventListener('click', resetMoves);
  $('#drawBtn').addEventListener('click', drawTurn);
  $('#commitBtn').addEventListener('click', commitTurn);
  $('#sortBtn').addEventListener('click', () => { sortMode = sortMode === 'valore' ? 'seme' : 'valore'; ls.set('mv-sort', sortMode); renderGame(); });
  $('#rulesBtn').addEventListener('click', () => showInfo(rulesHTML()));
  $('#scoreBtn').addEventListener('click', () => showInfo(scoresHTML()));
  $('#chatToggle').addEventListener('click', () => { sideOpen = !sideOpen; $('#side').classList.toggle('open', sideOpen); if (sideOpen && chat.length) chatSeenT = chat[chat.length - 1].t; updBadge(); });
  $('#quitBtn').addEventListener('click', () => showInfo(`<h2>Uscire dalla partita?</h2><p>${S.status === 'playing' ? 'Se esci durante la partita, gli altri ti aspetteranno per il tempo scelto e poi verrai tolto. Puoi rientrare con lo stesso link.' : 'Puoi rientrare quando vuoi con lo stesso link.'}</p>
    <div class="mbtns"><button class="btn" data-close-info>Resta</button><button class="btn warn" data-quit>Esci</button></div>`));
  $('#chatForm').addEventListener('submit', e => { e.preventDefault(); const t = $('#chatInput').value.trim(); if (!t) return; $('#chatInput').value = ''; sendChat(t); });
}
function bindGlobal() {
  $('#modal').addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if ('next' in t.dataset) { act(N => { const r = E.applyAction(N.game, { type: 'next', player: myId }); if (!r.ok) return false; N.tAt = Date.now(); if (N.game.phase === 'gameEnd') { N.status = 'ended'; N.ended = Date.now(); } }); }
    else if ('rematch' in t.dataset) act(N => { N.status = 'lobby'; N.game = null; N.away = {}; });
    else if ('home' in t.dataset) leave();
  });
  $('#info').addEventListener('click', e => {
    if (e.target.id === 'info') return hideInfo();
    const t = e.target.closest('button'); if (!t) return;
    if ('closeInfo' in t.dataset) hideInfo();
    if ('quit' in t.dataset) { hideInfo(); leave(); }
  });
  document.addEventListener('keydown', e => {
    if (!canEdit() || /input|textarea|select/i.test((e.target.tagName || ''))) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undoMove(); }
    else if (e.key === 'Escape' && WS.sel.length) { WS.sel = []; renderGame(); }
  });
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (view === 'game' && S && S.game && S.status !== 'lobby') renderGame(); }, 120); });
  window.addEventListener('hashchange', () => { const h = (location.hash || '').replace('#', ''); if (/^[A-Z0-9]{5}$/.test(h) && h !== code && myName) openGame(h, true); });
}

bindGlobal();
init();
window.__mach = { get S() { return S; }, get WS() { return WS; }, get myId() { return myId; }, E, B, gameAct, act, moveCards, commitTurn };
</script>
<script>
/* 💬 Chat: il pulsante apre e chiude il pannello su ogni schermo */
(function () {
  var SEL = '#chatToggle,#bSide,#chatBtn,#bSideX';
  var wide = function () { return innerWidth > CHAT_BP; }, was = wide();
  function aperta() { try { return !!sideOpen; } catch (e) { return true; } }
  function sync() {
    var open = aperta();
    var L = document.querySelector('.layout'); if (L) L.classList.toggle('chat-chiusa', !open);
    var x = document.getElementById('bSideX'); if (x) x.hidden = !open;
    document.querySelectorAll('#chatToggle,#bSide,#chatBtn').forEach(function (b) {
      b.setAttribute('aria-pressed', open ? 'true' : 'false');
      b.title = open ? 'Nascondi la chat' : 'Mostra la chat';
    });
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest || !e.target.closest(SEL)) return;
    if (wide()) { try { localStorage.setItem('tavolata-chat', aperta() ? 'aperta' : 'chiusa'); } catch (er) {} }
    sync();
    if (wide()) dispatchEvent(new Event('resize'));
  });
  addEventListener('resize', function () {
    var w = wide(); if (w === was) return; was = w;
    try { sideOpen = chatAperta(); } catch (e) { return; }
    var s = document.getElementById('side'); if (s) s.classList.toggle('open', sideOpen);
    sync();
  });
  new MutationObserver(function () { if (document.getElementById('side')) sync(); }).observe(document.getElementById('app') || document.body, { childList: true });
  sync();
})();
</script>
<script>
/* 👤 Account Tavolata: profilo, amici, inviti e stanze (codice comune in ../comune/tavolata.js) */
(function () {
  if (!window.Tavolata) return;
  if (typeof avatar === 'function') { const _av = avatar; avatar = function (p) { return Tavolata.conFoto(_av.apply(this, arguments), p); }; }
  const scrive = () => { const a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#app')); };
  const lobby = () => { if (view === 'game' && S && S.status === 'lobby') renderLobby(); };
  Tavolata.collegaGioco({
    id: 'machiavelli',
    stato: () => ({ view, code, S, seats, myId, DB, MODE }),
    act: fn => act(fn),
    max: () => { try { return MAXP; } catch (e) { return 0; } },
    entra: c => { if (view !== 'home') leave(); setTimeout(() => { const j = document.getElementById('jc'), b = document.getElementById('joinc'); if (j && b) { j.value = c; b.click(); } }, 30); },
    riapri: () => { if (code) openGame(code, true); },
    impostaPosti: r => { seats = r.slice().sort((a, b) => a.t - b.t); },
    ridisegna: lobby,
    impostaNome: n => { myName = n; const nm = document.getElementById('nm'); if (nm && document.activeElement !== nm) nm.value = n; }
  });
  addEventListener('tavolata:stats', () => { if (view === 'home' && !scrive()) renderHome(); });
  addEventListener('tavolata:profili', () => { if (!scrive()) lobby(); });
})();
</script>
