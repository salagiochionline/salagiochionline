</script>
<style>
:root{
  --bg:#1d1a2f; --bg2:#262142; --panel:#2b2550; --panel2:#342d60; --line:rgba(255,255,255,.10);
  --text:#f4f1ff; --muted:#b4acd6; --accent:#ffe066; --accent2:#ffcf3f; --blue:#4dabf7; --violet:#7c4dff;
  --ok:#22c55e; --bad:#f43f5e; --paper:#fbf6e3; --ink:#1b1638;
  --radius:14px;
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{background:radial-gradient(1200px 700px at 50% -10%,#4a3c16 0%,var(--bg) 62%) fixed}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- pulsanti ---------- */
.btn{border:1px solid var(--line);background:var(--panel2);padding:.55em 1em;border-radius:12px;cursor:pointer;font-weight:600;transition:transform .12s,background .12s,opacity .12s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translateY(-1px);background:#3e3672}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(135deg,#f5b400,#ff8a3d);border:none;color:#2a1700}
.btn.primary:hover:not(:disabled){background:linear-gradient(135deg,#ffc21a,#ff9a52)}
.btn.go{background:#22c55e;color:#06260f;border:none}
.btn.go:hover:not(:disabled){background:#34d36d}
.btn.go.pulse:not(:disabled){animation:pulse 1.4s infinite}
.btn.warn{background:#c2410c;border:none}
.btn.ghost{background:transparent}
.btn.sm{padding:.4em .75em;font-size:.86rem;border-radius:9px}
.btn.big{padding:.8em 1.6em;font-size:1.08rem}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}50%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}

/* ---------- logo ---------- */
.logo{font-weight:700;font-size:3.1rem;letter-spacing:-.02em;line-height:1.05;display:inline-flex;align-items:center;gap:.25em;
  transform:rotate(-3deg);filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.logo .lt{background:linear-gradient(90deg,#fff3a3,#ffe066 40%,#ffb03b);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .tiles{display:inline-flex;font-size:.55em;line-height:1;gap:.08em}
.logo .tiles i{font-style:normal;background:var(--paper);color:var(--ink);border-radius:.2em;width:1.15em;height:1.2em;display:grid;place-items:center;box-shadow:0 .12em 0 #b08f1a}
.logo .tiles i:nth-child(1){transform:rotate(-10deg)}
.logo .tiles i:nth-child(2){transform:rotate(4deg) translateY(-.1em);background:var(--accent)}
.logo .tiles i:nth-child(3){transform:rotate(12deg)}
.logo.sm{font-size:1.6rem}
.logo.xs{font-size:1.25rem}

/* ---------- home e lobby ---------- */
body.v-home,body.v-lobby{overflow-y:auto}
body.v-game{overflow:hidden}
.home{max-width:780px;margin:0 auto;padding:30px 16px 60px;display:flex;flex-direction:column;gap:16px;position:relative}
.hero{text-align:center;margin-bottom:4px}
.gamepill{display:table;margin:0 auto 14px;background:var(--accent);color:#1d1a2f;font-weight:700;letter-spacing:.14em;font-size:.75rem;padding:5px 16px;border-radius:99px}
.tagline{color:var(--muted);margin:16px auto 0;max-width:54ch}
.hubbtn{text-decoration:none;color:var(--text);width:max-content;display:inline-flex;align-items:center;gap:6px}
.panel{background:rgba(43,37,80,.78);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(6px)}
.panel h3{margin:0 0 12px;font-size:1.15rem;font-weight:600}
.mut{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.mid{justify-content:center}
.banner{background:#3a2a10;border:1px solid #7c5a10;color:#ffe2a8;border-radius:14px;padding:12px 14px;font-size:.9rem}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gitem{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.medal{font-size:1.2rem;font-weight:700;color:var(--accent);width:40px;text-align:center}
.bigcode{font-size:2.6rem;font-weight:700;letter-spacing:8px;color:var(--accent);margin:4px 0}
.netst{color:#fde68a}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.seat{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 12px}
.seat select{padding:.25em .4em;font-size:.8rem;border-radius:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.tile{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tile b{font-size:1.4rem;color:var(--accent)}.tile span{font-size:.78rem;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.sitem{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.sitem span{color:var(--muted)}
.sitem b{text-align:right;overflow-wrap:anywhere}
input,select{font:inherit;color:var(--text);background:#1f1b38;border:1px solid var(--line);border-radius:10px;padding:.6em .7em}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}

/* impostazioni */
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.flabel{font-size:.85rem;color:var(--muted);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.seg button{background:#1f1b38;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.seg button small{color:var(--muted);font-size:.8rem}
.seg button.on{border-color:var(--accent);background:#3a3218}
.inline{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.group{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.group h4{margin:4px 0 6px;font-size:1rem;color:var(--accent);font-weight:600}
.group .gnote{color:var(--muted);font-size:.82rem;margin:0 0 6px}
.opt{border-radius:12px;padding:8px 10px;margin:4px 0;background:rgba(255,255,255,.03)}
.opt-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.opt-label{font-weight:500}
.opt select{max-width:58%}
.opt details,.catbox details{margin-top:4px}
.opt summary,.catbox summary{cursor:pointer;color:var(--muted);font-size:.82rem;list-style:none;display:inline-flex;gap:4px;align-items:center}
.opt summary::-webkit-details-marker,.catbox summary::-webkit-details-marker{display:none}
.opt summary::before,.catbox summary::before{content:'▸';transition:transform .15s}
.opt details[open] summary::before,.catbox details[open] summary::before{transform:rotate(90deg)}
.help{font-size:.88rem;color:#ece6ff;line-height:1.45;padding:6px 2px 2px}
.help ul{margin:.3em 0;padding-left:1.2em}
.switch{position:relative;width:46px;height:26px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#443c70;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+span{background:#22c55e}
.switch input:checked+span::after{transform:translateX(20px)}
.opt select:disabled,.seg button:disabled,.switch input:disabled+span{opacity:.6;cursor:default}

/* categorie nella lobby */
.catbox{border-radius:14px;padding:10px 12px;background:rgba(255,224,102,.07);border:1px solid rgba(255,224,102,.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 8px 5px 12px;background:var(--paper);color:var(--ink);font-weight:600;font-size:.92rem;border:none}
.chip .x{border:none;background:rgba(0,0,0,.08);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0;font-size:.8rem}
.chip .x:hover{background:#f43f5e;color:#fff}
.chip.add{background:transparent;color:var(--text);border:1.5px dashed rgba(255,255,255,.35);padding:5px 12px;cursor:pointer}
.chip.add:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.chip.add:disabled{opacity:.4;cursor:default}
.chip .nob{font-size:.7rem;opacity:.7}
.chip.custom{background:#ffd8a8}

/* ---------- avatar ---------- */
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:1.1rem;color:#1a1238;box-shadow:0 0 0 2px rgba(255,255,255,.25)}

/* ---------- partita ---------- */
#game{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(29,26,47,.6);backdrop-filter:blur(6px)}
.roundinfo{flex:1;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.roundinfo b{color:var(--accent)}
.tb-actions{display:flex;gap:4px}
.layout{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
.maincol{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:rgba(20,18,34,.6)}
.side-head{padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line)}
.feed{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.msg{padding:4px 8px;border-radius:8px;color:var(--muted);line-height:1.35}
.msg.play{color:#fff3bf}
.msg.warn{color:#ffd0c2;background:rgba(194,65,12,.25)}
.msg.win{color:#d1ffe0;background:rgba(34,197,94,.22);font-weight:600}
.msg.chat{color:var(--text);background:rgba(124,77,255,.22)}
.chatform{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.chatform input{flex:1;min-width:0}

.stage{flex:1;overflow:auto;padding:14px 16px 24px;-webkit-overflow-scrolling:touch}
.stage-in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* lettera */
.lhead{display:flex;align-items:center;gap:18px;justify-content:center;flex-wrap:wrap}
.ltile{width:96px;height:96px;border-radius:22px;background:linear-gradient(160deg,#fff7c2,#ffe066);color:#1d1a2f;font-weight:700;font-size:66px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 0 #b08f1a,0 14px 30px rgba(0,0,0,.4);flex:none;position:relative}
.ltile.rolling{animation:wobble .12s infinite alternate}
.ltile.land{animation:land .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes wobble{from{transform:rotate(-6deg) scale(.96)}to{transform:rotate(6deg) scale(1.02)}}
@keyframes land{0%{transform:scale(1.45) rotate(-8deg)}60%{transform:scale(.92) rotate(3deg)}100%{transform:none}}
.linfo{display:flex;flex-direction:column;gap:4px;min-width:200px}
.linfo .big{font-size:1.25rem;font-weight:600}
.clock{font-size:1.6rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.clock.low{color:#ff7a59;animation:throb 1s infinite}
@keyframes throb{50%{opacity:.55}}

/* corridori */
.racers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.racer{display:flex;align-items:center;gap:8px;background:rgba(29,26,47,.78);border:2px solid transparent;border-radius:16px;padding:5px 12px 5px 5px;transition:.2s}
.racer.me{border-color:rgba(255,224,102,.45)}
.racer.stop{border-color:var(--bad);box-shadow:0 0 18px rgba(244,63,94,.35)}
.racer.away,.racer.disconnesso{opacity:.5}
.racer .nm{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.dots{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;max-width:140px}
.dots i{width:10px;height:10px;border-radius:3px;border:1.5px solid rgba(255,224,102,.7);display:inline-block;transition:background .25s,transform .25s}
.dots i.on{background:var(--accent);transform:scale(1.1)}
.tag{display:inline-block;font-size:.7rem;padding:1px 6px;border-radius:99px;background:#443c70;margin-left:4px;vertical-align:middle}
.tag.stop{background:var(--bad)}
.tag.off{background:#c2410c}
.tag.done{background:#22c55e;color:#06260f}

/* foglio delle risposte */
.sheet{position:relative;background:var(--paper);color:var(--ink);border-radius:18px;padding:16px 18px 16px 46px;
  box-shadow:0 2px 0 rgba(0,0,0,.2),0 18px 40px rgba(0,0,0,.35);display:grid;grid-template-columns:1fr 1fr;gap:4px 26px;
  background-image:linear-gradient(90deg,transparent 30px,rgba(244,63,94,.35) 30px,rgba(244,63,94,.35) 32px,transparent 32px)}
.sheet .holes{position:absolute;left:9px;top:18px;bottom:18px;display:flex;flex-direction:column;justify-content:space-around}
.sheet .holes i{width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.cell{position:relative;display:flex;flex-direction:column;gap:0;padding:6px 0 4px}
.cell .ci{font-size:.74rem;font-weight:600;color:#6b5f8f;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:center}
.cell input{font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:1.55rem;line-height:1.2;background:transparent;border:none;border-bottom:2px solid rgba(77,120,200,.35);border-radius:0;color:var(--ink);padding:2px 30px 3px 2px;width:100%}
.cell input:focus{outline:none;border-bottom-color:#f5b400;background:rgba(255,224,102,.18)}
.cell .mk{position:absolute;right:2px;bottom:8px;font-weight:700;font-size:1.05rem}
.cell.ok .mk{color:#15803d}
.cell.bad input{border-bottom-color:#f43f5e}
.cell.bad .mk{color:#be123c}
.cell .why{font-size:.74rem;color:#be123c;min-height:1em}
.sheet.locked input{pointer-events:none;color:#4b4568}
.sheet .cover{position:absolute;inset:0;border-radius:18px;background:rgba(29,26,47,.55);display:grid;place-items:center;text-align:center;color:#fff;font-weight:600;font-size:1.1rem;padding:20px;backdrop-filter:blur(1px)}
.sheet .cover span{background:rgba(29,26,47,.85);padding:12px 18px;border-radius:14px}
.wactions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.stopbtn{background:var(--bad);color:#fff;font-size:1.3rem;font-weight:700;padding:.6em 1.9em;border-radius:16px;border:none;box-shadow:0 5px 0 #9f1239;cursor:pointer;letter-spacing:.04em;transition:transform .1s,box-shadow .1s}
.stopbtn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #9f1239}
.stopbtn:disabled{background:#5b5375;box-shadow:0 5px 0 #3b3456;cursor:default;opacity:.8}
.stopbtn:not(:disabled){animation:stopglow 1.2s infinite}
@keyframes stopglow{50%{box-shadow:0 5px 0 #9f1239,0 0 0 8px rgba(244,63,94,.25)}}
.whint{text-align:center;color:var(--muted);font-size:.86rem}
.stopbanner{background:rgba(244,63,94,.18);border:2px solid var(--bad);border-radius:14px;padding:10px 14px;text-align:center;font-weight:600;font-size:1.05rem}
.stopbanner b.cd{font-size:1.4rem;color:#fff}
.stamp{position:fixed;left:50%;top:42%;z-index:80;pointer-events:none;font-size:clamp(3rem,12vw,6rem);font-weight:700;color:var(--bad);border:.12em solid var(--bad);border-radius:.25em;padding:0 .35em;background:rgba(29,26,47,.7);
  transform:translate(-50%,-50%) rotate(-12deg);animation:stamp 1.6s ease-out forwards;text-align:center;line-height:1.1}
.stamp small{display:block;font-size:.28em;color:#fff;font-weight:600;padding-bottom:.3em}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(3);opacity:0}18%{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}24%{transform:translate(-50%,-50%) rotate(-12deg) scale(1.06)}30%{transform:translate(-50%,-50%) rotate(-12deg) scale(1)}80%{opacity:1}100%{opacity:0}}

/* controllo delle parole */
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.vhead h2{margin:0;font-size:1.3rem}
.vcat{background:rgba(43,37,80,.82);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.vcat h4{margin:0 0 8px;display:flex;gap:8px;align-items:center;font-size:1rem}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.vans{display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border-radius:12px;padding:6px 8px;border:3px solid transparent;transition:border-color .2s}
.vans.anim{animation:flipin .45s both}
@keyframes flipin{from{transform:perspective(500px) rotateX(-80deg);opacity:0}to{transform:none;opacity:1}}
.vans .av{width:28px;height:28px;font-size:.85rem}
.vans .wbox{flex:1;min-width:0;display:flex;flex-direction:column}
.vans .who{font-size:.72rem;color:#6b5f8f;font-weight:600}
.vans .w{font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:1.35rem;line-height:1.1;overflow-wrap:anywhere}
.vans.auto .w{text-decoration:line-through;opacity:.55}
.vans.empty .w{opacity:.45;font-style:italic;font-family:inherit;font-size:.95rem;text-decoration:none}
.vans.out{border-color:var(--bad);background:#ffe3e8}
.vans.mine{box-shadow:inset 0 0 0 2px #f5b400}
.bd{display:inline-block;font-size:.7rem;font-weight:600;padding:1px 6px;border-radius:99px;margin-right:3px;white-space:nowrap}
.bd.kn{background:#d3f9d8;color:#0b5a26}
.bd.dp{background:#d0ebff;color:#0b3f6b}
.bd.bad{background:#ffd6dc;color:#9f1239}
.thumb{border:2px solid #c9c2e0;background:#fff;border-radius:10px;padding:3px 8px;cursor:pointer;font-weight:700;color:var(--ink);display:inline-flex;gap:4px;align-items:center;flex:none;min-width:48px;justify-content:center}
.thumb.on{background:var(--bad);border-color:var(--bad);color:#fff}
.thumb:disabled{cursor:default;opacity:.85}
.ncount{font-size:.8rem;font-weight:700;color:#9f1239;flex:none}
.vfoot{position:sticky;bottom:-24px;margin:0 -16px -24px;padding:10px 16px 14px;background:linear-gradient(transparent,rgba(29,26,47,.96) 30%);display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.donechips{display:flex;gap:4px;flex-wrap:wrap}
.donechips .av{width:26px;height:26px;font-size:.75rem;opacity:.35}
.donechips .av.ok{opacity:1;box-shadow:0 0 0 2px #22c55e}

/* risultati del giro */
.rhead{text-align:center}
.rhead h2{margin:0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.rcard{background:rgba(43,37,80,.88);border:1px solid var(--line);border-radius:16px;padding:10px 12px;animation:rise .4s both}
.rcard.top{border-color:var(--accent);box-shadow:0 0 22px rgba(255,224,102,.18)}
.rcard .rh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rcard .rh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .rsum{font-size:1.4rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-size:.9rem}
.rrow .rw{flex:1;min-width:0;overflow-wrap:anywhere}
.rrow .rw small{color:var(--muted);display:block;font-size:.7rem}
.rrow .rw.x{color:var(--muted)}
.rrow .rw.x .ww{text-decoration:line-through}
.pt{min-width:48px;text-align:center;border-radius:99px;font-weight:700;font-size:.8rem;padding:2px 8px;flex:none}
.pt.p20{background:var(--accent);color:#2a1d00}
.pt.p10{background:#22c55e;color:#04210f}
.pt.p5{background:#74c0fc;color:#04213a}
.pt.p0{background:#443c70;color:#cfc8ef}
.pt.pop{animation:pop .4s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:none}}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.standings{display:flex;flex-direction:column;gap:6px}
.stand{display:grid;grid-template-columns:28px 34px 1fr 64px;align-items:center;gap:8px}
.stand .pos{font-weight:700;color:var(--accent);text-align:center}
.stand .barw{height:14px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.stand .bar{height:100%;border-radius:99px;background:linear-gradient(90deg,#f5b400,#ffe066);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.stand .nm{font-size:.85rem;margin-bottom:2px}
.stand .tot{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.nextbar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}

/* ---------- modali ---------- */
.modal{position:fixed;inset:0;background:rgba(10,8,20,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;backdrop-filter:blur(3px)}
#info{z-index:60}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:720px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 60px rgba(0,0,0,.5);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.modal-box h2{margin:0 0 6px}
.modal-box p{color:var(--muted)}
.res{width:100%;border-collapse:collapse;margin:10px 0;font-size:.92rem}
.res th,.res td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.res th{color:var(--muted);font-weight:500;font-size:.8rem}
.res td.num,.res th.num{text-align:right}
.res tr.win td{background:rgba(255,224,102,.12)}
.res tr.off td{opacity:.6}
.winner{font-size:1.35rem;font-weight:700;margin:4px 0 8px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.rules-list{padding-left:1.1em;line-height:1.6}
.rules-list b{color:var(--accent);font-weight:600}
.note{font-size:.72rem;color:#fdba74;font-weight:500}
.stwrap{overflow-x:auto;border-radius:12px;background:rgba(0,0,0,.2)}
.sttab{border-collapse:collapse;width:100%;font-size:.88rem;white-space:nowrap}
.sttab th,.sttab td{padding:7px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
.sttab th{font-weight:600;font-size:.8rem;vertical-align:bottom}
.sttab th .av{display:inline-grid;font-size:.8rem;margin-bottom:2px;width:30px;height:30px}
.sttab td:first-child{text-align:left;color:var(--muted);position:sticky;left:0;background:#2b2550}
.sttab td.lw{font-family:'Patrick Hand',cursive;font-size:1.05rem;white-space:normal;min-width:90px}
.sttab tr.best td{color:var(--accent);font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.example{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.example .chip{font-family:'Patrick Hand',cursive;font-size:1.1rem}

/* ---------- avvisi ---------- */
.toasts{position:fixed;top:24vh;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:70;pointer-events:none;align-items:center;width:max-content;max-width:92vw}
.toast{background:#111;border:1px solid var(--line);padding:9px 16px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:rise .2s ease-out;text-align:center}
.toast.warn{background:#c2410c}
.toast.good{background:#15803d}
.toast.big{background:var(--accent);color:#2a1d00;font-size:1.15rem}
.toast.out{opacity:0;transition:opacity .4s}

/* giocatore disconnesso */
.awaybar{background:rgba(194,65,12,.88);display:flex;flex-direction:column;gap:4px;padding:6px 14px;font-size:.92rem;z-index:5}
.awayrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.awayrow .btn{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.35)}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:.7rem;font-weight:700;margin-left:3px;padding:0 5px;text-align:center}
.specbar{background:rgba(77,171,247,.2);border:1px solid rgba(77,171,247,.5);border-radius:12px;padding:8px 12px;text-align:center;font-size:.9rem}

  .layout{grid-template-columns:1fr}

  .side.open{transform:none}
}
@media (max-width:640px){
  .topbar{gap:6px;padding:6px 8px}
  .tb-actions .btn{padding:.45em .6em}
  .logo{font-size:2.1rem;flex-wrap:wrap;justify-content:center}
  .logo.sm{font-size:1.3rem}
  .logo.xs{font-size:1rem}
  .logo.xs .lt{display:none}
  .logo.xs{font-size:1.5rem}
  .seg{grid-template-columns:1fr}
  .sgrid{grid-template-columns:1fr}
  .hide-sm{display:none}
  .opt select{max-width:100%}
  .opt-head{flex-wrap:wrap}
  .bigcode{font-size:2.1rem;letter-spacing:6px}
  .stage{padding:10px 10px 20px}
  .ltile{width:72px;height:72px;font-size:50px;border-radius:18px}
  .lhead{gap:12px}
  .linfo{min-width:0}
  .linfo .big{font-size:1.05rem}
  .clock{font-size:1.35rem}
  .sheet{grid-template-columns:1fr;padding:12px 12px 12px 40px}
  .sheet .holes{left:7px}
  .cell input{font-size:1.45rem}
  .racer{padding:3px 8px 3px 3px;gap:6px}
  .racer .av{width:28px;height:28px;font-size:.85rem}
  .racer .nm{max-width:80px;font-size:.8rem}
  .dots i{width:8px;height:8px}
  .vlist{grid-template-columns:1fr;gap:6px}
  .vans{padding:4px 6px;gap:6px}
  .vans .av{width:24px;height:24px;font-size:.75rem}
  .vans .w{font-size:1.2rem}
  .vcat{padding:8px}
  .vhead h2{font-size:1.1rem}
  .dtxt{display:none}
  .vfoot .btn.big{padding:.6em 1.1em;font-size:1rem}
  .vfoot{bottom:-20px;margin:0 -10px -20px;padding:10px 10px 12px}
  .rgrid{grid-template-columns:1fr}
  .stopbtn{font-size:1.15rem;padding:.6em 1.4em}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  function botsDone(G, now) {
    const el = now - G.t0;
    return active(G).filter(p => p.bot).every(p => { const b = G.bots[p.id]; return !b || el >= b.doneAt; });
  }
  function botWantsStop(G, now) {
    if (G.phase !== 'write') return null;
    const el = now - G.t0;
    let best = null;
    active(G).filter(p => p.bot).forEach(p => { const b = G.bots[p.id]; if (b && b.stopAt != null && el >= b.stopAt && (!best || b.stopAt < best.at)) best = { id: p.id, at: b.stopAt }; });
    return best ? best.id : null;
  }

  return {
    DEFAULT_OPTIONS, BASE_LETTERS, HARD_LETTERS, MIN_CATS, MAX_CATS, BOT_LEVELS, COLLECT_GRACE, RESULTS_PAUSE, CATS: W.CATS, DEFAULT_CATS: W.DEFAULT_CATS,

    letterPool, plannedRounds, botPlan, botAnswersAt, botFilledAt, botsDone, botWantsStop,
    createGame, startRound, pressStop, endWriting, collect, voters, scoreRound, nextRound, removePlayer, finish, isOver, active
  };
});

/* =========================================================
   DATABASE: online (claude db) oppure locale (stesso dispositivo / più schede)

function makeDB(kv){
  const snap=p=>{const d=kv.get(p);return {id:p.split('/').pop(),exists:!!d,data:()=>d?clone(d):undefined,metadata:{fromCache:false,hasPendingWrites:false}}};
  const docRef=p=>({id:p.split('/').pop(),path:p,get:async()=>snap(p),set:d=>kv.write('set',p,clone(d)),
    update:async d=>{if(!kv.get(p))throw{code:'invalid_argument'};return kv.write('update',p,clone(d))},
    delete:()=>kv.write('delete',p,null),
    onSnapshot(next){let last;const f=()=>{const raw=JSON.stringify(kv.get(p));if(raw!==last){last=raw;next(snap(p))}};const un=kv.listen(f);setTimeout(f,0);return un},
    collection:c=>collRef(p+'/'+c)});
  const collRef=(p,q={w:[],o:null,l:null})=>{
    const run=()=>{const dep=p.split('/').length+1;let docs=kv.keys().filter(k=>k.startsWith(p+'/')&&k.split('/').length===dep).map(snap).filter(d=>d.exists);
      for(const[f,op,v]of q.w)docs=docs.filter(d=>{const x=d.data()[f];return op==='=='?x===v:op==='!='?x!==v:op==='>'?x>v:op==='<'?x<v:op==='>='?x>=v:op==='<='?x<=v:op==='in'?v.includes(x):true});
      if(q.o){const[f,dir]=q.o;docs.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];return(x>y?1:x<y?-1:0)*(dir==='desc'?-1:1)})}else docs.sort((a,b)=>a.id<b.id?-1:1);
      if(q.l)docs=docs.slice(0,q.l);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}};
    return{path:p,where:(f,op,v)=>collRef(p,{...q,w:[...q.w,[f,op,v]]}),orderBy:(f,d='asc')=>collRef(p,{...q,o:[f,d]}),limit:n=>collRef(p,{...q,l:n}),
      get:async()=>run(),onSnapshot(next){let last;const f=()=>{const s=run();const raw=JSON.stringify(s.docs.map(d=>[d.id,d.data()]));if(raw!==last){last=raw;next(s)}};const un=kv.listen(f);setTimeout(f,0);return un},
      doc:id=>docRef(p+'/'+(id||rid(14))),add:async d=>{const r=docRef(p+'/'+rid(14));await r.set(d);return r}}};
  return{doc:docRef,collection:p=>collRef(p)};
}
/* stessa macchina: localStorage + BroadcastChannel (più schede) */
function makeLocalKV(){
  const PFX='ncc-db:';const mem={};const fresh=new Map();
  const st={get(p){if(fresh.has(p))return fresh.get(p);try{const v=localStorage.getItem(PFX+p);return v?JSON.parse(v):null}catch(e){return mem[p]!==undefined?mem[p]:null}},
    set(p,d){fresh.set(p,d);try{localStorage.setItem(PFX+p,JSON.stringify(d))}catch(e){mem[p]=d}},
    del(p){fresh.set(p,null);try{localStorage.removeItem(PFX+p)}catch(e){delete mem[p]}},
    keys(){let k=[];try{k=Object.keys(localStorage).filter(k=>k.startsWith(PFX)).map(k=>k.slice(PFX.length))}catch(e){k=Object.keys(mem)}const s=new Set(k);fresh.forEach((v,p)=>{if(v)s.add(p);else s.delete(p)});return[...s]}};
  const L=new Set();let bc=null;
  try{bc=new BroadcastChannel('ncc-db');bc.onmessage=e=>{const m=e.data;if(m&&m.p)fresh.set(m.p,m.d);L.forEach(f=>f())}}catch(e){}
  try{addEventListener('storage',e=>{if(e.key&&e.key.startsWith(PFX)){fresh.delete(e.key.slice(PFX.length));L.forEach(f=>f())}})}catch(e){}
  return{get:p=>st.get(p),keys:()=>st.keys(),listen(f){L.add(f);return()=>L.delete(f)},
    write(op,p,d){if(op==='set')st.set(p,d);else if(op==='update'){const o=st.get(p);if(o)st.set(p,{...o,...d})}else st.del(p);
      setTimeout(()=>L.forEach(f=>f()),0);try{bc&&bc.postMessage({p,d:st.get(p)})}catch(e){}return Promise.resolve();}};
}
/* =========================================================
   RETE SENZA ACCOUNT: server pubblico MQTT (messaggi "conservati")
   Ogni documento è un messaggio conservato sul tema tavolata-nomicosecitta/v1/<percorso>
   ========================================================= */
const BROKER=(()=>{try{const q=new URLSearchParams(location.search);if(q.get('broker'))return q.get('broker');}catch(e){}return'wss://broker.emqx.io:8084/mqtt';})();
const TP='tavolata-nomicosecitta/v1/';
const Net={client:null,status:'',cache:new Map(),L:new Set(),subs:new Set(),ready:null,nt:null,
  setStatus(s){this.status=s;document.querySelectorAll('.netst').forEach(el=>el.textContent=netText());},
  notify(){clearTimeout(this.nt);this.nt=setTimeout(()=>this.L.forEach(f=>f()),0);},
  connect(){
    if(this.client&&this.client.connected)return Promise.resolve(true);
    if(this.ready)return this.ready;
    this.ready=new Promise(res=>{
      let done=false;const fin=v=>{if(!done){done=true;if(!v)this.ready=null;res(v)}};
      let c;try{c=mqtt.connect(BROKER,{clientId:'ncc_'+rid(12),keepalive:30,reconnectPeriod:2500,connectTimeout:10000,clean:true,resubscribe:true});}catch(e){return fin(false)}
      this.client=c;
      c.on('connect',()=>{this.setStatus('ok');this.subs.forEach(t=>c.subscribe(t,{qos:1}));fin(true);});
      c.on('reconnect',()=>this.setStatus('offline'));c.on('offline',()=>this.setStatus('offline'));c.on('error',()=>{});
      c.on('message',(topic,payload)=>{
        if(!topic.startsWith(TP))return;const p=topic.slice(TP.length);let d=null;
        if(payload&&payload.length){try{d=JSON.parse(typeof payload==='string'?payload:payload.toString())}catch(e){return}}
        const old=this.cache.get(p);
        if(d&&old&&typeof d.v==='number'&&typeof old.v==='number'&&d.v<old.v)return;
        if(d)this.cache.set(p,d);else this.cache.delete(p);this.notify();
      });
      setTimeout(()=>{if(!done){try{c.end(true)}catch(e){}this.client=null;fin(false)}},14000);
    });
    return this.ready;
  },
  sub(code){[TP+'games/'+code,TP+'games/'+code+'/#'].forEach(t=>{if(!this.subs.has(t)){this.subs.add(t);if(this.client)this.client.subscribe(t,{qos:1});}});},
  unsub(code){[TP+'games/'+code,TP+'games/'+code+'/#'].forEach(t=>{this.subs.delete(t);try{this.client&&this.client.unsubscribe(t)}catch(e){}});
    [...this.cache.keys()].forEach(k=>{if(k==='games/'+code||k.startsWith('games/'+code+'/'))this.cache.delete(k)});},
  kv(){return{get:p=>this.cache.get(p)||null,keys:()=>[...this.cache.keys()],listen:f=>{this.L.add(f);return()=>this.L.delete(f)},
    write:(op,p,d)=>{let v=null;if(op==='set')v=d;else if(op==='update'){const o=this.cache.get(p);if(!o)return Promise.resolve();v={...o,...d};}
      if(v)this.cache.set(p,v);else this.cache.delete(p);this.notify();
      return new Promise(res=>{try{this.client.publish(TP+p,v?JSON.stringify(v):'',{qos:1,retain:true},()=>res());}catch(e){res()}});}};},
  waitDoc(p,ms){return new Promise(res=>{if(this.cache.get(p))return res(true);const f=()=>{if(this.cache.get(p)){this.L.delete(f);res(true)}};this.L.add(f);setTimeout(()=>{this.L.delete(f);res(!!this.cache.get(p))},ms);});}
};

    <li><b>Punti:</b> ★ 20 se sei l'unico con una parola buona in quella categoria, ● 10 se la tua parola è diversa da quelle degli altri, ▲ 5 se qualcuno ha scritto la stessa parola, ✗ 0 se è vuota o non vale.</li>

}

/* ---------------- statistiche sul dispositivo ---------------- */
function loadStats() { try { return JSON.parse(ls.get('ncc-stats') || '[]') } catch (e) { return [] } }
function saveGameStats() {
  if (!S || !S.game) return;
  const G = S.game;
  const me = G.players.find(p => p.id === myId);
  if (!me) return;
  const ended = S.status === 'ended';
  const removed = me.status === 'disconnesso';
  if (!ended && !removed) return;
  const all = loadStats();
  const k = S.code + ':' + myId + ':' + (S.started || 0);
  if (all.some(r => r.k === k)) return;
  const pos = G.ranking && G.ranking.length ? G.ranking.indexOf(myId) + 1 : G.players.length;
  const w = G.players.filter(p => (G.winners || []).includes(p.id)).map(p => p.name);
  all.push({ k, code: S.code, t: Date.now(), name: me.name, n: G.players.length, mode: G.options.mode, rounds: G.results.length,
    pos: removed ? G.players.length : pos, won: !removed && (G.winners || []).includes(myId), winner: w.join(' e '), total: me.total,
    st: me.stats, disc: (S.disc && S.disc[myId]) || 0, removed });
  ls.set('ncc-stats', JSON.stringify(all.slice(-200)));
}
let statName = null;
function statsHome() {
  const all = loadStats();
  if (!all.length) return `<div class="panel"><h3>Le tue statistiche</h3><div class="mut small">Ancora nessuna partita conclusa su questo dispositivo. Finisci una partita e qui troverai vittorie, parole uniche, STOP gridati, la parola più lunga e molto altro.</div></div>`;
  const names = [...new Set(all.map(r => r.name))];
  if (!statName || !names.includes(statName)) statName = names.includes(myName) ? myName : all[all.length - 1].name;
  const rs = all.filter(r => r.name === statName).sort((a, b) => b.t - a.t);
  const sum = k => rs.reduce((a, r) => a + ((r.st && r.st[k]) || 0), 0);
  const max = k => rs.reduce((a, r) => Math.max(a, (r.st && r.st[k]) || 0), 0);
  const wins = rs.filter(r => r.won).length, avgPos = rs.reduce((a, r) => a + r.pos, 0) / rs.length;
  const disc = rs.reduce((a, r) => a + (r.disc || 0), 0);
  let streak = 0; for (const r of rs) { if (r.won) streak++; else break; }
  const letters = rs.reduce((a, r) => a + (r.rounds || 0), 0), pts = rs.reduce((a, r) => a + (r.total || 0), 0);
  let longest = ''; rs.forEach(r => { const l = r.st && r.st.longest; if (l && E.wordKey(l).length > E.wordKey(longest).length) longest = l; });
  const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
  const item = (l, v) => `<div class="sitem"><span>${l}</span><b>${v}</b></div>`;
  const modeTxt = r => r.mode === 'punti' ? 'a punti, ' + r.rounds + ' lettere' : r.rounds + ' lettere';
  return `<div class="panel">
    <div class="row between" style="margin-bottom:12px"><h3>Le tue statistiche</h3>${names.length > 1 ? `<select id="stn">${names.map(n => `<option ${n === statName ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : `<span class="mut">${esc(statName)}</span>`}</div>
    <div class="tiles">${tile(rs.length, 'partite')}${tile(wins, 'vittorie')}${tile(Math.round(wins / rs.length * 100) + '%', 'vinte')}${tile(avgPos.toFixed(1) + '°', 'piazzamento medio')}${tile(streak, 'vittorie di fila')}${tile(disc, 'disconnessioni')}</div>
    <div class="sgrid" style="margin-top:12px">
      ${item('✅ Parole valide', sum('valid'))}${item('★ Colpi da 20 (solo tu)', sum('uniq'))}
      ${item('▲ Doppioni', sum('dup'))}${item('🛑 STOP gridati', sum('stops'))}
      ${item('🏅 Lettere vinte', sum('roundsWon'))}${item('🚀 Record in una lettera', max('best') + ' punti')}
      ${item('📊 Media per lettera', letters ? (pts / letters).toFixed(1) + ' punti' : '–')}${item('👎 Tue parole bocciate', sum('rejected'))}
      ${item('📏 Parola più lunga', longest ? esc(longest) : '–')}${item('🔤 Lettere giocate', letters)}
    </div>
    <div class="small mut" style="margin:14px 0 8px">Ultime partite</div>
    <div class="glist">${rs.slice(0, 10).map(r => `<div class="gitem"><div class="medal">${r.removed ? '–' : r.pos + '°'}</div><div style="flex:1;min-width:0"><div><b>${r.removed ? 'Disconnesso' : r.won ? 'Vittoria!' : 'Ha vinto ' + esc(r.winner)}</b></div><div class="small mut">${new Date(r.t).toLocaleDateString('it-IT', { day: 'numeric', month: 'short' })} · ${modeTxt(r)} · ${r.n} giocatori${r.disc ? ` · disconnesso ${r.disc} ${r.disc === 1 ? 'volta' : 'volte'}` : ''}</div></div><div style="text-align:right"><b>${r.total}</b><div class="small mut">punti</div></div></div>`).join('')}</div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost sm" id="stclr">Azzera statistiche</button></div>
  </div>`;
}
function wireStatsHome() {
  const sn = $('#stn'); if (sn) sn.onchange = () => { statName = sn.value; renderHome(); };
  const c = $('#stclr'); if (c) c.onclick = () => showInfo(`<h2>Azzerare le statistiche?</h2><p>Verranno cancellate tutte le statistiche di ${esc(statName)} su questo dispositivo.</p>
    <div class="mbtns"><button class="btn" data-close-info>Annulla</button><button class="btn warn" id="stok">Azzera</button></div>`, m => {

/* =========================================================
   CREA / APRI / ESCI
   ========================================================= */
function busy(msg) { $('#app').innerHTML = `<div class="home"><div class="panel mut">${esc(msg)}</div></div>`; }
function writeErr(e) {
  if (e && e.code === 'invalid_argument') toast('Non hai il permesso di giocare qui.', 'warn');
  else toast('Connessione instabile, riprova.', 'warn');
}
async function createGame() {
  if (MODE === 'claude' && !CANWRITE) return toast('Non hai il permesso di creare partite', 'warn');
  const c = genCode();
  if (MODE === 'p2p') {
    busy('Preparo la partita…');
    if (!(await Net.connect())) { renderHome(); return toast('Non riesco a collegarmi al server del gioco. Controlla la connessione e riprova.', 'warn'); }
    Net.sub(c);
  }
  addRecent(c, myName);
  const g = { code: c, status: 'lobby', host: myId, hostName: myName, created: Date.now(), v: 1, settings: defaultSettings(), extras: [] };
  try { await DB.doc('games/' + c).set(g); await DB.doc(`games/${c}/seats/${myId}`).set({ id: myId, name: myName, t: Date.now() }); }
  catch (e) { return writeErr(e); }
  openGame(c, false);
}

function closeGame() {
  unsubs.forEach(u => { try { u() } catch (e) { } }); unsubs = [];
  clearInterval(hbTimer); clearInterval(dutyTimer); clearInterval(uiTick); clearTimeout(plTimer);
  S = null; serverS = null; seats = []; chat = []; pls = {}; code = null; inflight = 0; writeChain = Promise.resolve();
  stageKey = ''; builtKey = ''; feedKey = ''; mine = null; plSent = ''; endShownKey = ''; plsLoaded = false;
  for (const o of [lastSeen, presT, presFg, offs, presGap]) for (const k in o) delete o[k];
  hideModal(); hideInfo();
  document.querySelectorAll('.confetti,.stamp').forEach(x => x.remove());
}

async function openGame(c, join) {
  closeGame(); view = 'game';
  try { if (location.hash !== '#' + c) location.hash = c; } catch (e) { }
  if (MODE === 'p2p') {
    busy('Mi collego alla partita ' + c + '…');
    const ok = await Net.connect();
    if (view !== 'game') return;
    let found = false;
    if (ok) { Net.sub(c); found = await Net.waitDoc('games/' + c, 9000); }
    if (view !== 'game') return;
    if (!found) {
      $('#app').innerHTML = `<div class="home"><div class="panel"><h3>${ok ? 'Non trovo la partita ' + esc(c) : 'Non riesco a collegarmi al server del gioco'}</h3><p class="mut">${ok ? 'Controlla che il codice sia giusto (5 caratteri, come te l’ha mandato chi ha creato la partita).' : 'Controlla la connessione a internet e riprova.'}</p><div class="row"><button class="btn primary" id="rt">Riprova</button><button class="btn" id="bk">Indietro</button></div></div></div>`;
      $('#rt').onclick = () => openGame(c, join); $('#bk').onclick = leave; return;
    }
    const g = Net.cache.get('games/' + c); addRecent(c, g && g.hostName);
  } else addRecent(c, myName);
  code = c;
  busy('Apro la partita ' + c + '…');
  let first = true;
  const t = setTimeout(() => { if (first && code === c) { $('#app').innerHTML = '<div class="home"><div class="panel">Non riesco a raggiungere la partita. Controlla la connessione. <button class="btn sm" id="bk">Indietro</button></div></div>'; $('#bk').onclick = leave; } }, 10000);
  unsubs.push(DB.doc('games/' + c).onSnapshot(snap => {
    clearTimeout(t);
    if (!snap.exists) { if (first) { first = false; $('#app').innerHTML = '<div class="home"><div class="panel">Partita non trovata. <button class="btn sm" id="bk">Indietro</button></div></div>'; $('#bk').onclick = leave; } return; }
    const d = clone(snap.data()); serverS = d;
    if (first && join && d.status === 'lobby' && !seats.some(s => s.id === myId)) {
      DB.doc(`games/${c}/seats/${myId}`).set({ id: myId, name: myName || 'Giocatore', t: Date.now() }).catch(writeErr);
    }
    first = false;
    if (d.by && typeof d.upd === 'number') sampleClock(d.by, d.upd);
    if (S && inflight > 0 && (d.v || 0) < (S.v || 0)) return;
    applyState(d);
  }, () => toast('Connessione alla partita persa.', 'warn')));
  unsubs.push(DB.collection(`games/${c}/seats`).onSnapshot(s => { seats = s.docs.map(d => d.data()).sort((a, b) => a.t - b.t); if (S && S.status === 'lobby') renderLobby(); }, () => { }));
  unsubs.push(DB.collection(`games/${c}/chat`).orderBy('t', 'desc').limit(60).onSnapshot(s => { chat = s.docs.map(d => d.data()).reverse(); chat.forEach(m => seen(m.id, m.t)); onChat(); }, () => { }));
  unsubs.push(DB.collection(`games/${c}/pl`).onSnapshot(s => {
    const next = {};
    s.docs.forEach(d => { const x = d.data(); if (!x || !x.id) return; next[x.id] = x; const o = pls[x.id]; if (!o || o.t !== x.t) { seen(x.id); if (typeof x.t === 'number') sampleClock(x.id, x.t); } });
    pls = next; plsLoaded = true;
    const myd = next[myId];
    if (mine && mine.fresh && myd && myd.r === mine.rk) { restoreMine(myd); stageKey = ''; }
    if (S && S.status !== 'lobby' && view === 'game') renderGame();
  }, () => { }));
  unsubs.push(DB.collection(`games/${c}/pres`).onSnapshot(s => {
    const now = Date.now();
    s.docs.forEach(d => { const x = d.data(); if (!x || !x.id) return;
      if (presT[x.id] === undefined) lastSeen[x.id] = now - x.t < 30000 ? now : x.t;
      else if (presT[x.id] !== x.t) { lastSeen[x.id] = now; sampleClock(x.id, x.t); if (x.t - presT[x.id] > 13000) presGap[x.id] = now; }
      presT[x.id] = x.t; presFg[x.id] = x.fg !== false; });
  }, () => { }));
  openedAt = Date.now();
  beat(); hbTimer = setInterval(beat, 5000);
  dutyTimer = setInterval(dutyTick, 400);
  uiTick = setInterval(tickUI, 250);
}
function beat() { if (code && DB) DB.doc(`games/${code}/pres/${myId}`).set({ id: myId, t: Date.now(), fg: !document.hidden }).catch(() => { }); }
function seen(id, t) { if (!id || id === myId) return; if (t && Date.now() - t > 20000) return; lastSeen[id] = Date.now(); }
/* stima della differenza tra l'orologio di un altro dispositivo e il mio */
function sampleClock(id, t) { if (id === myId) { offs[id] = 0; return; } const s = t - Date.now(); if (offs[id] === undefined || s > offs[id]) offs[id] = s; }
function regiaNow() { const k = S && S.clk; return Date.now() + ((k && offs[k] !== undefined) ? offs[k] : 0); }

function leave() {
  if (S && S.status === 'lobby' && code && DB) DB.doc(`games/${code}/seats/${myId}`).delete().catch(() => { });
  const cc = code; closeGame(); view = 'home';
  if (MODE === 'p2p' && cc) setTimeout(() => Net.unsub(cc), 400);
  try { history.replaceState(null, '', location.pathname + location.search) } catch (e) { try { location.hash = '' } catch (_) { } }
  renderHome();
}

/* scrive il nuovo stato (copia, modifica, pubblica) */
function act(fn, regia) {
  if (!S) return false;
  if (MODE === 'claude' && !CANWRITE) { toast('Puoi solo guardare questa partita'); return false; }
  const N = clone(S);
  if (fn(N) === false) return false;
  N.v = (S.v || 0) + 1; N.upd = Date.now(); N.by = myId;
  if (regia && !N.clk) N.clk = myId;
  applyState(N);
  inflight++;
  writeChain = writeChain.then(() => DB.doc('games/' + code).set(N)).then(() => { inflight--; }, e => { inflight--; writeErr(e); if (serverS) applyState(clone(serverS)); });
  return true;
}
function applyState(d) {
  S = d;
  if (view !== 'game') return;
  if (S.status === 'lobby') { builtKey = ''; stageKey = ''; renderLobby(); return; }
  renderGame();
  saveGameStats();
}

    <div class="row mid">${isHost ? `<button class="btn primary big" id="start" ${all.length < 2 ? 'disabled' : ''}>▶ Inizia la partita</button>${all.length < 2 ? '<span class="mut small">Servono almeno 2 giocatori (puoi aggiungere un bot)</span>' : ''}` : '<span class="mut">In attesa che chi ha creato la partita la avvii…</span>'}</div>
  </div>`;
  openHelp.forEach(k => { const d = document.querySelector(`details[data-help="${k}"]`); if (d) d.open = true; });
  if (focusId === 'newcat' && $('#newcat')) { const n = $('#newcat'); n.focus(); try { n.setSelectionRange(n.value.length, n.value.length); } catch (e) { } }
  const copy = (txt, ok) => { try { navigator.clipboard.writeText(txt).then(() => toast(ok, 'good'), () => toast(txt)) } catch (e) { toast(txt) } };
  $('#lv').onclick = leave;
  $('#cpy').onclick = () => copy(S.code, 'Codice copiato');
  const cpl = $('#cpl'); if (cpl) cpl.onclick = () => copy(inviteLink(S.code), 'Link copiato: incollalo nella chat con i tuoi amici');
  if (!isHost) return;
  const upd = (k, v) => act(N => { N.settings[k] = v; try { ls.set('ncc-settings', JSON.stringify(N.settings)); } catch (e) { } });
  document.querySelectorAll('#fMode button').forEach(b => b.onclick = () => upd('mode', b.dataset.v));
  const fl = $('#fLetters'); if (fl) fl.onchange = () => upd('letters', +fl.value);
  const ft = $('#fTarget'); if (ft) ft.onchange = () => upd('target', +ft.value);
  document.querySelectorAll('[data-opt]').forEach(el => el.onchange = () => {
    const k = el.dataset.opt;
    upd(k, el.type === 'checkbox' ? el.checked : (/^\d+$/.test(el.value) ? +el.value : el.value));
  });
  const setCats = c => upd('cats', E.sanitizeCats(c));
  document.querySelectorAll('[data-rmcat]').forEach(b => b.onclick = () => { if (cats.length > E.MIN_CATS) setCats(cats.filter(x => x !== b.dataset.rmcat)); });
  document.querySelectorAll('[data-addcat]').forEach(b => b.onclick = () => setCats(cats.concat([b.dataset.addcat])));
  $('#catreset').onclick = () => setCats(E.DEFAULT_CATS.slice());
  const nc = $('#newcat'), addc = () => {
    const v = E.cleanAnswer(nc.value).slice(0, 24); if (!v) return toast('Scrivi il nome della categoria', 'warn');
    const same = cats.find(c => E.normalize(E.catLabel(c)) === E.normalize(v));
    if (same) return toast('Questa categoria c\'è già', 'warn');
    const builtin = E.CATS.find(c => E.normalize(c.label) === E.normalize(v));
    nc.value = ''; setCats(cats.concat([builtin ? builtin.k : 'x:' + v]));
  };
  if (nc) { nc.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addc(); } }; $('#addcat').onclick = addc; }
  $('#addbot').onclick = () => act(N => {
    const used = new Set((N.extras || []).map(x => x.name));
    const n = BOTN.find(b => !used.has('Bot ' + b)) || rid(3);
    (N.extras = N.extras || []).push({ id: 'bot-' + rid(6), name: 'Bot ' + n, bot: true, level: 'normale' });
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => act(N => { N.extras = (N.extras || []).filter(x => x.id !== b.dataset.rm); }));
  document.querySelectorAll('[data-lvl]').forEach(s => s.onchange = () => act(N => { const x = (N.extras || []).find(x => x.id === s.dataset.lvl); if (x) x.level = s.value; }));
  $('#start').onclick = startMatch;
}

function startMatch() {
  const humans = seats.map(s => ({ id: s.id, name: s.name || 'Giocatore', bot: false }));
  act(N => {
    const ex = (N.extras || []).map(x => ({ id: x.id, name: x.name, bot: true, level: x.level || 'normale' }));
    const all = [...humans, ...ex].slice(0, MAXP);
    if (all.length < 2) return false;
    const now = Date.now();
    N.game = E.createGame(all, Object.assign({}, N.settings), null, now);
    N.status = 'playing'; N.started = now; N.away = {}; N.disc = {}; N.ended = null; N.clk = myId;
  }, true);
}

/* =========================================================
   COMPITI DI "REGIA" (bot, tempi, raccolta delle risposte,
   disconnessioni). Li svolge un solo dispositivo: chi ha
   creato la partita, oppure, se è offline o in secondo piano,
   il primo giocatore collegato con la pagina aperta.
   ========================================================= */
function isPresent(id) { return id === myId || (lastSeen[id] && Date.now() - lastSeen[id] < 16000); }
function isFg(id) { return id === myId ? !document.hidden : presFg[id] !== false; }
function dutyId() {
  if (!S) return null;
  if (!S.game) return S.host;
  const humans = S.game.players.filter(p => !p.bot && p.status !== 'disconnesso');
  const order = [S.host, ...humans.map(p => p.id)].filter((id, i, a) => a.indexOf(id) === i && humans.some(p => p.id === id));
  for (const id of order) if (isPresent(id) && isFg(id)) return id;
  for (const id of order) if (isPresent(id)) return id;
  return S.host;
}
const rkOf = (s, G) => (s.started || 0) + ':' + G.round;
function plOf(id) { const G = S.game; const p = pls[id]; return p && p.r === rkOf(S, G) ? p : null; }
function isAway(id) { return !!(S.away && S.away[id]); }
function dutyTick() {
  if (!S || view !== 'game' || S.status !== 'playing' || !S.game) return;
  if (dutyId() !== myId || document.hidden) return;
  const G = S.game, now = regiaNow(), lnow = Date.now();
  const wait = (G.options.disconnectWait || 60) * 1000;
  /* presenza */
  if (lnow - openedAt > 15000 && lnow - fgSince > 6000) for (const p of G.players) {
    if (p.bot || p.status === 'disconnesso' || p.id === myId) continue;
    const here = isPresent(p.id), away = S.away && S.away[p.id];
    if (!here && !away) {
      return act(N => { N.away = N.away || {}; N.disc = N.disc || {};
        N.away[p.id] = { since: now, until: now + wait }; N.disc[p.id] = (N.disc[p.id] || 0) + 1;
        chatSys(N, `🔌 ${p.name} si è disconnesso: lo aspettiamo ${fmtTime(wait)}.`); }, true);
    }
    if (here && away) return act(N => {
      delete N.away[p.id];
      // falso allarme: il suo dispositivo non ha mai smesso di mandare segnali → non conta
      const real = presGap[p.id] && lnow - presGap[p.id] < 120000;
      if (!real && now - away.since < 20000) N.disc[p.id] = Math.max(0, (N.disc[p.id] || 1) - 1);
      else chatSys(N, `✅ ${p.name} è tornato!`);
      holdAfterAway(N, now);
    }, true);
    if (away && now > away.until) {
      return act(N => { delete N.away[p.id]; E.removePlayer(N.game, p.id, now); if (N.game.phase === 'gameEnd') endMatch(N); holdAfterAway(N, now); }, true);
    }
  }
  const anyAway = Object.keys(S.away || {}).length > 0;
  const humansIn = E.active(G).filter(p => !p.bot);
  const here = humansIn.filter(p => !isAway(p.id));
  const rnow = now;   // tutti i tempi della partita sono sull'orologio della partita (S.clk)
  switch (G.phase) {
    case 'write': {
      // STOP di un giocatore
      const st = here.map(p => ({ p, d: plOf(p.id) })).filter(x => x.d && x.d.stop && x.d.full).sort((a, b) => (a.d.st || 0) - (b.d.st || 0))[0];
      if (st) return act(N => { E.pressStop(N.game, st.p.id, rnow); }, true);
      const b = E.botWantsStop(G, rnow);
      if (b) return act(N => { E.pressStop(N.game, b, rnow); }, true);
      if (G.dl && rnow >= G.dl) return act(N => { E.endWriting(N.game, rnow, 'time'); }, true);
      if (rnow - G.t0 > 3000 && here.every(p => { const d = plOf(p.id); return d && d.pass; }) && E.botsDone(G, rnow))
        return act(N => { E.endWriting(N.game, rnow, 'pass'); }, true);
      break;
    }
    case 'stop':
      if (rnow >= G.dl) return act(N => { E.endWriting(N.game, rnow, 'stop'); }, true);
      break;
    case 'collect': {
      const ready = here.every(p => { const d = plOf(p.id); return d && d.fin; });
      if (ready || rnow >= G.dl) {
        const given = {};
        humansIn.forEach(p => { const d = plOf(p.id); given[p.id] = d ? decA(d.a) : []; });
        return act(N => { E.collect(N.game, given, rnow); }, true);
      }
      break;
    }
    case 'vote': {
      if (anyAway) break;
      const ready = here.every(p => { const d = plOf(p.id); return d && d.vd; });
      if (ready || (G.dl && rnow >= G.dl)) {
        const votes = {};
        humansIn.forEach(p => { const d = plOf(p.id); if (d && Array.isArray(d.no)) votes[p.id] = d.no; });
        return act(N => { E.scoreRound(N.game, votes, rnow); if (N.game.phase === 'gameEnd') endMatch(N); }, true);
      }
      break;
    }
    case 'roundEnd': {
      if (anyAway) break;
      const nx = here.some(p => { const d = plOf(p.id); return d && d.next; });
      if (nx || rnow >= G.dl) return act(N => { E.nextRound(N.game, null, rnow); if (N.game.phase === 'gameEnd') endMatch(N); }, true);
      break;
    }
  }
}
/* quando nessuno è più assente, il controllo e la pausa ripartono con almeno 15 secondi */
function holdAfterAway(N, now) {
  if (Object.keys(N.away || {}).length) return;
  const g = N.game; if (!g) return;
  if ((g.phase === 'vote' && g.dl) || g.phase === 'roundEnd') g.dl = Math.max(g.dl, now + 15000);
}
function endMatch(N) { N.status = 'ended'; N.ended = Date.now(); N.away = {}; }
function chatSys(N, msg) { if (!N.game) return; N.game.log.push({ n: ++N.game.logSeq, msg, kind: 'warn', t: Date.now() }); }

/* ---------------- le mie risposte (documento personale) ---------------- */
function encA(a) { try { return btoa(unescape(encodeURIComponent(JSON.stringify(a)))).split('').reverse().join(''); } catch (e) { return ''; } }
function decA(s) { try { const a = JSON.parse(decodeURIComponent(escape(atob(String(s || '').split('').reverse().join(''))))); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function pushPl(now) {
  if (!mine || !code || !DB) return;
  clearTimeout(plTimer);
  const send = () => {
    if (!mine || !code) return;
    const G = S && S.game;
    const n = mine.a.filter((w, i) => G && w && E.startsOk(w, G.letter)).length;
    const doc = { id: myId, r: mine.rk, n, full: !!(G && n === G.cats.length), stop: !!mine.stop, st: mine.stopT || 0, pass: !!mine.pass, fin: !!mine.fin,
      a: encA(mine.a), no: [...mine.no], vd: !!mine.vd, next: !!mine.next };
    const raw = JSON.stringify(doc);
    if (raw === plSent) return; plSent = raw;
    doc.t = Date.now();
    DB.doc(`games/${code}/pl/${myId}`).set(doc).catch(() => { });
  };
  if (now) send(); else plTimer = setTimeout(send, 450);
}

/* =========================================================
   INTERFACCIA DI GIOCO
   ========================================================= */
const G_ = () => S && S.game;
const meP = () => { const G = G_(); return G ? G.players.find(p => p.id === myId) : null; };
const pIdx = id => S.game.players.findIndex(p => p.id === id);
const nameOf = id => { const p = S.game.players.find(p => p.id === id); return p ? p.name : '?'; };
const isPlaying = () => { const p = meP(); return !!(p && p.status === 'in' && !p.bot); };

function ensureMine() {
  const G = G_();
  if (!G || !isPlaying()) { mine = null; return; }
  const rk = rkOf(S, G);
  if (mine && mine.rk === rk) return;
  let saved = null; try { saved = JSON.parse(ss.get('ncc-m:' + code + ':' + rk) || 'null'); } catch (e) { }
  mine = { rk, a: G.cats.map((_, i) => (saved && saved.a && saved.a[i]) || ''), pass: !!(saved && saved.pass), stop: !!(saved && saved.stop), stopT: 0, fin: false, no: new Set((saved && saved.no) || []), vd: false, next: false, fresh: !saved };
  plSent = '';
  const d = pls[myId];
  if (mine.fresh && d && d.r === rk) restoreMine(d);
}
/* dopo un ricaricamento della pagina riprendo le risposte già inviate */
function restoreMine(d) {
  const G = G_(); if (!mine || !G) return;
  const a = decA(d.a);
  mine.a = G.cats.map((_, i) => String(a[i] || '').slice(0, 40));
  mine.pass = !!d.pass; mine.stop = !!d.stop; mine.vd = !!d.vd; mine.next = !!d.next;
  mine.no = new Set(Array.isArray(d.no) ? d.no : []);
  mine.fresh = false; saveMine();
}
function saveMine() { if (mine) mine.fresh = false; if (mine && code) ss.set('ncc-m:' + code + ':' + mine.rk, JSON.stringify({ a: mine.a, pass: mine.pass, stop: mine.stop, no: [...mine.no] })); }
function finalizeMine() { if (mine && !mine.fin && plsLoaded) { mine.fin = true; saveMine(); pushPl(true); } }

function buildGameUI() {
  document.body.className = 'v-game';
  $('#app').innerHTML = `<section id="game">
    <header class="topbar">
      ${LOGO('xs')}
      <div id="roundInfo" class="roundinfo"></div>
      <div class="tb-actions">
        <button class="btn ghost" id="rulesBtn" title="Regole attive">📜 <span class="hide-sm">Regole</span></button>
        <button class="btn ghost" id="scoreBtn" title="Punteggi">🏆 <span class="hide-sm">Punti</span></button>
        <button class="btn ghost" id="chatToggle" title="Chat">💬<span id="chatBadge" class="badge" hidden></span></button>
        <button class="btn ghost" id="quitBtn" title="Esci">✕</button>
      </div>
    </header>
    <div id="awaybar" class="awaybar" hidden></div>
    <div class="layout">
      <main class="maincol"><div class="stage" id="stage"><div class="stage-in" id="stageIn"></div></div></main>
      <aside id="side" class="side ${sideOpen ? 'open' : ''}">
        <div class="side-head">Chat e cronaca <span class="small mut netst">${esc(netText())}</span></div>
        <div id="feed" class="feed"></div>
        <form id="chatForm" class="chatform" autocomplete="off"><input id="chatInput" placeholder="Scrivi un messaggio…" maxlength="200"><button class="btn primary" type="submit">Invia</button></form>
      </aside>
    </div>
  </section>`;
  bindGame();
  feedKey = ''; chatSeenT = chat.length ? chat[chat.length - 1].t : 0;
}

function renderGame() {
  const G = G_(); if (!G || view !== 'game') return;
  const bk = S.code + ':' + (S.started || 0);
  if (builtKey !== bk) { buildGameUI(); builtKey = bk; stageKey = ''; lastEventN = G.evSeq; endShownKey = ''; }
  ensureMine();
  handleEvents(G);
  if (mine && (G.phase === 'collect' || G.phase === 'vote') && !mine.fin) finalizeMine();
  const ri = $('#roundInfo');
  if (ri) ri.innerHTML = `Lettera <b>${G.letter || '–'}</b> · ${G.options.mode === 'punti' ? `${G.round}ª lettera · a ${G.options.target} punti` : `${G.round} di ${G.total}`}`;
  renderAway();
  renderFeed();
  updBadge();
  const fam = (G.phase === 'write' || G.phase === 'stop' || G.phase === 'collect') ? 'w' : G.phase === 'vote' ? 'v' : 'r';
  const k = rkOf(S, G) + ':' + fam;
  if (k !== stageKey) { stageKey = k; buildStage(fam); }
  updateStage(fam);
  renderEnd(G);
}

/* ---------------- eventi -> animazioni e avvisi ---------------- */
let animRk = '';
function handleEvents(G) {
  for (const e of G.events) {
    if (e.n <= lastEventN) continue;
    lastEventN = e.n;
    switch (e.type) {
      case 'letter': animRk = rkOf(S, G); letterAnimUntil = Date.now() + (reduceMotion() ? 0 : 1400); break;
      case 'stop': stamp(e.by === myId ? 'Hai detto' : nameOf(e.by) + ' dice'); break;
      case 'pens': if (e.why === 'time') toast('⏰ Tempo scaduto: penne giù!', 'warn'); else if (e.why === 'pass') toast('✋ Penne giù!', ''); break;
      case 'removed': toast(e.player === myId ? 'Sei stato tolto dalla partita (disconnesso troppo a lungo)' : `🔌 ${nameOf(e.player)} è stato tolto dalla partita`, 'warn'); break;
      case 'end': setTimeout(confetti, 1800); break;
    }
  }
}
function stamp(who) {
  if (reduceMotion()) return toast(`🛑 ${who} STOP!`, 'warn');
  const d = document.createElement('div');
  d.className = 'stamp'; d.innerHTML = `<small>${esc(who)}</small>STOP!`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1700);
}
function confetti() {
  if (reduceMotion() || !S || !S.game || view !== 'game') return;
  const box = document.createElement('div'); box.className = 'confetti';
  const cols = ['#ffe066', '#f43f5e', '#22c55e', '#4dabf7', '#e386e6', '#ff8a3d'];
  for (let i = 0; i < 90; i++) { const c = document.createElement('i'); c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length]; c.style.animationDuration = (2.2 + Math.random() * 2) + 's'; c.style.animationDelay = (Math.random() * .8) + 's'; c.style.transform = `rotate(${Math.random() * 360}deg)`; box.appendChild(c); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 5200);
}

/* =========================================================
   FASE 1: SCRITTURA
   ========================================================= */
function buildStage(fam) {
  const G = G_(); const box = $('#stageIn'); if (!box) return;
  hideModal();
  if (fam === 'w') box.innerHTML = writeHTML(G);
  else if (fam === 'v') box.innerHTML = voteHTML(G);
  else box.innerHTML = resultsHTML(G);
  const st = $('#stage'); if (st) st.scrollTop = 0;
  if (fam === 'w') wireWrite(G);
  if (fam === 'v') wireVote(G);
  if (fam === 'r') animateResults();
}
function writeHTML(G) {
  const me = meP();
  const spect = !isPlaying();
  const totTxt = G.options.mode === 'punti' ? `${G.round}ª lettera · vince chi arriva a ${G.options.target}` : `Lettera ${G.round} di ${G.total}`;
  return `<div class="lhead"><div class="ltile" id="ltile">${G.letter}</div>
      <div class="linfo"><div class="big">${totTxt}</div><div class="clock" id="wclock"></div><div class="small mut" id="wsub"></div></div></div>
    <div id="stopban"></div>
    <div class="racers" id="racers"></div>
    ${spect ? `<div class="specbar">${me && me.status === 'disconnesso' ? 'Sei stato tolto dalla partita perché eri disconnesso da troppo tempo: puoi continuare a guardare.' : 'Stai guardando la partita.'}</div>` : `
    <form class="sheet" id="sheet" autocomplete="off" onsubmit="return false">
      <div class="holes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      ${G.cats.map((c, i) => `<label class="cell" data-cell="${i}"><span class="ci">${E.catIcon(c)} ${esc(E.catLabel(c))}</span>
        <input data-ci="${i}" maxlength="40" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" aria-label="${esc(E.catLabel(c))} con la ${G.letter}" value="${esc(mine ? mine.a[i] : '')}">
        <span class="mk" aria-hidden="true"></span><span class="why"></span></label>`).join('')}
      <div class="cover" id="cover" hidden><span></span></div>
    </form>
    <div class="wactions" id="wactions">
      <button type="button" class="btn" id="passBtn"></button>
      <button type="button" class="stopbtn" id="stopBtn">🛑 STOP!</button>
    </div>
    <div class="whint" id="whint"></div>`}`;
}
function wireWrite(G) {
  const sheet = $('#sheet');
  const rk = rkOf(S, G);
  const tile = $('#ltile');
  if (tile && animRk === rk && Date.now() < letterAnimUntil) {
    // la lettera "gira" e poi si ferma
    const pool = E.letterPool(G.options);
    tile.classList.add('rolling');
    const iv = setInterval(() => { tile.textContent = pool[Math.floor(Math.random() * pool.length)]; }, 70);
    setTimeout(() => {
      clearInterval(iv); tile.classList.remove('rolling'); tile.textContent = G.letter; tile.classList.add('land');
      updateStage('w');
      focusFirst();
    }, Math.max(0, letterAnimUntil - Date.now()));
  } else setTimeout(focusFirst, 50);
  if (!sheet) return;
  sheet.addEventListener('input', e => {
    const inp = e.target.closest('input[data-ci]'); if (!inp || !mine || mine.fin) return;
    const i = +inp.dataset.ci;
    mine.a[i] = inp.value.slice(0, 40);
    if (mine.pass && inp.value) mine.pass = false;
    saveMine(); updateCell(i); updateActions(); pushPl();
  });
  sheet.addEventListener('keydown', e => {
    const inp = e.target.closest('input[data-ci]'); if (!inp) return;
    if (e.key === 'Enter') {
      e.preventDefault();
      if ((e.ctrlKey || e.metaKey) && !$('#stopBtn').disabled) return pressStop();
      const ins = [...document.querySelectorAll('#sheet input[data-ci]')];
      const i = ins.indexOf(inp);
      const nx = ins.slice(i + 1).concat(ins.slice(0, i)).find(x => !x.value.trim());
      if (nx) nx.focus(); else { const sb = $('#stopBtn'); if (sb && !sb.disabled) sb.focus(); else inp.blur(); }
    }
  });
  $('#stopBtn').addEventListener('click', pressStop);
  $('#passBtn').addEventListener('click', () => {
    if (!mine || mine.fin) return;
    mine.pass = !mine.pass; saveMine(); updateActions(); pushPl(true);
    if (mine.pass) toast('Ok! Quando anche gli altri hanno finito si passa al controllo.');
  });
  G.cats.forEach((_, i) => updateCell(i));
}
function focusFirst() {
  let fine = false; try { fine = matchMedia('(pointer:fine)').matches; } catch (e) { }
  if (!fine || !mine || mine.fin) return;
  const inp = [...document.querySelectorAll('#sheet input[data-ci]')].find(x => !x.value.trim() && !x.disabled);
  if (inp && document.activeElement !== inp && !(document.activeElement && document.activeElement.id === 'chatInput')) inp.focus({ preventScroll: true });
}
function pressStop() {
  const G = G_(); if (!G || G.phase !== 'write' || !mine || mine.fin) return;
  if (!allOk(G)) return toast('Riempi prima tutte le caselle con la ' + G.letter, 'warn');
  mine.stop = true; mine.stopT = Date.now(); saveMine(); pushPl(true);
  const b = $('#stopBtn'); if (b) { b.disabled = true; b.textContent = '🛑 STOP inviato…'; }
}
const allOk = G => mine && G.cats.every((_, i) => mine.a[i] && E.startsOk(mine.a[i], G.letter));
function updateCell(i) {
  const G = G_(); const cell = document.querySelector(`.cell[data-cell="${i}"]`); if (!cell || !mine) return;
  const w = (mine.a[i] || '').trim();
  const ok = w && E.startsOk(w, G.letter), bad = w && !ok;
  cell.classList.toggle('ok', !!ok); cell.classList.toggle('bad', !!bad);
  $('.mk', cell).textContent = ok ? '✓' : bad ? '✗' : '';
  $('.why', cell).textContent = bad ? `Deve iniziare con la ${G.letter}` : '';
}
function sheetLocked(G) {
  if (!mine) return true;
  if (mine.fin || G.phase === 'collect') return true;
  if (G.phase === 'stop' && regiaNow() >= G.dl) return true;
  return Date.now() < letterAnimUntil && animRk === rkOf(S, G);
}
function updateActions() {
  const G = G_(); if (!G || !mine) return;
  const pb = $('#passBtn'), sb = $('#stopBtn'), hint = $('#whint'); if (!pb) return;
  const locked = sheetLocked(G);
  const ok = allOk(G);
  const filled = G.cats.filter((_, i) => mine.a[i] && E.startsOk(mine.a[i], G.letter)).length;
  const showStop = G.phase === 'write';
  sb.hidden = !showStop;
  if (!mine.stop) { sb.disabled = locked || !ok; sb.textContent = '🛑 STOP!'; }
  pb.hidden = G.phase !== 'write';
  pb.disabled = locked || ok;
  pb.textContent = mine.pass ? '✍️ Mi è venuta un\'idea' : '✋ Non mi viene altro';
  pb.classList.toggle('go', mine.pass);
  let h = '';
  if (G.phase === 'write' && !locked) {
    if (ok) h = 'Hai riempito tutto: premi <b>STOP!</b> prima degli altri (o Ctrl+Invio).';
    else if (mine.pass) h = 'Hai detto che non ti viene altro. Se cambi idea, scrivi pure!';
    else h = `Hai riempito ${filled} caselle su ${G.cats.length}. Le tue risposte le vedi solo tu.`;
  }
  if (hint) hint.innerHTML = h;
  const sheet = $('#sheet');
  if (sheet) {
    sheet.classList.toggle('locked', locked);
    sheet.querySelectorAll('input').forEach(x => { x.disabled = locked; });
    const cv = $('#cover');
    const coverTxt = (mine.fin || G.phase === 'collect' || (G.phase === 'stop' && regiaNow() >= G.dl)) ? '✋ Penne giù! Raccolgo le risposte di tutti…' : '';
    cv.hidden = !coverTxt; if (coverTxt) $('span', cv).textContent = coverTxt;
  }
}
function filledOf(G, p) {

  if (p.bot) { const b = G.bots[p.id]; if (!b) return 0; const el = (G.phase === 'write' || G.phase === 'stop') ? regiaNow() - G.t0 : (G.wEnd || regiaNow()) - G.t0; return E.botFilledAt(b, el); }
  const d = plOf(p.id); return d ? Math.min(d.n || 0, G.cats.length) : 0;
}
function racersHTML(G) {

  return G.players.map((p, i) => {
    const n = filledOf(G, p);
    const d = p.bot ? null : (p.id === myId ? mine : plOf(p.id));
    const b = p.bot ? G.bots[p.id] : null;
    const passed = p.bot ? (b && el >= b.doneAt && b.stopAt == null) : !!(d && d.pass);
    const cls = ['racer'];
    if (p.id === myId) cls.push('me');

      <div class="dots" title="${n} caselle su ${G.cats.length}">${G.cats.map((_, k) => `<i class="${k < n ? 'on' : ''}"></i>`).join('')}</div></div></div>`;
  }).join('');

function updateWrite(G) {
  const r = $('#racers'); if (r) { const h = racersHTML(G); if (r._h !== h) { r._h = h; r.innerHTML = h; } }
  const ban = $('#stopban');

    else if (G.phase === 'collect') h = '<div class="stopbanner" style="animation:none">✋ Penne giù! Raccolgo le risposte di tutti…</div>';

/* =========================================================
   FASE 2: CONTROLLO DELLE PAROLE
   ========================================================= */
function voteHTML(G) {
  const ids = G.players.filter(p => G.answers[p.id]).map(p => p.id);
  let k = 0;
  const cats = G.cats.map((c, ci) => `<section class="vcat"><h4>${E.catIcon(c)} ${esc(E.catLabel(c))}</h4><div class="vlist">${ids.map(pid => {
    const p = G.players.find(x => x.id === pid), i = pIdx(pid);
    const w = G.answers[pid][ci], au = G.auto[pid][ci];
    const delay = reduceMotion() ? 0 : Math.min(1200, (k++) * 35);
    return `<div class="vans anim ${au ? 'auto' : ''} ${!w ? 'empty' : ''} ${pid === myId ? 'mine' : ''}" data-k="${esc(pid)}:${ci}" style="animation-delay:${delay}ms">${avatar(p, i)}
      <div class="wbox"><span class="who">${esc(p.name)}${pid === myId ? ' (tu)' : ''}</span><span class="w">${w ? esc(w) : '— vuota —'}</span><span class="bds"></span></div><span class="vbtn"></span></div>`;
  }).join('')}</div></section>`).join('');
  return `<div class="vhead"><h2>🔎 Controllo delle parole · lettera ${G.letter}</h2><div class="clock" id="vclock"></div></div>
    <div class="small mut">${isPlaying() ? 'Tocca <b>👎</b> sulle parole degli altri che secondo te non valgono. Se più della metà di chi vota dice 👎, la parola vale 0. ✓ = parola che il gioco conosce.' : 'I giocatori stanno controllando le parole.'}</div>
    ${cats}
    <div class="vfoot"><div class="donechips" id="donechips"></div>${isPlaying() ? '<button class="btn go big" id="vdone">✓ Ho finito di controllare</button>' : ''}</div>`;
}
function onThumb(e) {
  const b = e.target.closest('[data-thumb]'); if (!b || !mine || !G_() || G_().phase !== 'vote') return;
  const k = b.dataset.thumb;
  if (mine.no.has(k)) mine.no.delete(k); else mine.no.add(k);
  if (mine.vd) mine.vd = false;
  saveMine(); pushPl(); updateVote(G_());
}
function wireVote(G) {
  const vd = $('#vdone'); if (vd) vd.addEventListener('click', () => { if (!mine) return; mine.vd = !mine.vd; pushPl(true); updateVote(G_()); });
}
function thumbsFor(G, pid, ci) {
  const key = pid + ':' + ci; let n = 0;
  E.voters(G, pid).forEach(v => { const no = v.id === myId ? (mine ? [...mine.no] : []) : ((plOf(v.id) || {}).no || []); if (no.includes(key)) n++; });
  return n;
}
function updateVote(G) {
  const ids = Object.keys(G.answers);
  // parole uguali (tra quelle non scartate in automatico)
  const dupKeys = G.cats.map((_, ci) => { const m = {}; ids.forEach(pid => { if (!G.auto[pid][ci]) { const k = E.wordKey(G.answers[pid][ci]); m[k] = (m[k] || 0) + 1; } }); return m; });
  document.querySelectorAll('.vans[data-k]').forEach(el => {
    const [pid, cis] = el.dataset.k.split(':'); const ci = +cis;
    if (!G.answers[pid]) return;
    const w = G.answers[pid][ci], au = G.auto[pid][ci];
    const n = au ? 0 : thumbsFor(G, pid, ci);
    const el2 = E.voters(G, pid).length;
    const out = !au && el2 > 0 && n * 2 > el2;
    el.classList.toggle('out', out);
    const known = G.known && G.known[pid] && G.known[pid][ci];
    const dup = !au && w && dupKeys[ci][E.wordKey(w)] > 1;
    const bds = (au === 'lettera' ? `<span class="bd bad">✗ non inizia con ${G.letter}</span>` : au === 'corta' ? '<span class="bd bad">✗ troppo corta</span>' : '') +
      (known && !au ? '<span class="bd kn">✓ conosciuta</span>' : '') + (dup ? '<span class="bd dp">= doppione</span>' : '') + (out ? '<span class="bd bad">👎 bocciata</span>' : '');
    const bb = $('.bds', el); if (bb._h !== bds) { bb._h = bds; bb.innerHTML = bds; }
    let btn = '';

      if (isPlaying() && pid !== myId) { const on = mine && mine.no.has(pid + ':' + ci); btn = `<button class="thumb ${on ? 'on' : ''}" data-thumb="${esc(pid)}:${ci}" aria-pressed="${on}" title="${on ? 'Togli il tuo 👎' : 'Questa parola non vale'}">👎${n ? ' ' + n : ''}</button>`; }
      else if (n) btn = `<span class="ncount">👎 ${n}</span>`;
    }
    const vb = $('.vbtn', el); if (vb._h !== btn) { vb._h = btn; vb.innerHTML = btn; }
  });
  const dc = $('#donechips');
  if (dc) {
    const hs = E.active(G).filter(p => !p.bot);
    const h = hs.map(p => { const d = p.id === myId ? mine : plOf(p.id); const ok = !!(d && d.vd); return `<span title="${esc(p.name)}${ok ? ': ha finito' : ': sta controllando'}" style="display:inline-flex">${avatar(p, pIdx(p.id)).replace('class="av"', `class="av ${ok ? 'ok' : ''}"`)}</span>`; }).join('');
    const txt = `<span class="small mut dtxt">Hanno finito ${hs.filter(p => { const d = p.id === myId ? mine : plOf(p.id); return d && d.vd; }).length} su ${hs.length}</span>`;
    const all = h + txt; if (dc._h !== all) { dc._h = all; dc.innerHTML = all; }
  }
  const vd = $('#vdone'); if (vd && mine) { vd.textContent = mine.vd ? '↩ Voglio ricontrollare' : '✓ Ho finito di controllare'; vd.className = 'btn big ' + (mine.vd ? '' : 'go pulse'); }
  const vc = $('#vclock');
  if (vc) { if (Object.keys(S.away || {}).length) { vc.textContent = '⏸ in pausa'; vc.classList.remove('low'); } else if (G.dl) { const left = G.dl - regiaNow(); vc.textContent = '⏱ ' + fmtTime(left); vc.classList.toggle('low', left < 10000); } else vc.textContent = ''; }
}

/* =========================================================
   FASE 3: PUNTI DEL GIRO E CLASSIFICA
   ========================================================= */
const PT = { 20: ['p20', '★ 20'], 10: ['p10', '● 10'], 5: ['p5', '▲ 5'], 0: ['p0', '✗ 0'] };
const WHY = { vuota: 'vuota', lettera: 'lettera sbagliata', corta: 'troppo corta', bocciata: 'bocciata 👎', sola: 'solo tu!', unica: 'parola unica', doppia: 'doppione' };

          ${R.cats.map((c, ci) => { const pts = r.pts[ci] || 0; const [cl, tx] = PT[pts] || PT[0]; return `<div class="rrow"><span class="rw ${pts ? '' : 'x'}"><small>${E.catIcon(c)} ${esc(E.catLabel(c))} · ${WHY[r.why[ci]] || ''}</small><span class="ww">${r.a[ci] ? esc(r.a[ci]) : '—'}</span></span><span class="pt ${cl} pop" style="animation-delay:${reduceMotion() ? 0 : 300 + (d++) * 25}ms">${tx}</span></div>`; }).join('')}

function standingsHTML(G) {
  const ps = G.players.slice().sort((a, b) => (a.status === 'in' ? 0 : 1) - (b.status === 'in' ? 0 : 1) || b.total - a.total);

  return ps.map((p, n) => { if (p.total !== last) { pos = n + 1; last = p.total; } return `<div class="stand"><span class="pos">${p.status === 'in' ? pos + '°' : '–'}</span>${avatar(p, pIdx(p.id), 30)}<div><div class="nm">${esc(p.name)}${p.status === 'disconnesso' ? ' <span class="tag off">disconnesso</span>' : ''}</div><div class="barw"><div class="bar" data-w="${Math.round(p.total / max * 100)}"></div></div></div><span class="tot">${p.total}</span></div>`; }).join('');
}
function animateResults() {
  const rm = reduceMotion();
  document.querySelectorAll('.bar[data-w]').forEach(b => { if (rm) b.style.width = b.dataset.w + '%'; else requestAnimationFrame(() => requestAnimationFrame(() => { b.style.width = b.dataset.w + '%'; })); });
  if (rm) return;
  document.querySelectorAll('.rsum[data-to]').forEach(el => {
    const to = +el.dataset.to, t0 = performance.now() + 250, dur = 900;
    const step = t => { const k = Math.min(1, Math.max(0, (t - t0) / dur)); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function updateResults(G) {
  const nb = $('#nextbar'); if (!nb) return;
  let h = '';
  if (G.phase === 'roundEnd') {

      h = `<span class="mut">${nx ? 'Si parte!' : `Prossima lettera tra <b>${left}</b> s`}</span>${isPlaying() ? `<button class="btn primary" id="nextBtn" ${mine && mine.next ? 'disabled' : ''}>▶ Avanti</button>` : ''}`;

/* =========================================================
   FINE PARTITA
   ========================================================= */
function renderEnd(G) {

  const k = rkOf(S, G) + ':end';
  if (endShownKey === k) return;

}

    ${roundsTable(G)}
    <div class="mbtns"><button class="btn" data-hide-modal>Guarda il tabellone</button>${isHost ? '<button class="btn primary" data-rematch>🔁 Rivincita</button>' : '<span class="small mut" style="align-self:center">Chi ha creato la partita può avviare la rivincita.</span>'}<button class="btn" data-home>Torna alla home</button></div>`;
}

  return `<h3 style="margin:14px 0 8px">Lettera per lettera</h3><div class="stwrap"><table class="sttab"><tr><th></th>${ps.map(p => `<th>${avatar(p, pIdx(p.id))}<div>${esc(p.name)}</div></th>`).join('')}</tr>
    ${G.results.map(r => { const vals = ps.map(p => r.rows[p.id] ? r.rows[p.id].sum : null); const mx = Math.max(...vals.filter(v => v != null)); return `<tr><td><b style="color:var(--accent)">${r.letter}</b></td>${vals.map(v => `<td style="${v === mx && mx > 0 ? 'color:var(--accent);font-weight:700' : ''}">${v == null ? '–' : v}</td>`).join('')}</tr>`; }).join('')}
    <tr><td><b>Totale</b></td>${ps.map(p => `<td><b>${p.total}</b></td>`).join('')}</tr></table></div>`;
}
